<script>
//# sourceURL=View_Dashboard.html
// ---------- DASHBOARD ----------
SRIT.Features.dashboard={
  charts:[],date:'',sesi:undefined,
  render(host){
    SRIT.UI.setPage('Beranda','Beranda');
    this._host=host;
    host.innerHTML=`<div id="dashSkel">${'<div class="row g-2 g-md-3 mb-3">'+Array(6).fill('<div class="col-6 col-md-4 col-xl-2"><div class="skeleton" style="height:88px"></div></div>').join('')+'</div><div class="skeleton" style="height:300px"></div>'}</div>`;
    setTimeout(()=>this.load(),120);
  },
  async load(){
    const host=this._host;this.destroy();
    if(!this.date)this.date=SRIT.Util.todayISO();
    // reset sesi ke default saat tanggal berubah (ditangani oleh getDashboardData)
    const _seq=(this._seq=(this._seq||0)+1);let d;
    try{d=await SRIT.Api.getDashboardData(this.date,this.sesi);}
    catch(e){if(SRIT.currentFeature==='dashboard'&&host)host.innerHTML='<div class="empty-state"><i class="bi bi-exclamation-triangle d-block text-danger"></i>'+SRIT.Util.esc(e.message||'Gagal memuat dashboard')+' <button class="btn btn-sm btn-primary mt-2" onclick="SRIT.Features.dashboard.load()">Coba Lagi</button></div>';return;}
    if(_seq!==this._seq||SRIT.currentFeature!=='dashboard')return;
    if(this.sesi===undefined)this.sesi=d.selectedSession||'';
    const kpi=(icon,cls,val,lbl,trend)=>`<div class="col-6 col-md-4 col-xl-2"><div class="kpi"><div class="d-flex justify-content-between align-items-start"><div style="min-width:0"><div class="kpi-lbl">${lbl}</div><div class="kpi-val">${val}</div>${trend||''}</div><div class="kpi-icon ${cls}"><i class="bi ${icon}"></i></div></div></div></div>`;
    const mini=(v,l,c)=>`<div class="col-4 col-md-3 col-xl-2"><div class="card-srit p-2 p-md-3 text-center h-100"><div class="fw-bold" style="font-size:clamp(18px,2.2vw,26px);color:${c}">${v}</div><div class="text-muted-2" style="font-size:clamp(9px,.8vw,11px);text-transform:uppercase;letter-spacing:.3px">${l}</div></div></div>`;
    const _al=(SRIT.computeAlerts?SRIT.computeAlerts():[]);
    host.innerHTML=`
      ${_al.length?`<div class="card-srit p-3 mb-3 d-flex align-items-center justify-content-between flex-wrap gap-2" style="border-left:4px solid var(--srit-warning)">
        <div><i class="bi bi-bell-fill text-warning me-1"></i> <b>${_al.length} peringatan</b> memerlukan perhatian — ${SRIT.Util.esc(_al[0].title)}${_al.length>1?' & lainnya':''}</div>
        <button class="btn btn-sm btn-outline-warning" onclick="location.hash='#/alert-center'">Lihat Pusat Peringatan</button></div>`:''}
      <!-- Filter tanggal & kegiatan -->
      <div class="card-srit p-3 mb-3"><div class="filter-bar align-items-end">
        <div><label class="form-label-sm">Tanggal</label><input type="date" class="form-control form-control-sm" id="dashDate" value="${d.iso}" max="${SRIT.Util.todayISO()}"></div>
        <div style="min-width:240px"><label class="form-label-sm">Kegiatan</label><select class="form-select form-select-sm" id="dashKeg"></select></div>
        ${!d.isToday?`<div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-outline-secondary btn-sm" id="dashToday"><i class="bi bi-calendar-check"></i> Hari Ini</button></div>`:''}
        <div class="flex-grow-1"></div>
        <div class="text-end"><div class="form-label-sm mb-0">${d.isToday?'<i class="bi bi-broadcast text-primary"></i> Kegiatan aktif':'<i class="bi bi-clock-history text-warning"></i> Data '+SRIT.Util.fmtDateShort(d.iso)}</div>
          <div style="font-size:13px"><b>${SRIT.Util.esc(d.curInfo.nama)}</b>${d.curInfo.jam?` <span class="text-muted-2">(${d.curInfo.jam})</span>`:''} · <span class="badge-soft st-HADIR">Hadir ${d.curInfo.pct}%</span></div></div>
      </div></div>
      <!-- KPI utama kehadiran (per kegiatan aktif, maks 100%) -->
      <div class="row g-2 g-md-3 mb-3">
        ${kpi('bi-people','bg-grad-primary',d.cur.TOTAL,'Peserta Kegiatan')}
        ${kpi('bi-check2-circle','bg-grad-success',d.cur.HADIR,'Hadir',`<div class="trend text-success">${d.curInfo.pct}%</div>`)}
        ${kpi('bi-envelope-open','bg-grad-info',d.cur.IZIN,'Izin')}
        ${kpi('bi-heart-pulse','bg-grad-warning',d.cur.SAKIT,'Sakit')}
        ${kpi('bi-x-octagon','bg-grad-danger',d.cur.ALPA,'Alpa')}
        ${kpi('bi-dash-circle','bg-grad-accent',d.cur.BELUM,'Belum Absen')}
      </div>
      <!-- Ringkasan struktur -->
      <div class="row g-2 g-md-3 mb-3">
        ${mini(d.stat.putra,'Putra','#38bdf8')}${mini(d.stat.putri,'Putri','#f472b6')}
        ${mini(d.stat.asrama,'Asrama','#4ade80')}${mini(d.stat.gedung,'Gedung','#22d3ee')}
        ${mini(d.stat.kamar,'Kamar','#fbbf24')}${mini(d.stat.bedTerisi+'/'+d.stat.bed,'Bed Terisi','#a855f7')}
        ${mini(d.stat.kelompok,'Kelompok','#fb923c')}${mini(d.stat.waliAsuh,'Wali Asuh','#e879f9')}
        ${mini(d.stat.waliAsrama,'Wali Asrama','#34d399')}${mini(d.stat.program,'Program','#60a5fa')}
        ${mini(d.stat.kegiatan,'Kegiatan Hari Ini','#facc15')}${mini(d.totalUser,'Pengguna','#94a3b8')}
      </div>
      <!-- Chart + komposisi -->
      <div class="row g-2 g-md-3">
        <div class="col-12 col-lg-8"><div class="card-srit p-3 h-100">
          <div class="d-flex justify-content-between mb-2"><h6 class="section-title">Tren Kehadiran (7 Hari)</h6><span class="badge-soft st-HADIR">Rekap Harian</span></div>
          <div class="chart-box"><canvas id="chTrend"></canvas></div>
        </div></div>
        <div class="col-12 col-lg-4"><div class="card-srit p-3 h-100">
          <h6 class="section-title mb-2">Komposisi Kehadiran (Kegiatan Aktif)</h6>
          <div class="chart-box sm"><canvas id="chDonut"></canvas></div>
        </div></div>
        <!-- Rincian breakdown (mengikuti filter tanggal & kegiatan di atas) -->
        <div class="col-12"><div class="text-muted-2" style="font-size:11px;padding-left:4px"><i class="bi bi-funnel me-1"></i>Rincian di bawah mengikuti filter Tanggal & Kegiatan di atas (persentase terhadap peserta kegiatan, maks 100%)</div></div>
        <div class="col-12"><div class="row g-2 g-md-3" id="dashBreakdown"></div></div>
        <!-- Layanan & kedisiplinan -->
        <div class="col-12 col-md-6 col-lg-4"><div class="card-srit p-3 h-100">
          <h6 class="section-title mb-3">Layanan & Kedisiplinan</h6>
          <table class="table table-sm table-srit mb-0"><tbody>
            <tr><td><i class="bi bi-box-arrow-right text-info me-1"></i>Izin/Kepulangan Aktif</td><td class="text-end fw-bold">${d.layanan.izinAktif}</td></tr>
            <tr><td><i class="bi bi-hourglass-split text-warning me-1"></i>Izin Menunggu</td><td class="text-end fw-bold">${d.layanan.izinMenunggu}</td></tr>
            <tr><td><i class="bi bi-person-exclamation text-danger me-1"></i>Belum Kembali</td><td class="text-end fw-bold" style="color:${d.layanan.belumKembali?'var(--srit-danger)':''}">${d.layanan.belumKembali}</td></tr>
            <tr><td><i class="bi bi-people text-primary me-1"></i>Tamu Hari Ini</td><td class="text-end fw-bold">${d.layanan.tamuHari}</td></tr>
            <tr><td><i class="bi bi-exclamation-diamond text-warning me-1"></i>Pelanggaran Proses</td><td class="text-end fw-bold">${d.layanan.pelanggaranProses}</td></tr>
            <tr><td><i class="bi bi-heart-pulse text-success me-1"></i>Pembinaan Aktif</td><td class="text-end fw-bold">${d.layanan.pembinaanAktif}</td></tr>
            <tr><td><i class="bi bi-shield-exclamation text-danger me-1"></i>Insiden Aktif</td><td class="text-end fw-bold" style="color:${d.layanan.insidenAktif?'var(--srit-danger)':''}">${d.layanan.insidenAktif}</td></tr>
            <tr><td><i class="bi bi-clipboard-check text-info me-1"></i>Inspeksi Hari Ini</td><td class="text-end fw-bold">${d.layanan.inspeksiHari}</td></tr>
          </tbody></table>
        </div></div>
        <!-- Jadwal kegiatan hari ini -->
        <div class="col-12 col-lg-8"><div class="card-srit p-3 h-100">
          <h6 class="section-title mb-3">Jadwal Kegiatan ${d.isToday?'Hari Ini':SRIT.Util.fmtDateShort(d.iso)} (${d.kegiatanHariIni.length})</h6>
          <div class="row g-2">${d.kegiatanHariIni.length?d.kegiatanHariIni.map(k=>`<div class="col-6 col-md-4 col-xl-3"><div class="p-2 rounded" style="background:var(--srit-hover)">
            <div class="fw-semibold" style="font-size:12px"><i class="bi bi-clock text-primary"></i> ${k.jamMulai}–${k.jamSelesai}</div>
            <div class="text-muted-2 text-truncate" style="font-size:11px">${SRIT.Util.esc(k.nama)}</div></div></div>`).join(''):'<div class="col-12 text-center text-muted-2 py-3">Tidak ada kegiatan terjadwal</div>'}</div>
        </div></div>
        <!-- Piket -->
        <div class="col-12 col-lg-4"><div class="card-srit p-3 h-100">
          <h6 class="section-title mb-3">Jadwal Piket ${d.isToday?'Hari Ini':SRIT.Util.fmtDateShort(d.iso)}</h6>
          <div class="table-responsive"><table class="table table-sm table-srit mb-0"><thead><tr><th>Petugas</th><th>Shift</th><th>Status</th></tr></thead><tbody>
          ${d.piket.length?d.piket.map(p=>`<tr><td>${(SRIT.Repo.getById('USERS',p.USER)||{}).NAME||'-'}<div class="text-muted-2" style="font-size:11px">${p.LOKASI}</div></td><td>${p.SHIFT}</td><td><span class="badge-soft st-HADIR">${p.STATUS}</span></td></tr>`).join(''):'<tr><td colspan="3" class="text-center text-muted-2">Belum ada piket</td></tr>'}
          </tbody></table></div>
        </div></div>
      </div>`;
    // charts (lazy)
    this.charts.push(new Chart($('#chTrend'),{type:'line',data:{labels:d.trend.map(t=>SRIT.Util.fmtDateShort(t.date)),datasets:[{label:'% Kehadiran',data:d.trend.map(t=>t.pct),borderColor:'#1c6ef2',backgroundColor:'rgba(28,110,242,.12)',fill:true,tension:.35,pointRadius:3}]},options:this._opt(true)}));
    this.charts.push(new Chart($('#chDonut'),{type:'doughnut',data:{labels:['Hadir','Izin','Sakit','Alpa','Belum'],datasets:[{data:[d.cur.HADIR,d.cur.IZIN,d.cur.SAKIT,d.cur.ALPA,d.cur.BELUM],backgroundColor:['#16a34a','#0ea5e9','#f59e0b','#dc2626','#94a3b8'],borderWidth:0}]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},cutout:'62%',maintainAspectRatio:false}}));
    // ---- filter tanggal & kegiatan (atas) ----
    const bd0={sessions:SRIT.Api.getSessionsForDate(d.iso).map(s=>({id:s.id,label:s.jamMulai+' '+s.nama+(s.jenjang!=='SEMUA'?' ('+s.jenjang+')':'')+(s.jk!=='SEMUA'?' '+(s.jk==='L'?'Putra':'Putri'):'')+(s.kelas?' Kls '+s.kelas:'')}))};
    const kegSel=$('#dashKeg');
    if(kegSel){
      kegSel.innerHTML='<option value="">Semua Kegiatan (status terkini)</option>'+bd0.sessions.map(s=>`<option value="${s.id}">${SRIT.Util.esc(s.label)}</option>`).join('');
      kegSel.value=this.sesi||'';
      kegSel.onchange=()=>{this.sesi=kegSel.value;this.load();};
    }
    const dt=$('#dashDate');if(dt)dt.onchange=()=>{this.date=dt.value;this.sesi=undefined;this.load();};
    const tb=$('#dashToday');if(tb)tb.onclick=()=>{this.date=SRIT.Util.todayISO();this.sesi=undefined;this.load();};
    // breakdown mengikuti tanggal + kegiatan terpilih
    this.renderBreakdown(d.iso,d.selectedSession||'',d);
  },
  renderBreakdown(iso,sessionId,pre){
    const d=pre; // perJenjang/perAsrama/perJenjangJK/perGedung sudah dibawa getDashboardData (1 permintaan server)
    const el=$('#dashBreakdown');if(!el)return;
    el.innerHTML=`
      <div class="col-12 col-md-6 col-lg-4"><div class="card-srit p-3 h-100">
        <h6 class="section-title mb-3">Kehadiran Per Jenjang & JK</h6>
        ${d.perJenjangJK.length?d.perJenjangJK.map(j=>`<div class="mb-2"><div class="d-flex justify-content-between small mb-1"><b>${j.jenjang} <span class="badge-soft ${j.jk==='L'?'st-IZIN':'st-SAKIT'}" style="font-size:10px">${j.jkLabel}</span></b><span class="text-muted-2">${j.hadir}/${j.total} (${j.pct}%)</span></div><div class="ltv-progress" style="background:var(--srit-hover)"><span style="width:${j.pct}%;background:${j.jk==='L'?'linear-gradient(90deg,#0ea5e9,#38bdf8)':'linear-gradient(90deg,#db2777,#f472b6)'}"></span></div></div>`).join(''):'<div class="empty-state py-3"><i class="bi bi-inbox d-block"></i>Belum ada data</div>'}
      </div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="card-srit p-3 h-100">
        <h6 class="section-title mb-3">Kehadiran Per Asrama</h6>
        ${d.perAsrama.length?d.perAsrama.map(a=>`<div class="mb-2"><div class="d-flex justify-content-between small mb-1"><b class="text-truncate">${SRIT.Util.esc(a.nama)}</b><span class="text-muted-2">${a.hadir}/${a.total} (${a.pct}%)</span></div><div class="ltv-progress" style="background:var(--srit-hover)"><span style="width:${a.pct}%;background:linear-gradient(90deg,#0ea5e9,#38bdf8)"></span></div></div>`).join(''):'<div class="empty-state py-3"><i class="bi bi-inbox d-block"></i>Belum ada data</div>'}
      </div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="card-srit p-3 h-100">
        <h6 class="section-title mb-3">Kehadiran Per Jenjang</h6>
        ${d.perJenjang.map(j=>`<div class="mb-2"><div class="d-flex justify-content-between small mb-1"><b>${j.jenjang}</b><span class="text-muted-2">${j.hadir}/${j.total} (${j.pct}%)</span></div><div class="ltv-progress" style="background:var(--srit-hover)"><span style="width:${j.pct}%"></span></div></div>`).join('')}
      </div></div>
      <div class="col-12"><div class="card-srit p-3">
        <h6 class="section-title mb-3">Rincian Kehadiran Per Gedung</h6>
        <div class="table-responsive"><table class="table table-sm table-srit mb-0">
          <thead><tr><th>Gedung</th><th>Jenjang</th><th>JK</th><th>Asrama</th><th class="text-center">Total</th><th class="text-center">Hadir</th><th class="text-center">Izin</th><th class="text-center">Sakit</th><th class="text-center">Alpa</th><th class="text-center">Belum</th><th style="min-width:120px">% Hadir</th></tr></thead>
          <tbody>${d.perGedung.length?d.perGedung.map(g=>`<tr>
            <td class="fw-semibold">${SRIT.Util.esc(g.nama)}</td>
            <td><span class="badge-soft st-IZIN">${g.jenjang}</span></td>
            <td>${g.jkLabel}</td>
            <td class="text-muted-2">${SRIT.Util.esc(g.asrama)}</td>
            <td class="text-center">${g.total}</td>
            <td class="text-center"><span class="badge-soft st-HADIR">${g.hadir}</span></td>
            <td class="text-center">${g.izin}</td>
            <td class="text-center">${g.sakit}</td>
            <td class="text-center">${g.alpa}</td>
            <td class="text-center">${g.belum}</td>
            <td><div class="d-flex align-items-center gap-2"><div class="ltv-progress flex-grow-1" style="background:var(--srit-hover)"><span style="width:${g.pct}%;background:${g.pct>=90?'linear-gradient(90deg,#16a34a,#4ade80)':g.pct>=75?'linear-gradient(90deg,#d97706,#fbbf24)':'linear-gradient(90deg,#dc2626,#f87171)'}"></span></div><b style="font-size:12px;min-width:38px;text-align:right">${g.pct}%</b></div></td>
          </tr>`).join(''):'<tr><td colspan="11"><div class="empty-state"><i class="bi bi-inbox d-block"></i>Belum ada data</div></td></tr>'}</tbody>
        </table></div>
      </div></div>`;
  },
  _opt(pct){return{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:pct?100:undefined,grid:{color:'rgba(128,128,128,.1)'}},x:{grid:{display:false}}}};},
  destroy(){this.charts.forEach(c=>c.destroy());this.charts=[];}
};
</script>

<script>__srit.n('View_Anak')</script>
<script>
//# sourceURL=View_Anak.html
// ---------- ANAK ----------
SRIT.Features.anak={
  state:{page:1,size:25,search:'',jenjang:'',jk:'',asrama:'',status:'AKTIF',lengkap:''},
  // Kolom kelengkapan data: SEMUA OPSIONAL (wajib hanya NIS, Nama, Jenjang, JK). Dipakai untuk penanda & filter "Kelengkapan Data".
  OPT_FIELDS:['NIK','NO_KK','NISN','TEMPAT_LAHIR','TANGGAL_LAHIR','SEKOLAH_ASAL','ALAMAT','DESA','KECAMATAN','ORANG_TUA','NO_HP','TAHUN_AJARAN'],
  _filled(a){return this.OPT_FIELDS.filter(k=>String(a[k]==null?'':a[k]).trim()!=='').length;},
  _badge(a){const n=this._filled(a),t=this.OPT_FIELDS.length,miss=this.OPT_FIELDS.filter(k=>String(a[k]==null?'':a[k]).trim()==='');
    return n===t?'<span class="badge-soft st-HADIR ms-1" style="font-size:10px">Data lengkap</span>'
      :`<span class="badge-soft st-IZIN ms-1" style="font-size:10px" title="Belum diisi: ${SRIT.Util.esc(miss.join(', '))}">Data ${n}/${t}</span>`;},
  _tahunAjaran(d=new Date()){const y=d.getFullYear(),m=d.getMonth();return m>=6?y+'/'+(y+1):(y-1)+'/'+y;},
  render(host){SRIT.UI.setPage('Data Anak / Siswa','Data Anak');
    const asr=SRIT.Store.read('ASRAMA');
    host.innerHTML=`
      <div class="card-srit p-3 mb-3"><div class="filter-bar">
        <div style="flex:1;min-width:200px"><label class="form-label-sm">Cari Nama / NIS / Kelas / Asrama / Gedung / Kamar / Wali Asuh</label>
          <div style="position:relative">
            <input class="form-control form-control-sm" id="anSearch" placeholder="Ketik nama, NIS, kelas, asrama, gedung, kamar, atau wali asuh..." style="padding-right:26px" value="${SRIT.Util.esc(this.state.search||'')}">
            <button type="button" id="anSearchClear" class="sf-clear-x" style="display:${this.state.search?'flex':'none'}" title="Hapus pencarian"><i class="bi bi-x-circle-fill"></i></button>
          </div>
        </div>
        <div><label class="form-label-sm">Jenjang</label><select class="form-select form-select-sm" id="anJenjang"><option value="">Semua</option>${['SRD','SRMP','SRMA'].map(j=>`<option ${this.state.jenjang===j?'selected':''}>${j}</option>`).join('')}</select></div>
        <div><label class="form-label-sm">Jenis Kelamin</label><select class="form-select form-select-sm" id="anJk"><option value="">Semua</option><option value="L" ${this.state.jk==='L'?'selected':''}>Putra</option><option value="P" ${this.state.jk==='P'?'selected':''}>Putri</option></select></div>
        <div><label class="form-label-sm">Asrama</label><select class="form-select form-select-sm" id="anAsrama"><option value="">Semua</option>${asr.map(a=>`<option value="${a.ID}" ${this.state.asrama===a.ID?'selected':''}>${a.NAME}</option>`).join('')}</select></div>
        <div><label class="form-label-sm">Status</label><select class="form-select form-select-sm" id="anStatus"><option value="">Semua</option><option value="AKTIF" ${this.state.status==='AKTIF'?'selected':''}>Aktif</option><option value="NONAKTIF" ${this.state.status==='NONAKTIF'?'selected':''}>Tidak Aktif</option></select></div>
        <div><label class="form-label-sm">Kelengkapan Data</label><select class="form-select form-select-sm" id="anLengkap"><option value="">Semua</option><option value="lengkap" ${this.state.lengkap==='lengkap'?'selected':''}>Lengkap</option><option value="belum" ${this.state.lengkap==='belum'?'selected':''}>Belum lengkap</option></select></div>
        <div><label class="form-label-sm">Per Halaman</label><select class="form-select form-select-sm" id="anSize"><option>25</option><option>50</option><option>100</option></select></div>
        ${SRIT.Auth.can('anak:CREATE')?'<div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-outline-success btn-sm" id="anImport"><i class="bi bi-file-earmark-excel"></i> Impor XLSX</button></div>':''}
        <div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-outline-secondary btn-sm" id="anExport"><i class="bi bi-download"></i> Ekspor</button></div>
        ${SRIT.Auth.can('anak:CREATE')?'<div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-primary btn-sm" id="anAdd"><i class="bi bi-plus-lg"></i> Tambah</button></div>':''}
      </div><div id="anActiveChips"></div></div>
      <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="anTable"></table></div>
      <div class="p-3 border-top" id="anPag"></div></div>`;
    $('#anSearch').oninput=e=>{
      $('#anSearchClear').style.display=e.target.value?'flex':'none';
      clearTimeout(this._searchT);
      this._searchT=setTimeout(()=>{this.state.search=e.target.value;this.state.page=1;this.load();},350);
    };
    $('#anSearchClear').onclick=()=>{$('#anSearch').value='';$('#anSearchClear').style.display='none';this.state.search='';this.state.page=1;this.load();};
    $('#anJenjang').onchange=e=>{this.state.jenjang=e.target.value;this.state.page=1;this.load();};
    $('#anJk').onchange=e=>{this.state.jk=e.target.value;this.state.page=1;this.load();};
    $('#anAsrama').onchange=e=>{this.state.asrama=e.target.value;this.state.page=1;this.load();};
    $('#anStatus').onchange=e=>{this.state.status=e.target.value;this.state.page=1;this.load();};
    $('#anLengkap').onchange=e=>{this.state.lengkap=e.target.value;this.state.page=1;this.load();};
    $('#anSize').onchange=e=>{this.state.size=+e.target.value;this.state.page=1;this.load();};
    $('#anExport').onclick=()=>this.exportCSV();
    const imp=$('#anImport');if(imp)imp.onclick=()=>this.importXLSX();
    const add=$('#anAdd');if(add)add.onclick=()=>this.form();

  renderChips(){
    const box=$('#anActiveChips');if(!box)return;
    const jjLabel={SRD:'SRD',SRMP:'SRMP',SRMA:'SRMA'};
    const asr=SRIT.Store.read('ASRAMA');
    const chips=[];
    if(this.state.search)chips.push({label:'Cari: "'+this.state.search+'"',clear:()=>{this.state.search='';$('#anSearch').value='';$('#anSearchClear').style.display='none';}});
    if(this.state.jenjang)chips.push({label:'Jenjang: '+(jjLabel[this.state.jenjang]||this.state.jenjang),clear:()=>{this.state.jenjang='';$('#anJenjang').value='';}});
    if(this.state.jk)chips.push({label:'JK: '+(this.state.jk==='L'?'Putra':'Putri'),clear:()=>{this.state.jk='';$('#anJk').value='';}});
    if(this.state.asrama)chips.push({label:'Asrama: '+((asr.find(a=>a.ID===this.state.asrama)||{}).NAME||this.state.asrama),clear:()=>{this.state.asrama='';$('#anAsrama').value='';}});
    if(this.state.status)chips.push({label:'Status: '+(this.state.status==='AKTIF'?'Aktif':'Tidak Aktif'),clear:()=>{this.state.status='';$('#anStatus').value='';}});
    if(this.state.lengkap)chips.push({label:'Data: '+(this.state.lengkap==='lengkap'?'Lengkap':'Belum lengkap'),clear:()=>{this.state.lengkap='';$('#anLengkap').value='';}});
    if(!chips.length){box.innerHTML='';return;}
    box.innerHTML=`<div class="d-flex align-items-center gap-2 flex-wrap mt-2">
      <span class="text-muted-2" style="font-size:11px">Filter aktif:</span>
      ${chips.map((c,i)=>`<span class="sf-chip" data-chip="${i}">${SRIT.Util.esc(c.label)} <i class="bi bi-x"></i></span>`).join('')}
      ${chips.length>1?'<span class="text-muted-2 pointer" id="anClearAll" style="font-size:11px;text-decoration:underline">Hapus semua filter</span>':''}
    </div>`;
    box.querySelectorAll('[data-chip]').forEach((el,i)=>{el.onclick=()=>{chips[i].clear();this.state.page=1;this.load();};});
    const ca=$('#anClearAll');if(ca)ca.onclick=()=>{
      this.state.search='';this.state.jenjang='';this.state.jk='';this.state.asrama='';this.state.status='';this.state.lengkap='';
      $('#anSearch').value='';$('#anSearchClear').style.display='none';$('#anJenjang').value='';$('#anJk').value='';$('#anAsrama').value='';$('#anStatus').value='';$('#anLengkap').value='';
      this.state.page=1;this.load();
    };
  },
  importXLSX(){
    SRIT.Import.open({
      table:'ANAK',title:'Data Anak / Siswa',module:'anak',idPrefix:'A',
      // Urutan & judul kolom mengikuti lembar data siswa; judul/alias lain (NIS, Nama, JK, TTL, dst.) juga dikenali.
      columns:[
        {key:'NIK',label:'NIK',hint:'opsional · 16 angka',pattern:'^\\d{16}$',patternMsg:'NIK harus 16 angka',normalize:v=>String(v).replace(/\D/g,'')},
        {key:'NO_KK',label:'Nomor KK',aliases:['No KK','No. KK','KK'],hint:'opsional · 16 angka',pattern:'^\\d{16}$',patternMsg:'Nomor KK harus 16 angka',normalize:v=>String(v).replace(/\D/g,'')},
        {key:'NISN',label:'NISN',hint:'opsional · 10 angka',pattern:'^\\d{10}$',patternMsg:'NISN harus 10 angka',normalize:v=>{const d=String(v).replace(/\D/g,'');return d.length>=8&&d.length<10?d.padStart(10,'0'):d;}},
        {key:'NIS',label:'Nomor Induk Siswa (NIS)',aliases:['NIS'],required:true},
        {key:'NAMA',label:'Nama Lengkap',aliases:['Nama'],required:true},
        {key:'TTL',label:'Tempat / Tgl.Lahir',aliases:['Tempat Tanggal Lahir','Tempat/Tanggal Lahir','TTL'],hint:'opsional · cth: Jombang, 12-03-2012'},
        {key:'JK',label:'Jenis Kelamin',aliases:['JK'],required:true,type:'select',options:[{v:'L'},{v:'P'}],hint:'L / P (Laki-laki / Perempuan juga dikenali)',normalize:v=>{const s=String(v).trim().toLowerCase();return /^(l|lk|laki|pria|putra|male)/.test(s)?'L':/^(p|pr|perempuan|wanita|putri|female)/.test(s)?'P':String(v).trim();}},
        {key:'JENJANG',label:'Jenjang',required:true,type:'select',options:[{v:'SRD'},{v:'SRMP'},{v:'SRMA'}],normalize:v=>{const s=String(v).trim().toUpperCase().replace(/\s+/g,'');return ({SD:'SRD',SDN:'SRD',SRD:'SRD',SMP:'SRMP',SRMP:'SRMP',SMA:'SRMA',SMK:'SRMA',SRMA:'SRMA'})[s]||s;}},
        {key:'SEKOLAH_ASAL',label:'Sekolah Asal',aliases:['Asal Sekolah'],hint:'opsional'},
        {key:'ALAMAT',label:'Alamat',hint:'opsional'},
        {key:'DESA',label:'Desa',aliases:['Desa/Kelurahan','Kelurahan'],hint:'opsional'},
        {key:'KECAMATAN',label:'Kecamatan',hint:'opsional'},
        {key:'ORANG_TUA',label:'Orang Tua',aliases:['Nama Orang Tua','Orang Tua / Wali','Wali'],hint:'opsional'},
        {key:'NO_HP',label:'No HP',aliases:['No. HP','Nomor HP','HP','No Telepon'],hint:'opsional',normalize:v=>{let d=String(v).replace(/[^\d+]/g,'');if(/^\+?62/.test(d))d='0'+d.replace(/^\+?62/,'');else if(/^8\d{8,11}$/.test(d))d='0'+d;return d;}},
        {key:'KELAS',label:'Kelas',hint:'cth: 7A'},
        {key:'TAHUN_AJARAN',label:'Keterangan ( Tahun Ajaran )',aliases:['Tahun Ajaran','Keterangan'],hint:'opsional · cth: 2026/2027'},
        {key:'ASRAMA',label:'Asrama',ref:'Struktur & Data Induk',refTable:'ASRAMA',refField:'NAME'},
        {key:'KAMAR',label:'Kamar',ref:'Struktur & Data Induk',refTable:'KAMAR',refField:'NAME'},
        {key:'WALI_ASUH',label:'Wali Asuh',ref:'Tenaga Kependidikan',refTable:'WALI_ASUH',refField:'NAME'},
        {key:'RFID_UID',label:'RFID UID',hint:'opsional untuk kartu RFID'}
      ],
      sample:[
        ['3517010101120001','3517012002100002','0123456789','2026999001','Contoh Siswa Satu','Jombang, 12-03-2012','L','SRMP','SDN Contoh 1','Jl. Mawar No. 5','Sumbersari','Jombang','Bpk. Slamet','081234567890','7A','2026/2027','Asrama Putra','Kamar 101','Bpk. Ridwan','RF999001'],
        ['','','','2026999002','Contoh Siswi Dua','','P','SRMA','','','','','','','10B','2026/2027','Asrama Putri','Kamar 201','Ibu Fatimah','RF999002']
      ],
      onRow:(rec,raw)=>{
        rec.STATUS='AKTIF';rec.TANGGAL_MASUK=SRIT.Util.todayISO();
        // "Tempat / Tgl.Lahir" gabungan → TEMPAT_LAHIR + TANGGAL_LAHIR (format tanggal: 12-03-2012, 12/03/2012, 2012-03-12, 12 Maret 2012)
        if(rec.TTL!==undefined){
          const s=String(rec.TTL||'').trim();delete rec.TTL;
          if(s){
            const BLN={januari:1,jan:1,februari:2,feb:2,pebruari:2,maret:3,mar:3,april:4,apr:4,mei:5,juni:6,jun:6,juli:7,jul:7,agustus:8,agu:8,agt:8,september:9,sep:9,sept:9,oktober:10,okt:10,november:11,nov:11,nop:11,desember:12,des:12};
            let iso='',tempat=s,m;
            const pad=n=>String(n).padStart(2,'0');
            if((m=s.match(/(\d{1,2})\s*[-/.\s]\s*(\d{1,2})\s*[-/.\s]\s*(\d{4})/))){iso=m[3]+'-'+pad(m[2])+'-'+pad(m[1]);tempat=s.slice(0,m.index);}
            else if((m=s.match(/(\d{4})\s*[-/.]\s*(\d{1,2})\s*[-/.]\s*(\d{1,2})/))){iso=m[1]+'-'+pad(m[2])+'-'+pad(m[3]);tempat=s.slice(0,m.index);}
            else if((m=s.match(/(\d{1,2})\s+([A-Za-z]+)\.?\s+(\d{4})/))&&BLN[m[2].toLowerCase()]){iso=m[3]+'-'+pad(BLN[m[2].toLowerCase()])+'-'+pad(m[1]);tempat=s.slice(0,m.index);}
            tempat=tempat.replace(/[\s,\/\-]+$/,'').trim();
            if(iso&&(+iso.slice(5,7)<1||+iso.slice(5,7)>12||+iso.slice(8,10)<1||+iso.slice(8,10)>31))iso='';
            rec.TEMPAT_LAHIR=iso?tempat:s;rec.TANGGAL_LAHIR=iso;
          }
        }
        // isi gedung/lantai dari kamar bila ada
        const km=SRIT.Repo.getById('KAMAR',rec.KAMAR);if(km){rec.GEDUNG=km.GEDUNG;rec.LANTAI=km.LANTAI;}
        if(!rec.RFID_UID)rec.RFID_UID='RF'+Date.now().toString().slice(-6);
      },
      onDone:()=>this.load()
    });
  },
  exportCSV(){
    const all=SRIT.Api.list('ANAK',{page:1,size:100000,search:this.state.search,searchFields:['NAMA','NIS'],filters:{JENJANG:this.state.jenjang,JK:this.state.jk,ASRAMA:this.state.asrama,STATUS:this.state.status},where:this.state.lengkap?(a=>{const n=this._filled(a);return this.state.lengkap==='lengkap'?n===this.OPT_FIELDS.length:n<this.OPT_FIELDS.length;}):null}).rows;
    if(!all.length){SRIT.Notify('Tidak ada data','warn');return;}
    let csv='NIK,Nomor KK,NISN,NIS,Nama Lengkap,Tempat Lahir,Tanggal Lahir,Jenis Kelamin,Jenjang,Sekolah Asal,Alamat,Desa,Kecamatan,Orang Tua,No HP,Kelas,Tahun Ajaran,Asrama,Kamar,Wali Asuh,Status,Tanggal Masuk,Tanggal Keluar\n';
    const tx=v=>v?'="'+String(v)+'"':'';   // angka panjang/berawalan 0 tetap utuh saat dibuka di Excel
    all.forEach(a=>csv+=[tx(a.NIK),tx(a.NO_KK),tx(a.NISN),a.NIS,a.NAMA,a.TEMPAT_LAHIR,a.TANGGAL_LAHIR,a.JK,a.JENJANG,a.SEKOLAH_ASAL,a.ALAMAT,a.DESA,a.KECAMATAN,a.ORANG_TUA,tx(a.NO_HP),a.KELAS,a.TAHUN_AJARAN,(SRIT.Repo.getById('ASRAMA',a.ASRAMA)||{}).NAME,(SRIT.Repo.getById('KAMAR',a.KAMAR)||{}).NAME,(SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME,a.STATUS,a.TANGGAL_MASUK,a.TANGGAL_KELUAR].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')+'\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='data_anak_'+SRIT.Util.todayISO()+'.csv';a.click();
    SRIT.Audit.log('EXPORT','anak','ANAK');SRIT.Notify('Data anak diekspor ('+all.length+')','ok');
  },
  load(){
    const r=SRIT.Api.list('ANAK',{page:this.state.page,size:this.state.size,search:this.state.search,
      searchFields:['NAMA','NIS','KELAS','JENJANG'],
      refSearch:[{table:'ASRAMA',field:'ASRAMA'},{table:'GEDUNG',field:'GEDUNG'},{table:'KAMAR',field:'KAMAR'},{table:'WALI_ASUH',field:'WALI_ASUH'}],
      filters:{JENJANG:this.state.jenjang,JK:this.state.jk,ASRAMA:this.state.asrama,STATUS:this.state.status},
      where:this.state.lengkap?(a=>{const n=this._filled(a);return this.state.lengkap==='lengkap'?n===this.OPT_FIELDS.length:n<this.OPT_FIELDS.length;}):null});
    const t=$('#anTable');
    const ket=a=>{
      const asr=(SRIT.Repo.getById('ASRAMA',a.ASRAMA)||{}).NAME||'-';
      const ged=(SRIT.Repo.getById('GEDUNG',a.GEDUNG)||{}).NAME||'-';
      const kmr=(SRIT.Repo.getById('KAMAR',a.KAMAR)||{}).NAME||'-';
      const wa=(SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-';
      return `<div class="text-muted-2" style="font-size:11px;line-height:1.5;margin-top:2px">
        <span class="me-2"><i class="bi bi-mortarboard"></i> ${a.KELAS||'-'}</span>
        <span class="me-2"><i class="bi bi-house"></i> ${SRIT.Util.esc(asr)}</span>
        <span class="me-2"><i class="bi bi-building"></i> ${SRIT.Util.esc(ged)}</span>
        <span class="me-2"><i class="bi bi-door-open"></i> ${SRIT.Util.esc(kmr)}</span>
        <span><i class="bi bi-person-heart"></i> ${SRIT.Util.esc(wa)}</span>
      </div>`;
    };
    const stat=a=>{
      const off=a.STATUS==='NONAKTIF';
      const tgl=(off?'Keluar '+ (a.TANGGAL_KELUAR?SRIT.Util.fmtDateShort(a.TANGGAL_KELUAR):'-') : (a.TANGGAL_MASUK?'Masuk '+SRIT.Util.fmtDateShort(a.TANGGAL_MASUK):''));
      return `<span class="badge-soft ${off?'st-ALPA':'st-HADIR'}">${off?'Tidak Aktif':'Aktif'}</span>${tgl?`<div class="text-muted-2 mt-1" style="font-size:10px">${tgl}</div>`:''}`;
    };
    t.innerHTML=`<thead><tr><th>NIS</th><th>Nama & Keterangan</th><th>Jenjang</th><th>JK</th><th>RFID</th><th>Status</th><th class="text-end">Aksi</th></tr></thead><tbody>
    ${r.rows.length?r.rows.map(a=>`<tr>
      <td class="align-top">${a.NIS}</td>
      <td><div class="fw-semibold">${SRIT.Util.esc(a.NAMA)}${this._badge(a)}</div>${ket(a)}</td>
      <td class="align-top"><span class="badge-soft st-IZIN">${a.JENJANG}</span></td>
      <td class="align-top">${a.JK==='L'?'Putra':a.JK==='P'?'Putri':a.JK}</td>
      <td class="align-top"><code style="font-size:11px">${a.RFID_UID}</code></td>
      <td class="align-top">${stat(a)}</td>
      <td class="text-end align-top text-nowrap"><button class="btn btn-sm btn-outline-primary py-0" title="Kartu QR" onclick="SRIT.Features.anak.qr('${a.ID}')"><i class="bi bi-qr-code"></i></button><button class="btn btn-sm btn-outline-info py-0 ms-1" title="Profil Perkembangan" onclick="SRIT.Features.profiling.open('${a.ID}')"><i class="bi bi-person-lines-fill"></i></button>
      ${SRIT.Auth.can('anak:UPDATE')?`<button class="btn btn-sm btn-outline-secondary py-0 ms-1" title="Ubah" onclick="SRIT.Features.anak.form('${a.ID}')"><i class="bi bi-pencil"></i></button>`:''}
      ${a.STATUS==='NONAKTIF'
        ?(SRIT.Auth.can('anak:UPDATE')?`<button class="btn btn-sm btn-outline-success py-0 ms-1" title="Aktifkan Kembali" onclick="SRIT.Features.anak.reaktivasi('${a.ID}')"><i class="bi bi-arrow-counterclockwise"></i></button>`:'')
        :(SRIT.Auth.can('anak:DELETE')?`<button class="btn btn-sm btn-outline-danger py-0 ms-1" title="Nonaktifkan" onclick="SRIT.Features.anak.del('${a.ID}')"><i class="bi bi-trash"></i></button>`:'')}</td>
    </tr>`).join(''):'<tr><td colspan="7"><div class="empty-state"><i class="bi bi-inbox d-block"></i>Tidak ada data</div></td></tr>'}
    </tbody>`;
    $('#anPag').innerHTML=SRIT.UI.pagination(r);
    $$('#anPag [data-pg]').forEach(a=>a.onclick=()=>{this.state.page=+a.dataset.pg;this.load();});
    this.renderChips();
  },

      const f=$('#anForm',m.el);if(!f.reportValidity())return;
      const data=Object.fromEntries(new FormData(f));
      Object.keys(data).forEach(k=>{if(typeof data[k]==='string')data[k]=data[k].trim();});
      if(id){SRIT.Repo.update('ANAK',id,data);SRIT.Audit.log('UPDATE','anak',id);}
      else{data.ID=SRIT.Util.uid('A');SRIT.Repo.insert('ANAK',data);SRIT.Audit.log('CREATE','anak',data.ID);}
      SRIT.Cache.invalidate('dash');m.close();SRIT.Notify('Data anak tersimpan','ok');this.load();
    };
  },
  del(id){const a=SRIT.Repo.getById('ANAK',id);
    if(confirm('Nonaktifkan '+a.NAMA+'? Tanggal keluar akan dicatat hari ini.')){
      SRIT.Repo.update('ANAK',id,{STATUS:'NONAKTIF',TANGGAL_KELUAR:SRIT.Util.todayISO()});
      SRIT.Audit.log('DELETE','anak',id);SRIT.Notify('Anak dinonaktifkan','warn');this.load();
    }},
  reaktivasi(id){const a=SRIT.Repo.getById('ANAK',id);
    if(confirm('Aktifkan kembali '+a.NAMA+'?')){
      SRIT.Repo.update('ANAK',id,{STATUS:'AKTIF',TANGGAL_KELUAR:''});
      SRIT.Audit.log('UPDATE','anak',id);SRIT.Notify('Anak diaktifkan kembali','ok');this.load();
    }},
  qr(id){
    const a=SRIT.Repo.getById('ANAK',id);if(!a)return;
    const payload='SRIT:'+a.ID;
    const url='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(payload);
    const set=SRIT.Store.readObj('SETTINGS');
    const card=`<div id="qrCard" style="text-align:center;font-family:Segoe UI,sans-serif;color:#111;border:1px solid #ddd;border-radius:12px;padding:20px;max-width:300px;margin:0 auto">
      <div style="font-weight:800;font-size:14px">${SRIT.Util.esc(set.SCHOOL_SHORT||set.SCHOOL_NAME||'SRITi')}</div>
      <div style="font-size:11px;color:#666;margin-bottom:12px">KARTU ABSENSI SANTRI</div>
      <img src="${url}" alt="QR" style="width:220px;height:220px" crossorigin="anonymous">
      <div style="font-weight:700;margin-top:10px">${SRIT.Util.esc(a.NAMA)}</div>
      <div style="font-size:12px;color:#444">NIS: ${a.NIS} · ${a.JENJANG} ${a.KELAS||''}</div>
      <div style="font-size:10px;color:#999;margin-top:6px">${payload}</div>
    </div>`;
    const m=SRIT.Modal.open({title:'Kartu QR — '+a.NAMA,body:card,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Tutup</button><button class="btn btn-primary btn-sm" id="qrPrint"><i class="bi bi-printer"></i> Cetak</button>`});
    $('#qrPrint',m.el).onclick=()=>{const w=window.open('','_blank');w.document.write('<html><head><title>Kartu QR</title></head><body style="display:flex;justify-content:center;padding:30px">'+$('#qrCard',m.el).outerHTML+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),400);};
  },
  destroy(){}
};
</script>

<script>__srit.n('View_Absensi')</script>
<script>
//# sourceURL=View_Absensi.html
// ---------- ABSENSI (tab: Manual / RFID / QR Camera) ----------
SRIT.Features.absensi={
  state:{date:SRIT.Util.todayISO(),keg:'',page:1,size:25,search:'',jenjang:'',jk:'',asrama:'',kelas:'',dirty:{},tab:'manual',log:[]},
  _qr:{stream:null,raf:null,last:'',lastTime:0},
  render(host){SRIT.UI.setPage('Absensi','Absensi');
    const asrama=SRIT.Store.read('ASRAMA');
    const kelasList=[...new Set(SRIT.Store.read('ANAK').map(a=>a.KELAS).filter(Boolean))].sort();
    host.innerHTML=`
      <div class="card-srit p-3 mb-3">
        <div class="filter-bar">
          <div><label class="form-label-sm">Tanggal</label><input type="date" class="form-control form-control-sm" id="abDate" value="${this.state.date}"></div>
          <div style="min-width:260px"><label class="form-label-sm">Sesi Kegiatan <span id="abHari" class="text-muted-2"></span></label><select class="form-select form-select-sm" id="abKeg"></select></div>
        </div>
        <div id="abSesInfo" class="mt-2"></div>
        <hr class="my-2">
        <style>.ab-ddrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}@media(max-width:575px){.ab-ddrow{grid-template-columns:1fr}}
.ab-dd{position:relative}.ab-dd-lbl{display:block;font-size:11px;color:var(--srit-text-2);margin-bottom:3px}
.ab-dd-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;background:var(--srit-surface);border:1px solid var(--srit-border);border-radius:10px;color:var(--srit-text);font-size:13px;cursor:pointer;transition:.15s;user-select:none}
.ab-dd-btn:hover{border-color:var(--srit-primary)}.ab-dd.open .ab-dd-btn,.ab-dd-btn.on{border-color:var(--srit-primary)}
.ab-dd.open .ab-dd-btn{box-shadow:0 0 0 3px rgba(var(--srit-primary-rgb),.18)}
.ab-dd-btn .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.ab-dd-btn .v.ph{font-weight:400;color:var(--srit-text-2)}
.ab-dd-btn .x{opacity:.55;font-size:14px}.ab-dd-btn .x:hover{opacity:1}.ab-dd-btn .ch{font-size:11px;opacity:.7;transition:.15s}.ab-dd.open .ch{transform:rotate(180deg)}
.ab-dd-panel{display:none;position:absolute;z-index:1060;left:0;right:0;top:calc(100% + 4px);min-width:190px;background:var(--srit-card);border:1px solid var(--srit-border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);overflow:hidden}
.ab-dd.open .ab-dd-panel{display:block}.ab-dd-search{padding:8px;border-bottom:1px solid var(--srit-border)}
.ab-dd-search input{width:100%;padding:6px 10px;font-size:13px;border:1px solid var(--srit-border);border-radius:8px;background:var(--srit-surface);color:var(--srit-text);outline:none}
.ab-dd-search input:focus{border-color:var(--srit-primary)}.ab-dd-list{max-height:250px;overflow:auto;padding:4px}
.ab-dd-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.ab-dd-opt:hover{background:var(--srit-hover)}.ab-dd-opt.sel{background:rgba(var(--srit-primary-rgb),.14);color:var(--srit-primary);font-weight:600}.ab-dd-opt .ck{margin-left:auto}
.ab-dd-empty{padding:12px;text-align:center;font-size:12px;color:var(--srit-text-2)}</style>
        <div id="abFilter">
          <div style="position:relative">
            <i class="bi bi-search" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6"></i>
            <input class="form-control" id="abSearch" placeholder="Cari nama atau NIS anak\u2026" autocomplete="off" style="padding-left:34px;padding-right:32px" value="${SRIT.Util.esc(this.state.search||'')}">
            <button type="button" id="abSearchClear" class="sf-clear-x" style="display:${this.state.search?'flex':'none'}" title="Hapus pencarian"><i class="bi bi-x-circle-fill"></i></button>
          </div>
          <div class="ab-ddrow"><div class="ab-dd" id="abDdJenjang"></div><div class="ab-dd" id="abDdAsrama"></div><div class="ab-dd" id="abDdKelas"></div></div>
        </div>
        <div id="abActiveChips"></div>
      </div>
      <div class="row g-2 mb-3" id="abSumm"></div>
      <ul class="nav nav-pills mb-3" id="abTabs">
        <li class="nav-item"><a class="nav-link active pointer" data-tab="manual"><i class="bi bi-pencil-square me-1"></i>Absen Manual</a></li>
        <li class="nav-item"><a class="nav-link pointer" data-tab="rfid"><i class="bi bi-credit-card-2-front me-1"></i>Scan RFID</a></li>
        <li class="nav-item"><a class="nav-link pointer" data-tab="qr"><i class="bi bi-qr-code-scan me-1"></i>Scan QR Kamera</a></li>
        <li class="nav-item"><a class="nav-link pointer" data-tab="face"><i class="bi bi-person-bounding-box me-1"></i>Scan Wajah</a></li>
      </ul>
      <div id="abTabBody"></div>`;
    $('#abDate').onchange=e=>{this.state.date=e.target.value;this.state.dirty={};this.buildSessions();};
    $('#abKeg').onchange=e=>{this.state.keg=e.target.value;this.state.dirty={};this.load();};
    this.state.jk='';
    $('#abSearch').oninput=e=>{
      $('#abSearchClear').style.display=e.target.value?'flex':'none';
      clearTimeout(this._searchT);
      this._searchT=setTimeout(()=>{this.state.search=e.target.value;this.state.page=1;this.load();},350);
    };
    $('#abSearchClear').onclick=()=>{$('#abSearch').value='';$('#abSearchClear').style.display='none';this.state.search='';this.state.page=1;this.load();};
    // filter dropdown kustom: pilih = langsung terapkan; X = lepas; klik di luar / Esc = tutup
    const closeDD=()=>$$('#abFilter .ab-dd.open').forEach(x=>x.classList.remove('open'));
    $('#abFilter').onclick=e=>{
      const x=e.target.closest('[data-ddx]');
      if(x){this.state[x.dataset.ddx]='';this.state.page=1;closeDD();this.load();return;}
      const o=e.target.closest('.ab-dd-opt');
      if(o){const k=o.dataset.k;this.state[k]=o.dataset.v;if(k!=='kelas'&&this.state.kelas&&this._kelasOpts().indexOf(this.state.kelas)<0)this.state.kelas='';closeDD();this.state.page=1;this.load();return;}
      const b=e.target.closest('.ab-dd-btn');
      if(b){const dd=b.closest('.ab-dd'),was=dd.classList.contains('open');closeDD();
        if(!was){dd.classList.add('open');const si=dd.querySelector('.ab-dd-search input');if(si){si.value='';this._ddFilter(dd,'');if(!('ontouchstart' in window))si.focus();}}}
    };
    $('#abFilter').oninput=e=>{const s=e.target.closest('.ab-dd-search');if(s)this._ddFilter(s.closest('.ab-dd'),e.target.value);};
    $('#abFilter').onkeydown=e=>{if(e.key==='Escape')closeDD();};
    if(this._ddDoc)document.removeEventListener('click',this._ddDoc);
    this._ddDoc=ev=>{if(!ev.target.closest||!ev.target.closest('#abFilter'))$$('#abFilter .ab-dd.open').forEach(x=>x.classList.remove('open'));};
    document.addEventListener('click',this._ddDoc);
    $$('#abTabs a').forEach(a=>a.onclick=()=>this.switchTab(a.dataset.tab));
    this.buildSessions();
  },
  _kelasOpts(){
    const s=this.state;
    return [...new Set(SRIT.Store.read('ANAK').filter(a=>(!s.jenjang||a.JENJANG===s.jenjang)&&(!s.asrama||a.ASRAMA===s.asrama)).map(a=>a.KELAS).filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),'id',{numeric:true}));
  },
  _ddFilter(dd,q){q=String(q||'').trim().toLowerCase();dd.querySelectorAll('.ab-dd-opt').forEach(o=>{o.style.display=(!q||o.textContent.toLowerCase().indexOf(q)>=0)?'':'none';});},
  _renderDD(){
    const s=this.state,asrama=SRIT.Store.read('ASRAMA'),esc=SRIT.Util.esc;
    const defs=[
      {id:'abDdJenjang',k:'jenjang',label:'Jenjang',items:['SRD','SRMP','SRMA'].map(j=>[j,j])},
      {id:'abDdAsrama',k:'asrama',label:'Asrama',items:asrama.map(a=>[a.ID,a.NAME])},
      {id:'abDdKelas',k:'kelas',label:'Kelas',items:this._kelasOpts().map(k=>[k,k])}];
    defs.forEach(d=>{
      const el=$('#'+d.id);if(!el||el.classList.contains('open'))return;
      const cur=s[d.k],it=d.items.find(i=>i[0]===cur),low=d.label.toLowerCase();
      el.innerHTML=`<span class="ab-dd-lbl">${d.label}</span>
        <div class="ab-dd-btn ${cur?'on':''}" role="button" tabindex="0">
          <span class="v ${cur?'':'ph'}">${cur?esc(it?it[1]:cur):'Semua'}</span>
          ${cur?'<i class="bi bi-x-circle-fill x" data-ddx="'+d.k+'" title="Hapus filter"></i>':''}
          <i class="bi bi-chevron-down ch"></i></div>
        <div class="ab-dd-panel">
          ${d.items.length>7?'<div class="ab-dd-search"><input type="text" placeholder="Cari '+low+'\u2026" autocomplete="off"></div>':''}
          <div class="ab-dd-list">
            <div class="ab-dd-opt ${cur?'':'sel'}" data-k="${d.k}" data-v="">Semua ${low}${cur?'':'<i class="bi bi-check2 ck"></i>'}</div>
            ${d.items.map(i=>`<div class="ab-dd-opt ${cur===i[0]?'sel':''}" data-k="${d.k}" data-v="${esc(i[0])}">${esc(i[1])}${cur===i[0]?'<i class="bi bi-check2 ck"></i>':''}</div>`).join('')}
            ${d.items.length?'':'<div class="ab-dd-empty">Tidak ada pilihan</div>'}
          </div></div>`;
    });
  },
  renderChips(){
    this._renderDD();
    const box=$('#abActiveChips');if(!box)return;
    const asrama=SRIT.Store.read('ASRAMA');
    const chips=[];
    if(this.state.search)chips.push({label:'Cari: "'+this.state.search+'"',clear:()=>{this.state.search='';$('#abSearch').value='';$('#abSearchClear').style.display='none';}});
    if(this.state.jenjang)chips.push({label:'Jenjang: '+this.state.jenjang,clear:()=>{this.state.jenjang='';}});
    if(this.state.asrama)chips.push({label:'Asrama: '+((asrama.find(a=>a.ID===this.state.asrama)||{}).NAME||this.state.asrama),clear:()=>{this.state.asrama='';}});
    if(this.state.kelas)chips.push({label:'Kelas: '+this.state.kelas,clear:()=>{this.state.kelas='';}});
    if(!chips.length){box.innerHTML='';return;}
    box.innerHTML=`<div class="d-flex align-items-center gap-2 flex-wrap mt-2">
      <span class="text-muted-2" style="font-size:11px">Filter aktif:</span>
      ${chips.map((c,i)=>`<span class="sf-chip" data-chip="${i}">${SRIT.Util.esc(c.label)} <i class="bi bi-x"></i></span>`).join('')}
      ${chips.length>1?'<span class="text-muted-2 pointer" id="abClearAll" style="font-size:11px;text-decoration:underline">Hapus semua filter</span>':''}
    </div>`;
    box.querySelectorAll('[data-chip]').forEach((el,i)=>{el.onclick=()=>{chips[i].clear();this.state.page=1;this.load();};});
    const ca=$('#abClearAll');if(ca)ca.onclick=()=>{
      this.state.search='';this.state.jenjang='';this.state.asrama='';this.state.kelas='';
      $('#abSearch').value='';$('#abSearchClear').style.display='none';
      this.state.page=1;this.load();
    };
  },
  switchTab(tab){
    if(tab===this.state.tab && $('#abTabBody').innerHTML)return;
    if(this.stopQR)this.stopQR();
    this.state.tab=tab;
    $$('#abTabs a').forEach(a=>a.classList.toggle('active',a.dataset.tab===tab));
    this.renderTab();
  },
  buildSessions(){
    const sessions=SRIT.Api.getSessionsForDate(this.state.date);
    $('#abHari').textContent='('+SRIT.Util.hariOf(this.state.date)+')';
    const sel=$('#abKeg');
    if(!sessions.length){sel.innerHTML='<option value="">\u2014 Tidak ada sesi \u2014</option>';this.state.keg='';
      $('#abSesInfo').innerHTML='<div class="alert alert-warning py-2 mb-0" style="font-size:12px"><i class="bi bi-info-circle"></i> Tidak ada kegiatan ber-absensi (jadwal rutin atau kegiatan khusus) pada hari ini.</div>';
      this.load();return;}
    if(!sessions.find(s=>s.id===this.state.keg))this.state.keg=sessions[0].id;
    sel.innerHTML=sessions.map(s=>{
      const tag=s.source==='KEGIATAN'?' [KHUSUS]':'';
      const scope=(s.jenjang!=='SEMUA'?s.jenjang:'')+(s.jk!=='SEMUA'?(s.jk==='L'?' Putra':' Putri'):'')+(s.kelas?' Kls '+s.kelas:'');
      return `<option value="${s.id}">${s.jamMulai}-${s.jamSelesai} \u00b7 ${SRIT.Util.esc(s.nama)}${scope?' ('+scope.trim()+')':''}${tag}</option>`;
    }).join('');
    sel.value=this.state.keg;
    this.load();
  },
  async load(){
    if(!this.state.keg){$('#abSumm').innerHTML='';$('#abTabBody').innerHTML='<div class="empty-state"><i class="bi bi-calendar-x d-block"></i>Pilih sesi kegiatan terlebih dahulu.</div>';this.renderChips();return;}
    const _seq=(this._seq=(this._seq||0)+1);let r;
    try{r=await this._query();}catch(e){SRIT.Notify(e.message||'Gagal memuat absensi','err');return;}
    if(_seq!==this._seq||SRIT.currentFeature!=='absensi'||!$('#abSumm'))return;
    const m=r.meta;
    if(m){const scope=[m.jenjang!=='SEMUA'?m.jenjang:'Semua Jenjang',m.jk==='L'?'Putra':m.jk==='P'?'Putri':'Putra & Putri'].concat(m.kelas?['Kelas '+m.kelas]:[]).join(' \u00b7 ');
      $('#abSesInfo').innerHTML=`<div class="d-flex flex-wrap gap-2 align-items-center" style="font-size:12px">
        <span class="badge-soft ${m.source==='KEGIATAN'?'st-SAKIT':'st-IZIN'}">${m.source==='KEGIATAN'?'KEGIATAN KHUSUS':'JADWAL RUTIN'}</span>
        <span><i class="bi bi-clock"></i> ${m.jamMulai}\u2013${m.jamSelesai}</span>
        <span><i class="bi bi-people"></i> ${scope}</span>
        ${m.lokasi?`<span><i class="bi bi-geo-alt"></i> ${SRIT.Util.esc(m.lokasi)}</span>`:''}</div>`;}
    const s=r.summary;
    const totSes=s.HADIR+s.IZIN+s.SAKIT+s.ALPA+s.BELUM;
    const pctSes=SRIT.Util.pct(s.HADIR,totSes);
    const chip=(l,v,cls)=>`<div class="col"><div class="card-srit p-2 text-center"><div class="fw-bold" style="font-size:20px">${v}</div><span class="badge-soft ${cls}">${l}</span></div></div>`;
    $('#abSumm').innerHTML=chip('HADIR',s.HADIR,'st-HADIR')+chip('IZIN',s.IZIN,'st-IZIN')+chip('SAKIT',s.SAKIT,'st-SAKIT')+chip('ALPA',s.ALPA,'st-ALPA')+chip('BELUM',s.BELUM,'st-BELUM')+chip('% HADIR (Kegiatan)',pctSes+'%','st-HADIR');
    this.renderChips();
    this.renderTab(r);
  },
  _query(){return SRIT.Api.getAttendanceSession(this.state.date,this.state.keg,{page:this.state.page,size:this.state.size,search:this.state.search,jenjang:this.state.jenjang,jk:this.state.jk,asrama:this.state.asrama,kelas:this.state.kelas});},
  async renderTab(r){
    if(!this.state.keg)return;
    if(!r){try{r=await this._query();}catch(e){SRIT.Notify(e.message||'Gagal memuat absensi','err');return;}
      if(SRIT.currentFeature!=='absensi'||!$('#abTabBody'))return;}
    const body=$('#abTabBody');
    if(this.state.tab==='qr'||this.state.tab==='rfid')SRIT.Api.seedScanned(this.state.date,this.state.keg);   // anti-ganda: muat yang sudah tercatat
    if(this.state.tab==='manual')this._renderManual(body,r);
    else if(this.state.tab==='rfid')this._renderRfid(body,r);
    else if(this.state.tab==='face')this._renderFace(body);
    else if(this._renderQR)this._renderQR(body,r);
    else body.innerHTML='<div class="alert alert-warning m-3">Modul kamera QR belum termuat (berkas View_AbsensiKamera). Gunakan tab Manual atau RFID.</div>';
  },
  // ---------- MANUAL ----------
  _renderManual(body,r){
    const canEdit=SRIT.Auth.can('absensi:CREATE');
    body.innerHTML=`<div class="card-srit p-0"><div class="d-flex justify-content-between align-items-center p-3 border-bottom flex-wrap gap-2">
        <div class="text-muted-2 small">Menampilkan ${r.rows.length} dari ${r.total} peserta (setelah filter)</div>
        <div class="d-flex align-items-center gap-2">
          ${canEdit?'<button class="btn btn-outline-success btn-sm" id="abAllHadir"><i class="bi bi-check2-all"></i> Hadir Semua</button>':''}
          <div><label class="form-label-sm d-inline me-1">Per Hal</label><select class="form-select form-select-sm d-inline-block w-auto" id="abSize"><option>25</option><option>50</option><option>100</option></select></div>
        </div>
      </div>
      <div class="table-responsive"><table class="table table-srit mb-0" id="abTable"></table></div>
      <div class="p-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2"><div id="abPag"></div>
      ${canEdit?'<button class="btn btn-success btn-sm" id="abSave"><i class="bi bi-save"></i> Simpan Batch (<span id="abDirtyN">0</span>)</button>':''}</div>
    </div>`;
    $('#abSize').value=this.state.size;$('#abSize').onchange=e=>{this.state.size=+e.target.value;this.state.page=1;this.load();};
    const sv=$('#abSave');if(sv)sv.onclick=()=>this.save();
    const ah=$('#abAllHadir');if(ah)ah.onclick=()=>this.hadirSemua();
    const t=$('#abTable');
    t.innerHTML=`<thead><tr><th>NIS</th><th>Nama</th><th>Jenjang</th><th>Kelas</th><th>JK</th><th>Status</th></tr></thead><tbody>
    ${r.rows.length?r.rows.map(a=>{const cur=this.state.dirty[a.ID]||a.STATUS;return `<tr>
      <td>${a.NIS}</td><td class="fw-semibold">${SRIT.Util.esc(a.NAMA)}</td><td>${a.JENJANG}</td><td>${a.KELAS||'-'}</td><td>${a.JK}</td>
      <td>${canEdit?`<div class="d-flex flex-wrap gap-1" role="group" style="min-width:180px">
        ${['HADIR','IZIN','SAKIT','ALPA','BELUM'].map(st=>`<button type="button" class="btn btn-sm ${cur===st?this._btnCls(st):'btn-outline-secondary'} py-0 px-2" style="font-size:12px;font-weight:700;min-width:32px;border-radius:6px" title="${st==='BELUM'?'Belum Absen':st}" onclick="SRIT.Features.absensi.mark('${a.ID}','${st}',this)">${st==='BELUM'?'-':st[0]}</button>`).join('')}
      </div>`:`<span class="badge-soft st-${cur}">${cur}</span>`}</td>
    </tr>`;}).join(''):'<tr><td colspan="6"><div class="empty-state"><i class="bi bi-people d-block"></i>Tidak ada peserta sesuai filter</div></td></tr>'}
    </tbody>`;
    $('#abPag').innerHTML=SRIT.UI.pagination(r);
    $$('#abPag [data-pg]').forEach(a=>a.onclick=()=>{this.state.page=+a.dataset.pg;this.load();});
    this._updateDirtyN();
  },
  // ---------- RFID ----------
  _renderRfid(body,r){
    body.innerHTML=`<div class="row g-3">
      <div class="col-lg-5"><div class="card-srit p-4 text-center">
        <div class="kpi-icon bg-grad-primary mx-auto mb-3" style="width:64px;height:64px;font-size:30px"><i class="bi bi-credit-card-2-front"></i></div>
        <h6 class="fw-bold">Scan Kartu RFID</h6>
        <p class="text-muted-2" style="font-size:13px">Tempelkan kartu pada reader. Fokuskan kursor pada kolom di bawah, hasil scan otomatis tercatat <b>HADIR</b>.</p>
        <input class="form-control form-control-lg text-center" id="abRfid" placeholder="Tap kartu / ketik UID..." autocomplete="off" style="letter-spacing:2px">
        <div class="text-muted-2 mt-2" style="font-size:11px">Sesi: ${SRIT.Util.esc((r.meta||{}).nama||'-')}</div>
      </div></div>
      <div class="col-lg-7"><div class="card-srit p-0 h-100">
        <div class="p-3 border-bottom d-flex justify-content-between"><h6 class="section-title mb-0"><i class="bi bi-clock-history me-1"></i>Log Scan Terakhir</h6><span class="badge-soft st-HADIR" id="abLogN">${this.state.log.length}</span></div>
        <div id="abLog" style="max-height:360px;overflow:auto"></div>
      </div></div>
    </div>`;
    const inp=$('#abRfid');inp.focus();
    inp.onkeydown=e=>{if(e.key==='Enter'){const v=inp.value.trim();inp.value='';if(!v)return;this._doScan('RFID',v);}};
    this._renderLog();
  },
  // ---------- SCAN WAJAH (pemindai di halaman terpisah; tab ini = pintu masuk + status pendaftaran) ----------
  _face:{q:'',f:'',page:1},_execUrl:'',
  _scanBase(){try{return (localStorage.getItem('srit_scan_url')||'').trim();}catch(e){return '';}},
  async _prefetchExec(){if(this._execUrl)return;try{const r=await SRIT.Server.call('apiWajahStatus',{size:1});this._execUrl=r.execUrl||'';}catch(e){}},
  _openScan(mode){
    const base=this._scanBase();
    if(!base){SRIT.Notify('Isi alamat halaman pemindai dulu di tab Scan Wajah','warn');this.switchTab('face');return;}
    const u=base.replace(/[#?].*$/,'')+'#'+(this._execUrl?'api='+encodeURIComponent(this._execUrl)+'&':'')+'mode='+mode;
    window.open(u,'_blank','noopener');
  },
  _renderFace(body){
    const esc=SRIT.Util.esc;
    body.innerHTML=`<div class="row g-3">
      <div class="col-lg-5"><div class="card-srit p-3">
        <h6 class="section-title mb-2"><i class="bi bi-person-bounding-box me-1"></i>Absensi Wajah</h6>
        <div class="alert alert-info py-2" style="font-size:12px">Kamera tidak dapat dipakai langsung di dalam Apps Script. Pindai &amp; pendaftaran wajah dilakukan di <b>halaman pemindai</b> terpisah (HTTPS). Hasilnya masuk ke absensi ini dengan metode <b>WAJAH</b>.</div>
        <label class="form-label-sm">Alamat halaman pemindai</label>
        <div class="input-group input-group-sm mb-2"><input class="form-control" id="abScanUrl" placeholder="https://srit-scan.vercel.app" value="${esc(this._scanBase())}"><button class="btn btn-outline-primary" id="abScanSave">Simpan</button></div>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-primary btn-sm" id="abOpenFace"><i class="bi bi-camera"></i> Buka Scan Wajah</button>
          <button class="btn btn-outline-primary btn-sm" id="abOpenEnroll"><i class="bi bi-person-plus"></i> Daftarkan Wajah</button>
        </div>
        <div class="text-muted-2 mt-2" style="font-size:11px">Yang disimpan adalah vektor angka (bukan foto) di sheet WAJAH yang tidak dikirim ke browser. Pastikan ada persetujuan wali sebelum mendaftarkan wajah anak.</div>
        <div id="abFaceSumm" class="mt-3"></div>
      </div></div>
      <div class="col-lg-7"><div class="card-srit p-0 h-100">
        <div class="p-3 border-bottom d-flex gap-2 flex-wrap justify-content-between align-items-center">
          <h6 class="section-title mb-0">Status Pendaftaran Wajah</h6>
          <div class="d-flex gap-2"><input class="form-control form-control-sm" id="abFaceQ" placeholder="Cari nama / NIS" value="${esc(this._face.q)}">
            <select class="form-select form-select-sm" id="abFaceF"><option value="">Semua</option><option value="belum" ${this._face.f==='belum'?'selected':''}>Belum terdaftar</option><option value="sudah" ${this._face.f==='sudah'?'selected':''}>Sudah terdaftar</option></select></div>
        </div>
        <div id="abFaceList"><div class="p-3 text-muted-2">Memuat\u2026</div></div>
      </div></div></div>`;
    $('#abScanSave').onclick=()=>{try{localStorage.setItem('srit_scan_url',$('#abScanUrl').value.trim());SRIT.Notify('Alamat pemindai disimpan','ok');}catch(e){SRIT.Notify('Gagal menyimpan','err');}};
    $('#abOpenFace').onclick=()=>{const v=$('#abScanUrl').value.trim();if(v)try{localStorage.setItem('srit_scan_url',v);}catch(e){}this._openScan('face');};
    $('#abOpenEnroll').onclick=()=>{const v=$('#abScanUrl').value.trim();if(v)try{localStorage.setItem('srit_scan_url',v);}catch(e){}this._openScan('enroll');};
    let tm;$('#abFaceQ').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{this._face.q=e.target.value.trim();this._face.page=1;this._faceLoad();},350);};
    $('#abFaceF').onchange=e=>{this._face.f=e.target.value;this._face.page=1;this._faceLoad();};
    this._faceLoad();
  },
  async _faceLoad(){
    const esc=SRIT.Util.esc;let r;
    try{r=await SRIT.Server.call('apiWajahStatus',{search:this._face.q,f:this._face.f,page:this._face.page,size:25});}
    catch(e){const el=$('#abFaceList');if(el)el.innerHTML='<div class="p-3 text-danger">'+esc(e.message||'Gagal memuat')+'</div>';return;}
    if(SRIT.currentFeature!=='absensi'||!$('#abFaceList'))return;
    this._execUrl=r.execUrl||this._execUrl;
    $('#abFaceSumm').innerHTML=`<span class="badge-soft st-HADIR">${r.summary.terdaftar} dari ${r.summary.aktif} anak aktif sudah terdaftar</span>`;
    const canDel=SRIT.Auth.can('absensi:UPDATE');
    $('#abFaceList').innerHTML=`<div class="table-responsive"><table class="table table-sm mb-0 align-middle"><thead><tr><th>Nama</th><th>NIS</th><th>Kelas</th><th>Wajah</th>${canDel?'<th></th>':''}</tr></thead><tbody>`+
      (r.rows.length?r.rows.map(a=>`<tr><td>${esc(a.NAMA)}</td><td>${esc(a.NIS)}</td><td>${esc(a.KELAS||'-')}</td>
        <td>${a.registered?`<span class="badge-soft st-HADIR">${a.jml} sampel</span>`:'<span class="badge-soft st-BELUM">Belum</span>'}</td>
        ${canDel?`<td class="text-end">${a.registered?`<button class="btn btn-outline-danger btn-sm py-0" data-del="${esc(a.ID)}" title="Hapus data wajah"><i class="bi bi-trash"></i></button>`:''}</td>`:''}</tr>`).join(''):'<tr><td colspan="5" class="text-center text-muted-2 py-3">Tidak ada data</td></tr>')+
      `</tbody></table></div><div class="d-flex justify-content-between align-items-center p-2" style="font-size:12px"><span>${r.total} anak \u00b7 hal ${r.page}/${r.pages}</span>
        <span><button class="btn btn-sm btn-outline-secondary py-0" id="abFaceP" ${r.page<=1?'disabled':''}>\u2039</button> <button class="btn btn-sm btn-outline-secondary py-0" id="abFaceN" ${r.page>=r.pages?'disabled':''}>\u203a</button></span></div>`;
    const pv=$('#abFaceP'),nx=$('#abFaceN');
    if(pv)pv.onclick=()=>{this._face.page--;this._faceLoad();};if(nx)nx.onclick=()=>{this._face.page++;this._faceLoad();};
    $$('#abFaceList [data-del]').forEach(b=>b.onclick=async()=>{
      if(!window.confirm('Hapus data wajah anak ini? Anak perlu didaftarkan ulang untuk absen wajah.'))return;
      try{await SRIT.Server.call('apiWajahDelete',b.dataset.del);SRIT.Notify('Data wajah dihapus','ok');this._faceLoad();}catch(e){SRIT.Notify(e.message||'Gagal menghapus','err');}
    });
  },
  // ---------- QR CAMERA ----------
  async _doScan(method,payload){
    if(!this.state.keg){SRIT.Notify('Pilih sesi kegiatan dulu','warn');return;}
    const r=await (method==='RFID'?SRIT.Api.rfidScan(this.state.date,this.state.keg,payload):method==='WAJAH'?SRIT.Api.faceScan(this.state.date,this.state.keg,payload):SRIT.Api.qrScan(this.state.date,this.state.keg,payload));
    try{if(this._sound)this._sound(r);}catch(e){}
    if(r.ok){
      this.state.log.unshift({time:new Date().toLocaleTimeString('id-ID'),nama:r.anak.NAMA,nis:r.anak.NIS,method,ok:true});
      SRIT.Notify(r.anak.NAMA+' \u2192 HADIR ('+method+')','ok',1800);
    }else if(r.dup){   // sudah tercatat pada tanggal + kegiatan + anak yang sama → tidak ditulis ulang
      this.state.log.unshift({time:new Date().toLocaleTimeString('id-ID'),nama:r.msg,nis:(r.anak&&r.anak.NIS)||payload,method,ok:false,dup:true});
      SRIT.Notify('\u26a0 '+r.msg,'warn',3500);
    }else{
      this.state.log.unshift({time:new Date().toLocaleTimeString('id-ID'),nama:r.msg,nis:payload,method,ok:false});
      SRIT.Notify(r.msg,'err',2000);
    }
    if(this.state.log.length>50)this.state.log.pop();
    // refresh summary quietly + log
    if(!this._sumT){this._sumT=setTimeout(async()=>{ // angka ringkasan (dari server) disegarkan tiap \u00b14 dtk selama pemindaian; log tampil instan
    this._sumT=null;
    try{await Promise.race([SRIT.Api.whenScansSaved(),new Promise(r=>setTimeout(r,9000))]);}catch(e){}
    let q;try{q=await this._query();}catch(e){return;}if(SRIT.currentFeature!=='absensi'||!$('#abSumm'))return;const s=q.summary;
    const totSes=s.HADIR+s.IZIN+s.SAKIT+s.ALPA+s.BELUM;
    const pctSes=SRIT.Util.pct(s.HADIR,totSes);
    const chip=(l,v,cls)=>`<div class="col"><div class="card-srit p-2 text-center"><div class="fw-bold" style="font-size:20px">${v}</div><span class="badge-soft ${cls}">${l}</span></div></div>`;
    $('#abSumm').innerHTML=chip('HADIR',s.HADIR,'st-HADIR')+chip('IZIN',s.IZIN,'st-IZIN')+chip('SAKIT',s.SAKIT,'st-SAKIT')+chip('ALPA',s.ALPA,'st-ALPA')+chip('BELUM',s.BELUM,'st-BELUM')+chip('% HADIR (Kegiatan)',pctSes+'%','st-HADIR');
    },4000);}
    this._renderLog();
    return r;
  },
  _renderLog(){
    const el=$('#abLog');if(!el)return;
    const n=$('#abLogN');if(n)n.textContent=this.state.log.length;
    el.innerHTML=this.state.log.length?this.state.log.map(l=>`<div class="d-flex align-items-center gap-2 px-3 py-2 border-bottom" style="font-size:13px">
      <i class="bi bi-${l.ok?'check-circle-fill text-success':(l.dup?'exclamation-triangle-fill text-warning':'x-circle-fill text-danger')}"></i>
      <div class="flex-grow-1"><div class="fw-semibold">${SRIT.Util.esc(l.nama)}</div><div class="text-muted-2" style="font-size:11px">${SRIT.Util.esc(l.nis)} \u00b7 ${l.method}</div></div>
      <span class="text-muted-2" style="font-size:11px">${l.time}</span></div>`).join(''):'<div class="empty-state py-4"><i class="bi bi-inbox d-block"></i>Belum ada scan</div>';
  },
  _btnCls(st){return {HADIR:'btn-success',IZIN:'btn-info',SAKIT:'btn-warning',ALPA:'btn-danger',BELUM:'btn-secondary'}[st];},
  mark(anakId,status,btn){
    this.state.dirty[anakId]=status;
    const grp=btn.parentElement;$$('button',grp).forEach(b=>{b.className='btn btn-sm btn-outline-secondary py-0 px-2';b.style.fontSize='12px';b.style.fontWeight='700';b.style.minWidth='32px';b.style.borderRadius='6px';});btn.className='btn btn-sm '+this._btnCls(status)+' py-0 px-2';btn.style.fontSize='12px';btn.style.fontWeight='700';btn.style.minWidth='32px';btn.style.borderRadius='6px';
    this._updateDirtyN();
  },
  _updateDirtyN(){const n=$('#abDirtyN');if(n)n.textContent=Object.keys(this.state.dirty).length;},
  async hadirSemua(){
    if(!this.state.keg){SRIT.Notify('Pilih sesi kegiatan dulu','warn');return;}
    // tandai HADIR untuk semua peserta sesuai filter yang sedang tampil (belum absen / apa pun) \u2192 jadi HADIR
    SRIT.Loading.show();let r;
    try{r=await SRIT.Api.getAttendanceSession(this.state.date,this.state.keg,{page:1,size:100000,search:this.state.search,jenjang:this.state.jenjang,jk:this.state.jk,asrama:this.state.asrama,kelas:this.state.kelas});}
    catch(e){SRIT.Loading.hide();SRIT.Notify(e.message||'Gagal memuat peserta','err');return;}
    SRIT.Loading.hide();
    let n=0;r.rows.forEach(a=>{this.state.dirty[a.ID]='HADIR';n++;});
    SRIT.Notify(n+' peserta ditandai HADIR \u2014 klik Simpan Batch untuk menyimpan','ok');
    this.load();
  },
  async save(){
    const changes=Object.entries(this.state.dirty).map(([anakId,status])=>({anakId,status,method:'MANUAL'}));
    if(!changes.length){SRIT.Notify('Tidak ada perubahan','warn');return;}
    SRIT.Loading.show();
    try{
      const r=await SRIT.Api.saveAttendanceBatch(this.state.date,this.state.keg,changes);
      SRIT.Loading.hide();this.state.dirty={};
      SRIT.Notify(`Batch tersimpan: ${r.created} baru, ${r.updated} diperbarui`,'ok');this.load();
    }catch(e){SRIT.Loading.hide();SRIT.Notify(e.message||'Gagal menyimpan absensi','err');}
  },
  destroy(){if(this.stopQR)this.stopQR();this.state.dirty={};this.state.log=[];}
};
</script>
