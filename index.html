  },
  _doPerkembangan(anakId){
    const set=SRIT.Store.readObj('SETTINGS');const a=this._anak(anakId);
    const pen=SRIT.Store.read('PENILAIAN').filter(r=>r.ANAK===anakId).slice(-1)[0]||{};
    const rub=SRIT.Store.readObj('RUBRIK');const pr=v=>rub[v]||(v>=4?'Sangat Baik':v>=3?'Baik':v>=2?'Cukup':v?'Kurang':'-');
    const wa=(SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-';
    const map=[['Akademik',pen.KARAKTER],['Kemandirian Belajar',pen.KEMANDIRIAN],['Disiplin',pen.DISIPLIN],['Tanggung Jawab',pen.KARAKTER],['Kejujuran',pen.KARAKTER],['Kerja Sama',pen.SOSIAL],['Empati',pen.SOSIAL],['Kebersihan Diri',pen.KEBERSIHAN],['Kebersihan Kamar',pen.KEBERSIHAN],['Keagamaan',pen.KEAGAMAAN],['Kepemimpinan',pen.LEADERSHIP],['Kegiatan Sosial',pen.SOSIAL]];
    const rows=map.map(x=>`<tr><td>${x[0]}</td><td style="text-align:center;width:110px">${pr(+x[1]||0)}</td><td>...............................</td></tr>`).join('');
    const inner=this._kop(set,'LAPORAN PERKEMBANGAN PESERTA DIDIK ASRAMA')+
      `<table class="info"><tr><td style="width:130px">Nama</td><td>: ${SRIT.Util.esc(a.NAMA||'-')}</td><td style="width:90px">NIS</td><td>: ${a.NIS||'-'}</td></tr>
        <tr><td>Jenjang/Kelas</td><td>: ${a.JENJANG||'-'} ${a.KELAS||''}</td><td>Kamar</td><td>: ${this._kamar(a.KAMAR)}</td></tr>
        <tr><td>Wali Asuh</td><td>: ${SRIT.Util.esc(wa)}</td><td>Periode</td><td>: ${SRIT.Util.fmtDateShort(this._range().to)}</td></tr></table>
      <table><thead><tr><th>Aspek</th><th style="width:120px">Nilai/Predikat</th><th>Catatan Perkembangan</th></tr></thead><tbody>${rows}</tbody></table>
      <h4>Catatan Wali Asuh</h4><div style="min-height:26px">.......................................................................................................</div>
      <h4>Potensi yang Perlu Dikembangkan</h4><div style="min-height:26px">.......................................................................................................</div>
      <h4>Tindak Lanjut</h4><div style="min-height:26px">.......................................................................................................</div>`+
      this._signBlock('Wali Asuh','Wali Asrama');
    this._printDoc('Laporan Perkembangan '+(a.NAMA||''),inner);
  },
  _printKejadian(){
    const ins=SRIT.Store.read('INSIDEN').slice().sort((a,b)=>String(b.TANGGAL).localeCompare(a.TANGGAL));
    const m=SRIT.Modal.open({title:'Cetak Formulir Kejadian & Tindak Lanjut',
      body:`<label class="form-label-sm">Pilih Kejadian/Insiden</label>
        <select class="form-select form-select-sm" id="lpIns"><option value="">— Form Kosong —</option>${ins.map(i=>`<option value="${i.ID}">${SRIT.Util.fmtDateShort(i.TANGGAL)} · ${SRIT.Util.esc(i.KATEGORI)} · ${SRIT.Util.esc((i.KEJADIAN||'').slice(0,40))}</option>`).join('')}</select>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="lpInsGo"><i class="bi bi-printer"></i> Cetak</button>`});
    $('#lpInsGo',m.el).onclick=()=>{const id=$('#lpIns',m.el).value;m.close();this._doKejadian(id);};
  },
  _doKejadian(id){
    const set=SRIT.Store.readObj('SETTINGS');const r=SRIT.Repo.getById('INSIDEN',id)||{};
    const cats=['Kesehatan','Pelanggaran tata tertib','Konflik antar peserta didik','Perundungan','Keamanan','Kerusakan fasilitas','Kepulangan/perizinan','Lainnya'];
    const map={'KESEHATAN':'Kesehatan','KONFLIK':'Konflik antar peserta didik','PERUNDUNGAN':'Perundungan','KEAMANAN':'Keamanan','KERUSAKAN':'Kerusakan fasilitas','KETIDAKHADIRAN':'Kepulangan/perizinan'};
    const chosen=map[r.KATEGORI]||'Lainnya';
    const cb=(label)=>`<span style="display:inline-block;margin-right:14px">${(chosen===label||(label==='Pelanggaran tata tertib'&&r.KATEGORI==='PELANGGARAN'))?'☑':'☐'} ${label}</span>`;
    const coord=(label)=>`<span style="display:inline-block;margin-right:14px">☐ ${label}</span>`;
    const stat=s=>`<span style="display:inline-block;margin-right:14px">${(r.STATUS===s||(s==='Selesai'&&r.STATUS==='SELESAI')||(s==='Dalam pemantauan'&&r.STATUS==='MONITORING'))?'☑':'☐'} ${s}</span>`;
    const inner=this._kop(set,'FORMULIR LAPORAN KEJADIAN DAN TINDAK LANJUT')+
      `<table class="info"><tr><td style="width:130px">Tanggal</td><td>: ${r.TANGGAL?SRIT.Util.fmtDate(r.TANGGAL):'...................'}</td></tr>
        <tr><td>Tempat</td><td>: ...................................................</td></tr>
        <tr><td>Pelapor</td><td>: ${SRIT.Util.esc(r.PELAPOR||'...................................................')}</td></tr></table>
      <h4>Jenis Kejadian</h4><div style="line-height:2">${cats.map(cb).join('')}</div>
      <h4>Peserta Didik yang Terlibat</h4><div style="min-height:22px">.......................................................................................................</div>
      <h4>Kronologi</h4><div style="min-height:40px">${SRIT.Util.esc(r.KEJADIAN||'.......................................................................................................')}</div>
      <h4>Tindakan Awal</h4><div style="min-height:26px">${SRIT.Util.esc(r.TINDAKAN||'...............................................................')}</div>
      <h4>Koordinasi dengan</h4><div style="line-height:2">${['Wali Asuh','Wali Asrama','Kepala Sekolah','Guru','Orang Tua/Wali','Pihak lain'].map(coord).join('')}</div>
      <h4>Hasil Penanganan</h4><div style="min-height:26px">.......................................................................................................</div>
      <h4>Tindak Lanjut</h4><div style="min-height:26px">.......................................................................................................</div>
      <h4>Status</h4><div style="line-height:2">${['Selesai','Dalam pemantauan','Perlu tindak lanjut'].map(stat).join('')}</div>`+
      this._signBlock('Wali Asrama','Mengetahui,<br>Kepala Sekolah');
    this._printDoc('Formulir Kejadian',inner);
  },
  destroy(){}
};
</script>

      filters:[{k:'KAMAR',label:'Kamar',options:()=>SRIT.Store.read('KAMAR').map(k=>({v:k.ID,t:k.NAME}))},{k:'JENJANG',label:'Jenjang',options:[{v:'SRD',t:'SRD'},{v:'SRMP',t:'SRMP'},{v:'SRMA',t:'SRMA'}]},{k:'JK',label:'Jenis Kelamin',options:[{v:'L',t:'Putra'},{v:'P',t:'Putri'}]},{k:'STATUS',label:'Status',options:[{v:'KOSONG',t:'KOSONG'},{v:'TERISI',t:'TERISI'},{v:'RUSAK',t:'RUSAK'}]},{k:'POSISI',label:'Posisi',options:[{v:'ATAS',t:'ATAS'},{v:'BAWAH',t:'BAWAH'}]}],
      cols:[{h:'Kode',k:'KODE'},{h:'Kamar',f:r=>(SRIT.Repo.getById('KAMAR',r.KAMAR)||{}).NAME||'-'},{h:'Jenjang',f:r=>{const jj=r.JENJANG||(SRIT.Repo.getById('KAMAR',r.KAMAR)||{}).JENJANG;return `<span class="badge-soft st-IZIN">${jj||'-'}</span>`;}},{h:'JK',f:r=>{const jk=r.JK||(SRIT.Repo.getById('KAMAR',r.KAMAR)||{}).JK;return jk==='L'?'Putra':jk==='P'?'Putri':'-';}},{h:'Posisi',k:'POSISI'},{h:'Status',f:r=>`<span class="badge-soft ${r.STATUS==='TERISI'?'st-HADIR':r.STATUS==='RUSAK'?'st-ALPA':'st-BELUM'}">${r.STATUS}</span>`},{h:'Penghuni',f:r=>SRIT.nm('ANAK',r.ANAK_ID)}],idPrefix:'TT',fields:[{k:'KAMAR',label:'Kamar',type:'select',col:12,options:()=>SRIT.Store.read('KAMAR').map(k=>({v:k.ID,t:k.NAME}))},{k:'KODE',label:'Kode'},{k:'JENJANG',label:'Jenjang',type:'select',options:[{v:'SRD',t:'SRD'},{v:'SRMP',t:'SRMP'},{v:'SRMA',t:'SRMA'}]},{k:'JK',label:'Jenis Kelamin',type:'select',options:[{v:'L',t:'Putra'},{v:'P',t:'Putri'}]},{k:'POSISI',label:'Posisi',type:'select',options:[{v:'ATAS',t:'ATAS'},{v:'BAWAH',t:'BAWAH'}]},{k:'STATUS',label:'Status',type:'select',options:[{v:'KOSONG',t:'KOSONG'},{v:'TERISI',t:'TERISI'},{v:'RUSAK',t:'RUSAK'}]}]},
    {k:'WALI_ASUH',t:'Wali Asuh',managed:true,searchFields:['NAME'],
      filters:[{k:'ASRAMA',label:'Asrama',options:()=>SRIT.Store.read('ASRAMA').map(a=>({v:a.ID,t:a.NAME}))},{k:'GEDUNG',label:'Gedung',options:()=>SRIT.Store.read('GEDUNG').map(g=>({v:g.ID,t:g.NAME}))},{k:'JENJANG',label:'Jenjang',options:[{v:'SRD',t:'SRD'},{v:'SRMP',t:'SRMP'},{v:'SRMA',t:'SRMA'}]},{k:'STATUS',label:'Status',options:[{v:'AKTIF',t:'AKTIF'},{v:'NONAKTIF',t:'NONAKTIF'}]}],
      cols:[{h:'Nama',k:'NAME'},{h:'Asrama',f:r=>(SRIT.Repo.getById('ASRAMA',r.ASRAMA)||{}).NAME||'-'},{h:'Gedung',f:r=>(SRIT.Repo.getById('GEDUNG',r.GEDUNG)||{}).NAME||'-'},{h:'Jenjang',k:'JENJANG'},{h:'Anak Asuh',f:r=>SRIT.Store.read('ANAK').filter(a=>a.WALI_ASUH===r.ID).length},{h:'Status',f:r=>`<span class="badge-soft st-HADIR">${r.STATUS||'AKTIF'}</span>`}],idPrefix:'WA',fields:[{k:'NAME',label:'Nama',col:12,required:true},{k:'USER_ID',label:'User Akun (opsional)',type:'select',options:()=>[{v:'',t:'—'}].concat(SRIT.Store.read('USERS').map(u=>({v:u.ID,t:u.NAME})))},{k:'ASRAMA',label:'Asrama',type:'select',options:()=>SRIT.Store.read('ASRAMA').map(a=>({v:a.ID,t:a.NAME}))},{k:'GEDUNG',label:'Gedung',type:'select',options:()=>[{v:'',t:'—'}].concat(SRIT.Store.read('GEDUNG').map(g=>({v:g.ID,t:g.NAME})))},{k:'JENJANG',label:'Jenjang',type:'select',options:[{v:'SRD',t:'SRD'},{v:'SRMP',t:'SRMP'},{v:'SRMA',t:'SRMA'}]},{k:'HP',label:'No. HP'},{k:'STATUS',label:'Status',type:'select',options:[{v:'AKTIF',t:'AKTIF'},{v:'NONAKTIF',t:'NONAKTIF'}]}]},
    {k:'WALI_ASRAMA',t:'Wali Asrama',managed:true,searchFields:['NAME'],
      filters:[{k:'ASRAMA',label:'Asrama',options:()=>SRIT.Store.read('ASRAMA').map(a=>({v:a.ID,t:a.NAME}))},{k:'GEDUNG',label:'Gedung',options:()=>SRIT.Store.read('GEDUNG').map(g=>({v:g.ID,t:g.NAME}))},{k:'JENJANG',label:'Jenjang',options:[{v:'SRD',t:'SRD'},{v:'SRMP',t:'SRMP'},{v:'SRMA',t:'SRMA'}]},{k:'STATUS',label:'Status',options:[{v:'AKTIF',t:'AKTIF'},{v:'NONAKTIF',t:'NONAKTIF'}]}],
      cols:[{h:'Nama',k:'NAME'},{h:'Asrama',f:r=>(SRIT.Repo.getById('ASRAMA',r.ASRAMA)||{}).NAME||'-'},{h:'Gedung',f:r=>(SRIT.Repo.getById('GEDUNG',r.GEDUNG)||{}).NAME||'-'},{h:'Jenjang',k:'JENJANG'},{h:'Status',f:r=>`<span class="badge-soft st-HADIR">${r.STATUS||'AKTIF'}</span>`}],idPrefix:'WR',fields:[{k:'NAME',label:'Nama',col:12,required:true},{k:'USER_ID',label:'User Akun (opsional)',type:'select',options:()=>[{v:'',t:'—'}].concat(SRIT.Store.read('USERS').map(u=>({v:u.ID,t:u.NAME})))},{k:'ASRAMA',label:'Asrama',type:'select',options:()=>SRIT.Store.read('ASRAMA').map(a=>({v:a.ID,t:a.NAME}))},{k:'GEDUNG',label:'Gedung',type:'select',options:()=>[{v:'',t:'—'}].concat(SRIT.Store.read('GEDUNG').map(g=>({v:g.ID,t:g.NAME})))},{k:'JENJANG',label:'Jenjang',type:'select',options:[{v:'SRD',t:'SRD'},{v:'SRMP',t:'SRMP'},{v:'SRMA',t:'SRMA'}]},{k:'STATUS',label:'Status',type:'select',options:[{v:'AKTIF',t:'AKTIF'},{v:'NONAKTIF',t:'NONAKTIF'}]}]},
    {k:'KELOMPOK_ASUH',t:'Kelompok Asuh',searchFields:['NAME'],
      filters:[{k:'ASRAMA',label:'Asrama',options:()=>SRIT.Store.read('ASRAMA').map(a=>({v:a.ID,t:a.NAME}))},{k:'GEDUNG',label:'Gedung',options:()=>SRIT.Store.read('GEDUNG').map(g=>({v:g.ID,t:g.NAME}))},{k:'JENJANG',label:'Jenjang',options:[{v:'SRD',t:'SRD'},{v:'SRMP',t:'SRMP'},{v:'SRMA',t:'SRMA'}]},{k:'WALI_ASUH',label:'Wali Asuh',options:()=>SRIT.Store.read('WALI_ASUH').map(w=>({v:w.ID,t:w.NAME}))}],
      cols:[{h:'Nama',k:'NAME'},{h:'Gedung',f:r=>(SRIT.Repo.getById('GEDUNG',r.GEDUNG)||{}).NAME||'-'},{h:'Jenjang',k:'JENJANG'},{h:'Wali Asuh',f:r=>(SRIT.Repo.getById('WALI_ASUH',r.WALI_ASUH)||{}).NAME||'-'},{h:'Anggota',f:r=>SRIT.Store.read('ANAK').filter(a=>a.KELOMPOK===r.ID).length},{h:'Kapasitas',k:'KAPASITAS'}],idPrefix:'KA',fields:[{k:'NAME',label:'Nama Kelompok',col:12,required:true},{k:'ASRAMA',label:'Asrama',type:'select',options:()=>SRIT.Store.read('ASRAMA').map(a=>({v:a.ID,t:a.NAME}))},{k:'GEDUNG',label:'Gedung',type:'select',options:()=>[{v:'',t:'—'}].concat(SRIT.Store.read('GEDUNG').map(g=>({v:g.ID,t:g.NAME})))},{k:'JENJANG',label:'Jenjang',type:'select',options:[{v:'SRD',t:'SRD'},{v:'SRMP',t:'SRMP'},{v:'SRMA',t:'SRMA'}]},{k:'WALI_ASUH',label:'Wali Asuh',type:'select',options:()=>SRIT.Store.read('WALI_ASUH').map(w=>({v:w.ID,t:w.NAME}))},{k:'KAPASITAS',label:'Kapasitas',type:'number'}]}
  ],
  _managed(body,t){
    const esc=SRIT.Util.esc,tbl=t.k,S=this._ms||(this._ms={});
    body.innerHTML=`<div class="alert alert-info d-flex flex-wrap gap-2 align-items-center justify-content-between py-2"><div style="font-size:13px"><i class="bi bi-info-circle"></i> Data <b>${esc(t.t)}</b> kini berada di <b>satu sheet Tenaga Kependidikan</b> (satu data dengan akun pengguna) dan dikelola di sana. Daftar ini otomatis diturunkan dari jabatan dan terhubung ke data Anak, Kamar, Kelompok Asuh, dan fitur lain, jadi di sini hanya ditampilkan.</div>
      <button class="btn btn-primary btn-sm" id="kmGoUser"><i class="bi bi-person-badge"></i> Kelola di Tenaga Kependidikan</button></div>
      <div class="card-srit p-3 mb-3"><div class="filter-bar">
        <div style="flex:1;min-width:200px"><label class="form-label-sm">Cari</label><input class="form-control form-control-sm" id="kmQ" placeholder="Ketik nama\u2026" value="${esc(S.q||'')}"></div>
        <div style="min-width:150px"><label class="form-label-sm">Status</label><select class="form-select form-select-sm" id="kmSt"><option value="">Semua</option><option ${S.st==='AKTIF'?'selected':''}>AKTIF</option><option ${S.st==='NONAKTIF'?'selected':''}>NONAKTIF</option></select></div>
      </div></div>
      <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="kmTbl"></table></div></div>`;
    const draw=()=>{
      const q=(S.q||'').trim().toLowerCase(),users=SRIT.Store.read('USERS');
      const rows=SRIT.Store.read(tbl).filter(r=>(!S.st||(r.STATUS||'AKTIF')===S.st)&&(!q||String(r.NAME||'').toLowerCase().indexOf(q)>=0)).sort((a,b)=>String(a.NAME||'').localeCompare(String(b.NAME||''),'id'));
      $('#kmTbl').innerHTML=`<thead><tr><th>Nama</th><th>Asrama</th><th>Gedung</th><th>Jenjang</th>${tbl==='WALI_ASUH'?'<th>Anak Asuh</th>':''}<th>Akun login</th><th>Status</th></tr></thead><tbody>${
        rows.map(r=>{const u=users.find(x=>x.ID===r.USER_ID),has=u&&u.AKUN!=='TIDAK'&&u.EMAIL;
          return `<tr><td class="fw-semibold">${esc(r.NAME)}</td><td>${esc((SRIT.Repo.getById('ASRAMA',r.ASRAMA)||{}).NAME||'-')}</td><td>${esc((SRIT.Repo.getById('GEDUNG',r.GEDUNG)||{}).NAME||'-')}</td><td>${esc(r.JENJANG||'-')}</td>
          ${tbl==='WALI_ASUH'?'<td>'+SRIT.Store.read('ANAK').filter(a=>a.WALI_ASUH===r.ID&&a.STATUS==='AKTIF').length+'</td>':''}
          <td>${u?(has?'<span class="badge-soft st-HADIR">Punya akun</span>':'<span class="badge-soft st-BELUM">Belum punya akun</span>'):'<span class="badge-soft st-BELUM">Belum terdaftar</span>'}</td>
          <td><span class="badge-soft ${(r.STATUS||'AKTIF')==='AKTIF'?'st-HADIR':'st-BELUM'}">${esc(r.STATUS||'AKTIF')}</span></td></tr>`;}).join('')||`<tr><td colspan="7" class="text-center text-muted-2 py-4">Belum ada data. Tambahkan lewat menu Tenaga Kependidikan.</td></tr>`}</tbody>`;
    };
    $('#kmQ').oninput=e=>{S.q=e.target.value;draw();};
    $('#kmSt').onchange=e=>{S.st=e.target.value;draw();};
    $('#kmGoUser').onclick=()=>{location.hash='#/user';};
    draw();
  },
  active:0,
  render(host){SRIT.UI.setPage('Struktur & Data Induk Asrama','Keasramaan / Data Induk');
    host.innerHTML=`<ul class="nav nav-pills flex-nowrap mb-3" id="kmTabs" style="overflow-x:auto">${this.tabs.map((t,i)=>`<li class="nav-item"><a class="nav-link ${i===this.active?'active':''} pointer text-nowrap" data-i="${i}">${t.t}</a></li>`).join('')}</ul><div id="kmBody"></div>`;
    $$('#kmTabs a').forEach(a=>a.onclick=()=>{this.active=+a.dataset.i;this.render(host);});
    const t=this.tabs[this.active];
    if(t.managed){this._managed($('#kmBody'),t);return;}
    regFeature('_km',{title:t.t,table:t.k,perm:'keasramaan-master',module:'keasramaan-master',idPrefix:t.idPrefix,searchFields:t.searchFields||['NAME'],filters:t.filters||[],cols:t.cols,fields:t.fields,onCreate:t.onCreate});
    SRIT.Features._km.render($('#kmBody'));
  },
  destroy(){if(SRIT.Features._km)try{SRIT.Features._km.destroy();}catch(e){}}
};
</script>

<script>
//# sourceURL=View_Sarpras.html
/* =========================================================================
   MONITORING SARPRAS (tabbed) — Data Sarpras, Monitoring, Kelengkapan Ceklis
   Pelapor/Petugas diambil dari Wali Asrama. Lengkap: cari, filter, ekspor, impor, detail.
   ========================================================================= */
SRIT.Features.sarpras={
  active:0,
  tabs:[
    // 1) Data / Inventaris Sarpras
    {t:'Data Sarpras',k:'OPS_SARPRAS',idPrefix:'SRP',searchFields:['NAMA','LOKASI'],
      filters:[{k:'KONDISI',label:'Kondisi',options:[{v:'BAIK',t:'BAIK'},{v:'PERLU PERBAIKAN',t:'PERLU PERBAIKAN'},{v:'RUSAK',t:'RUSAK'}]},{k:'KATEGORI',label:'Kategori',options:['ELEKTRONIK','MEBEL','KEBERSIHAN','KEAMANAN','DAPUR','OLAHRAGA','LAINNYA'].map(v=>({v,t:v}))}],
      cols:[{h:'Nama Aset',k:'NAMA'},{h:'Kategori',f:r=>`<span class="badge-soft st-IZIN">${r.KATEGORI||'-'}</span>`},{h:'Lokasi',k:'LOKASI'},{h:'Jumlah',k:'JUMLAH'},{h:'Kondisi',f:r=>`<span class="badge-soft ${r.KONDISI==='BAIK'?'st-HADIR':r.KONDISI==='RUSAK'?'st-ALPA':'st-SAKIT'}">${r.KONDISI}</span>`}],
      detail:true,
      fields:[{k:'NAMA',label:'Nama Aset',col:12,required:true},{k:'KATEGORI',label:'Kategori',type:'select',options:['ELEKTRONIK','MEBEL','KEBERSIHAN','KEAMANAN','DAPUR','OLAHRAGA','LAINNYA'].map(v=>({v,t:v}))},{k:'LOKASI',label:'Lokasi',required:true},{k:'JUMLAH',label:'Jumlah',type:'number',default:1},{k:'KONDISI',label:'Kondisi',type:'select',options:[{v:'BAIK',t:'BAIK'},{v:'PERLU PERBAIKAN',t:'PERLU PERBAIKAN'},{v:'RUSAK',t:'RUSAK'}]},{k:'KETERANGAN',label:'Keterangan',type:'textarea',col:12}]},
    // 2) Monitoring kondisi sarpras berkala — pelapor wali asrama
    {t:'Monitoring Sarpras',k:'SARPRAS_MONITORING',idPrefix:'SMO',searchFields:['CATATAN','LOKASI'],refSearch:[{get:r=>waliAsramaName(r.PELAPOR)}],
      filters:[{k:'ASET',label:'Aset',options:()=>SRIT.Store.read('OPS_SARPRAS').map(a=>({v:a.ID,t:a.NAMA}))},{k:'KONDISI',label:'Kondisi',options:[{v:'BAIK',t:'BAIK'},{v:'PERLU PERBAIKAN',t:'PERLU PERBAIKAN'},{v:'RUSAK',t:'RUSAK'}]},{k:'PELAPOR',label:'Pelapor (Wali Asrama)',options:waliAsramaOpts},{k:'STATUS',label:'Status',options:[{v:'DILAPORKAN',t:'DILAPORKAN'},{v:'DITINDAKLANJUTI',t:'DITINDAKLANJUTI'},{v:'SELESAI',t:'SELESAI'}]}],
      cols:[{h:'Tanggal',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)},{h:'Aset',f:r=>(SRIT.Repo.getById('OPS_SARPRAS',r.ASET)||{}).NAMA||r.ASET||'-'},{h:'Lokasi',k:'LOKASI'},{h:'Kondisi',f:r=>`<span class="badge-soft ${r.KONDISI==='BAIK'?'st-HADIR':r.KONDISI==='RUSAK'?'st-ALPA':'st-SAKIT'}">${r.KONDISI}</span>`},{h:'Pelapor (Wali Asrama)',f:r=>waliAsramaName(r.PELAPOR)},{h:'Status',f:r=>`<span class="badge-soft ${r.STATUS==='SELESAI'?'st-BELUM':r.STATUS==='DITINDAKLANJUTI'?'st-IZIN':'st-SAKIT'}">${r.STATUS||'DILAPORKAN'}</span>`}],
      detail:true,
      rowActions:[
        {id:'tl',label:'Tindak Lanjut',icon:'bi-tools',cls:'btn-outline-primary',show:r=>r.STATUS==='DILAPORKAN',run:function(rec,reload){SRIT.Repo.update('SARPRAS_MONITORING',rec.ID,{STATUS:'DITINDAKLANJUTI'});SRIT.Audit.log('UPDATE','sarpras',rec.ID);SRIT.Notify('Status: Ditindaklanjuti','ok');reload();}},
        {id:'done',label:'Selesai',icon:'bi-check-lg',cls:'btn-outline-success',show:r=>r.STATUS!=='SELESAI',run:function(rec,reload){SRIT.Repo.update('SARPRAS_MONITORING',rec.ID,{STATUS:'SELESAI'});SRIT.Audit.log('UPDATE','sarpras',rec.ID);SRIT.Notify('Status: Selesai','ok');reload();}}
      ],
      onCreate:d=>{const a=SRIT.Repo.getById('OPS_SARPRAS',d.ASET);if(a&&!d.LOKASI)d.LOKASI=a.LOKASI||'';},
      fields:[{k:'TANGGAL',label:'Tanggal',type:'date',default:SRIT.Util.todayISO(),required:true},{k:'ASET',label:'Aset Sarpras',type:'select',col:12,options:()=>SRIT.Store.read('OPS_SARPRAS').map(a=>({v:a.ID,t:a.NAMA+' — '+(a.LOKASI||'')}))},{k:'LOKASI',label:'Lokasi'},{k:'KONDISI',label:'Kondisi',type:'select',options:[{v:'BAIK',t:'BAIK'},{v:'PERLU PERBAIKAN',t:'PERLU PERBAIKAN'},{v:'RUSAK',t:'RUSAK'}]},{k:'PELAPOR',label:'Pelapor (Wali Asrama)',type:'select',col:12,options:waliAsramaOpts},{k:'CATATAN',label:'Catatan / Temuan',type:'textarea',col:12},{k:'STATUS',label:'Status',type:'select',options:[{v:'DILAPORKAN',t:'DILAPORKAN'},{v:'DITINDAKLANJUTI',t:'DITINDAKLANJUTI'},{v:'SELESAI',t:'SELESAI'}]}]},
    // 3) Kelengkapan ceklis sarana per lokasi — petugas wali asrama
    {t:'Kelengkapan Ceklis',k:'SARPRAS_CEKLIS',idPrefix:'SCK',searchFields:['ITEM','LOKASI','CATATAN'],refSearch:[{get:r=>waliAsramaName(r.PETUGAS)}],
      filters:[{k:'LOKASI',label:'Lokasi',options:()=>[...new Set(SRIT.Store.read('SARPRAS_CEKLIS').map(x=>x.LOKASI).filter(Boolean))].map(v=>({v,t:v}))},{k:'STATUS',label:'Status',options:[{v:'LENGKAP',t:'LENGKAP'},{v:'KURANG',t:'KURANG'},{v:'TIDAK ADA',t:'TIDAK ADA'}]},{k:'PETUGAS',label:'Petugas (Wali Asrama)',options:waliAsramaOpts}],
      cols:[{h:'Tanggal',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)},{h:'Item / Sarana',k:'ITEM'},{h:'Lokasi',k:'LOKASI'},{h:'Jumlah',k:'JUMLAH'},{h:'Status',f:r=>`<span class="badge-soft ${r.STATUS==='LENGKAP'?'st-HADIR':r.STATUS==='KURANG'?'st-SAKIT':'st-ALPA'}">${r.STATUS}</span>`},{h:'Petugas (Wali Asrama)',f:r=>waliAsramaName(r.PETUGAS)}],
      detail:true,
      fields:[{k:'TANGGAL',label:'Tanggal',type:'date',default:SRIT.Util.todayISO(),required:true},{k:'ITEM',label:'Item / Sarana',col:12,required:true},{k:'LOKASI',label:'Lokasi',required:true},{k:'JUMLAH',label:'Jumlah',type:'number',default:1},{k:'STATUS',label:'Status Kelengkapan',type:'select',options:[{v:'LENGKAP',t:'LENGKAP'},{v:'KURANG',t:'KURANG'},{v:'TIDAK ADA',t:'TIDAK ADA'}]},{k:'PETUGAS',label:'Petugas (Wali Asrama)',type:'select',col:12,options:waliAsramaOpts},{k:'CATATAN',label:'Catatan',type:'textarea',col:12}]}
  ],
  render(host){SRIT.UI.setPage('Monitoring Sarpras','Layanan Asrama / Sarpras');
    // ringkasan KPI
    const inv=SRIT.Store.read('OPS_SARPRAS');
    const kpi=(v,l,c)=>`<div class="col-6 col-md-3"><div class="card-srit p-2 p-md-3 text-center h-100"><div class="fw-bold" style="font-size:clamp(18px,2.2vw,26px);color:${c}">${v}</div><div class="text-muted-2" style="font-size:11px;text-transform:uppercase">${l}</div></div></div>`;
    host.innerHTML=`<div class="row g-2 g-md-3 mb-3">
        ${kpi(inv.length,'Total Aset','#38bdf8')}
        ${kpi(inv.filter(x=>x.KONDISI==='BAIK').length,'Kondisi Baik','#4ade80')}
        ${kpi(inv.filter(x=>x.KONDISI==='PERLU PERBAIKAN').length,'Perlu Perbaikan','#fbbf24')}
        ${kpi(inv.filter(x=>x.KONDISI==='RUSAK').length,'Rusak','#f87171')}
      </div>
      <ul class="nav nav-pills flex-nowrap mb-3" id="srTabs" style="overflow-x:auto">${this.tabs.map((t,i)=>`<li class="nav-item"><a class="nav-link ${i===this.active?'active':''} pointer text-nowrap" data-i="${i}">${t.t}</a></li>`).join('')}</ul>
      <div id="srBody"></div>`;
    $$('#srTabs a').forEach(a=>a.onclick=()=>{this.active=+a.dataset.i;this.render(host);});
    const t=this.tabs[this.active];
    regFeature('_sr',{title:t.t,table:t.k,perm:'sarpras',module:'sarpras',idPrefix:t.idPrefix,searchFields:t.searchFields||['NAMA'],refSearch:t.refSearch||[],filters:t.filters||[],cols:t.cols,fields:t.fields,detail:t.detail,rowActions:t.rowActions,onCreate:t.onCreate});
    SRIT.Features._sr.render($('#srBody'));
  },
  destroy(){if(SRIT.Features._sr)try{SRIT.Features._sr.destroy();}catch(e){}}
};
</script>

<script>

// Program Pembinaan
regFeature('program',{title:'Program Pembinaan',table:'PROGRAM',
  rowActions:[
    {id:'setuju',label:'Setujui',icon:'bi-check-lg',cls:'btn-outline-success',show:r=>r.STATUS==='USULAN'&&SRIT.Approval.canUsulan('program'),run:function(rec,reload){SRIT.Approval.decide('PROGRAM','program',rec,'AKTIF',reload,'Program');}},
    {id:'tolak',label:'Tolak',icon:'bi-x-lg',cls:'btn-outline-danger',show:r=>r.STATUS==='USULAN'&&SRIT.Approval.canUsulan('program'),run:function(rec,reload){SRIT.Approval.decide('PROGRAM','program',rec,'DITOLAK',reload,'Program');}}
  ],

  cols:[{h:'Program',f:r=>SRIT.Util.esc(r.NAME||'')+SRIT.Approval.badge(r)},{h:'Kategori',f:r=>`<span class="badge-soft st-IZIN">${r.KATEGORI}</span>`},{h:'Target',k:'TARGET'},{h:'Periode',k:'PERIODE'},{h:'Status',f:r=>`<span class="badge-soft ${r.STATUS==='DITOLAK'?'st-ALPA':r.STATUS==='USULAN'?'st-SAKIT':'st-HADIR'}">${r.STATUS}</span>`}],

<script>
//# sourceURL=View_Izin.html
// Izin & Kepulangan (dengan alur persetujuan)
regFeature('izin',{title:'Izin & Kepulangan',table:'IZIN',perm:'izin',module:'izin',idPrefix:'IZ',searchFields:['NAMA_ANAK','TUJUAN','PENJEMPUT'],refSearch:SRIT.anakRefSearch,detail:true,
  filters:[{k:'STATUS',label:'Status',options:['MENUNGGU','DISETUJUI','DITOLAK','BERANGKAT','KEMBALI','TERLAMBAT','SELESAI'].map(v=>({v,t:v}))},{k:'JENIS',label:'Jenis',options:['REGULER','KHUSUS','DARURAT'].map(v=>({v,t:v}))}],
  cols:[
    {h:'Anak & Keterangan',f:r=>`<div class="fw-semibold">${SRIT.Util.esc(SRIT.nm('ANAK',r.ANAK))}</div>${SRIT.anakKet(r.ANAK,{asrama:false,gedung:false})}`},
    {h:'Wali Asuh',f:r=>{const a=SRIT.Repo.getById('ANAK',r.ANAK)||{};return (SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-';}},
    {h:'Jenis',f:r=>`<span class="badge-soft st-IZIN">${r.JENIS}</span>`},
    {h:'Berangkat',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)+(r.JAM_BERANGKAT?'<div class="text-muted-2" style="font-size:11px"><i class="bi bi-clock"></i> '+r.JAM_BERANGKAT+'</div>':'')},
    {h:'Kembali',f:r=>SRIT.Util.fmtDateShort(r.KEMBALI)+(r.JAM_KEMBALI?'<div class="text-muted-2" style="font-size:11px"><i class="bi bi-clock"></i> '+r.JAM_KEMBALI+'</div>':'')},
    {h:'Tujuan',k:'TUJUAN'},{h:'Penjemput',f:r=>SRIT.Util.esc(r.PENJEMPUT||'-')+(r.HUBUNGAN?`<div class="text-muted-2" style="font-size:11px">(${SRIT.Util.esc(r.HUBUNGAN)})</div>`:'')},
    {h:'Status',f:r=>{const c={MENUNGGU:'st-SAKIT',DISETUJUI:'st-HADIR',DITOLAK:'st-ALPA',BERANGKAT:'st-IZIN',KEMBALI:'st-HADIR',TERLAMBAT:'st-ALPA',SELESAI:'st-BELUM'}[r.STATUS]||'st-BELUM',esc=SRIT.Util.esc;let x=`<span class="badge-soft ${c}">${r.STATUS}</span>`;
      if(r.STATUS==='MENUNGGU'){x+=`<div class="text-muted-2" style="font-size:10px">menunggu ${esc(SRIT.Approval.roleName(SRIT.Approval.R.IZIN_MIN[r.JENIS||'REGULER']||'WALI_ASRAMA'))}</div>`;}
      else if(r.DISETUJUI_NAMA){x+=`<div class="text-muted-2" style="font-size:10px">${r.STATUS==='DITOLAK'?'ditolak':'disetujui'} ${esc(r.DISETUJUI_NAMA)}</div>`;}
      if(r.STATUS==='DITOLAK'&&r.CATATAN_APPROVAL)x+=`<div class="text-muted-2" style="font-size:10px">${esc(r.CATATAN_APPROVAL)}</div>`;
      if(r.PENGESAHAN==='MENUNGGU')x+=`<div><span class="badge-soft st-SAKIT" style="font-size:10px">menunggu pengesahan ${esc(SRIT.Approval.roleName(SRIT.Approval.R.IZIN_SAH))}</span></div>`;
      else if(r.PENGESAHAN==='SAH'&&r.PENGESAH_NAMA)x+=`<div class="text-muted-2" style="font-size:10px">disahkan ${esc(r.PENGESAH_NAMA)}</div>`;
      return x;}}
  ],
  rowActions:[
    {id:'cetak',label:'Cetak Surat Izin',icon:'bi-printer',cls:'btn-outline-dark',run:function(rec){SRIT.Features.izin.cetak(rec);}},
    {id:'setuju',label:'Setujui',icon:'bi-check-lg',cls:'btn-outline-success',show:r=>r.STATUS==='MENUNGGU'&&SRIT.Approval.canIzin(r.JENIS),run:function(rec,reload){SRIT.Approval.decide('IZIN','izin',rec,'DISETUJUI',reload,'Izin');}},
    {id:'tolak',label:'Tolak',icon:'bi-x-lg',cls:'btn-outline-danger',show:r=>r.STATUS==='MENUNGGU'&&SRIT.Approval.canIzin(r.JENIS),run:function(rec,reload){SRIT.Approval.decide('IZIN','izin',rec,'DITOLAK',reload,'Izin');}},
    {id:'sahkan',label:'Sahkan Izin Darurat',icon:'bi-patch-check',cls:'btn-outline-warning',show:r=>r.PENGESAHAN==='MENUNGGU'&&SRIT.Approval.canSah(r),run:function(rec,reload){SRIT.Approval.sahkan(rec,reload);}},
    {id:'berangkat',label:'Berangkat',icon:'bi-box-arrow-right',cls:'btn-outline-primary',show:r=>r.STATUS==='DISETUJUI',run:_setStatus('IZIN','STATUS','BERANGKAT')},
    {id:'kembali',label:'Konfirmasi Kembali',icon:'bi-box-arrow-in-left',cls:'btn-outline-info',show:r=>r.STATUS==='BERANGKAT'||r.STATUS==='TERLAMBAT',run:_setStatus('IZIN','STATUS','SELESAI')}
  ],
  onCreate:d=>{d.NAMA_ANAK=(SRIT.Repo.getById('ANAK',d.ANAK)||{}).NAMA||d.NAMA_ANAK||'';},
  fields:[{k:'ANAK',label:'Anak',type:'select',col:12,options:anakOpts},{k:'JENIS',label:'Jenis',type:'select',options:['REGULER','KHUSUS','DARURAT'].map(v=>({v,t:v}))},{k:'TANGGAL',label:'Tgl Berangkat',type:'date',default:SRIT.Util.todayISO()},{k:'KEMBALI',label:'Tgl Kembali',type:'date',default:SRIT.Util.todayISO()},{k:'TUJUAN',label:'Tujuan'},{k:'PENJEMPUT',label:'Penjemput'},{k:'ALASAN',label:'Alasan',type:'textarea',col:12},{k:'STATUS',label:'Status',type:'select',options:['MENUNGGU','DISETUJUI','DITOLAK','BERANGKAT','KEMBALI','TERLAMBAT','SELESAI'].map(v=>({v,t:v}))}]});

/* ===== Izin: form kustom (pencarian anak + filter berjenjang) & cetak surat izin iPOS 58 ===== */
SRIT.Features.izin.form=function(id){
  const rec=id?SRIT.Repo.getById('IZIN',id):{};
  const asrOpt=SRIT.Store.read('ASRAMA').map(a=>`<option value="${a.ID}">${SRIT.Util.esc(a.NAME)}</option>`).join('');
  const m=SRIT.Modal.open({title:(id?'Edit':'Tambah')+' Izin & Kepulangan',size:'modal-lg',
    body:`<form id="izForm"><div class="row g-2">
      <div class="col-12"><label class="form-label-sm">Cari & Pilih Anak</label>
        <div class="border rounded p-2" style="background:var(--srit-hover)">
          <div class="row g-2 mb-2">
            <div class="col-6 col-md-4"><select class="form-select form-select-sm" id="izfJenjang"><option value="">Semua Jenjang</option><option>SRD</option><option>SRMP</option><option>SRMA</option></select></div>
            <div class="col-6 col-md-4"><select class="form-select form-select-sm" id="izfAsrama"><option value="">Semua Asrama</option>${asrOpt}</select></div>
            <div class="col-12 col-md-4"><input class="form-control form-control-sm" id="izfSearch" placeholder="Cari nama / NIS / kelas..."></div>
          </div>
          <select class="form-select form-select-sm" id="izfList" size="6" style="font-size:12px"></select>
          <input type="hidden" name="ANAK" id="izfAnak" value="${rec.ANAK||''}">
          <div class="mt-1" id="izfPick" style="font-size:11px"></div>
        </div>
      </div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Jenis</label><select class="form-select form-select-sm" name="JENIS">${['REGULER','KHUSUS','DARURAT'].map(v=>`<option ${rec.JENIS===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Tgl Berangkat</label><input type="date" class="form-control form-control-sm" name="TANGGAL" value="${rec.TANGGAL||SRIT.Util.todayISO()}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Jam Berangkat</label><input type="time" class="form-control form-control-sm" name="JAM_BERANGKAT" value="${rec.JAM_BERANGKAT||''}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Tgl Kembali</label><input type="date" class="form-control form-control-sm" name="KEMBALI" value="${rec.KEMBALI||SRIT.Util.todayISO()}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Jam Kembali</label><input type="time" class="form-control form-control-sm" name="JAM_KEMBALI" value="${rec.JAM_KEMBALI||''}"></div>
      <div class="col-12 col-md-4"><label class="form-label-sm">Tujuan</label><input class="form-control form-control-sm" name="TUJUAN" value="${SRIT.Util.esc(rec.TUJUAN||'')}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Nama Penjemput</label><input class="form-control form-control-sm" name="PENJEMPUT" value="${SRIT.Util.esc(rec.PENJEMPUT||'')}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Hubungan dengan Siswa</label><select class="form-select form-select-sm" name="HUBUNGAN">${['','Ayah','Ibu','Kakek','Nenek','Kakak','Paman','Bibi','Wali','Lainnya'].map(v=>`<option value="${v}" ${rec.HUBUNGAN===v?'selected':''}>${v||'— pilih —'}</option>`).join('')}</select></div>
      <div class="col-12"><label class="form-label-sm">Alasan</label><textarea class="form-control form-control-sm" name="ALASAN" rows="2">${SRIT.Util.esc(rec.ALASAN||'')}</textarea></div>
      <div class="col-12"><div class="p-2 rounded border" style="font-size:12px">${id?`Status: <b>${SRIT.Util.esc(rec.STATUS||'MENUNGGU')}</b>. Persetujuan dilakukan lewat tombol Setujui/Tolak sesuai jenjang.`:'Pengajuan baru berstatus <b>MENUNGGU</b>: izin reguler disetujui Wali Asrama, izin khusus Wakasek Keasramaan. Izin <b>darurat</b> oleh petugas piket langsung berlaku dan disahkan Wakasek setelahnya.'}</div></div>
    </div></form>`,
    footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="izSave">Simpan</button>`});
  const drawList=()=>{
    const jj=$('#izfJenjang',m.el).value,asr=$('#izfAsrama',m.el).value,q=$('#izfSearch',m.el).value.toLowerCase();
    let list=SRIT.Store.read('ANAK').filter(a=>a.STATUS==='AKTIF');
    if(jj)list=list.filter(a=>a.JENJANG===jj);
    if(asr)list=list.filter(a=>a.ASRAMA===asr);
    if(q)list=list.filter(a=>(a.NAMA+' '+a.NIS+' '+(a.KELAS||'')).toLowerCase().includes(q));
    list=list.slice(0,200);
    $('#izfList',m.el).innerHTML=list.map(a=>`<option value="${a.ID}" ${$('#izfAnak',m.el).value===a.ID?'selected':''}>${SRIT.Util.esc(a.NAMA)} · ${a.NIS} · ${a.JENJANG} ${a.KELAS||''} · ${(SRIT.Repo.getById('KAMAR',a.KAMAR)||{}).NAME||''}</option>`).join('')||'<option disabled>Tidak ada anak</option>';
  };
  const showPick=()=>{const id=$('#izfAnak',m.el).value;$('#izfPick',m.el).innerHTML=id?`<span class="badge-soft st-HADIR">Terpilih: ${SRIT.Util.esc(SRIT.nm('ANAK',id))}</span>`:'<span class="text-muted-2">Belum ada anak dipilih</span>';};
  ['izfJenjang','izfAsrama'].forEach(f=>$('#'+f,m.el).onchange=drawList);
  $('#izfSearch',m.el).oninput=drawList;
  $('#izfList',m.el).onchange=e=>{$('#izfAnak',m.el).value=e.target.value;showPick();};
  drawList();showPick();
  $('#izSave',m.el).onclick=()=>{
    const f=$('#izForm',m.el);const d=Object.fromEntries(new FormData(f));
    if(!d.ANAK){SRIT.Notify('Pilih anak terlebih dahulu','warn');return;}
    d.NAMA_ANAK=(SRIT.Repo.getById('ANAK',d.ANAK)||{}).NAMA||'';
    if(id){SRIT.Repo.update('IZIN',id,d);SRIT.Audit.log('UPDATE','izin',id);}
    else{d.ID=SRIT.Util.uid('IZ');Object.assign(d,SRIT.Approval.izinNew(d.JENIS));SRIT.Repo.insert('IZIN',d);SRIT.Audit.log('CREATE','izin',d.ID);}
    SRIT.Cache.invalidate('dash');SRIT.Cache.invalidate('livetv');
    m.close();SRIT.Notify('Izin tersimpan','ok');SRIT.Features.izin.load();
  };
};
// Cetak surat izin — dioptimalkan untuk printer thermal iPOS 58 (lebar kertas 58mm ≈ 48mm area cetak)
SRIT.Features.izin.cetak=function(rec){
  const a=SRIT.Repo.getById('ANAK',rec.ANAK)||{};
  const set=SRIT.Store.readObj('SETTINGS');
  const kmr=(SRIT.Repo.getById('KAMAR',a.KAMAR)||{}).NAME||'-';
  const wa=(SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-';
  const noSurat=(rec.ID||'').toUpperCase();
  const petugas=(SRIT.Auth.user||{}).NAME||'-';
  const row=(l,v)=>`<tr><td style="vertical-align:top">${l}</td><td style="vertical-align:top">:</td><td style="vertical-align:top">${SRIT.Util.esc(v)}</td></tr>`;
  const html=`<html><head><title>Surat Izin ${noSurat}</title><meta charset="utf-8">
    <style>
      @page{size:58mm auto;margin:0}
      *{box-sizing:border-box}
      body{width:58mm;margin:0;padding:3mm;font-family:'Courier New',monospace;color:#000;font-size:11px;line-height:1.35}
      .c{text-align:center}.b{font-weight:bold}
      .line{border-top:1px dashed #000;margin:4px 0}
      table{width:100%;border-collapse:collapse;font-size:11px}
      td{padding:1px 2px}
      h1{font-size:13px;margin:2px 0}
      .sign{margin-top:14px;font-size:11px}
      .box{border:1px solid #000;padding:3px;text-align:center;margin-top:6px;font-weight:bold}
    </style></head><body>
    <div class="c b" style="font-size:12px">${SRIT.Util.esc(set.SCHOOL_NAME||'SEKOLAH RAKYAT')}</div>
    <div class="c" style="font-size:10px">${SRIT.Util.esc(set.SCHOOL_TAGLINE||'')}</div>
    <div class="line"></div>
    <h1 class="c b">SURAT IZIN KELUAR / PULANG</h1>
    <div class="c" style="font-size:10px">No: ${SRIT.Util.esc(noSurat)}</div>
    <div class="line"></div>
    <table>
      ${row('Nama',a.NAMA||rec.NAMA_ANAK||'-')}
      ${row('NIS',a.NIS||'-')}
      ${row('Jenjang',(a.JENJANG||'-')+' '+(a.KELAS||''))}
      ${row('Kamar',kmr)}
      ${row('Wali Asuh',wa)}
    </table>
    <div class="line"></div>
    <table>
      ${row('Jenis',rec.JENIS||'-')}
      ${row('Berangkat',SRIT.Util.fmtDateShort(rec.TANGGAL)+(rec.JAM_BERANGKAT?' '+rec.JAM_BERANGKAT:''))}
      ${row('Kembali',SRIT.Util.fmtDateShort(rec.KEMBALI)+(rec.JAM_KEMBALI?' '+rec.JAM_KEMBALI:''))}
      ${row('Tujuan',rec.TUJUAN||'-')}
      ${row('Penjemput',(rec.PENJEMPUT||'-')+(rec.HUBUNGAN?' ('+rec.HUBUNGAN+')':''))}
      ${row('Alasan',rec.ALASAN||'-')}
    </table>
    <div class="box">STATUS: ${SRIT.Util.esc(rec.STATUS||'-')}${rec.DISETUJUI_NAMA?'<br>Oleh: '+SRIT.Util.esc(rec.DISETUJUI_NAMA):''}${rec.PENGESAHAN==='MENUNGGU'?'<br>(menunggu pengesahan)':''}</div>
    <div class="line"></div>
    <div style="font-size:10px">Dicetak: ${new Date().toLocaleString('id-ID')}</div>
    <div class="sign">
      <table style="width:100%">
        <tr>
          <td class="c" style="width:50%">Wali Asuh<br><br><br>(${SRIT.Util.esc(wa)})</td>
          <td class="c" style="width:50%">Penjemput<br><br><br>(${SRIT.Util.esc(rec.PENJEMPUT||'________')})${rec.HUBUNGAN?'<br><span style="font-size:9px">'+SRIT.Util.esc(rec.HUBUNGAN)+'</span>':''}</td>
        </tr>
        <tr>
          <td class="c" colspan="2" style="padding-top:8px">Mengetahui,<br>Wali Asrama<br><br><br>(________________)</td>
        </tr>
      </table>
    </div>
    <div class="c" style="margin-top:8px;font-size:10px">-- Terima kasih --</div>
    <div style="height:10mm"></div>
  </body></html>`;
  const w=window.open('','_blank','width=380,height=600');
  if(!w){SRIT.Notify('Popup diblokir, izinkan popup untuk mencetak','err');return;}
  w.document.write(html);w.document.close();w.focus();
  setTimeout(()=>{w.print();},400);
  SRIT.Audit.log('PRINT','izin',rec.ID);
};
</script>

  ],
  onCreate:d=>{d.NAMA_ANAK=(SRIT.Repo.getById('ANAK',d.ANAK)||{}).NAMA||'';d.TINGKAT=(SRIT.Repo.getById('TATA_TERTIB',d.ATURAN)||{}).TINGKAT||'RINGAN';},
  fields:[{k:'ANAK',label:'Anak',type:'select',col:12,options:anakOpts},{k:'ATURAN',label:'Aturan Dilanggar',type:'select',col:12,options:()=>SRIT.Store.read('TATA_TERTIB').map(t=>({v:t.ID,t:t.KODE+' — '+t.JUDUL}))},{k:'TANGGAL',label:'Tanggal',type:'date',default:SRIT.Util.todayISO()},{k:'KEJADIAN',label:'Kronologi',type:'textarea',col:12},{k:'TINDAKAN',label:'Tindakan Pembinaan',type:'textarea',col:12},{k:'PETUGAS',label:'Petugas'},{k:'STATUS',label:'Status',type:'select',options:['PROSES','SELESAI'].map(v=>({v,t:v}))}]});

<script>

// ---------- INSIDEN & MANAJEMEN KASUS ----------
// Mengikuti Modul "Permasalahan di Asrama" (Bab I, Integrasi Modul 5):
// 3 pilar (Kesehatan/Keselamatan/Perlindungan) · klasifikasi Ringan/Sedang/Berat · batas lapor mengikat
// (berat 1×24 jam, sedang 2×24 jam) · 6 tahap manajemen kasus · eskalasi Satgas SR → Kepala Sekolah → Satgas Pusat.
// PRIORITAS dan STATUS lama tetap diisi otomatis (dari Tingkat dan Tahap) agar Beranda, Pusat Peringatan, Live TV, dan laporan lama tetap berjalan.
SRIT.Kasus=(function(){
  const TINGKAT={
    RINGAN:{t:'Ringan',cls:'st-HADIR',prio:'LOW',oleh:'Satgas SR (selesai di sekolah)'},
    SEDANG:{t:'Sedang',cls:'st-SAKIT',prio:'HIGH',oleh:'Satgas SR dengan supervisi Satgas Pusat'},
    BERAT:{t:'Berat',cls:'st-ALPA',prio:'CRITICAL',oleh:'Satgas Pusat'}
  };
  const TAHAP=['','Proses awal','Asesmen','Rencana penanganan','Pelaksanaan penanganan','Monitoring & evaluasi','Pengakhiran'];
  const TAHAP_PERAN=['','Menerima, mencatat, dan menyerahkan informasi ke Satgas SR; amankan anak bila darurat','Memberi data pengamatan harian; tidak melakukan asesmen sendiri','Memberi masukan tentang keseharian anak di asrama','Menjaga keberlangsungan penanganan dalam rutinitas harian anak','Mengisi catatan perkembangan secara berkala','Melaporkan bila kondisi anak kembali memburuk'];
  const STATUS_OF={1:'LAPORAN',2:'VERIFIKASI',3:'KOORDINASI',4:'PENANGANAN',5:'MONITORING',6:'SELESAI'};
  const TAHAP_OF={LAPORAN:1,VERIFIKASI:2,KOORDINASI:3,PENANGANAN:4,'TINDAK LANJUT':4,MONITORING:5,PENYELESAIAN:6,SELESAI:6};
  const WAJIB={
    KEKERASAN:'Dugaan kekerasan, pelecehan, atau eksploitasi',
    MELUKAI_DIRI:'Indikasi melukai diri, ide bunuh diri, atau gangguan mental berat',
    KABUR:'Anak tidak diketahui keberadaannya atau kabur dari asrama',
    TENDIK:'Melibatkan pegawai, guru, atau tenaga kependidikan',
    MEDIS:'Kondisi medis darurat atau perlu rujukan',
    BERULANG:'Kasus berulang yang tidak selesai dengan pembinaan biasa'
  };
  // jenis wajib-teruskan yang diperlakukan 1×24 jam (kekerasan, melukai diri, anak hilang, melibatkan tenaga kependidikan)
  const WAJIB_24=['KEKERASAN','MELUKAI_DIRI','KABUR','TENDIK'];
  const PILAR={KESEHATAN:'Kesehatan',KESELAMATAN:'Keselamatan',PERLINDUNGAN:'Perlindungan'};
  const KATEGORI=['KESEHATAN','KESEHATAN MENTAL','NAPZA','GIZI','PENYAKIT MENULAR','DARURAT','KECELAKAAN','KEAMANAN','KONFLIK','PERUNDUNGAN','INTOLERANSI','KEHILANGAN','KERUSAKAN','KETIDAKHADIRAN','KEKERASAN','PELECEHAN','KEAMANAN DIGITAL','PENELANTARAN','MASALAH KELUARGA','LAINNYA'];
  const PILAR_OF={KESEHATAN:'KESEHATAN','KESEHATAN MENTAL':'KESEHATAN',NAPZA:'KESEHATAN',GIZI:'KESEHATAN','PENYAKIT MENULAR':'KESEHATAN',DARURAT:'KESEHATAN',
    KECELAKAAN:'KESELAMATAN',KEAMANAN:'KESELAMATAN',KONFLIK:'KESELAMATAN',PERUNDUNGAN:'KESELAMATAN',INTOLERANSI:'KESELAMATAN',KEHILANGAN:'KESELAMATAN',KERUSAKAN:'KESELAMATAN',KETIDAKHADIRAN:'KESELAMATAN',
    KEKERASAN:'PERLINDUNGAN',PELECEHAN:'PERLINDUNGAN','KEAMANAN DIGITAL':'PERLINDUNGAN',PENELANTARAN:'PERLINDUNGAN','MASALAH KELUARGA':'PERLINDUNGAN'};
  const LAPOR_KE={SATGAS_SR:'Satgas SR',KEPALA_SEKOLAH:'Kepala Sekolah',SATGAS_PUSAT:'Satgas Pusat'};
  const p2=n=>String(n).padStart(2,'0');
  const toLocal=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes());
  const nowLocal=()=>toLocal(new Date());
  const parseDt=s=>{if(!s)return null;const d=new Date(String(s).length<=10?s+'T00:00':s);return isNaN(d)?null:d;};
  const tahapOf=r=>(+r.TAHAP>=1&&+r.TAHAP<=6)?+r.TAHAP:(TAHAP_OF[r.STATUS]||1);
  const tingkatOf=r=>TINGKAT[r.TINGKAT]?r.TINGKAT:({LOW:'RINGAN',MEDIUM:'RINGAN',HIGH:'SEDANG',CRITICAL:'BERAT'}[r.PRIORITAS]||'RINGAN');
  const aktif=r=>tahapOf(r)<6;
  const jamBatas=r=>{
    if(r.WAJIB_JENIS&&WAJIB_24.indexOf(r.WAJIB_JENIS)>=0)return 24;
    const t=TINGKAT[r.TINGKAT]?r.TINGKAT:'';
    return t==='BERAT'?24:t==='SEDANG'?48:0;
  };
  const batas=r=>{const h=jamBatas(r),d=parseDt(r.WAKTU_TEMU);return(h&&d)?new Date(d.getTime()+h*3600000):null;};
  const fmtDur=h=>{h=Math.abs(h);const j=Math.floor(h),m=Math.round((h-j)*60);return (j?j+' j ':'')+(m||!j?m+' m':'').trim();};
  // status pelaporan terhadap batas waktu
  function lapor(r,now){
    now=now||new Date();const b=batas(r);if(!b)return {k:'NA'};
    const l=parseDt(r.WAKTU_LAPOR);
    if(l)return l<=b?{k:'TEPAT'}:{k:'TERLAMBAT',jam:(l-b)/3600000};
    return now>b?{k:'LEWAT',jam:(now-b)/3600000}:{k:'MENUNGGU',sisa:(b-now)/3600000};
  }
  const laporBadge=r=>{
    const s=lapor(r);
    if(s.k==='TEPAT')return '<span class="badge-soft st-HADIR">Dilaporkan tepat waktu</span>';
    if(s.k==='TERLAMBAT')return '<span class="badge-soft st-ALPA">Lapor terlambat '+fmtDur(s.jam)+'</span>';
    if(s.k==='LEWAT')return '<span class="badge-soft st-ALPA"><i class="bi bi-exclamation-triangle-fill"></i> Lewat batas '+fmtDur(s.jam)+'</span>';
    if(s.k==='MENUNGGU')return '<span class="badge-soft '+(s.sisa<6?'st-SAKIT':'st-IZIN')+'">Sisa '+fmtDur(s.sisa)+'</span>';
    return '<span class="text-muted-2">–</span>';
  };
  const fmtDT=s=>{const d=parseDt(s);return d?d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})+' '+p2(d.getHours())+'.'+p2(d.getMinutes()):'-';};
  function ringkas(rows){
    rows=rows||SRIT.Store.read('INSIDEN');const a=rows.filter(aktif),now=new Date();
    return {aktif:a.length,lewat:a.filter(r=>lapor(r,now).k==='LEWAT').length,
      wajibBelum:a.filter(r=>r.WAJIB_JENIS&&!r.WAKTU_LAPOR).length,
      pusat:a.filter(r=>tingkatOf(r)!=='RINGAN'&&r.KE_PUSAT!=='YA'&&TINGKAT[r.TINGKAT]).length};
  }
  return {TINGKAT,TAHAP,TAHAP_PERAN,STATUS_OF,TAHAP_OF,WAJIB,WAJIB_24,PILAR,KATEGORI,PILAR_OF,LAPOR_KE,toLocal,nowLocal,parseDt,tahapOf,tingkatOf,aktif,jamBatas,batas,lapor,laporBadge,fmtDur,fmtDT,ringkas};
})();

SRIT.Features.insiden={
  state:{page:1,size:20,search:'',tingkat:'',pilar:'',tampil:'AKTIF'},
  render(host){SRIT.UI.setPage('Insiden & Manajemen Kasus','Insiden');this._host=host;
    const s=this.state,K=SRIT.Kasus,sm=K.ringkas();
    host.innerHTML=`<div class="row g-2 mb-3">
      <div class="col-6 col-md-3"><div class="card-srit p-2 text-center"><div class="text-muted-2" style="font-size:11px">Kasus aktif</div><div class="fw-bold" style="font-size:20px">${sm.aktif}</div></div></div>
      <div class="col-6 col-md-3"><div class="card-srit p-2 text-center" style="${sm.lewat?'border-color:var(--srit-danger)':''}"><div class="text-muted-2" style="font-size:11px">Lewat batas lapor</div><div class="fw-bold" style="font-size:20px;${sm.lewat?'color:var(--srit-danger)':''}">${sm.lewat}</div></div></div>
      <div class="col-6 col-md-3"><div class="card-srit p-2 text-center"><div class="text-muted-2" style="font-size:11px">Wajib-teruskan belum dilapor</div><div class="fw-bold" style="font-size:20px;${sm.wajibBelum?'color:var(--srit-danger)':''}">${sm.wajibBelum}</div></div></div>
      <div class="col-6 col-md-3"><div class="card-srit p-2 text-center"><div class="text-muted-2" style="font-size:11px">Sedang/Berat belum ke Satgas Pusat</div><div class="fw-bold" style="font-size:20px">${sm.pusat}</div></div></div>
    </div>
    <div class="card-srit p-3 mb-3"><div class="filter-bar">
      <div style="flex:1;min-width:170px"><label class="form-label-sm">Cari</label><input class="form-control form-control-sm" id="ksSearch" placeholder="Kejadian, anak, kategori" value="${SRIT.Util.esc(s.search||'')}"></div>
      <div><label class="form-label-sm">Tingkat</label><select class="form-select form-select-sm" id="ksTingkat"><option value="">Semua</option>${Object.keys(K.TINGKAT).map(k=>`<option value="${k}" ${s.tingkat===k?'selected':''}>${K.TINGKAT[k].t}</option>`).join('')}</select></div>
      <div><label class="form-label-sm">Pilar</label><select class="form-select form-select-sm" id="ksPilar"><option value="">Semua</option>${Object.keys(K.PILAR).map(k=>`<option value="${k}" ${s.pilar===k?'selected':''}>${K.PILAR[k]}</option>`).join('')}</select></div>
      <div><label class="form-label-sm">Tampilkan</label><select class="form-select form-select-sm" id="ksTampil">${[['AKTIF','Aktif'],['LEWAT','Lewat batas lapor'],['SELESAI','Selesai'],['SEMUA','Semua']].map(o=>`<option value="${o[0]}" ${s.tampil===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
      ${SRIT.Auth.can('insiden:CREATE')?'<div><button class="btn btn-primary btn-sm" id="ksAdd"><i class="bi bi-plus-lg"></i> Catat Kejadian</button></div>':''}
    </div>
    <div class="text-muted-2 mt-2" style="font-size:12px">Batas lapor mengikat: kasus berat 1×24 jam, sedang 2×24 jam sejak ditemukan. Amankan anak lebih dulu, catat dan laporkan kemudian. Jaga kerahasiaan.</div></div>
    <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="ksTable"></table></div><div class="p-3 border-top" id="ksPag"></div></div>`;
    $('#ksSearch').oninput=e=>{clearTimeout(this._t);this._t=setTimeout(()=>{s.search=e.target.value;s.page=1;this.load();},300);};
    $('#ksTingkat').onchange=e=>{s.tingkat=e.target.value;s.page=1;this.load();};
    $('#ksPilar').onchange=e=>{s.pilar=e.target.value;s.page=1;this.load();};
    $('#ksTampil').onchange=e=>{s.tampil=e.target.value;s.page=1;this.load();};
    const add=$('#ksAdd');if(add)add.onclick=()=>this.form();
    this.load();
  },
  _rows(){
    const s=this.state,K=SRIT.Kasus,q=(s.search||'').toLowerCase(),now=new Date();
    let rows=SRIT.Store.read('INSIDEN').filter(r=>{
      if(s.tingkat&&K.tingkatOf(r)!==s.tingkat)return false;
      if(s.pilar&&(r.PILAR||K.PILAR_OF[r.KATEGORI])!==s.pilar)return false;
      const a=K.aktif(r);
      if(s.tampil==='AKTIF'&&!a)return false;
      if(s.tampil==='SELESAI'&&a)return false;
      if(s.tampil==='LEWAT'&&!(a&&K.lapor(r,now).k==='LEWAT'))return false;
      if(q&&![r.KEJADIAN,r.KATEGORI,r.NAMA_ANAK,r.PELAPOR,r.PETUGAS].some(v=>String(v||'').toLowerCase().includes(q)))return false;
      return true;});
    const w=r=>(K.aktif(r)?2:0)+(K.lapor(r,now).k==='LEWAT'?1:0);
    return rows.sort((a,b)=>w(b)-w(a)||String(b.WAKTU_TEMU||b.TANGGAL).localeCompare(String(a.WAKTU_TEMU||a.TANGGAL)));
  },
  load(){
    const s=this.state,K=SRIT.Kasus,esc=SRIT.Util.esc,all=this._rows();
    const total=all.length,pages=Math.ceil(total/s.size)||1;if(s.page>pages)s.page=pages;
    const rows=all.slice((s.page-1)*s.size,s.page*s.size);
    const canU=SRIT.Auth.can('insiden:UPDATE'),canD=SRIT.Auth.can('insiden:DELETE');
    $('#ksTable').innerHTML=`<thead><tr><th>Ditemukan</th><th>Anak</th><th>Kasus</th><th>Tingkat</th><th>Batas lapor</th><th>Tahap</th><th></th></tr></thead><tbody>
    ${rows.length?rows.map(r=>{
      const tk=K.tingkatOf(r),T=K.TINGKAT[tk],th=K.tahapOf(r),pl=r.PILAR||K.PILAR_OF[r.KATEGORI]||'';
      const pusat=(r.TINGKAT&&tk!=='RINGAN')?(r.KE_PUSAT==='YA'?'<span class="badge-soft st-HADIR">Sudah ke Satgas Pusat</span>':'<span class="badge-soft st-SAKIT">Perlu eskalasi ke Satgas Pusat</span>'):'';
      return `<tr>
      <td class="text-nowrap">${r.WAKTU_TEMU?K.fmtDT(r.WAKTU_TEMU):SRIT.Util.fmtDateShort(r.TANGGAL)}</td>
      <td>${r.ANAK?esc(SRIT.nm('ANAK',r.ANAK)||r.NAMA_ANAK):(esc(r.NAMA_ANAK)||'<span class="text-muted-2">–</span>')}</td>
      <td style="min-width:200px"><div class="fw-semibold">${esc(r.KATEGORI||'-')}${pl?` <span class="text-muted-2 fw-normal" style="font-size:11px">· ${K.PILAR[pl]||pl}</span>`:''}</div><div style="font-size:12px">${esc(String(r.KEJADIAN||'').slice(0,110))}${String(r.KEJADIAN||'').length>110?'…':''}</div>
        ${r.WAJIB_JENIS?`<div><span class="badge-soft st-ALPA" style="font-size:10px">Wajib diteruskan</span></div>`:''}</td>
      <td><span class="badge-soft ${T.cls}">${T.t}</span>${r.TINGKAT?(r.KLASIFIKASI_STATUS==='DITETAPKAN'?'<div class="text-muted-2" style="font-size:10px"><i class="bi bi-patch-check-fill text-success"></i> ditetapkan '+esc(r.KLASIFIKASI_OLEH||'')+'</div>':'<div class="text-muted-2" style="font-size:10px">usulan, menunggu penetapan</div>'):'<div class="text-muted-2" style="font-size:10px">dari prioritas lama</div>'}</td>
      <td>${K.laporBadge(r)}${r.DILAPORKAN_KE?`<div class="text-muted-2" style="font-size:11px">ke ${K.LAPOR_KE[r.DILAPORKAN_KE]||esc(r.DILAPORKAN_KE)}${r.WAKTU_LAPOR?' · '+K.fmtDT(r.WAKTU_LAPOR):''}</div>`:(r.WAJIB_JENIS&&K.aktif(r)?'<div style="font-size:11px;color:var(--srit-danger)">belum dilaporkan</div>':'')}${pusat?`<div class="mt-1">${pusat}</div>`:''}</td>
      <td style="min-width:130px"><span class="badge-soft ${th===6?'st-BELUM':'st-IZIN'}">${th}/6 ${K.TAHAP[th]}</span></td>
      <td class="text-end text-nowrap">
        <button class="btn btn-sm btn-outline-info py-0" title="Detail" onclick="SRIT.Features.insiden.detail('${r.ID}')"><i class="bi bi-eye"></i></button>
        ${(r.TINGKAT&&r.KLASIFIKASI_STATUS!=='DITETAPKAN'&&SRIT.Approval.canKasus())?`<button class="btn btn-sm btn-outline-success py-0 ms-1" title="Tetapkan klasifikasi (Kepala Sekolah)" onclick="SRIT.Features.insiden.tetapkan('${r.ID}')"><i class="bi bi-patch-check"></i></button>`:''}
        ${canU&&th<6&&(tk==='RINGAN'||th<5||SRIT.Approval.canKasus())?`<button class="btn btn-sm btn-outline-primary py-0 ms-1" title="Lanjut ke tahap berikutnya" onclick="SRIT.Features.insiden.maju('${r.ID}')"><i class="bi bi-arrow-right-circle"></i></button>`:''}
        ${canU?`<button class="btn btn-sm btn-outline-secondary py-0 ms-1" title="Edit" onclick="SRIT.Features.insiden.form('${r.ID}')"><i class="bi bi-pencil"></i></button>`:''}
        ${canD?`<button class="btn btn-sm btn-outline-danger py-0 ms-1" title="Hapus" onclick="SRIT.Features.insiden.del('${r.ID}')"><i class="bi bi-trash"></i></button>`:''}</td></tr>`;}).join(''):'<tr><td colspan="7"><div class="empty-state"><i class="bi bi-shield-check d-block"></i>Tidak ada kasus pada tampilan ini</div></td></tr>'}</tbody>`;
    $('#ksPag').innerHTML=SRIT.UI.pagination({rows,total,page:s.page,size:s.size,pages});
    $$('#ksPag [data-pg]').forEach(a=>a.onclick=()=>{s.page=+a.dataset.pg;this.load();});
  },
  tetapkan(id){
    const r=SRIT.Repo.getById('INSIDEN',id);if(!r)return;
    if(!confirm('Tetapkan klasifikasi kasus ini sebagai '+SRIT.Kasus.TINGKAT[SRIT.Kasus.tingkatOf(r)].t+' (hasil case conference)?'))return;
    const s=SRIT.Approval.stamp(),p={KLASIFIKASI_STATUS:'DITETAPKAN',KLASIFIKASI_OLEH:s.name,KLASIFIKASI_PADA:s.at};
    SRIT.Repo.update('INSIDEN',id,p);SRIT.Audit.log('UPDATE','insiden',id,{KLASIFIKASI_STATUS:r.KLASIFIKASI_STATUS||'USULAN'},{KLASIFIKASI_STATUS:'DITETAPKAN'});
    SRIT.Notify('Klasifikasi ditetapkan','ok');this.render(this._host);
  },
  maju(id){
    const r=SRIT.Repo.getById('INSIDEN',id);if(!r)return;const K=SRIT.Kasus,th=K.tahapOf(r);if(th>=6)return;
    const n=th+1;
    if(n===6&&K.tingkatOf(r)!=='RINGAN'&&!SRIT.Approval.canKasus()){SRIT.Notify('Pengakhiran kasus sedang/berat ditetapkan oleh '+SRIT.Approval.roleName(SRIT.Approval.R.KASUS),'warn');return;}
    if(n===6&&!confirm('Akhiri penanganan? Lakukan hanya bila kondisi anak sudah stabil.'))return;
    SRIT.Repo.update('INSIDEN',id,{TAHAP:n,STATUS:K.STATUS_OF[n]});SRIT.Audit.log('UPDATE','insiden',id,{TAHAP:th},{TAHAP:n});
    SRIT.Cache.invalidate('dash');SRIT.Cache.invalidate('livetv');SRIT.Notify('Tahap '+n+': '+K.TAHAP[n],'ok');this.load();
  },
  del(id){
    if(!confirm('Hapus data kasus ini? Tindakan ini tidak dapat dibatalkan.'))return;
    SRIT.Repo.remove('INSIDEN',id);SRIT.Audit.log('DELETE','insiden',id);SRIT.Cache.invalidate('dash');SRIT.Cache.invalidate('livetv');SRIT.Notify('Kasus dihapus','warn');this.load();
  },
  detail(id){
    const r=SRIT.Repo.getById('INSIDEN',id);if(!r)return;const K=SRIT.Kasus,esc=SRIT.Util.esc,tk=K.tingkatOf(r),T=K.TINGKAT[tk],th=K.tahapOf(r),pl=r.PILAR||K.PILAR_OF[r.KATEGORI]||'';
    const b=K.batas(r);
    const row=(l,v)=>`<tr><td class="text-muted-2" style="width:38%">${l}</td><td class="fw-semibold">${v||'-'}</td></tr>`;
    const steps=[1,2,3,4,5,6].map(n=>`<li class="${n===th?'fw-bold':n<th?'text-muted-2':''}" style="margin:2px 0">${n<th?'<i class="bi bi-check-circle-fill text-success"></i>':n===th?'<i class="bi bi-arrow-right-circle-fill text-primary"></i>':'<i class="bi bi-circle"></i>'} ${n}. ${K.TAHAP[n]}${n===th?`<div class="text-muted-2 fw-normal" style="font-size:11px;margin-left:22px">Peran wali asrama: ${K.TAHAP_PERAN[n]}</div>`:''}</li>`).join('');
    SRIT.Modal.open({title:'Detail Kasus',size:'modal-lg',body:`<table class="table table-sm table-srit mb-3"><tbody>
      ${row('Ditemukan',r.WAKTU_TEMU?K.fmtDT(r.WAKTU_TEMU):SRIT.Util.fmtDateShort(r.TANGGAL))}
      ${row('Anak',r.ANAK?esc(SRIT.nm('ANAK',r.ANAK)||r.NAMA_ANAK):esc(r.NAMA_ANAK))}
      ${row('Kategori / pilar',esc(r.KATEGORI||'-')+(pl?' · '+(K.PILAR[pl]||pl):''))}
      ${row('Kejadian',esc(r.KEJADIAN).replace(/\n/g,'<br>'))}
      ${row('Tindakan awal / lanjutan',esc(r.TINDAKAN).replace(/\n/g,'<br>'))}
      ${row('Wajib diteruskan',r.WAJIB_JENIS?esc(K.WAJIB[r.WAJIB_JENIS]||r.WAJIB_JENIS):'Tidak')}
      ${row('Klasifikasi',`<span class="badge-soft ${T.cls}">${T.t}</span> <span class="fw-normal text-muted-2" style="font-size:12px">ditangani: ${T.oleh}</span>${r.TINGKAT?(r.KLASIFIKASI_STATUS==='DITETAPKAN'?' · ditetapkan '+esc(r.KLASIFIKASI_OLEH||'')+(r.KLASIFIKASI_PADA?' ('+K.fmtDT(r.KLASIFIKASI_PADA)+')':''):' · usulan, menunggu penetapan '+esc(SRIT.Approval.roleName(SRIT.Approval.R.KASUS))):''}`)}
      ${row('Batas lapor',b?(K.jamBatas(r)+' jam → '+K.fmtDT(K.toLocal(b))+' '+K.laporBadge(r)):'Tidak ditetapkan')}
      ${row('Dilaporkan kepada',r.DILAPORKAN_KE?(K.LAPOR_KE[r.DILAPORKAN_KE]||esc(r.DILAPORKAN_KE))+(r.WAKTU_LAPOR?' · '+K.fmtDT(r.WAKTU_LAPOR):''):'Belum dilaporkan')}
      ${row('Eskalasi ke Satgas Pusat',tk==='RINGAN'?'Tidak diperlukan (selesai di sekolah)':(r.KE_PUSAT==='YA'?'Sudah':'Belum — wajib untuk kasus '+K.TINGKAT[tk].t.toLowerCase()))}
      ${row('Pelapor / petugas',esc([r.PELAPOR,r.PETUGAS].filter(Boolean).join(' / ')))}
      </tbody></table>
      <div class="fw-semibold mb-1" style="font-size:13px">Tahap manajemen kasus</div><ul class="list-unstyled mb-2" style="font-size:13px">${steps}</ul>
      <div class="text-muted-2" style="font-size:11px">Alur: wali asrama menemukan dan mengamankan → Satgas SR mencatat, memverifikasi, asesmen awal → Kepala Sekolah menetapkan klasifikasi (case conference) → ringan selesai di sekolah; sedang dan berat dieskalasikan ke Satgas Pusat.</div>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Tutup</button>`});
  },
  form(id){
    const K=SRIT.Kasus,esc=SRIT.Util.esc,self=this;
    const r=id?SRIT.Repo.getById('INSIDEN',id):{};
    if(id&&!r){SRIT.Notify('Data tidak ditemukan','err');return;}
    const kat=K.KATEGORI.slice();if(r.KATEGORI&&kat.indexOf(r.KATEGORI)<0)kat.unshift(r.KATEGORI);
    const anakList=SRIT.Store.read('ANAK').filter(a=>a.STATUS==='AKTIF');
    const temu=id?(r.WAKTU_TEMU||''):K.nowLocal();   // data lama tanpa jam temu: jangan mengarang jam (agar tidak muncul batas lapor palsu)
    const tk0=r.TINGKAT||(id?K.tingkatOf(r):'RINGAN'),th0=id?K.tahapOf(r):1;
    const canK=SRIT.Approval.canKasus(),lockTk=!!id&&r.KLASIFIKASI_STATUS==='DITETAPKAN'&&!canK;
    const opt=(arr,cur)=>arr.map(o=>`<option value="${o[0]}" ${String(cur||'')===String(o[0])?'selected':''}>${o[1]}</option>`).join('');
    const m=SRIT.Modal.open({title:(id?'Edit':'Catat')+' Kejadian / Kasus',size:'modal-lg',
      body:`<form id="ksForm" onsubmit="return false"><div class="row g-2">
        <div class="col-12"><div class="p-2 rounded border" style="font-size:12px"><b>Kenali → Amankan → Dengarkan → Catat → Laporkan → Dampingi.</b> Amankan anak dulu, catat kemudian. Tuliskan yang terlihat dan terdengar, bukan dugaan. Jangan menginterogasi atau menggali sendiri; asesmen dilakukan tenaga berkompeten.</div></div>
        <div class="col-12 col-md-5"><label class="form-label-sm">Waktu ditemukan / dilaporkan ke wali asrama</label><input type="datetime-local" class="form-control form-control-sm" name="WAKTU_TEMU" value="${esc(temu)}" ${(!id||r.WAKTU_TEMU)?'required':''}></div>
        <div class="col-12 col-md-7"><label class="form-label-sm">Anak terkait (opsional)</label><select class="form-select form-select-sm" name="ANAK"><option value="">— tidak terkait satu anak / lebih dari satu —</option>${anakList.map(a=>`<option value="${a.ID}" ${r.ANAK===a.ID?'selected':''}>${esc(a.NAMA)} (${esc(a.NIS)})</option>`).join('')}</select></div>
        <div class="col-6"><label class="form-label-sm">Kategori</label><select class="form-select form-select-sm" name="KATEGORI">${kat.map(k=>`<option ${r.KATEGORI===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div>
        <div class="col-6"><label class="form-label-sm">Pilar</label><select class="form-select form-select-sm" name="PILAR">${opt(Object.keys(K.PILAR).map(k=>[k,K.PILAR[k]]),r.PILAR||K.PILAR_OF[r.KATEGORI||kat[0]])}</select></div>
        <div class="col-12"><label class="form-label-sm">Kejadian / temuan</label><textarea class="form-control form-control-sm" name="KEJADIAN" rows="3" required>${esc(r.KEJADIAN||'')}</textarea></div>
        <div class="col-12"><label class="form-label-sm">Tindakan awal yang dilakukan</label><textarea class="form-control form-control-sm" name="TINDAKAN" rows="2">${esc(r.TINDAKAN||'')}</textarea></div>
        <div class="col-12"><label class="form-label-sm">Termasuk yang wajib diteruskan ke Satgas SR / Kepala Sekolah?</label><select class="form-select form-select-sm" name="WAJIB_JENIS"><option value="">Tidak / belum jelas</option>${Object.keys(K.WAJIB).map(k=>`<option value="${k}" ${r.WAJIB_JENIS===k?'selected':''}>${K.WAJIB[k]}</option>`).join('')}</select></div>
        <div class="col-12"><label class="form-label-sm">Klasifikasi (usulan wali asrama; ditetapkan Kepala Sekolah melalui case conference)</label>
          <div class="btn-group btn-group-sm w-100" role="group">${Object.keys(K.TINGKAT).map(k=>`<input type="radio" class="btn-check" name="TINGKAT" id="ksT_${k}" value="${k}" ${tk0===k?'checked':''} ${lockTk?'disabled':''}><label class="btn btn-outline-primary" for="ksT_${k}">${K.TINGKAT[k].t}</label>`).join('')}</div></div>
        ${canK?`<div class="col-12"><label style="font-size:12px"><input type="checkbox" class="me-1" name="TETAPKAN" value="1" ${r.KLASIFIKASI_STATUS==='DITETAPKAN'?'checked disabled':''}>Tetapkan klasifikasi ini (hasil case conference Kepala Sekolah)</label></div>`:(lockTk?'<div class="col-12 text-muted-2" style="font-size:12px">Klasifikasi sudah ditetapkan Kepala Sekolah dan hanya dapat diubah oleh beliau.</div>':'')}
        <div class="col-12"><div id="ksHint" class="p-2 rounded border" style="font-size:12px"></div></div>
        <div class="col-6 col-md-4"><label class="form-label-sm">Dilaporkan kepada</label><select class="form-select form-select-sm" name="DILAPORKAN_KE"><option value="">Belum dilaporkan</option>${opt(Object.keys(K.LAPOR_KE).map(k=>[k,K.LAPOR_KE[k]]),r.DILAPORKAN_KE)}</select></div>
        <div class="col-6 col-md-5"><label class="form-label-sm">Waktu lapor</label><div class="input-group input-group-sm"><input type="datetime-local" class="form-control form-control-sm" name="WAKTU_LAPOR" value="${esc(r.WAKTU_LAPOR||'')}"><button type="button" class="btn btn-outline-secondary" id="ksNow">Sekarang</button></div></div>
        <div class="col-12 col-md-3"><label class="form-label-sm">Sudah ke Satgas Pusat?</label><select class="form-select form-select-sm" name="KE_PUSAT" ${canK?'':'disabled'}><option value="">Belum</option><option value="YA" ${r.KE_PUSAT==='YA'?'selected':''}>Sudah</option></select></div>
        <div class="col-12 col-md-6"><label class="form-label-sm">Tahap manajemen kasus</label><select class="form-select form-select-sm" name="TAHAP">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${th0===n?'selected':''} ${(n===6&&th0<6&&tk0!=='RINGAN'&&!canK)?'disabled':''}>${n}. ${K.TAHAP[n]}</option>`).join('')}</select></div>
        <div class="col-6 col-md-3"><label class="form-label-sm">Pelapor</label><input class="form-control form-control-sm" name="PELAPOR" value="${esc(r.PELAPOR||(SRIT.Auth.user||{}).NAME||'')}"></div>
        <div class="col-6 col-md-3"><label class="form-label-sm">Petugas penanganan</label><input class="form-control form-control-sm" name="PETUGAS" value="${esc(r.PETUGAS||'')}"></div>
      </div></form>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="ksSave">Simpan</button>`});
    const el=m.el,F=()=>Object.fromEntries(new FormData($('#ksForm',el)));
    const hint=()=>{
      const f=F();if(!f.TINGKAT)f.TINGKAT=tk0;const tmp={TINGKAT:f.TINGKAT,WAJIB_JENIS:f.WAJIB_JENIS,WAKTU_TEMU:f.WAKTU_TEMU,WAKTU_LAPOR:f.WAKTU_LAPOR},b=K.batas(tmp),T=K.TINGKAT[f.TINGKAT];
      $('#ksHint',el).innerHTML=(T?`<div><b>Ditangani oleh:</b> ${T.oleh}${f.TINGKAT!=='RINGAN'?'. <b>Wajib dieskalasikan ke Satgas Pusat.</b>':'.'}</div>`:'')+
        (b?`<div><b>Batas lapor:</b> ${K.jamBatas(tmp)} jam sejak ditemukan → <b>${K.fmtDT(K.toLocal(b))}</b> ${K.laporBadge(tmp)}</div>`:'<div class="text-muted-2">Batas lapor berlaku untuk kasus sedang (2×24 jam) dan berat (1×24 jam), serta jenis wajib-teruskan tertentu (1×24 jam).</div>')+
        (f.WAJIB_JENIS&&!f.DILAPORKAN_KE?'<div style="color:var(--srit-danger)"><b>Kasus wajib diteruskan — segera laporkan ke Satgas SR / Kepala Sekolah.</b></div>':'');
    };
    $('select[name=KATEGORI]',el).onchange=e=>{const p=K.PILAR_OF[e.target.value];if(p)$('select[name=PILAR]',el).value=p;};
    // usulan awal: jenis wajib-teruskan berisiko tinggi → klasifikasi Berat (dapat diubah)
    $('select[name=WAJIB_JENIS]',el).onchange=e=>{if(K.WAJIB_24.indexOf(e.target.value)>=0)$('#ksT_BERAT',el).checked=true;hint();};
    $('select[name=DILAPORKAN_KE]',el).onchange=e=>{const w=$('input[name=WAKTU_LAPOR]',el);if(e.target.value&&!w.value)w.value=K.nowLocal();hint();};
    $('#ksNow',el).onclick=()=>{$('input[name=WAKTU_LAPOR]',el).value=K.nowLocal();hint();};
    $$('#ksForm input,#ksForm select',el).forEach(i=>{i.addEventListener('change',hint);});
    hint();
    $('#ksSave',el).onclick=()=>{
      const fm=$('#ksForm',el);if(!fm.reportValidity())return;
      const f=F(),tk=f.TINGKAT||tk0||'RINGAN',th=+f.TAHAP||1;
      const tmp={TINGKAT:tk,WAJIB_JENIS:f.WAJIB_JENIS,WAKTU_TEMU:f.WAKTU_TEMU},b=K.batas(tmp);
      if(f.WAKTU_LAPOR&&f.WAKTU_TEMU&&f.WAKTU_LAPOR<f.WAKTU_TEMU){SRIT.Notify('Waktu lapor tidak boleh sebelum waktu ditemukan','err');return;}
      const row={WAKTU_TEMU:f.WAKTU_TEMU||'',TANGGAL:f.WAKTU_TEMU?String(f.WAKTU_TEMU).slice(0,10):(r.TANGGAL||SRIT.Util.todayISO()),ANAK:f.ANAK||'',NAMA_ANAK:f.ANAK?((SRIT.Repo.getById('ANAK',f.ANAK)||{}).NAMA||''):'',
        KATEGORI:f.KATEGORI,PILAR:f.PILAR,KEJADIAN:String(f.KEJADIAN||'').trim(),TINDAKAN:String(f.TINDAKAN||'').trim(),WAJIB_JENIS:f.WAJIB_JENIS||'',
        TINGKAT:tk,PRIORITAS:K.TINGKAT[tk].prio,BATAS_LAPOR:b?K.toLocal(b):'',DEADLINE:b?K.toLocal(b).slice(0,10):(r.DEADLINE||''),
        DILAPORKAN_KE:f.DILAPORKAN_KE||'',WAKTU_LAPOR:f.WAKTU_LAPOR||'',KE_PUSAT:canK?(f.KE_PUSAT||''):(r.KE_PUSAT||''),TAHAP:th,STATUS:K.STATUS_OF[th],
        PELAPOR:String(f.PELAPOR||'').trim(),PETUGAS:String(f.PETUGAS||'').trim()};
      if(canK&&f.TETAPKAN){const s=SRIT.Approval.stamp();row.KLASIFIKASI_STATUS='DITETAPKAN';row.KLASIFIKASI_OLEH=s.name;row.KLASIFIKASI_PADA=s.at;}
      else if(!canK&&tk!==(r.TINGKAT||'')){row.KLASIFIKASI_STATUS='USULAN';}
      if(id){SRIT.Repo.update('INSIDEN',id,row);SRIT.Audit.log('UPDATE','insiden',id);}
      else{row.ID=SRIT.Util.uid('IN');SRIT.Repo.insert('INSIDEN',row);SRIT.Audit.log('CREATE','insiden',row.ID);}
      SRIT.Cache.invalidate('dash');SRIT.Cache.invalidate('livetv');
      m.close();SRIT.Notify('Kasus tersimpan','ok');
      const msg=(row.WAJIB_JENIS&&!row.DILAPORKAN_KE)?'Kasus wajib diteruskan: segera laporkan ke Satgas SR / Kepala Sekolah.':'';if(msg)SRIT.Notify(msg,'warn');
      self.render(self._host);
    };
  },
  destroy(){}
};
</script>

  filters:[{k:'KAMAR',label:'Kamar',options:()=>SRIT.Store.read('KAMAR').map(k=>({v:k.ID,t:k.NAME}))},{k:'PETUGAS',label:'Petugas (Wali Asrama)',options:waliAsramaOpts}],
