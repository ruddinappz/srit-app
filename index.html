<style>#srit-boot{position:fixed;inset:0;z-index:2147483000;background:#eef2f8;color:#1b2440;overflow:auto;font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#srit-boot .sb-c{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#srit-boot .sb-dot{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;background:#1c6ef2;animation:sbd 1s infinite ease-in-out}
#srit-boot .sb-dot:nth-child(2){animation-delay:.15s}#srit-boot .sb-dot:nth-child(3){animation-delay:.3s}
@keyframes sbd{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
#srit-boot .sb-p{max-width:720px;margin:0 auto;padding:18px 16px 40px;text-align:left}
#srit-boot h2{margin:0 0 6px;font-size:20px}#srit-boot h3{margin:16px 0 4px;font-size:15px}
#srit-boot ul,#srit-boot ol{padding-left:20px;margin:4px 0}#srit-boot li{margin:3px 0}
#srit-boot .sb-bx{background:#fff;border:1px solid #d5dcee;border-radius:10px;padding:8px 12px;margin:8px 0}
#srit-boot .sb-bad{color:#c62828;font-weight:600}#srit-boot .sb-ok{color:#0a8a4a;font-weight:600}
#srit-boot textarea{width:100%;height:130px;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid #d5dcee;border-radius:8px;padding:8px;box-sizing:border-box}</style>
<script>
/* SRIT — diagnostik pemuatan: bila halaman tampak putih/kosong, tampilkan PENYEBABNYA di layar (juga di HP tanpa konsol). */
window.__srit=(function(){
  var S={errs:[],booted:false,cur:'Index',parts:[],t0:Date.now(),server:null},EXPECT={"JS_Util": ["SRIT", "SRIT.Util"], "JS_Data": ["SRIT.LS", "SRIT.Server", "SRIT.Store", "SRIT.Repo", "SRIT.Cache", "SRIT.Sync", "SRIT.Audit"], "JS_UI": ["SRIT.Notify", "SRIT.Loading", "SRIT.Modal", "SRIT.SS", "SRIT.Import"], "JS_Auth": ["SRIT.Auth"], "JS_Api": ["SRIT.Api"], "JS_Theme": ["SRIT.Theme", "SRIT.Brand"], "JS_Shell": ["SRIT.UI", "SRIT.MENU", "SRIT.Features"], "View_Shared": ["simpleFeature", "regFeature", "SRIT.anakKet", "SRIT.anakRefSearch"], "JS_Router": ["SRIT.Router"], "View_LiveTV": ["SRIT.LiveTV"], "View_Dashboard": ["SRIT.Features.dashboard"], "View_Anak": ["SRIT.Features.anak"], "View_Absensi": ["SRIT.Features.absensi"], "View_AbsensiKamera": ["SRIT.Features.absensi._showCamError"], "View_Jadwal": ["SRIT.Features.jadwal"], "View_Kegiatan": ["SRIT.Features.kegiatan"], "View_JadwalPiket": ["SRIT.Features.jadwal-piket"], "View_Jabatan": ["SRIT.Features.jabatan"], "View_User": ["SRIT.Features.user"], "View_Role": ["SRIT.Features.role"], "View_Analytics": ["SRIT.Features.analytics"], "View_Laporan": ["SRIT.Features.laporan"], "View_Keasramaan": ["SRIT.Features.keasramaan", "SRIT.Features.ops-module"], "View_StrukturMaster": ["SRIT.Features.keasramaan-master"], "View_Sarpras": ["SRIT.Features.sarpras"], "View_Program": ["SRIT.Features.program"], "View_Izin": ["SRIT.Features.izin"], "View_Tamu": ["SRIT.Features.tamu"], "View_TataTertib": ["SRIT.Features.tatatertib"], "View_Pelanggaran": ["SRIT.Features.pelanggaran"], "View_Pembinaan": ["SRIT.Features.pembinaan"], "View_Insiden": ["SRIT.Features.insiden"], "View_Inspeksi": ["SRIT.Features.inspeksi"], "View_Refleksi": ["SRIT.Features.refleksi"], "View_Penghuni": ["SRIT.Features.penghuni"], "View_Penilaian": ["SRIT.Features.penilaian"], "View_Profiling": ["SRIT.Features.profiling"], "View_Peta": ["SRIT.Features.peta"], "View_Alert": ["SRIT.Features.alert-center"], "View_Audit": ["SRIT.Features.audit"], "View_Settings": ["SRIT.Features.settings"]},CORE=["JS_Util", "JS_Data", "JS_UI", "JS_Auth", "JS_Api", "JS_Theme", "JS_Shell", "View_Shared", "JS_Router", "View_LiveTV"];
  S.n=function(name){S.cur=name;S.parts.push(name);};
  function get(p){try{return p.split('.').reduce(function(o,k){return o==null?undefined:o[k];},window);}catch(e){return undefined;}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  /** berkas yang belum menetapkan objek global yang diharapkan → [{file,missing[],core}] */
  S.check=function(){var out=[];Object.keys(EXPECT).forEach(function(f){var bad=EXPECT[f].filter(function(p){return get(p)===undefined;});if(bad.length)out.push({file:f,missing:bad,core:CORE.indexOf(f)>=0});});return out;};
  S.lines=function(miss){
    var L=[];
    if(!(window.google&&google.script&&google.script.run))L.push('Halaman ini <b>tidak dijalankan lewat Apps Script</b> (mis. membuka berkas <code>Index.html</code> langsung dari komputer/HP). Buka lewat URL web app yang berakhiran <code>/exec</code>.');
    (miss||[]).forEach(function(m){L.push('Berkas <b>'+esc(m.file)+'.html</b> tidak termuat lengkap (bagian yang hilang: '+esc(m.missing.join(', '))+'). Kemungkinan isinya terpotong / salah tempel, atau ada galat sintaks.');});
    S.errs.forEach(function(e){
      if(e.kind==='resource')L.push('Pustaka luar gagal dimuat: <code>'+esc(e.msg)+'</code>');
      else L.push('Galat'+(e.file?' di berkas <b>'+esc(e.file)+'.html</b>':'')+(e.line?' baris '+e.line:'')+': '+esc(e.msg));
    });
    if(!L.length)L.push('Tidak ada galat JavaScript tercatat, tetapi aplikasi belum selesai dimuat setelah '+Math.round((Date.now()-S.t0)/1000)+' detik (jaringan lambat / pustaka CDN tertahan / berkas HTML ada yang hilang).');
    return L;
  };
  S.report=function(miss){
    var t=['SRIT ABSENSI — laporan diagnostik','waktu: '+new Date().toISOString(),'url: '+String(location.href).slice(0,120),'agen: '+navigator.userAgent,
      'bagian dimuat: '+S.parts.join(', '),'BSN: bootstrap='+typeof window.bootstrap+' Chart='+typeof window.Chart+' jsQR='+typeof window.jsQR+' XLSX='+typeof window.XLSX,
      'google.script.run: '+((window.google&&google.script&&google.script.run)?'ada':'TIDAK ADA')];
    (miss||[]).forEach(function(m){t.push('HILANG '+m.file+': '+m.missing.join(', '));});
    S.errs.forEach(function(e){t.push((e.kind||'err')+' '+(e.file||'')+' '+(e.line||'')+' '+e.msg);});
    if(S.server)t.push('server: '+JSON.stringify(S.server));
    return t.join('\n');
  };
  S.show=function(title,html,miss){
    S.lastMiss=miss;
    var el=document.getElementById('srit-boot');
    if(!el){el=document.createElement('div');el.id='srit-boot';(document.body||document.documentElement).appendChild(el);}
    el.innerHTML='<div class="sb-p"><h2>'+title+'</h2>'+html+
      '<h3>Cara memperbaiki</h3><ol><li>Salin ulang berkas yang disebut di atas dari paket (pastikan <b>lengkap</b> sampai baris terakhir <code>&lt;/script&gt;</code>; jangan dari layar HP yang terpotong).</li>'+
      '<li>Nama berkas harus persis (tanpa ekstensi di editor): <code>JS_Data</code>, <code>View_Absensi</code>, dst.</li>'+
      '<li>Setelah mengubah kode: <b>Deploy → Kelola deployment → ikon pensil → Versi: Versi baru → Deploy</b> (URL <code>/exec</code> memakai versi lama sampai dibuat versi baru).</li>'+
      '<li>Buka URL yang berakhiran <code>/exec</code> (bukan membuka <code>Index.html</code> langsung). Untuk pemeriksaan server buka <code>/exec?diag=1</code>.</li></ol>'+
      '<h3>Laporan (salin &amp; kirim)</h3><textarea readonly onclick="this.select()">'+esc(S.report(miss))+'</textarea></div>';

  };
  S.checkServer=function(){
    var box=document.getElementById('srit-srv');
    try{
      if(!(window.google&&google.script&&google.script.run&&google.script.run.apiSelfCheck)){ if(box)box.innerHTML='<span class="sb-bad">Server Apps Script tidak merespons</span> — fungsi <code>apiSelfCheck</code> tidak ditemukan (berkas .gs belum lengkap / belum di-deploy versi baru).'; return; }
      google.script.run.withSuccessHandler(function(r){S.server=r;if(!box)return;
        var b=[];b.push(r.dbSiap?'<span class="sb-ok">Database siap</span>':'<span class="sb-bad">Database BELUM dibuat</span> — jalankan <code>runFullSetup()</code> di editor Apps Script');
        if(r.htmlHilang&&r.htmlHilang.length)b.push('<span class="sb-bad">Berkas HTML hilang di proyek:</span> '+esc(r.htmlHilang.join(', ')));
        if(r.fungsiHilang&&r.fungsiHilang.length)b.push('<span class="sb-bad">Fungsi .gs hilang:</span> '+esc(r.fungsiHilang.join(', ')));
        if(!(r.htmlHilang&&r.htmlHilang.length)&&!(r.fungsiHilang&&r.fungsiHilang.length))b.push('<span class="sb-ok">Semua berkas .html dan fungsi .gs ada</span>');
        if(r.galat)b.push('<span class="sb-bad">Galat server:</span> '+esc(r.galat));
        box.innerHTML='<b>Pemeriksaan server (v'+esc(r.versi||'?')+')</b><br>'+b.join('<br>');
        var ta=document.querySelector('#srit-boot textarea');if(ta)ta.value=S.report(S.lastMiss);
      }).withFailureHandler(function(e){if(box)box.innerHTML='<span class="sb-bad">Server gagal dipanggil:</span> '+esc((e&&e.message)||e);}).apiSelfCheck();
    }catch(e){if(box)box.innerHTML='<span class="sb-bad">Pemeriksaan server gagal:</span> '+esc(e.message||e);}
  };
  S.fail=function(miss){
    if(S.booted)return;
    S.show('SRIT ABSENSI belum bisa tampil','<p style="margin:0 0 10px;color:#5a6785">Ini bukan layar kosong biasa — berikut yang terdeteksi:</p><ul>'+S.lines(miss).map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul><div class="sb-bx" id="srit-srv">Memeriksa server…</div>',miss);
  };

  S.watch=function(){if(S.booted)return;var miss=S.check(),late=(Date.now()-S.t0)>=14000;if(miss.length||S.errs.length||late)S.fail(miss);else{var s=document.getElementById('srit-boot-msg');if(s)s.textContent='Masih memuat… (jaringan lambat?)';}};

    var t=ev&&ev.target;
    if(t&&t!==window&&(t.tagName==='SCRIPT'||t.tagName==='LINK')){S.errs.push({kind:'resource',msg:(t.src||t.href||'?')});return;}

<style>
/* ===================== THEME ENGINE / DESIGN TOKENS ===================== */
:root{
  --srit-primary:#1c6ef2;
  --srit-primary-rgb:28,110,242;
  --srit-accent:#00b8a9;
  --srit-success:#16a34a;
  --srit-warning:#f59e0b;
  --srit-danger:#dc2626;
  --srit-info:#0ea5e9;
  --srit-radius:14px;
  --srit-radius-sm:10px;
  --sidebar-w:256px;
  --topbar-h:60px;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
/* ---------- 1. EXECUTIVE LIGHT (default terang korporat) ---------- */
[data-bs-theme="light"]{
  --srit-body:#eef2f8;
  --srit-surface:#ffffff;
  --srit-card:#ffffff;
  --srit-sidebar:#0f1b33;
  --srit-sidebar-text:#c7d2e6;
  --srit-header:#ffffff;
  --srit-text:#16233d;
  --srit-text-2:#67748e;
  --srit-border:#e4e9f2;
  --srit-hover:#f2f6fd;
}
/* ---------- 2. EXECUTIVE DARK (gelap netral) ---------- */
[data-bs-theme="dark"]{
  --srit-body:#0a1120;
  --srit-surface:#111c30;
  --srit-card:#131f36;
  --srit-sidebar:#0a1322;
  --srit-sidebar-text:#a9b6cf;
  --srit-header:#111c30;
  --srit-text:#e6edf9;
  --srit-text-2:#8a99b6;
  --srit-border:#233149;
  --srit-hover:#182741;
}
/* ---------- 3. MIDNIGHT COMMAND (biru dongker pekat, command center) ---------- */
[data-srit-theme="midnight"]{
  --srit-primary:#3b82f6;--srit-primary-rgb:59,130,246;--srit-accent:#22d3ee;
  --srit-body:#060b18;--srit-surface:#0c1424;--srit-card:#0e1830;
  --srit-sidebar:#040814;--srit-sidebar-text:#8ba0c4;--srit-header:#0c1424;
  --srit-text:#dbe7ff;--srit-text-2:#7488ad;--srit-border:#1c2b47;--srit-hover:#13223d;
}
/* ---------- 4. EMERALD (hijau alami, terang) ---------- */
[data-srit-theme="emerald"]{
  --srit-primary:#059669;--srit-primary-rgb:5,150,105;--srit-accent:#10b981;
  --srit-body:#eefaf3;--srit-surface:#ffffff;--srit-card:#ffffff;
  --srit-sidebar:#053b2c;--srit-sidebar-text:#bfe6d4;--srit-header:#ffffff;
  --srit-text:#12281f;--srit-text-2:#5b7a6c;--srit-border:#d5ebe0;--srit-hover:#eafaf1;
}
/* ---------- 5. ROYAL PURPLE (ungu mewah, gelap) ---------- */
[data-srit-theme="royal"]{
  --srit-primary:#a855f7;--srit-primary-rgb:168,85,247;--srit-accent:#e879f9;
  --srit-body:#100a1f;--srit-surface:#1a1030;--srit-card:#1f1438;
  --srit-sidebar:#0c0718;--srit-sidebar-text:#cbb6e6;--srit-header:#1a1030;
  --srit-text:#efe6ff;--srit-text-2:#a08bc0;--srit-border:#33254d;--srit-hover:#271948;
}
/* ---------- 6. SUNSET (amber hangat, terang) ---------- */
[data-srit-theme="sunset"]{
  --srit-primary:#ea580c;--srit-primary-rgb:234,88,12;--srit-accent:#f59e0b;
  --srit-body:#fdf4ec;--srit-surface:#fffaf5;--srit-card:#ffffff;
  --srit-sidebar:#3d1f0f;--srit-sidebar-text:#f0d3bd;--srit-header:#fffaf5;
  --srit-text:#3a2416;--srit-text-2:#8a6b56;--srit-border:#f0dcca;--srit-hover:#fcf0e6;
}
/* ---------- 7. OCEAN TEAL (teal segar, terang) ---------- */
[data-srit-theme="ocean"]{
  --srit-primary:#0891b2;--srit-primary-rgb:8,145,178;--srit-accent:#06b6d4;
  --srit-body:#eef7fb;--srit-surface:#ffffff;--srit-card:#ffffff;
  --srit-sidebar:#083344;--srit-sidebar-text:#b6dfec;--srit-header:#ffffff;
  --srit-text:#0f2a35;--srit-text-2:#557785;--srit-border:#d5e9f0;--srit-hover:#e8f5fa;
}
/* ---------- 8. SLATE MONO (abu profesional, gelap lembut) ---------- */
[data-srit-theme="slate"]{
  --srit-primary:#64748b;--srit-primary-rgb:100,116,139;--srit-accent:#94a3b8;
  --srit-body:#1a1f28;--srit-surface:#232a35;--srit-card:#262e3a;
  --srit-sidebar:#141922;--srit-sidebar-text:#aeb8c7;--srit-header:#232a35;
  --srit-text:#e8edf4;--srit-text-2:#93a0b3;--srit-border:#374151;--srit-hover:#2d3745;
}
/* ---------- 9. ROSE SAKURA (merah muda lembut, terang) ---------- */
[data-srit-theme="rose"]{
  --srit-primary:#e11d76;--srit-primary-rgb:225,29,118;--srit-accent:#f472b6;
  --srit-body:#fdf1f6;--srit-surface:#ffffff;--srit-card:#ffffff;
  --srit-sidebar:#4a1130;--srit-sidebar-text:#f3cbe0;--srit-header:#ffffff;
  --srit-text:#3d1226;--srit-text-2:#8a5c72;--srit-border:#f3d9e6;--srit-hover:#fcecf3;
}
*{scrollbar-width:thin;scrollbar-color:var(--srit-border) transparent}
body{
  font-family:var(--font);
  background:var(--srit-body);
  color:var(--srit-text);
  margin:0;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none}
.text-muted-2{color:var(--srit-text-2)!important}

/* ===================== APP SHELL ===================== */
#appShell{display:none}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:var(--srit-sidebar);color:var(--srit-sidebar-text);
  z-index:1040;display:flex;flex-direction:column;
  transition:transform .25s ease;
}
.sidebar-brand{
  height:var(--topbar-h);display:flex;align-items:center;gap:10px;
  padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07);
  flex-shrink:0;
}
.sidebar-brand .logo{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--srit-primary),var(--srit-accent));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
}
.sidebar-brand b{color:#fff;font-size:15px;line-height:1.05}
.sidebar-brand small{font-size:10px;color:#8fa0c0;letter-spacing:.5px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#5f6f92;padding:14px 12px 6px}
.nav-link-srit{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;
  color:var(--srit-sidebar-text);font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer;
  transition:.15s;
}
.nav-link-srit i{font-size:16px;width:20px;text-align:center}
.nav-link-srit:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-link-srit.active{background:linear-gradient(90deg,rgba(var(--srit-primary-rgb),.9),rgba(var(--srit-primary-rgb),.55));color:#fff;box-shadow:0 4px 14px rgba(var(--srit-primary-rgb),.35)}

.main-wrap{margin-left:var(--sidebar-w);min-height:100vh;transition:margin .25s}
.topbar{
  height:var(--topbar-h);background:var(--srit-header);border-bottom:1px solid var(--srit-border);
  position:sticky;top:0;z-index:1030;display:flex;align-items:center;gap:12px;padding:0 18px;
}
.topbar .page-title{font-weight:700;font-size:16px;margin:0}
.topbar .breadcrumb-mini{font-size:11px;color:var(--srit-text-2)}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--srit-border);background:var(--srit-surface);
  color:var(--srit-text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
}
.icon-btn:hover{background:var(--srit-hover);border-color:var(--srit-primary)}
.content{padding:20px}

/* ===================== CARDS / KPI ===================== */
.card-srit{background:var(--srit-card);border:1px solid var(--srit-border);border-radius:var(--srit-radius);}
.kpi{
  background:var(--srit-card);border:1px solid var(--srit-border);border-radius:var(--srit-radius);
  padding:16px 18px;position:relative;overflow:hidden;height:100%;
}
.kpi .kpi-icon{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;
}
.kpi .kpi-val{font-size:26px;font-weight:800;line-height:1}
.kpi .kpi-lbl{font-size:12px;color:var(--srit-text-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .trend{font-size:11px;font-weight:700}
.bg-grad-primary{background:linear-gradient(135deg,#1c6ef2,#4f8dff)}
.bg-grad-success{background:linear-gradient(135deg,#16a34a,#4ade80)}
.bg-grad-warning{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.bg-grad-danger{background:linear-gradient(135deg,#dc2626,#f87171)}
.bg-grad-info{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
.bg-grad-accent{background:linear-gradient(135deg,#00b8a9,#2dd4bf)}

.section-title{font-size:14px;font-weight:700;margin:0}

<script>__srit.n('JS_Util')</script>
<script>
//# sourceURL=JS_Util.html
/* =========================================================================
   SRIT ABSENSI — Command Center
   Front-end implementation of the specified architecture:
   APP SHELL → ROUTER → FEATURE PANEL (lazy) → API → SERVICE → REPOSITORY → STORAGE
   Storage layer = localStorage (mirrors Google Sheets schema; swap with
   google.script.run for GAS deployment — see SRIT.Api / SRIT.Repo comments).
   ========================================================================= */
window.SRIT = window.SRIT || {};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ============ UTILITY ============ */
SRIT.Util = {
  uid:(p='ID')=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
  todayISO:()=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}catch(e){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}}, // tanggal WIB = zona server (asli: UTC → salah sebelum 07.00 WIB)
  fmtDate:iso=>{ if(!iso)return'-'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});},
  fmtDateShort:iso=>{ if(!iso)return'-'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});},
  HARI:['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],
  hariOf:iso=>{ if(!iso)return''; return SRIT.Util.HARI[new Date(iso+'T00:00:00').getDay()]; },
  pct:(a,b)=>b?Math.round(a/b*1000)/10:0,
  debounce:(fn,ms=350)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}},
  esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  // simple deterministic "hash+salt" for demo (NOT for real production secrets)
  hash:(pw,salt)=>{let h=5381;const s=salt+pw+salt;for(let i=0;i<s.length;i++){h=((h<<5)+h)+s.charCodeAt(i);h|=0;}return 'h'+(h>>>0).toString(16);}
};
</script>

<script>__srit.n('JS_Data')</script>
<script>
//# sourceURL=JS_Data.html
/* =========================================================================
   LAPISAN DATA KLIEN — pengganti SRIT.Store/Repo/Audit berbasis localStorage pada SPA asli.
   Browser menyimpan "cermin" data (memori) yang dimuat dari server setelah login; seluruh kode menu
   tetap memakai SRIT.Store / SRIT.Repo sinkron seperti aslinya. Setiap perubahan otomatis
   dikirim ke server (Apps Script → Google Sheets) melalui antrean SRIT.Sync.
   ========================================================================= */

/* ---- penyimpanan lokal aman (iframe HtmlService / mode privat) ---- */
SRIT.LS={_m:{},
  get(k){try{return window.localStorage.getItem(k)}catch(e){return SRIT.LS._m[k]===undefined?null:SRIT.LS._m[k]}},
  set(k,v){try{window.localStorage.setItem(k,v)}catch(e){SRIT.LS._m[k]=v}},
  del(k){try{window.localStorage.removeItem(k)}catch(e){delete SRIT.LS._m[k]}}};
SRIT.SessStore={_m:{},
  get(k){try{return window.sessionStorage.getItem(k)}catch(e){return SRIT.SessStore._m[k]===undefined?null:SRIT.SessStore._m[k]}},
  set(k,v){try{window.sessionStorage.setItem(k,v)}catch(e){SRIT.SessStore._m[k]=v}},
  del(k){try{window.sessionStorage.removeItem(k)}catch(e){delete SRIT.SessStore._m[k]}}};

/* ---- jembatan ke server: google.script.run → Promise ---- */
SRIT.Server={
  token:null,
  _run(fn,args){return new Promise((resolve,reject)=>{
    if(!(window.google&&google.script&&google.script.run)){reject(new Error('Tidak terhubung ke server Apps Script'));return;}
    let clean;try{clean=JSON.parse(JSON.stringify(args));}catch(e){reject(e);return;}
    google.script.run.withSuccessHandler(resolve)
      .withFailureHandler(e=>reject(new Error(((e&&e.message)||String(e)).replace(/^Exception:\s*/,''))))[fn](...clean);
  });},
  async _do(fn,args){
    const r=await this._run(fn,args);
    if(r&&r.ok===false){const e=new Error(r.msg||'Terjadi kesalahan');e.code=r.code;if(r.code==='AUTH')SRIT.Auth._expired();throw e;}
    return r&&r.ok?r.data:r;
  },
  call(fn,...a){return this._do(fn,[this.token,...a]);},   // endpoint yang butuh login
  pub(fn,...a){return this._do(fn,a);}                       // endpoint publik
};

/* ---- Store: cermin sinkron; tulis → antrean sinkronisasi ---- */
SRIT.Store={
  _s:{},
  key:t=>'SRIT_'+t,
  read(t){const s=this._s[t];if(!s)return[];try{return JSON.parse(s)||[]}catch(e){return[]}},
  readObj(t){const s=this._s[t];if(!s)return{};try{return JSON.parse(s)||{}}catch(e){return{}}},
  write(t,d){const old=this._s[t];const nw=JSON.stringify(d);if(old===nw)return;this._s[t]=nw;SRIT.Sync.pushDiff(t,old,nw);},
  writeObj(t,d){const old=this._s[t];const nw=JSON.stringify(d);if(old===nw)return;this._s[t]=nw;SRIT.Sync.pushObj(t,d);},
  _commit(t,d,ops){this._s[t]=JSON.stringify(d);ops.forEach(o=>SRIT.Sync.enqueue(Object.assign({t},o)));},
  _set(t,v){this._s[t]=JSON.stringify(v);},                // dari server: tanpa antrean
  clearExcept(keep){Object.keys(this._s).forEach(k=>{if(!(keep||[]).includes(k))delete this._s[k];});}
};

/* ---- Repo: API sama dengan aslinya; getById memakai indeks agar cepat untuk 1.000+ baris ---- */
SRIT.Repo={
  _idx:{},
  _map(t){const s=SRIT.Store._s[t]||'[]';let c=this._idx[t];
    if(!c||c.s!==s){let rows=[];try{rows=JSON.parse(s)||[]}catch(e){}const m=new Map();rows.forEach(r=>{if(r&&r.ID!==undefined&&!m.has(r.ID))m.set(r.ID,r);});c=this._idx[t]={s,m,n:rows.length};}
    return c;},
  getRows:t=>SRIT.Store.read(t),
  getById(t,id,idField='ID'){
    if(idField==='ID'){const r=this._map(t).m.get(id);return r?{...r}:undefined;}
    return SRIT.Store.read(t).find(r=>r[idField]===id);},
  insert(t,row){const d=SRIT.Store.read(t);d.push(row);SRIT.Store._commit(t,d,[{op:'I',row}]);return row;},
  update(t,id,patch,idField='ID'){const d=SRIT.Store.read(t);const i=d.findIndex(r=>r[idField]===id);if(i<0)return null;
    d[i]={...d[i],...patch};SRIT.Store._commit(t,d,[{op:'U',id,row:d[i]}]);return d[i];},
  remove(t,id,idField='ID'){let d=SRIT.Store.read(t);d=d.filter(r=>r[idField]!==id);SRIT.Store._commit(t,d,[{op:'D',id}]);},
  count(t){return this._map(t).n;},
  // resolver relasi by ID → field (default NAMA/NAME). Nama selalu diambil realtime dari master.
  name(t,id){const r=this.getById(t,id);if(!r)return '-';return r.NAMA||r.NAME||r.JUDUL||id;}
};
// helper global singkat
SRIT.nm=(t,id)=>SRIT.Repo.name(t,id);

/* ============ CACHE ============ */
SRIT.Cache = {
  _m:new Map(),
  get(k){const e=this._m.get(k);if(!e)return null;if(Date.now()>e.exp){this._m.delete(k);return null;}return e.v;},
  set(k,v,ttl=60000){this._m.set(k,{v,exp:Date.now()+ttl});},
  invalidate(prefix){[...this._m.keys()].filter(k=>k.startsWith(prefix)).forEach(k=>this._m.delete(k));}
};

/* ---- Sinkronisasi: antrean tulis + pembaruan versi ---- */
SRIT.Sync={
  q:[],audits:[],timer:null,busy:false,again:false,vers:{},lastPoll:0,_busyP:null,
  enqueue(op){this.q.push(op);this._sched();},
  audit(e){if(!SRIT.Server.token)return;this.audits.push(e);this._sched();},
  setPassword(id,pw){this.enqueue({op:'PW',id,pw});},
  pushObj(t,obj){this.enqueue({t,op:'O',obj});},
  pushDiff(t,oldS,newS){
    let o=[],n=[];try{o=JSON.parse(oldS||'[]')||[];n=JSON.parse(newS)||[];}catch(e){}
    const keyed=r=>r&&typeof r==='object'&&r.ID!==undefined&&r.ID!==null&&r.ID!=='';
    if(!Array.isArray(o)||!Array.isArray(n)||!n.every(keyed)||!o.every(keyed)){this.enqueue({t,op:'R',rows:n});return;}
    const om=new Map(o.map(r=>[r.ID,JSON.stringify(r)]));const nm=new Set();
    n.forEach(r=>{nm.add(r.ID);const s=JSON.stringify(r);
      if(!om.has(r.ID))this.enqueue({t,op:'I',row:r});
      else if(om.get(r.ID)!==s)this.enqueue({t,op:'U',id:r.ID,row:r});});
    o.forEach(r=>{if(!nm.has(r.ID))this.enqueue({t,op:'D',id:r.ID});});
  },
  pending(){return this.q.length+this.audits.length+(this.busy?1:0)+((SRIT.Api&&SRIT.Api.scansPending)?SRIT.Api.scansPending():0);},
  _sched(){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),150);},
  async flush(){
    clearTimeout(this.timer);
    if(this.busy){this.again=true;return this._busyP;}
    if(!this.q.length&&!this.audits.length)return;
    if(!SRIT.Server.token){this.q=[];this.audits=[];return;}
    this.busy=true;
    const ops=this.q.splice(0),aud=this.audits.splice(0);
    this._busyP=(async()=>{
      try{
        for(let i=0;i<Math.max(1,Math.ceil(ops.length/1500));i++){
          const r=await SRIT.Server.call('apiSync',ops.slice(i*1500,(i+1)*1500),i===0?aud:[]);
          Object.entries(r.vers||{}).forEach(([t,v])=>{if(this.vers[t]===v.from)this.vers[t]=v.to;});
        }
      }catch(e){
        if(e.code!=='AUTH'){
          SRIT.Notify('Gagal menyimpan ke server: '+(e.message||e)+' — data dimuat ulang dari server','err',7000);
          this.q=[];this.audits=[];try{await this.bootstrap();}catch(x){}
          try{SRIT.Router.go();}catch(x){}
        }
      }finally{
        this.busy=false;
        if(this.q.length||this.audits.length||this.again){this.again=false;this._sched();}
      }
    })();
    return this._busyP;
  },
  _hydrate(r){
    Object.keys(r.tables||{}).forEach(t=>SRIT.Store._set(t,r.tables[t]));
    Object.keys(r.objs||{}).forEach(t=>SRIT.Store._set(t,r.objs[t]));
    this.vers=r.vers||{};this.lastPoll=Date.now();
  },
  async bootstrap(){const r=await SRIT.Server.call('apiBootstrap');this._hydrate(r);SRIT.Auth.user=r.user;return r;},
  async poll(){
    if(!SRIT.Server.token||this.busy||this.q.length||this.audits.length)return;
    try{
      const r=await SRIT.Server.call('apiPoll',this.vers);
      if(this.busy||this.q.length||this.audits.length)return;   // ada tulis baru selama menunggu
      Object.keys(r.tables||{}).forEach(t=>SRIT.Store._set(t,r.tables[t]));
      Object.keys(r.objs||{}).forEach(t=>SRIT.Store._set(t,r.objs[t]));
      this.vers=r.vers;this.lastPoll=Date.now();
    }catch(e){}
  },
  async ensureFresh(){
    if(!SRIT.Server.token)return;
    if(this.busy)await this._busyP;
    if(Date.now()-this.lastPoll<15000)return;
    await this.poll();
  },

/* ============ NOTIFICATIONS ============ */

/* =========================================================================
   IMPORT ENGINE (XLSX/CSV) — unduh template + impor massal dengan validasi
   cfg: { table, title, module, idPrefix, columns:[{key,label,required,type,options,ref}], onRow, sample:[..] }
   ========================================================================= */
SRIT.Import = {
  // buat & unduh template XLSX berisi header + baris contoh
  downloadTemplate(cfg){
    const headers=cfg.columns.map(c=>c.label);
    const example=cfg.sample&&cfg.sample.length?cfg.sample:[cfg.columns.map(c=>c.example||'')];
    const aoa=[headers,...example];
    // baris petunjuk untuk kolom pilihan
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=cfg.columns.map(c=>({wch:Math.max(14,c.label.length+2)}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Data');
    // sheet petunjuk
    const guide=[['PETUNJUK PENGISIAN'],[''],['Kolom','Wajib','Keterangan / Pilihan']];
    cfg.columns.forEach(c=>{
      let ket=c.hint||'';
      if(c.type==='select'){const o=typeof c.options==='function'?c.options():c.options;ket='Pilihan: '+o.map(x=>x.t||x.v||x).join(', ');}
      if(c.ref)ket='Isi dengan NAMA yang terdaftar di menu '+c.ref;
      guide.push([c.label,c.required?'WAJIB':'opsional',ket]);
    });
    const wg=XLSX.utils.aoa_to_sheet(guide);wg['!cols']=[{wch:20},{wch:10},{wch:60}];
    XLSX.utils.book_append_sheet(wb,wg,'Petunjuk');

  // buka dialog impor
  open(cfg){
    const m=SRIT.Modal.open({title:'Impor Data — '+cfg.title,size:'modal-lg',
      body:`<div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
          <button class="btn btn-outline-primary btn-sm" id="impDl"><i class="bi bi-file-earmark-arrow-down"></i> Unduh Template XLSX</button>
          <label class="btn btn-primary btn-sm mb-0"><i class="bi bi-upload"></i> Pilih File XLSX/CSV<input type="file" id="impFile" accept=".xlsx,.xls,.csv" hidden></label>
          <span class="text-muted-2 small" id="impFileName"></span>
        </div>
        <div class="alert alert-info py-2" style="font-size:12px"><i class="bi bi-info-circle"></i> Unduh template terlebih dahulu, isi datanya, lalu unggah. Kolom berlabel <b>WAJIB</b> harus diisi. Kolom relasi (Asrama, Kamar, dll) diisi dengan <b>nama</b> yang sudah terdaftar.</div>
        <div id="impPreview"></div>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Tutup</button><button class="btn btn-success btn-sm" id="impSave" disabled><i class="bi bi-check2-circle"></i> Simpan Data Valid</button>`});
    $('#impDl',m.el).onclick=()=>this.downloadTemplate(cfg);
    let parsed=[];
    $('#impFile',m.el).onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      $('#impFileName',m.el).textContent=f.name;
      const rd=new FileReader();
      rd.onload=ev=>{
        try{
          const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
          parsed=this._validate(cfg,rows);
          this._preview(m.el,cfg,parsed);
          $('#impSave',m.el).disabled=!parsed.some(r=>r._valid);
        }catch(err){SRIT.Notify('Gagal membaca file: '+err.message,'err');}
      };
      rd.readAsArrayBuffer(f);
    };
    $('#impSave',m.el).onclick=()=>{
      const valid=parsed.filter(r=>r._valid);
      if(!valid.length){SRIT.Notify('Tidak ada baris valid','warn');return;}
      let n=0;
      valid.forEach(r=>{
        const rec={ID:SRIT.Util.uid(cfg.idPrefix||'ID')};
        cfg.columns.forEach(c=>{rec[c.key]=r._data[c.key];});
        if(cfg.onRow)cfg.onRow(rec,r._raw);

      SRIT.Cache.invalidate('dash');SRIT.Cache.invalidate('livetv');
      m.close();SRIT.Notify(n+' data berhasil diimpor','ok');
      if(cfg.onDone)cfg.onDone();
    };
  },
  _validate(cfg,rows){
    const labelToKey={};cfg.columns.forEach(c=>labelToKey[c.label.toLowerCase().trim()]=c);
    return rows.map((raw,i)=>{
      const data={};const errs=[];
      cfg.columns.forEach(c=>{
        // cari nilai berdasarkan label (case-insensitive)
        // cari nilai berdasarkan label ATAU alias (tanpa peduli huruf besar/kecil, spasi, titik, tanda baca)
        const nz=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,'');
        const names=[c.label].concat(c.aliases||[]).map(nz);
        let v='';for(const k in raw){if(names.indexOf(nz(k))>=0){v=raw[k];break;}}
        v=(v===null||v===undefined)?'':String(v).trim();
        if(c.normalize&&v)v=String(c.normalize(v,raw)==null?'':c.normalize(v,raw)).trim();
        if(c.required&&!v){errs.push(c.label+' kosong');}
        if(v&&c.pattern&&!new RegExp(c.pattern).test(v)){errs.push(c.patternMsg||(c.label+' format tidak valid ('+v+')'));}
        // validasi pilihan
        if(v&&c.type==='select'){const o=(typeof c.options==='function'?c.options():c.options).map(x=>String(x.v!==undefined?x.v:(x.t||x)));
          if(!o.includes(v)){errs.push(c.label+' tidak valid ('+v+')');}}
        // resolve referensi (nama → ID)
        if(v&&c.ref){const found=SRIT.Store.read(c.refTable).find(x=>String(x[c.refField||'NAME']).toLowerCase()===v.toLowerCase());
          if(found){v=found.ID;}else{errs.push(c.label+' "'+v+'" tidak ditemukan');}}
        data[c.key]=v;
      });
      return {_row:i+2,_raw:raw,_data:data,_valid:errs.length===0,_errs:errs};
    });
  },
  _preview(root,cfg,parsed){
    const okN=parsed.filter(r=>r._valid).length,badN=parsed.length-okN;
    const head=cfg.columns.map(c=>`<th>${c.label}</th>`).join('');
    $('#impPreview',root).innerHTML=`
      <div class="d-flex gap-2 mb-2"><span class="badge-soft st-HADIR">${okN} valid</span>${badN?`<span class="badge-soft st-ALPA">${badN} bermasalah</span>`:''}<span class="badge-soft st-BELUM">${parsed.length} total</span></div>
      <div class="table-responsive" style="max-height:320px"><table class="table table-sm table-srit mb-0"><thead><tr><th>#</th><th>Status</th>${head}</tr></thead><tbody>
      ${parsed.slice(0,100).map(r=>`<tr class="${r._valid?'':'table-danger'}"><td>${r._row}</td>
        <td>${r._valid?'<i class="bi bi-check-circle-fill text-success"></i>':`<span class="text-danger" title="${SRIT.Util.esc(r._errs.join('; '))}" style="font-size:11px"><i class="bi bi-exclamation-triangle"></i> ${SRIT.Util.esc(r._errs[0]||'')}</span>`}</td>
        ${cfg.columns.map(c=>`<td>${SRIT.Util.esc(r._raw[c.label]??r._data[c.key]??'')}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>${parsed.length>100?'<div class="text-muted-2 small mt-1">Menampilkan 100 baris pertama…</div>':''}`;
  }
};
</script>

/* ============ AUTH + AUTHORIZATION (klien) — otentikasi dilakukan server (Api_Auth.gs / Security.gs) ============ */
SRIT.Auth = {
  user:null,
  session:()=>{try{return JSON.parse(SRIT.SessStore.get('SRIT_SESSION'))}catch(e){return null}},
  async restore(){
    const sess=SRIT.Auth.session();
    if(!(sess&&sess.token&&Date.now()<sess.exp))return false;
    SRIT.Server.token=sess.token;

    catch(e){SRIT.Auth._clear();return false;}
  },
  async login(email,pw){
    let r;
    try{r=await SRIT.Server.pub('apiLogin',email,pw);}catch(e){return {ok:false,msg:e.message||'Gagal masuk'};}
    SRIT.Server.token=r.token;
    SRIT.SessStore.set('SRIT_SESSION',JSON.stringify({token:r.token,exp:r.exp}));
    try{await SRIT.Sync.bootstrap();}catch(e){SRIT.Auth._clear();return {ok:false,msg:e.message||'Gagal memuat data'};}
    return {ok:true};
  },
  logout(){
    SRIT.Audit.log('LOGOUT','auth',(SRIT.Auth.user||{}).ID);
    const tk=SRIT.Server.token;
    Promise.all([SRIT.Sync.flush(),SRIT.Api.whenScansSaved()]).catch(()=>{}).finally(()=>{if(SRIT.Server.token===tk)SRIT.Server.token=null;});
    SRIT.Auth.user=null;SRIT.SessStore.del('SRIT_SESSION');SRIT.Store.clearExcept(['SETTINGS']);
    location.hash='#/live';
  },
  _clear(){SRIT.Server.token=null;SRIT.Auth.user=null;SRIT.SessStore.del('SRIT_SESSION');SRIT.Store.clearExcept(['SETTINGS']);SRIT.Sync.q=[];SRIT.Sync.audits=[];},
  _expired(){ // server menolak token (kedaluwarsa / akun dinonaktifkan / sandi diganti)
    if(!SRIT.Server.token)return;
    SRIT.Auth._clear();
    try{SRIT.Notify('Sesi berakhir, silakan masuk kembali','warn');}catch(e){}
    location.hash='#/login';
  },
  isSuper(){return (SRIT.Auth.user||{}).ROLE==='SUPER_ADMIN';},
  can(perm){ // perm = "module:ACTION"
    if(!SRIT.Auth.user)return false;
    if(SRIT.Auth.isSuper())return true; // SUPER_ADMIN global access
    const rp=SRIT.Store.read('ROLE_PERMISSIONS');
    return rp.some(x=>x.ROLE_ID===SRIT.Auth.user.ROLE&&x.PERMISSION_ID===perm);
  },
  canModule(m){return this.can(m+':VIEW');}
};

<script>
//# sourceURL=JS_Api.html
/* =========================================================================
   API LAYER (klien). Operasi berat/berskala besar (absensi, dashboard, analitik, Live TV) dijalankan di
   server Apps Script (Api_*.gs) dan mengembalikan Promise; daftar/paginasi tabel master tetap dihitung
   di browser dari cermin data. Bentuk hasil identik dengan SRIT.Api asli.
   ========================================================================= */
SRIT.Api = {
  list(table,{page=1,size=25,search='',filters={},searchFields=[],refSearch=[],where=null}={}){
    let rows=SRIT.Repo.getRows(table);
    if(search){const q=search.toLowerCase();
      rows=rows.filter(r=>
        searchFields.some(f=>String(r[f]??'').toLowerCase().includes(q)) ||
        // cari juga via relasi. rs.get(r) memberi teks siap-cari, atau rs.table+rs.field resolusi ID→NAMA
        refSearch.some(rs=> rs.get
          ? String(rs.get(r)||'').toLowerCase().includes(q)
          : String(SRIT.Repo.name(rs.table,r[rs.field])||'').toLowerCase().includes(q))
      );}
    Object.entries(filters).forEach(([k,v])=>{if(v)rows=rows.filter(r=>String(r[k])===String(v));});
    if(typeof where==='function')rows=rows.filter(where);   // filter bebas (mis. kelengkapan data)
    const total=rows.length;const start=(page-1)*size;
    return {rows:rows.slice(start,start+size),total,page,size,pages:Math.ceil(total/size)||1};
  },
  // ---- sesi kegiatan pada suatu tanggal = JADWAL rutin (per hari) + KEGIATAN khusus (per tanggal) ----
  // all=true → termasuk kegiatan "tanpa absensi" (untuk jadwal/bel); default hanya kegiatan ber-absensi
  // Kegiatan ber-absensi hanya bila kolom ABSENSI berisi ya/iya (kosong = ya untuk data lama). Selain itu (Tidak, tidak, N, 0, ...) = tanpa absensi.
  absensiYa(v){const s=String(v==null?'':v).trim().toUpperCase();return s===''||['YA','IYA','Y','YES','TRUE','1','ADA'].indexOf(s)>=0;},
  getSessionsForDate(iso,all){
    const hari=SRIT.Util.hariOf(iso);
    const sessions=[];
    // recurring schedule templates matching this weekday
    SRIT.Store.read('JADWAL').filter(j=>(j.STATUS||'AKTIF')==='AKTIF'&&String(j.HARI||'').split(',').map(s=>s.trim()).includes(hari)).forEach(j=>{
      sessions.push({id:j.ID,source:'JADWAL',nama:j.NAMA,jamMulai:j.JAM_MULAI,jamSelesai:j.JAM_SELESAI,
        jenjang:j.JENJANG||'SEMUA',jk:j.JK||'SEMUA',lokasi:j.LOKASI||'',petugas:j.PETUGAS||'',bel:j.BEL||'',belTeks:j.BEL_TEKS||'',absensi:SRIT.Api.absensiYa(j.ABSENSI),kelas:j.KELAS||''});
    });
    // special dated activities
    SRIT.Store.read('KEGIATAN').filter(k=>k.TANGGAL===iso&&(k.STATUS||'TERJADWAL')!=='DIBATALKAN').forEach(k=>{
      sessions.push({id:k.ID,source:'KEGIATAN',nama:k.NAMA,jamMulai:k.JAM_MULAI,jamSelesai:k.JAM_SELESAI,
        jenjang:k.JENJANG||'SEMUA',jk:k.JK||'SEMUA',lokasi:k.LOKASI||'',petugas:'',bel:k.BEL||'',belTeks:k.BEL_TEKS||'',absensi:SRIT.Api.absensiYa(k.ABSENSI),kelas:k.KELAS||''});
    });
    return sessions.filter(s=>all||s.absensi).sort((a,b)=>String(a.jamMulai||'').localeCompare(String(b.jamMulai||'')));
  },
  getSessionMeta(iso,sessionId){
    return this.getSessionsForDate(iso,true).find(s=>s.id===sessionId)||null;
  },
  // ---- Dashboard / breakdown (server) ----
  getDashboardData(iso,sessionId){return SRIT.Server.call('apiDashboard',iso||'',sessionId===undefined?null:sessionId);},
  getBreakdown(iso,sessionId){return SRIT.Server.call('apiBreakdown',iso,sessionId||'');},
  // ---- Absensi (server) ----
  getAttendanceSession(iso,sessionId,opt){return SRIT.Server.call('apiAttSession',iso,sessionId||'',opt||{});},
  async saveAttendanceBatch(iso,kegiatanId,changes){
    const r=await SRIT.Server.call('apiAttSave',iso,kegiatanId,changes);
    (changes||[]).forEach(c=>{if(c.status==='HADIR'||c.status==='IZIN'||c.status==='SAKIT')this._markDone(iso,kegiatanId,c.anakId,c.status);else this._unmark(iso,kegiatanId,c.anakId);});
    if(r&&r.rekap)SRIT.Sync.merge('REKAP_HARIAN',r.rekap);

    return r;
  },
  // ---- Pemindaian RFID/QR: konfirmasi INSTAN dari data lokal; penyimpanan dikirim berkelompok di latar ----
  _sq:{},_sChain:Promise.resolve(),_sPend:0,_ai:null,_lastStale:0,
  // ---- Anti-ganda: tanggal + kegiatan + anak. Dicek instan di browser dan DIPUTUSKAN ulang di server (apiAttScan) ----
  _seen:{},
  _sk(iso,sid){return iso+'|'+sid;},
  _isDone(iso,sid,id){const m=this._seen[this._sk(iso,sid)];return (m&&m[id])||'';},
  _markDone(iso,sid,id,st){const k=this._sk(iso,sid);(this._seen[k]=this._seen[k]||{})[id]=st||'HADIR';},
  _unmark(iso,sid,id){const m=this._seen[this._sk(iso,sid)];if(m)delete m[id];},
  async seedScanned(iso,sid){ // muat yang sudah tercatat (HADIR/IZIN/SAKIT) agar scan ulang langsung terdeteksi
    if(!iso||!sid)return;
    try{const r=await SRIT.Server.call('apiAttDone',iso,sid);const k=this._sk(iso,sid),m=this._seen[k]=this._seen[k]||{};
      Object.keys((r&&r.map)||{}).forEach(id=>{const s=r.map[id];if(s==='HADIR'||s==='IZIN'||s==='SAKIT')m[id]=s;});}catch(e){}
  },
  _dupResult(a,st){return {ok:false,dup:true,status:st,anak:{...a},msg:a.NAMA+(st==='HADIR'?' sudah absen':' berstatus '+st)+' di kegiatan ini'};},
  _anakIdx(){ // indeks pencarian dari cermin ANAK (dibangun ulang hanya saat data berubah)
    const s=SRIT.Store._s.ANAK||'[]';
    if(this._ai&&this._ai.s===s)return this._ai;
    let rows=[];try{rows=JSON.parse(s)||[];}catch(e){}
    const id={},nis={},rf={},rfA={};
    rows.forEach(a=>{
      if(id[a.ID]===undefined)id[a.ID]=a;
      if(a.NIS&&nis[a.NIS]===undefined)nis[a.NIS]=a;
      if(a.RFID_UID){if(rf[a.RFID_UID]===undefined)rf[a.RFID_UID]=a;if(a.STATUS==='AKTIF'&&rfA[a.RFID_UID]===undefined)rfA[a.RFID_UID]=a;}
    });
    return (this._ai={s,id,nis,rf,rfA});
  },
  _staleCheck(){ // kartu/QR tak dikenal bisa karena data lokal usang → segarkan cermin (maks 1× / 10 dtk)
    if(Date.now()-this._lastStale<10000)return;this._lastStale=Date.now();SRIT.Sync.lastPoll=0;SRIT.Sync.poll();
  },
  _enqueue(method,iso,sid,payload,anakId){
    const key=method+'|'+iso+'|'+sid;
    const b=this._sq[key]||(this._sq[key]={method,iso,sid,items:[],ids:[],timer:null});
    b.items.push(payload);b.ids.push(anakId);
    if(!b.timer)b.timer=setTimeout(()=>this._flushScan(key),1000);
  },
  _flushScan(key){

    this._sPend++;

  },
  async _sendScan(b,attempt=1){ // tidak pernah melempar; gagal jaringan diulang (3/6/9 dtk) sebelum melapor
    try{
      const r=await SRIT.Server.call('apiAttScan',b.iso,b.sid,b.method,b.items);
      const bad=[];
      (r.results||[]).forEach(x=>{
        if(x&&x.dup){if(x.anak)this._markDone(b.iso,b.sid,x.anak.ID,x.status);if(typeof this.onScanDup==='function'){try{this.onScanDup(x,b);}catch(e){}}}
        else if(!x||!x.ok)bad.push(x);
      });
      if(bad.length)SRIT.Notify(bad.length+' pindaian ditolak server: '+((bad[0]&&bad[0].msg)||'gagal'),'warn',5000);
      SRIT.Cache.invalidate('dash');SRIT.Cache.invalidate('livetv');
    }catch(e){
      if(e.code==='AUTH'||e.code==='FORBIDDEN'){SRIT.Notify(e.message||'Tidak diizinkan','err',6000);return;}
      if(attempt<4){await new Promise(r=>setTimeout(r,attempt*3000));return this._sendScan(b,attempt+1);}
      (b.ids||[]).forEach(id=>this._unmark(b.iso,b.sid,id));   // tidak jadi tersimpan → boleh dipindai ulang
      SRIT.Notify('Gagal menyimpan '+b.items.length+' pindaian ('+(e.message||e)+'). Pindai ulang bila perlu.','err',9000);

    if(!a){this._staleCheck();return Promise.resolve({ok:false,msg:'QR tidak dikenali: '+p});}

  // dipakai bersama oleh 4 modul analitik (Absensi/Izin & Kepulangan/Sakit/Pelanggaran) — tiga granularitas periode
  _trendLabel(dateStr,period){

  },
  async getAnalyticsPelanggaran(period='harian',opt={}){

  },
  // ---- Live TV (publik, tanpa login) ----
  async getLiveTVSummary(iso,sessionId){ // logo dikirim sekali, polling berikutnya memakai salinan lokal (hemat data)

};
</script>

// ---------- Generic master CRUD feature builder ----------
// cfg: {title,table,perm,module,idPrefix,searchFields,cols,fields}
// fields: [{k,label,type,options,required,maxlength}]  type: text|number|time|date|select|textarea
function simpleFeature(cfg){
  const mod=cfg.module||cfg.perm;
  return {
    cfg,
    state:{page:1,size:25,search:''},
    _opts(f){ let o=typeof f.options==='function'?f.options():(f.options||[]); return o; },
    render(host){SRIT.UI.setPage(cfg.title,cfg.title);
      const canCreate=cfg.fields&&SRIT.Auth.can(mod+':CREATE');
      const canExport=SRIT.Auth.can(mod+':EXPORT')||SRIT.Auth.isSuper();
      const canImport=cfg.fields&&(SRIT.Auth.can(mod+':CREATE')||SRIT.Auth.isSuper());
      const curFilters=this.state.filters||{};
      const extraFilters=(cfg.filters||[]).map(f=>{
        const curVal=curFilters[f.k]||'';
        const opts=(typeof f.options==='function'?f.options():f.options);
        return `<div><label class="form-label-sm">${f.label}</label><select class="form-select form-select-sm sf-filter" data-k="${f.k}"><option value="">Semua</option>${opts.map(o=>`<option value="${o.v}" ${String(o.v)===String(curVal)?'selected':''}>${o.t}</option>`).join('')}</select></div>`;
      }).join('');
      host.innerHTML=`<div class="card-srit p-3 mb-3"><div class="filter-bar">
        <div style="flex:1;min-width:200px"><label class="form-label-sm">Cari</label>
          <div style="position:relative">
            <input class="form-control form-control-sm" id="sfSearch" placeholder="Ketik untuk mencari..." style="padding-right:26px" value="${SRIT.Util.esc(this.state.search||'')}">

          </div>
        </div>
        ${extraFilters}
        ${(cfg.toolbar||[]).filter(b=>!b.perm||SRIT.Auth.can(b.perm)||SRIT.Auth.isSuper()).map(b=>`<div><label class="form-label-sm d-block">&nbsp;</label><button class="btn ${b.cls||'btn-outline-primary'} btn-sm" data-tb="${b.id}"><i class="bi ${b.icon||'bi-gear'}"></i> ${b.label}</button></div>`).join('')}
        <div><label class="form-label-sm">Per Halaman</label><select class="form-select form-select-sm" id="sfSize"><option>25</option><option>50</option><option>100</option></select></div>
        ${canImport?`<div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-outline-success btn-sm" id="sfImport"><i class="bi bi-file-earmark-excel"></i> Impor</button></div>`:''}
        ${canExport?`<div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-outline-secondary btn-sm" id="sfExport"><i class="bi bi-download"></i> Ekspor</button></div>`:''}
        ${canCreate?`<div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-primary btn-sm" id="sfAdd"><i class="bi bi-plus-lg"></i> Tambah</button></div>`:''}
      </div><div id="sfActiveChips"></div></div>
      <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="sfTable"></table></div><div class="p-3 border-top" id="sfPag"></div></div>`;
      $('#sfSearch').oninput=e=>{
        $('#sfSearchClear').style.display=e.target.value?'flex':'none';
        clearTimeout(this._searchT);
        this._searchT=setTimeout(()=>{this.state.search=e.target.value;this.state.page=1;this.load();},350);
      };
      $('#sfSearchClear').onclick=()=>{$('#sfSearch').value='';$('#sfSearchClear').style.display='none';this.state.search='';this.state.page=1;this.load();};
      $('#sfSize').onchange=e=>{this.state.size=+e.target.value;this.state.page=1;this.load();};
      $$('.sf-filter').forEach(sel=>sel.onchange=e=>{this.state.filters=this.state.filters||{};this.state.filters[e.target.dataset.k]=e.target.value;this.state.page=1;this.load();});
      const add=$('#sfAdd');if(add)add.onclick=()=>this.form();
      const exp=$('#sfExport');if(exp)exp.onclick=()=>this.exportCSV();
      const imp=$('#sfImport');if(imp)imp.onclick=()=>this.importXLSX();
      (cfg.toolbar||[]).forEach(b=>{const el=document.querySelector('[data-tb="'+b.id+'"]');if(el)el.onclick=()=>b.run.call(this);});
      this.load();},
    // ---- tampilkan chip filter aktif (pencarian + dropdown) dengan tombol hapus per-chip & hapus semua ----
    renderChips(){
      const box=$('#sfActiveChips');if(!box)return;
      const chips=[];
      if(this.state.search)chips.push({label:'Cari: "'+this.state.search+'"',clear:()=>{this.state.search='';const el=$('#sfSearch');if(el)el.value='';const cx=$('#sfSearchClear');if(cx)cx.style.display='none';}});
      Object.entries(this.state.filters||{}).forEach(([k,v])=>{
        if(!v)return;
        const f=(cfg.filters||[]).find(x=>x.k===k);
        const opts=f?(typeof f.options==='function'?f.options():f.options):[];
        const ot=(opts.find(o=>String(o.v)===String(v))||{}).t||v;
        chips.push({label:(f?f.label:k)+': '+ot,clear:()=>{this.state.filters[k]='';const el=document.querySelector('.sf-filter[data-k="'+k+'"]');if(el)el.value='';}});
      });
      if(!chips.length){box.innerHTML='';return;}
      box.innerHTML=`<div class="d-flex align-items-center gap-2 flex-wrap mt-2">
        <span class="text-muted-2" style="font-size:11px">Filter aktif:</span>
        ${chips.map((c,i)=>`<span class="sf-chip" data-chip="${i}">${SRIT.Util.esc(c.label)} <i class="bi bi-x"></i></span>`).join('')}
        ${chips.length>1?'<span class="text-muted-2 pointer" id="sfClearAll" style="font-size:11px;text-decoration:underline">Hapus semua filter</span>':''}
      </div>`;
      box.querySelectorAll('[data-chip]').forEach((el,i)=>{el.onclick=()=>{chips[i].clear();this.state.page=1;this.load();};});
