  _renderTable(rep,res){
    const meta=(res.meta||[[ 'Rentang',SRIT.Util.fmtDateShort(this._range().from)+' s/d '+SRIT.Util.fmtDateShort(this._range().to)]]);
    return `<div class="p-3 border-bottom d-flex flex-wrap gap-3" style="font-size:12px">${meta.map(m=>`<span><span class="text-muted-2">${m[0]}:</span> <b>${SRIT.Util.esc(String(m[1]))}</b></span>`).join('')}<span class="text-muted-2 ms-auto">${res.rows.length} baris</span></div>
      <div class="table-responsive"><table class="table table-srit mb-0"><thead><tr>${res.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${res.rows.length?res.rows.map(row=>`<tr>${row.map(c=>`<td>${SRIT.Util.esc(String(c==null?'-':c))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${res.cols.length}"><div class="empty-state"><i class="bi bi-inbox d-block"></i>Belum ada data pada periode ini</div></td></tr>`}</tbody></table></div>`;
  },
  exportCSV(rep,res){
    let csv=res.cols.join(',')+'\n';
    res.rows.forEach(r=>csv+=r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')+'\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=rep.id+'_'+this._range().from+'_'+this._range().to+'.csv';a.click();
    SRIT.Audit.log('EXPORT','laporan',rep.id);SRIT.Notify('Laporan diekspor','ok');
  },
  async print(rep,res){
    // gunakan template formal khusus bila tersedia, jika tidak pakai tabel generik
    await this._prefetch(rep.id);
    const fn=this._formal[rep.id];
    if(fn){fn.call(this,rep);return;}
    const set=SRIT.Store.readObj('SETTINGS');const {from,to}=this._range();
    const inner=this._kop(set,rep.name.toUpperCase(),rep.grp+' · Periode '+SRIT.Util.fmtDateShort(from)+' s/d '+SRIT.Util.fmtDateShort(to))+
      `<table><thead><tr>${res.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${res.rows.length?res.rows.map(row=>`<tr>${row.map(c=>`<td>${SRIT.Util.esc(String(c==null?'-':c))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${res.cols.length}" style="text-align:center">Belum ada data</td></tr>`}</tbody></table>`+
      this._signBlock(rep.grp==='WALI ASUH'?'Wali Asuh':'Wali Asrama');
    this._printDoc(rep.name,inner);
  },
  // ===== Template dokumen formal per jenis laporan =====
  _formal:{
    // Draft 1 — Laporan Harian Wali Asrama
    'wr-harian'(rep){
      const set=SRIT.Store.readObj('SETTINGS');const iso=this.to||SRIT.Util.todayISO();
      const rek=SRIT.Store.read('REKAP_HARIAN').find(r=>r.TANGGAL===iso)||{TOTAL:SRIT.Repo.count('ANAK'),HADIR:0,IZIN:0,SAKIT:0,ALPA:0};
      const att=this._attDayRows(iso);
      const sesi=SRIT.Api.getSessionsForDate(iso);
      const rowsK=sesi.map((s,i)=>{
        const rel=att.filter(r=>r.KEGIATAN_ID===s.id);
        let pes=SRIT.Store.read('ANAK').filter(a=>a.STATUS==='AKTIF');
        if(s.jenjang&&s.jenjang!=='SEMUA')pes=pes.filter(a=>a.JENJANG===s.jenjang);
        if(s.jk&&s.jk!=='SEMUA')pes=pes.filter(a=>a.JK===s.jk);
        const h=rel.filter(r=>r.STATUS==='HADIR').length;const izn=rel.filter(r=>r.STATUS==='IZIN').length,skt=rel.filter(r=>r.STATUS==='SAKIT').length,alp=rel.filter(r=>r.STATUS==='ALPA').length;
        const pct=SRIT.Util.pct(h,pes.length);
        const ket=[izn?izn+' izin':'',skt?skt+' sakit':'',alp?alp+' alpa':''].filter(Boolean).join(', ')||'Berjalan tertib';
        return `<tr><td style="text-align:center">${i+1}</td><td>${s.jamMulai}–${s.jamSelesai}</td><td>${SRIT.Util.esc(s.nama)}</td><td style="text-align:center">${pct}%</td><td>${ket}</td></tr>`;
      }).join('')||'<tr><td colspan="5" style="text-align:center">Belum ada kegiatan terjadwal</td></tr>';
      const mon=SRIT.Store.read('OPS_MONITORING').filter(m=>m.TANGGAL===iso);
      const log=SRIT.Store.read('OPS_LOGKEJADIAN').filter(m=>m.TANGGAL===iso);
      const plg=SRIT.Store.read('PELANGGARAN').filter(m=>m.TANGGAL===iso);
      const kondisi=mon.some(m=>m.KONDISI!=='AMAN')?'Terdapat catatan perhatian pada monitoring kondisi asrama.':'Asrama dalam keadaan aman, tertib dan kondusif. Kegiatan harian berjalan sesuai jadwal.';
      const masalah=plg.length?plg.length+' pelanggaran tata tertib tercatat hari ini.':(log.length?log.map(l=>l.KEJADIAN).join('; '):'Tidak ada permasalahan berarti.');
      const inner=this._kop(set,'LAPORAN HARIAN KEGIATAN KEASRAMAAN')+
        `<table class="info"><tr><td style="width:150px">Hari/Tanggal</td><td>: ${SRIT.Util.fmtDate(iso)}</td></tr>
          <tr><td>Wali Asrama</td><td>: ......................................................</td></tr>
          <tr><td>Jumlah Penghuni</td><td>: ${rek.TOTAL} peserta didik</td></tr></table>
        <table><thead><tr><th style="width:34px">No</th><th style="width:110px">Waktu</th><th>Kegiatan</th><th style="width:80px">Kehadiran</th><th>Kondisi/Keterangan</th></tr></thead><tbody>${rowsK}</tbody></table>
        <h4>Kondisi Umum Asrama</h4><div>${SRIT.Util.esc(kondisi)}</div>
        <h4>Permasalahan yang Ditemukan</h4><div>${SRIT.Util.esc(masalah)}</div>
        <h4>Tindak Lanjut</h4><div>Wali Asuh melakukan pendampingan dan pemantauan perkembangan peserta didik terkait.</div>
        <h4>Catatan Lain</h4><div style="min-height:24px">.......................................................................................................</div>`+
        this._signBlock('Wali Asrama','Mengetahui,<br>Kepala Sekolah');
      this._printDoc('Laporan Harian Keasramaan',inner);
    },
    // Draft 2 — Laporan Refleksi & Pengasuhan Mingguan Wali Asuh
    'wa-refleksi'(rep){
      const set=SRIT.Store.readObj('SETTINGS');const {from,to}=this._range();
      const AGr=this._agg();
      const h=AGr.hadir;const pctH=SRIT.Util.pct(h,AGr.total);
      const plg=SRIT.Store.read('PELANGGARAN').filter(r=>this._inRange(r.TANGGAL)).length;
      const aspek=[
        ['Kehadiran kegiatan',pctH>=95?'Baik':'Cukup',pctH+'% mengikuti kegiatan'],
        ['Kedisiplinan',plg?'Cukup':'Baik',plg?plg+' pelanggaran tercatat':'Tidak ada pelanggaran'],
        ['Kebersihan diri','Baik','Perlu pemantauan rutin'],
        ['Kebersihan kamar','Baik','Kamar terjaga'],
        ['Ibadah/Kerohanian','Baik','Mengikuti kegiatan rutin'],
        ['Belajar malam','Cukup','Sebagian perlu pendampingan'],
        ['Sosial/pertemanan','Baik','Hubungan antarsiswa kondusif'],
        ['Kemandirian','Baik','Mampu mengatur kebutuhan pribadi'],
        ['Kepemimpinan','Cukup','Perlu tanggung jawab tambahan'],
        ['Kondisi kesehatan','Baik','Tidak ada masalah serius']
      ].map(a=>`<tr><td>${a[0]}</td><td style="text-align:center;width:80px">${a[1]}</td><td>${a[2]}</td></tr>`).join('');
      const perhatian=SRIT.Store.read('PEMBINAAN').filter(r=>this._inRange(r.TANGGAL)).slice(0,5).map((r,i)=>
        `<p style="margin:4px 0"><b>${i+1}. ${SRIT.Util.esc(this._anak(r.ANAK).NAMA||r.NAMA_ANAK)}</b><br>Permasalahan: ${SRIT.Util.esc(r.MATERI||'-')}<br>Tindakan: ${SRIT.Util.esc(r.JENIS||'-')}<br>Hasil: ${SRIT.Util.esc(r.HASIL||'Dalam pemantauan')}</p>`).join('')||'<p class="muted">Tidak ada peserta didik yang memerlukan perhatian khusus.</p>';
      const inner=this._kop(set,'LAPORAN REFLEKSI DAN PENGASUHAN MINGGUAN')+
        `<table class="info"><tr><td style="width:150px">Nama Wali Asuh</td><td>: ......................................................</td></tr>
          <tr><td>Kelompok/Kamar</td><td>: ......................................................</td></tr>
          <tr><td>Periode</td><td>: ${SRIT.Util.fmtDateShort(from)} s/d ${SRIT.Util.fmtDateShort(to)}</td></tr></table>
        <table><thead><tr><th>Aspek</th><th style="width:90px">Kondisi</th><th>Keterangan</th></tr></thead><tbody>${aspek}</tbody></table>
        <h4>Peserta Didik yang Memerlukan Perhatian</h4>${perhatian}
        <h4>Kesimpulan</h4><div>Secara umum perkembangan peserta didik asuh selama satu minggu berjalan baik. Pembinaan difokuskan pada peningkatan kemandirian, kedisiplinan, dan kemandirian belajar.</div>`+
        this._signBlock('Wali Asuh','Mengetahui,<br>Wali Asrama');
      this._printDoc('Laporan Refleksi Mingguan',inner);
    },
    // Draft 3 — Laporan Pengelolaan & Pembinaan Asrama Bulanan
    'wr-bulanan'(rep){
      const set=SRIT.Store.readObj('SETTINGS');const {from,to}=this._range();
      const inRange=r=>this._inRange(r.TANGGAL);
      const prog=SRIT.Store.read('PROGRAM').map(p=>`<tr><td>${SRIT.Util.esc(p.NAME)}</td><td style="text-align:center">${p.PERIODE||'-'}</td><td style="text-align:center">${p.STATUS==='AKTIF'?'Berjalan':p.STATUS}</td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center">-</td></tr>';
      const cnt=(t)=>SRIT.Store.read(t).filter(inRange).length;
      const masalah=[
        ['Pelanggaran tata tertib',cnt('PELANGGARAN'),'Pembinaan'],
        ['Ketidakhadiran kegiatan','-','Pemantauan'],
        ['Masalah belajar',SRIT.Store.read('PEMBINAAN').filter(r=>inRange(r)&&['MENTORING','PENDAMPINGAN','TUGAS'].includes(r.JENIS)).length,'Pendampingan'],
        ['Masalah sosial/konseling',SRIT.Store.read('PEMBINAAN').filter(r=>inRange(r)&&['KONSELING','NASIHAT'].includes(r.JENIS)).length,'Konseling']
      ].map(m=>`<tr><td>${m[0]}</td><td style="text-align:center;width:70px">${m[1]}</td><td>${m[2]}</td></tr>`).join('');
      const sarpras=SRIT.Store.read('OPS_SARPRAS');
      const sp=k=>{const it=sarpras.filter(x=>(x.LOKASI||'').toLowerCase().includes(k));return it.length?(it.every(x=>x.KONDISI==='BAIK')?'Baik':'Perlu perhatian'):'Baik';};
      const rusak=sarpras.filter(x=>x.KONDISI==='RUSAK');
      const rekBulan=SRIT.Store.read('REKAP_HARIAN').filter(inRange);
      const pctBulan=SRIT.Util.pct(rekBulan.reduce((a,r)=>a+r.HADIR,0),rekBulan.reduce((a,r)=>a+r.TOTAL,0));
      const inner=this._kop(set,'LAPORAN PENGELOLAAN DAN PEMBINAAN ASRAMA')+
        `<table class="info"><tr><td style="width:150px">Bulan</td><td>: ${new Date((to||SRIT.Util.todayISO())+'T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</td></tr>
          <tr><td>Jumlah Peserta Didik</td><td>: ${SRIT.Repo.count('ANAK')} orang</td></tr>
          <tr><td>Rata-rata Kehadiran</td><td>: ${pctBulan}%</td></tr></table>
        <h4>A. Pelaksanaan Kegiatan / Program</h4>
        <table><thead><tr><th>Program</th><th style="width:110px">Periode</th><th style="width:110px">Status</th></tr></thead><tbody>${prog}</tbody></table>
        <h4>B. Kondisi Peserta Didik</h4>
        <table><tr><td style="width:150px">Akademik</td><td>..............................................</td></tr>
          <tr><td>Kedisiplinan</td><td>..............................................</td></tr>
          <tr><td>Karakter</td><td>..............................................</td></tr>
          <tr><td>Kemandirian</td><td>..............................................</td></tr>
          <tr><td>Keagamaan</td><td>..............................................</td></tr>
          <tr><td>Kesehatan</td><td>..............................................</td></tr></table>
        <h4>C. Permasalahan</h4>
        <table><thead><tr><th>Permasalahan</th><th style="width:70px">Jumlah</th><th>Tindakan</th></tr></thead><tbody>${masalah}</tbody></table>
        <h4>D. Sarana Prasarana</h4>
        <table><tr><td style="width:150px">Kondisi Kamar</td><td>${sp('kamar')}</td><td style="width:150px">MCK</td><td>${sp('mck')||'Baik'}</td></tr>
          <tr><td>Ruang Makan</td><td>${sp('makan')||'Baik'}</td><td>Tempat Ibadah/Aula</td><td>${sp('aula')||'Baik'}</td></tr>
          <tr><td>Fasilitas Rusak</td><td colspan="3">${rusak.length?rusak.map(x=>SRIT.Util.esc(x.NAMA)).join(', '):'Nihil'}</td></tr></table>
        <h4>E. Evaluasi</h4><div style="min-height:28px">.......................................................................................................</div>
        <h4>F. Rencana Tindak Lanjut Bulan Berikutnya</h4>
        <ul><li>Meningkatkan pendampingan belajar malam.</li><li>Meningkatkan pembiasaan kebersihan kamar.</li><li>Pemantauan peserta didik yang memerlukan perhatian khusus.</li><li>Meningkatkan koordinasi Wali Asrama dan Wali Asuh.</li><li>Komunikasi dengan orang tua/wali bila diperlukan.</li></ul>`+
        this._signBlock('Wali Asrama','Mengetahui,<br>Kepala Sekolah');
      this._printDoc('Laporan Pengelolaan Asrama Bulanan',inner);
    },
    // Draft 4 — Laporan Perkembangan Individu (per anak) → pilih anak dulu
    'wr-perkembangan'(rep){this._printPerkembangan();},
    'wa-perkembangan'(rep){this._printPerkembangan();},
    // Draft 5 — Formulir Kejadian & Tindak Lanjut (per insiden) → pilih insiden dulu
    'wr-mitigasi'(rep){this._printKejadian();}
  },
  _printPerkembangan(){
    // dialog pilih anak
    const anak=SRIT.Store.read('ANAK').filter(a=>a.STATUS==='AKTIF');
    const m=SRIT.Modal.open({title:'Cetak Laporan Perkembangan Individu',
      body:`<label class="form-label-sm">Pilih Peserta Didik</label>
        <select class="form-select form-select-sm" id="lpAnak">${anak.map(a=>`<option value="${a.ID}">${SRIT.Util.esc(a.NAMA)} · ${a.NIS} · ${a.JENJANG} ${a.KELAS||''}</option>`).join('')}</select>
        <div class="text-muted-2 mt-2" style="font-size:11px">Nilai diambil dari data Penilaian terbaru anak (bila ada).</div>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="lpAnakGo"><i class="bi bi-printer"></i> Cetak</button>`});
    $('#lpAnakGo',m.el).onclick=()=>{const id=$('#lpAnak',m.el).value;m.close();this._doPerkembangan(id);};
  },
  _doPerkembangan(anakId){
    const set=SRIT.Store.readObj('SETTINGS');const a=this._anak(anakId);
    const pen=SRIT.Store.read('PENILAIAN').filter(r=>r.ANAK===anakId).slice(-1)[0]||{};
    const rub=SRIT.Store.readObj('RUBRIK');const pr=v=>rub[v]||(v>=4?'Sangat Baik':v>=3?'Baik':v>=2?'Cukup':v?'Kurang':'-');
    const wa=(SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-';
    const map=[['Akademik',pen.KARAKTER],['Kemandirian Belajar',pen.KEMANDIRIAN],['Disiplin',pen.DISIPLIN],['Tanggung Jawab',pen.KARAKTER],['Kejujuran',pen.KARAKTER],['Kerja Sama',pen.SOSIAL],['Empati',pen.SOSIAL],['Kebersihan Diri',pen.KEBERSIHAN],['Kebersihan Kamar',pen.KEBERSIHAN],['Keagamaan',pen.KEAGAMAAN],['Kepemimpinan',pen.LEADERSHIP],['Kegiatan Sosial',pen.SOSIAL]];
    const rows=map.map(x=>`<tr><td>${x[0]}</td><td style="text-align:center;width:110px">${pr(+x[1]||0)}</td><td>...............................</td></tr>`).join('');
    const inner=this._kop(set,'LAPORAN PERKEMBANGAN PESERTA DIDIK ASRAMA')+
      `<table class="info"><tr><td style="width:130px">Nama</td><td>: ${SRIT.Util.esc(a.NAMA||'-')}</td><td style="width:90px">NIS</td><td>: ${a.NIS||'-'}</td></tr>
        <tr><td>Jenjang/Kelas</td><td>: ${a.JENJANG||'-'} ${a.KELAS||''}</td><td>Kamar</td><td>: ${this._kamar(a.KAMAR)}</td></tr>
        <tr><td>Wali Asuh</td><td>: ${SRIT.Util.esc(wa)}</td><td>Periode</td><td>: ${SRIT.Util.fmtDateShort(this._range().to)}</td></tr></table>
      <table><thead><tr><th>Aspek</th><th style="width:120px">Nilai/Predikat</th><th>Catatan Perkembangan</th></tr></thead><tbody>${rows}</tbody></table>
      <h4>Catatan Wali Asuh</h4><div style="min-height:26px">.......................................................................................................</div>
      <h4>Potensi yang Perlu Dikembangkan</h4><div style="min-height:26px">.......................................................................................................</div>
      <h4>Tindak Lanjut</h4><div style="min-height:26px">.......................................................................................................</div>`+
      this._signBlock('Wali Asuh','Wali Asrama');
    this._printDoc('Laporan Perkembangan '+(a.NAMA||''),inner);
  },
  _printKejadian(){
    const ins=SRIT.Store.read('INSIDEN').slice().sort((a,b)=>String(b.TANGGAL).localeCompare(a.TANGGAL));
    const m=SRIT.Modal.open({title:'Cetak Formulir Kejadian & Tindak Lanjut',
      body:`<label class="form-label-sm">Pilih Kejadian/Insiden</label>
        <select class="form-select form-select-sm" id="lpIns"><option value="">— Form Kosong —</option>${ins.map(i=>`<option value="${i.ID}">${SRIT.Util.fmtDateShort(i.TANGGAL)} · ${SRIT.Util.esc(i.KATEGORI)} · ${SRIT.Util.esc((i.KEJADIAN||'').slice(0,40))}</option>`).join('')}</select>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="lpInsGo"><i class="bi bi-printer"></i> Cetak</button>`});
    $('#lpInsGo',m.el).onclick=()=>{const id=$('#lpIns',m.el).value;m.close();this._doKejadian(id);};
  },
  _doKejadian(id){
    const set=SRIT.Store.readObj('SETTINGS');const r=SRIT.Repo.getById('INSIDEN',id)||{};
    const cats=['Kesehatan','Pelanggaran tata tertib','Konflik antar peserta didik','Perundungan','Keamanan','Kerusakan fasilitas','Kepulangan/perizinan','Lainnya'];
    const map={'KESEHATAN':'Kesehatan','KONFLIK':'Konflik antar peserta didik','PERUNDUNGAN':'Perundungan','KEAMANAN':'Keamanan','KERUSAKAN':'Kerusakan fasilitas','KETIDAKHADIRAN':'Kepulangan/perizinan'};
    const chosen=map[r.KATEGORI]||'Lainnya';
    const cb=(label)=>`<span style="display:inline-block;margin-right:14px">${(chosen===label||(label==='Pelanggaran tata tertib'&&r.KATEGORI==='PELANGGARAN'))?'☑':'☐'} ${label}</span>`;
    const coord=(label)=>`<span style="display:inline-block;margin-right:14px">☐ ${label}</span>`;
    const stat=s=>`<span style="display:inline-block;margin-right:14px">${(r.STATUS===s||(s==='Selesai'&&r.STATUS==='SELESAI')||(s==='Dalam pemantauan'&&r.STATUS==='MONITORING'))?'☑':'☐'} ${s}</span>`;
    const inner=this._kop(set,'FORMULIR LAPORAN KEJADIAN DAN TINDAK LANJUT')+
      `<table class="info"><tr><td style="width:130px">Tanggal</td><td>: ${r.TANGGAL?SRIT.Util.fmtDate(r.TANGGAL):'...................'}</td></tr>
        <tr><td>Tempat</td><td>: ...................................................</td></tr>
        <tr><td>Pelapor</td><td>: ${SRIT.Util.esc(r.PELAPOR||'...................................................')}</td></tr></table>
      <h4>Jenis Kejadian</h4><div style="line-height:2">${cats.map(cb).join('')}</div>
      <h4>Peserta Didik yang Terlibat</h4><div style="min-height:22px">.......................................................................................................</div>
      <h4>Kronologi</h4><div style="min-height:40px">${SRIT.Util.esc(r.KEJADIAN||'.......................................................................................................')}</div>
      <h4>Tindakan Awal</h4><div style="min-height:26px">${SRIT.Util.esc(r.TINDAKAN||'...............................................................')}</div>
      <h4>Koordinasi dengan</h4><div style="line-height:2">${['Wali Asuh','Wali Asrama','Kepala Sekolah','Guru','Orang Tua/Wali','Pihak lain'].map(coord).join('')}</div>
      <h4>Hasil Penanganan</h4><div style="min-height:26px">.......................................................................................................</div>
      <h4>Tindak Lanjut</h4><div style="min-height:26px">.......................................................................................................</div>
      <h4>Status</h4><div style="line-height:2">${['Selesai','Dalam pemantauan','Perlu tindak lanjut'].map(stat).join('')}</div>`+
      this._signBlock('Wali Asrama','Mengetahui,<br>Kepala Sekolah');
    this._printDoc('Formulir Kejadian',inner);
  },
  destroy(){}
};
</script>

<script>__srit.n('View_Keasramaan')</script>
<script>
//# sourceURL=View_Keasramaan.html
// ---------- KEASRAMAAN ----------
/* ===== Operational sub-module registry (each = record-keeping panel) ===== */
SRIT.OPS={
  'monitoring':{title:'Monitoring 24 Jam',icon:'bi-clock-history',table:'OPS_MONITORING',idPrefix:'MON',searchFields:['CATATAN','PETUGAS'],
    cols:[{h:'Tanggal',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)},{h:'Shift',k:'SHIFT'},{h:'Lokasi',k:'LOKASI'},{h:'Petugas',k:'PETUGAS'},{h:'Kondisi',f:r=>`<span class="badge-soft ${r.KONDISI==='AMAN'?'st-HADIR':'st-ALPA'}">${r.KONDISI}</span>`},{h:'Catatan',k:'CATATAN'}],
    fields:[{k:'TANGGAL',label:'Tanggal',type:'date',default:SRIT.Util.todayISO(),required:true},{k:'SHIFT',label:'Shift',type:'select',options:[{v:'PAGI',t:'PAGI'},{v:'SIANG',t:'SIANG'},{v:'MALAM',t:'MALAM'}]},{k:'LOKASI',label:'Lokasi',required:true},{k:'PETUGAS',label:'Petugas',required:true},{k:'KONDISI',label:'Kondisi',type:'select',options:[{v:'AMAN',t:'AMAN'},{v:'PERHATIAN',t:'PERHATIAN'},{v:'DARURAT',t:'DARURAT'}]},{k:'CATATAN',label:'Catatan',type:'textarea',col:12}]},
  'kepulangan':{title:'Kepulangan',icon:'bi-box-arrow-right',table:'OPS_KEPULANGAN',idPrefix:'KPL',searchFields:['TUJUAN','PENJEMPUT'],
    cols:[{h:'Tanggal',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)},{h:'Anak',f:r=>SRIT.nm('ANAK',r.ANAK)},{h:'Tujuan',k:'TUJUAN'},{h:'Penjemput',k:'PENJEMPUT'},{h:'Status',f:r=>`<span class="badge-soft ${r.STATUS==='DISETUJUI'?'st-HADIR':r.STATUS==='DITOLAK'?'st-ALPA':'st-SAKIT'}">${r.STATUS}</span>`}],
    fields:[{k:'TANGGAL',label:'Tanggal',type:'date',default:SRIT.Util.todayISO(),required:true},{k:'ANAK',label:'Anak',type:'select',col:12,required:true,options:()=>SRIT.Store.read('ANAK').filter(a=>a.STATUS==='AKTIF').map(a=>({v:a.ID,t:a.NAMA+' ('+a.NIS+')'}))},{k:'TUJUAN',label:'Tujuan',required:true},{k:'PENJEMPUT',label:'Penjemput',required:true},{k:'HUBUNGAN',label:'Hubungan'},{k:'STATUS',label:'Status',type:'select',options:[{v:'MENUNGGU',t:'MENUNGGU'},{v:'DISETUJUI',t:'DISETUJUI'},{v:'DITOLAK',t:'DITOLAK'}]}]},
  'kunjungan':{title:'Kunjungan Orang Tua',icon:'bi-people',table:'OPS_KUNJUNGAN',idPrefix:'KJG',searchFields:['PENGUNJUNG'],
    cols:[{h:'Tanggal',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)},{h:'Anak',f:r=>SRIT.nm('ANAK',r.ANAK)},{h:'Pengunjung',k:'PENGUNJUNG'},{h:'Hubungan',k:'HUBUNGAN'},{h:'Jam',k:'JAM'},{h:'Status',f:r=>`<span class="badge-soft st-HADIR">${r.STATUS}</span>`}],
    fields:[{k:'TANGGAL',label:'Tanggal',type:'date',default:SRIT.Util.todayISO(),required:true},{k:'ANAK',label:'Anak',type:'select',col:12,required:true,options:()=>SRIT.Store.read('ANAK').filter(a=>a.STATUS==='AKTIF').map(a=>({v:a.ID,t:a.NAMA+' ('+a.NIS+')'}))},{k:'PENGUNJUNG',label:'Pengunjung',required:true},{k:'HUBUNGAN',label:'Hubungan'},{k:'JAM',label:'Jam',type:'time'},{k:'STATUS',label:'Status',type:'select',options:[{v:'TERVERIFIKASI',t:'TERVERIFIKASI'},{v:'SELESAI',t:'SELESAI'}]}]},

<script>

      detail:true,
      fields:[{k:'NAMA',label:'Nama Aset',col:12,required:true},{k:'KATEGORI',label:'Kategori',type:'select',options:['ELEKTRONIK','MEBEL','KEBERSIHAN','KEAMANAN','DAPUR','OLAHRAGA','LAINNYA'].map(v=>({v,t:v}))},{k:'LOKASI',label:'Lokasi',required:true},{k:'JUMLAH',label:'Jumlah',type:'number',default:1},{k:'KONDISI',label:'Kondisi',type:'select',options:[{v:'BAIK',t:'BAIK'},{v:'PERLU PERBAIKAN',t:'PERLU PERBAIKAN'},{v:'RUSAK',t:'RUSAK'}]},{k:'KETERANGAN',label:'Keterangan',type:'textarea',col:12}]},
    // 2) Monitoring kondisi sarpras berkala — pelapor wali asrama
    {t:'Monitoring Sarpras',k:'SARPRAS_MONITORING',idPrefix:'SMO',searchFields:['CATATAN','LOKASI'],refSearch:[{get:r=>waliAsramaName(r.PELAPOR)}],
      filters:[{k:'ASET',label:'Aset',options:()=>SRIT.Store.read('OPS_SARPRAS').map(a=>({v:a.ID,t:a.NAMA}))},{k:'KONDISI',label:'Kondisi',options:[{v:'BAIK',t:'BAIK'},{v:'PERLU PERBAIKAN',t:'PERLU PERBAIKAN'},{v:'RUSAK',t:'RUSAK'}]},{k:'PELAPOR',label:'Pelapor (Wali Asrama)',options:waliAsramaOpts},{k:'STATUS',label:'Status',options:[{v:'DILAPORKAN',t:'DILAPORKAN'},{v:'DITINDAKLANJUTI',t:'DITINDAKLANJUTI'},{v:'SELESAI',t:'SELESAI'}]}],
      cols:[{h:'Tanggal',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)},{h:'Aset',f:r=>(SRIT.Repo.getById('OPS_SARPRAS',r.ASET)||{}).NAMA||r.ASET||'-'},{h:'Lokasi',k:'LOKASI'},{h:'Kondisi',f:r=>`<span class="badge-soft ${r.KONDISI==='BAIK'?'st-HADIR':r.KONDISI==='RUSAK'?'st-ALPA':'st-SAKIT'}">${r.KONDISI}</span>`},{h:'Pelapor (Wali Asrama)',f:r=>waliAsramaName(r.PELAPOR)},{h:'Status',f:r=>`<span class="badge-soft ${r.STATUS==='SELESAI'?'st-BELUM':r.STATUS==='DITINDAKLANJUTI'?'st-IZIN':'st-SAKIT'}">${r.STATUS||'DILAPORKAN'}</span>`}],
      detail:true,
      rowActions:[
        {id:'tl',label:'Tindak Lanjut',icon:'bi-tools',cls:'btn-outline-primary',show:r=>r.STATUS==='DILAPORKAN',run:function(rec,reload){SRIT.Repo.update('SARPRAS_MONITORING',rec.ID,{STATUS:'DITINDAKLANJUTI'});SRIT.Audit.log('UPDATE','sarpras',rec.ID);SRIT.Notify('Status: Ditindaklanjuti','ok');reload();}},
        {id:'done',label:'Selesai',icon:'bi-check-lg',cls:'btn-outline-success',show:r=>r.STATUS!=='SELESAI',run:function(rec,reload){SRIT.Repo.update('SARPRAS_MONITORING',rec.ID,{STATUS:'SELESAI'});SRIT.Audit.log('UPDATE','sarpras',rec.ID);SRIT.Notify('Status: Selesai','ok');reload();}}
      ],
      onCreate:d=>{const a=SRIT.Repo.getById('OPS_SARPRAS',d.ASET);if(a&&!d.LOKASI)d.LOKASI=a.LOKASI||'';},
      fields:[{k:'TANGGAL',label:'Tanggal',type:'date',default:SRIT.Util.todayISO(),required:true},{k:'ASET',label:'Aset Sarpras',type:'select',col:12,options:()=>SRIT.Store.read('OPS_SARPRAS').map(a=>({v:a.ID,t:a.NAMA+' — '+(a.LOKASI||'')}))},{k:'LOKASI',label:'Lokasi'},{k:'KONDISI',label:'Kondisi',type:'select',options:[{v:'BAIK',t:'BAIK'},{v:'PERLU PERBAIKAN',t:'PERLU PERBAIKAN'},{v:'RUSAK',t:'RUSAK'}]},{k:'PELAPOR',label:'Pelapor (Wali Asrama)',type:'select',col:12,options:waliAsramaOpts},{k:'CATATAN',label:'Catatan / Temuan',type:'textarea',col:12},{k:'STATUS',label:'Status',type:'select',options:[{v:'DILAPORKAN',t:'DILAPORKAN'},{v:'DITINDAKLANJUTI',t:'DITINDAKLANJUTI'},{v:'SELESAI',t:'SELESAI'}]}]},
    // 3) Kelengkapan ceklis sarana per lokasi — petugas wali asrama
    {t:'Kelengkapan Ceklis',k:'SARPRAS_CEKLIS',idPrefix:'SCK',searchFields:['ITEM','LOKASI','CATATAN'],refSearch:[{get:r=>waliAsramaName(r.PETUGAS)}],
      filters:[{k:'LOKASI',label:'Lokasi',options:()=>[...new Set(SRIT.Store.read('SARPRAS_CEKLIS').map(x=>x.LOKASI).filter(Boolean))].map(v=>({v,t:v}))},{k:'STATUS',label:'Status',options:[{v:'LENGKAP',t:'LENGKAP'},{v:'KURANG',t:'KURANG'},{v:'TIDAK ADA',t:'TIDAK ADA'}]},{k:'PETUGAS',label:'Petugas (Wali Asrama)',options:waliAsramaOpts}],
      cols:[{h:'Tanggal',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)},{h:'Item / Sarana',k:'ITEM'},{h:'Lokasi',k:'LOKASI'},{h:'Jumlah',k:'JUMLAH'},{h:'Status',f:r=>`<span class="badge-soft ${r.STATUS==='LENGKAP'?'st-HADIR':r.STATUS==='KURANG'?'st-SAKIT':'st-ALPA'}">${r.STATUS}</span>`},{h:'Petugas (Wali Asrama)',f:r=>waliAsramaName(r.PETUGAS)}],
      detail:true,
      fields:[{k:'TANGGAL',label:'Tanggal',type:'date',default:SRIT.Util.todayISO(),required:true},{k:'ITEM',label:'Item / Sarana',col:12,required:true},{k:'LOKASI',label:'Lokasi',required:true},{k:'JUMLAH',label:'Jumlah',type:'number',default:1},{k:'STATUS',label:'Status Kelengkapan',type:'select',options:[{v:'LENGKAP',t:'LENGKAP'},{v:'KURANG',t:'KURANG'},{v:'TIDAK ADA',t:'TIDAK ADA'}]},{k:'PETUGAS',label:'Petugas (Wali Asrama)',type:'select',col:12,options:waliAsramaOpts},{k:'CATATAN',label:'Catatan',type:'textarea',col:12}]}
  ],
  render(host){SRIT.UI.setPage('Monitoring Sarpras','Layanan Asrama / Sarpras');
    // ringkasan KPI
    const inv=SRIT.Store.read('OPS_SARPRAS');
    const kpi=(v,l,c)=>`<div class="col-6 col-md-3"><div class="card-srit p-2 p-md-3 text-center h-100"><div class="fw-bold" style="font-size:clamp(18px,2.2vw,26px);color:${c}">${v}</div><div class="text-muted-2" style="font-size:11px;text-transform:uppercase">${l}</div></div></div>`;
    host.innerHTML=`<div class="row g-2 g-md-3 mb-3">
        ${kpi(inv.length,'Total Aset','#38bdf8')}
        ${kpi(inv.filter(x=>x.KONDISI==='BAIK').length,'Kondisi Baik','#4ade80')}
        ${kpi(inv.filter(x=>x.KONDISI==='PERLU PERBAIKAN').length,'Perlu Perbaikan','#fbbf24')}
        ${kpi(inv.filter(x=>x.KONDISI==='RUSAK').length,'Rusak','#f87171')}
      </div>
      <ul class="nav nav-pills flex-nowrap mb-3" id="srTabs" style="overflow-x:auto">${this.tabs.map((t,i)=>`<li class="nav-item"><a class="nav-link ${i===this.active?'active':''} pointer text-nowrap" data-i="${i}">${t.t}</a></li>`).join('')}</ul>
      <div id="srBody"></div>`;
    $$('#srTabs a').forEach(a=>a.onclick=()=>{this.active=+a.dataset.i;this.render(host);});
    const t=this.tabs[this.active];
    regFeature('_sr',{title:t.t,table:t.k,perm:'sarpras',module:'sarpras',idPrefix:t.idPrefix,searchFields:t.searchFields||['NAMA'],refSearch:t.refSearch||[],filters:t.filters||[],cols:t.cols,fields:t.fields,detail:t.detail,rowActions:t.rowActions,onCreate:t.onCreate});
    SRIT.Features._sr.render($('#srBody'));
  },
  destroy(){if(SRIT.Features._sr)try{SRIT.Features._sr.destroy();}catch(e){}}
};
</script>

<script>__srit.n('View_Izin')</script>
<script>
//# sourceURL=View_Izin.html
// Izin & Kepulangan (dengan alur persetujuan)
regFeature('izin',{title:'Izin & Kepulangan',table:'IZIN',perm:'izin',module:'izin',idPrefix:'IZ',searchFields:['NAMA_ANAK','TUJUAN','PENJEMPUT'],refSearch:SRIT.anakRefSearch,detail:true,
  filters:[{k:'STATUS',label:'Status',options:['MENUNGGU','DISETUJUI','DITOLAK','BERANGKAT','KEMBALI','TERLAMBAT','SELESAI'].map(v=>({v,t:v}))},{k:'JENIS',label:'Jenis',options:['REGULER','KHUSUS','DARURAT'].map(v=>({v,t:v}))}],
  cols:[
    {h:'Anak & Keterangan',f:r=>`<div class="fw-semibold">${SRIT.Util.esc(SRIT.nm('ANAK',r.ANAK))}</div>${SRIT.anakKet(r.ANAK,{asrama:false,gedung:false})}`},
    {h:'Wali Asuh',f:r=>{const a=SRIT.Repo.getById('ANAK',r.ANAK)||{};return (SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-';}},
    {h:'Jenis',f:r=>`<span class="badge-soft st-IZIN">${r.JENIS}</span>`},
    {h:'Berangkat',f:r=>SRIT.Util.fmtDateShort(r.TANGGAL)+(r.JAM_BERANGKAT?'<div class="text-muted-2" style="font-size:11px"><i class="bi bi-clock"></i> '+r.JAM_BERANGKAT+'</div>':'')},
    {h:'Kembali',f:r=>SRIT.Util.fmtDateShort(r.KEMBALI)+(r.JAM_KEMBALI?'<div class="text-muted-2" style="font-size:11px"><i class="bi bi-clock"></i> '+r.JAM_KEMBALI+'</div>':'')},
    {h:'Tujuan',k:'TUJUAN'},{h:'Penjemput',f:r=>SRIT.Util.esc(r.PENJEMPUT||'-')+(r.HUBUNGAN?`<div class="text-muted-2" style="font-size:11px">(${SRIT.Util.esc(r.HUBUNGAN)})</div>`:'')},
    {h:'Status',f:r=>{const c={MENUNGGU:'st-SAKIT',DISETUJUI:'st-HADIR',DITOLAK:'st-ALPA',BERANGKAT:'st-IZIN',KEMBALI:'st-HADIR',TERLAMBAT:'st-ALPA',SELESAI:'st-BELUM'}[r.STATUS]||'st-BELUM';return `<span class="badge-soft ${c}">${r.STATUS}</span>`;}}
  ],
  rowActions:[
    {id:'cetak',label:'Cetak Surat Izin',icon:'bi-printer',cls:'btn-outline-dark',run:function(rec){SRIT.Features.izin.cetak(rec);}},
    {id:'setuju',perm:'izin:APPROVE',label:'Setujui',icon:'bi-check-lg',cls:'btn-outline-success',show:r=>r.STATUS==='MENUNGGU',run:_setStatus('IZIN','STATUS','DISETUJUI')},
    {id:'tolak',perm:'izin:APPROVE',label:'Tolak',icon:'bi-x-lg',cls:'btn-outline-danger',show:r=>r.STATUS==='MENUNGGU',run:_setStatus('IZIN','STATUS','DITOLAK')},
    {id:'berangkat',label:'Berangkat',icon:'bi-box-arrow-right',cls:'btn-outline-primary',show:r=>r.STATUS==='DISETUJUI',run:_setStatus('IZIN','STATUS','BERANGKAT')},
    {id:'kembali',label:'Konfirmasi Kembali',icon:'bi-box-arrow-in-left',cls:'btn-outline-info',show:r=>r.STATUS==='BERANGKAT'||r.STATUS==='TERLAMBAT',run:_setStatus('IZIN','STATUS','SELESAI')}
  ],
  onCreate:d=>{d.NAMA_ANAK=(SRIT.Repo.getById('ANAK',d.ANAK)||{}).NAMA||d.NAMA_ANAK||'';},
  fields:[{k:'ANAK',label:'Anak',type:'select',col:12,options:anakOpts},{k:'JENIS',label:'Jenis',type:'select',options:['REGULER','KHUSUS','DARURAT'].map(v=>({v,t:v}))},{k:'TANGGAL',label:'Tgl Berangkat',type:'date',default:SRIT.Util.todayISO()},{k:'KEMBALI',label:'Tgl Kembali',type:'date',default:SRIT.Util.todayISO()},{k:'TUJUAN',label:'Tujuan'},{k:'PENJEMPUT',label:'Penjemput'},{k:'ALASAN',label:'Alasan',type:'textarea',col:12},{k:'STATUS',label:'Status',type:'select',options:['MENUNGGU','DISETUJUI','DITOLAK','BERANGKAT','KEMBALI','TERLAMBAT','SELESAI'].map(v=>({v,t:v}))}]});

/* ===== Izin: form kustom (pencarian anak + filter berjenjang) & cetak surat izin iPOS 58 ===== */
SRIT.Features.izin.form=function(id){
  const rec=id?SRIT.Repo.getById('IZIN',id):{};
  const asrOpt=SRIT.Store.read('ASRAMA').map(a=>`<option value="${a.ID}">${SRIT.Util.esc(a.NAME)}</option>`).join('');
  const m=SRIT.Modal.open({title:(id?'Edit':'Tambah')+' Izin & Kepulangan',size:'modal-lg',
    body:`<form id="izForm"><div class="row g-2">
      <div class="col-12"><label class="form-label-sm">Cari & Pilih Anak</label>
        <div class="border rounded p-2" style="background:var(--srit-hover)">
          <div class="row g-2 mb-2">
            <div class="col-6 col-md-4"><select class="form-select form-select-sm" id="izfJenjang"><option value="">Semua Jenjang</option><option>SRD</option><option>SRMP</option><option>SRMA</option></select></div>
            <div class="col-6 col-md-4"><select class="form-select form-select-sm" id="izfAsrama"><option value="">Semua Asrama</option>${asrOpt}</select></div>
            <div class="col-12 col-md-4"><input class="form-control form-control-sm" id="izfSearch" placeholder="Cari nama / NIS / kelas..."></div>
          </div>
          <select class="form-select form-select-sm" id="izfList" size="6" style="font-size:12px"></select>
          <input type="hidden" name="ANAK" id="izfAnak" value="${rec.ANAK||''}">
          <div class="mt-1" id="izfPick" style="font-size:11px"></div>
        </div>
      </div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Jenis</label><select class="form-select form-select-sm" name="JENIS">${['REGULER','KHUSUS','DARURAT'].map(v=>`<option ${rec.JENIS===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Tgl Berangkat</label><input type="date" class="form-control form-control-sm" name="TANGGAL" value="${rec.TANGGAL||SRIT.Util.todayISO()}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Jam Berangkat</label><input type="time" class="form-control form-control-sm" name="JAM_BERANGKAT" value="${rec.JAM_BERANGKAT||''}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Tgl Kembali</label><input type="date" class="form-control form-control-sm" name="KEMBALI" value="${rec.KEMBALI||SRIT.Util.todayISO()}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Jam Kembali</label><input type="time" class="form-control form-control-sm" name="JAM_KEMBALI" value="${rec.JAM_KEMBALI||''}"></div>
      <div class="col-12 col-md-4"><label class="form-label-sm">Tujuan</label><input class="form-control form-control-sm" name="TUJUAN" value="${SRIT.Util.esc(rec.TUJUAN||'')}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Nama Penjemput</label><input class="form-control form-control-sm" name="PENJEMPUT" value="${SRIT.Util.esc(rec.PENJEMPUT||'')}"></div>
      <div class="col-6 col-md-4"><label class="form-label-sm">Hubungan dengan Siswa</label><select class="form-select form-select-sm" name="HUBUNGAN">${['','Ayah','Ibu','Kakek','Nenek','Kakak','Paman','Bibi','Wali','Lainnya'].map(v=>`<option value="${v}" ${rec.HUBUNGAN===v?'selected':''}>${v||'— pilih —'}</option>`).join('')}</select></div>
      <div class="col-12"><label class="form-label-sm">Alasan</label><textarea class="form-control form-control-sm" name="ALASAN" rows="2">${SRIT.Util.esc(rec.ALASAN||'')}</textarea></div>
      <div class="col-12"><label class="form-label-sm">Status</label><select class="form-select form-select-sm" name="STATUS">${['MENUNGGU','DISETUJUI','DITOLAK','BERANGKAT','KEMBALI','TERLAMBAT','SELESAI'].map(v=>`<option ${rec.STATUS===v?'selected':''}>${v}</option>`).join('')}</select></div>
    </div></form>`,
    footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="izSave">Simpan</button>`});
  const drawList=()=>{
    const jj=$('#izfJenjang',m.el).value,asr=$('#izfAsrama',m.el).value,q=$('#izfSearch',m.el).value.toLowerCase();
    let list=SRIT.Store.read('ANAK').filter(a=>a.STATUS==='AKTIF');
    if(jj)list=list.filter(a=>a.JENJANG===jj);
    if(asr)list=list.filter(a=>a.ASRAMA===asr);
    if(q)list=list.filter(a=>(a.NAMA+' '+a.NIS+' '+(a.KELAS||'')).toLowerCase().includes(q));
    list=list.slice(0,200);
    $('#izfList',m.el).innerHTML=list.map(a=>`<option value="${a.ID}" ${$('#izfAnak',m.el).value===a.ID?'selected':''}>${SRIT.Util.esc(a.NAMA)} · ${a.NIS} · ${a.JENJANG} ${a.KELAS||''} · ${(SRIT.Repo.getById('KAMAR',a.KAMAR)||{}).NAME||''}</option>`).join('')||'<option disabled>Tidak ada anak</option>';
  };
  const showPick=()=>{const id=$('#izfAnak',m.el).value;$('#izfPick',m.el).innerHTML=id?`<span class="badge-soft st-HADIR">Terpilih: ${SRIT.Util.esc(SRIT.nm('ANAK',id))}</span>`:'<span class="text-muted-2">Belum ada anak dipilih</span>';};
  ['izfJenjang','izfAsrama'].forEach(f=>$('#'+f,m.el).onchange=drawList);
  $('#izfSearch',m.el).oninput=drawList;
  $('#izfList',m.el).onchange=e=>{$('#izfAnak',m.el).value=e.target.value;showPick();};
  drawList();showPick();
  $('#izSave',m.el).onclick=()=>{
    const f=$('#izForm',m.el);const d=Object.fromEntries(new FormData(f));
    if(!d.ANAK){SRIT.Notify('Pilih anak terlebih dahulu','warn');return;}
    d.NAMA_ANAK=(SRIT.Repo.getById('ANAK',d.ANAK)||{}).NAMA||'';
    if(id){SRIT.Repo.update('IZIN',id,d);SRIT.Audit.log('UPDATE','izin',id);}
    else{d.ID=SRIT.Util.uid('IZ');SRIT.Repo.insert('IZIN',d);SRIT.Audit.log('CREATE','izin',d.ID);}
    SRIT.Cache.invalidate('dash');SRIT.Cache.invalidate('livetv');
    m.close();SRIT.Notify('Izin tersimpan','ok');SRIT.Features.izin.load();
  };
};
// Cetak surat izin — dioptimalkan untuk printer thermal iPOS 58 (lebar kertas 58mm ≈ 48mm area cetak)
SRIT.Features.izin.cetak=function(rec){
  const a=SRIT.Repo.getById('ANAK',rec.ANAK)||{};
  const set=SRIT.Store.readObj('SETTINGS');
  const kmr=(SRIT.Repo.getById('KAMAR',a.KAMAR)||{}).NAME||'-';
  const wa=(SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-';
  const noSurat=(rec.ID||'').toUpperCase();
  const petugas=(SRIT.Auth.user||{}).NAME||'-';
  const row=(l,v)=>`<tr><td style="vertical-align:top">${l}</td><td style="vertical-align:top">:</td><td style="vertical-align:top">${SRIT.Util.esc(v)}</td></tr>`;
  const html=`<html><head><title>Surat Izin ${noSurat}</title><meta charset="utf-8">
    <style>
      @page{size:58mm auto;margin:0}
      *{box-sizing:border-box}
      body{width:58mm;margin:0;padding:3mm;font-family:'Courier New',monospace;color:#000;font-size:11px;line-height:1.35}
      .c{text-align:center}.b{font-weight:bold}
      .line{border-top:1px dashed #000;margin:4px 0}
      table{width:100%;border-collapse:collapse;font-size:11px}
      td{padding:1px 2px}
      h1{font-size:13px;margin:2px 0}
      .sign{margin-top:14px;font-size:11px}
      .box{border:1px solid #000;padding:3px;text-align:center;margin-top:6px;font-weight:bold}
    </style></head><body>
    <div class="c b" style="font-size:12px">${SRIT.Util.esc(set.SCHOOL_NAME||'SEKOLAH RAKYAT')}</div>
    <div class="c" style="font-size:10px">${SRIT.Util.esc(set.SCHOOL_TAGLINE||'')}</div>
    <div class="line"></div>
    <h1 class="c b">SURAT IZIN KELUAR / PULANG</h1>
    <div class="c" style="font-size:10px">No: ${SRIT.Util.esc(noSurat)}</div>
    <div class="line"></div>
    <table>
      ${row('Nama',a.NAMA||rec.NAMA_ANAK||'-')}
      ${row('NIS',a.NIS||'-')}
      ${row('Jenjang',(a.JENJANG||'-')+' '+(a.KELAS||''))}
      ${row('Kamar',kmr)}
      ${row('Wali Asuh',wa)}
    </table>
    <div class="line"></div>
    <table>
      ${row('Jenis',rec.JENIS||'-')}
      ${row('Berangkat',SRIT.Util.fmtDateShort(rec.TANGGAL)+(rec.JAM_BERANGKAT?' '+rec.JAM_BERANGKAT:''))}
      ${row('Kembali',SRIT.Util.fmtDateShort(rec.KEMBALI)+(rec.JAM_KEMBALI?' '+rec.JAM_KEMBALI:''))}
      ${row('Tujuan',rec.TUJUAN||'-')}
      ${row('Penjemput',(rec.PENJEMPUT||'-')+(rec.HUBUNGAN?' ('+rec.HUBUNGAN+')':''))}
      ${row('Alasan',rec.ALASAN||'-')}
    </table>
    <div class="box">STATUS: ${SRIT.Util.esc(rec.STATUS||'-')}</div>
    <div class="line"></div>
    <div style="font-size:10px">Dicetak: ${new Date().toLocaleString('id-ID')}</div>
    <div class="sign">
      <table style="width:100%">
        <tr>
          <td class="c" style="width:50%">Wali Asuh<br><br><br>(${SRIT.Util.esc(wa)})</td>
          <td class="c" style="width:50%">Penjemput<br><br><br>(${SRIT.Util.esc(rec.PENJEMPUT||'________')})${rec.HUBUNGAN?'<br><span style="font-size:9px">'+SRIT.Util.esc(rec.HUBUNGAN)+'</span>':''}</td>
        </tr>
        <tr>
          <td class="c" colspan="2" style="padding-top:8px">Mengetahui,<br>Wali Asrama<br><br><br>(________________)</td>
        </tr>
      </table>
    </div>
    <div class="c" style="margin-top:8px;font-size:10px">-- Terima kasih --</div>
    <div style="height:10mm"></div>
  </body></html>`;
  const w=window.open('','_blank','width=380,height=600');
  if(!w){SRIT.Notify('Popup diblokir, izinkan popup untuk mencetak','err');return;}
  w.document.write(html);w.document.close();w.focus();
  setTimeout(()=>{w.print();},400);
  SRIT.Audit.log('PRINT','izin',rec.ID);
};
</script>

        <div><label class="form-label-sm">Status</label><select class="form-select form-select-sm" id="phStatus"><option value="">Semua</option>${['AKTIF','IZIN','PULANG','SAKIT','PINDAH','NONAKTIF','LULUS'].map(s=>`<option ${this.state.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div><div id="phActiveChips"></div></div>
      <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="phTable"></table></div><div class="p-3 border-top" id="phPag"></div></div>`;
    $('#phSearch').oninput=e=>{
      $('#phSearchClear').style.display=e.target.value?'flex':'none';
      clearTimeout(this._searchT);
      this._searchT=setTimeout(()=>{this.state.search=e.target.value;this.state.page=1;this.load();},350);
    };
    $('#phSearchClear').onclick=()=>{$('#phSearch').value='';$('#phSearchClear').style.display='none';this.state.search='';this.state.page=1;this.load();};
    $('#phAsrama').onchange=e=>{this.state.asrama=e.target.value;this.state.page=1;this.load();};
    $('#phStatus').onchange=e=>{this.state.status=e.target.value;this.state.page=1;this.load();};
    this.load();
  },
  renderChips(){
    const box=$('#phActiveChips');if(!box)return;
    const asr=SRIT.Store.read('ASRAMA');
    const chips=[];
    if(this.state.search)chips.push({label:'Cari: "'+this.state.search+'"',clear:()=>{this.state.search='';$('#phSearch').value='';$('#phSearchClear').style.display='none';}});
    if(this.state.asrama)chips.push({label:'Asrama: '+((asr.find(a=>a.ID===this.state.asrama)||{}).NAME||this.state.asrama),clear:()=>{this.state.asrama='';$('#phAsrama').value='';}});
    if(this.state.status)chips.push({label:'Status: '+this.state.status,clear:()=>{this.state.status='';$('#phStatus').value='';}});
    if(!chips.length){box.innerHTML='';return;}
    box.innerHTML=`<div class="d-flex align-items-center gap-2 flex-wrap mt-2">
      <span class="text-muted-2" style="font-size:11px">Filter aktif:</span>
      ${chips.map((c,i)=>`<span class="sf-chip" data-chip="${i}">${SRIT.Util.esc(c.label)} <i class="bi bi-x"></i></span>`).join('')}
      ${chips.length>1?'<span class="text-muted-2 pointer" id="phClearAll" style="font-size:11px;text-decoration:underline">Hapus semua filter</span>':''}
    </div>`;
    box.querySelectorAll('[data-chip]').forEach((el,i)=>{el.onclick=()=>{chips[i].clear();this.state.page=1;this.load();};});
    const ca=$('#phClearAll');if(ca)ca.onclick=()=>{
      this.state.search='';this.state.asrama='';this.state.status='';
      $('#phSearch').value='';$('#phSearchClear').style.display='none';$('#phAsrama').value='';$('#phStatus').value='';
      this.state.page=1;this.load();
    };
  },
  load(){
    const anak=SRIT.Store.read('ANAK');
    const cap=SRIT.Store.read('TEMPAT_TIDUR').length;
    const terisi=SRIT.Store.read('TEMPAT_TIDUR').filter(b=>b.STATUS==='TERISI').length;
    const kpi=(v,l,c)=>`<div class="col-6 col-lg-3"><div class="kpi"><div class="kpi-lbl">${l}</div><div class="kpi-val">${v}</div><div class="trend text-muted-2">${c||''}</div></div></div>`;
    $('#phKpi').innerHTML=kpi(anak.filter(a=>a.STATUS==='AKTIF').length,'Penghuni Aktif')+kpi(cap,'Kapasitas Bed')+kpi(terisi,'Bed Terisi',SRIT.Util.pct(terisi,cap)+'% okupansi')+kpi(cap-terisi,'Bed Tersedia');
    const r=SRIT.Api.list('ANAK',{page:this.state.page,size:this.state.size,search:this.state.search,searchFields:['NAMA','NIS'],filters:{ASRAMA:this.state.asrama,STATUS:this.state.status}});
    $('#phTable').innerHTML=`<thead><tr><th>NIS</th><th>Nama</th><th>Jenjang</th><th>Kamar</th><th>Tempat Tidur</th><th>Wali Asuh</th><th>Status</th><th></th></tr></thead><tbody>
    ${r.rows.length?r.rows.map(a=>`<tr><td>${a.NIS}</td><td class="fw-semibold">${SRIT.Util.esc(a.NAMA)}</td><td><span class="badge-soft st-IZIN">${a.JENJANG}</span></td>
      <td>${(SRIT.Repo.getById('KAMAR',a.KAMAR)||{}).NAME||'-'}</td>
      <td>${(SRIT.Repo.getById('TEMPAT_TIDUR',a.TEMPAT_TIDUR)||{}).KODE||'<span class="text-muted-2">belum</span>'}</td>
      <td>${(SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-'}</td>
      <td><span class="badge-soft ${a.STATUS==='AKTIF'?'st-HADIR':'st-BELUM'}">${a.STATUS}</span></td>
      <td class="text-end">${SRIT.Auth.can('penghuni:UPDATE')?`<button class="btn btn-sm btn-outline-primary py-0" onclick="SRIT.Features.penghuni.place('${a.ID}')"><i class="bi bi-door-open"></i> Tempatkan</button>`:''}</td>
    </tr>`).join(''):'<tr><td colspan="8"><div class="empty-state"><i class="bi bi-people d-block"></i>Tidak ada penghuni</div></td></tr>'}
    </tbody>`;
    $('#phPag').innerHTML=SRIT.UI.pagination(r);
    $$('#phPag [data-pg]').forEach(a=>a.onclick=()=>{this.state.page=+a.dataset.pg;this.load();});
    this.renderChips();
  },
  place(id){
    const a=SRIT.Repo.getById('ANAK',id);
    const kamar=SRIT.Store.read('KAMAR');
    const m=SRIT.Modal.open({title:'Penempatan: '+a.NAMA,
      body:`<form id="phForm"><div class="row g-2">
        <div class="col-12"><label class="form-label-sm">Kamar</label><select class="form-select form-select-sm" name="KAMAR" id="phKamar">${kamar.map(k=>`<option value="${k.ID}" ${a.KAMAR===k.ID?'selected':''}>${k.NAME} (${SRIT.Store.read('ANAK').filter(x=>x.KAMAR===k.ID&&x.STATUS==='AKTIF').length}/${k.KAPASITAS||8})</option>`).join('')}</select></div>
        <div class="col-12"><label class="form-label-sm">Tempat Tidur</label><select class="form-select form-select-sm" name="TEMPAT_TIDUR" id="phBed"></select></div>
        <div class="col-6"><label class="form-label-sm">Wali Asuh</label><select class="form-select form-select-sm" name="WALI_ASUH">${SRIT.Store.read('WALI_ASUH').map(w=>`<option value="${w.ID}" ${a.WALI_ASUH===w.ID?'selected':''}>${w.NAME}</option>`).join('')}</select></div>
        <div class="col-6"><label class="form-label-sm">Kelompok Asuh</label><select class="form-select form-select-sm" name="KELOMPOK">${SRIT.Store.read('KELOMPOK_ASUH').map(k=>`<option value="${k.ID}" ${a.KELOMPOK===k.ID?'selected':''}>${k.NAME}</option>`).join('')}</select></div>
      </div></form>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="phSave">Simpan Penempatan</button>`});
    const fillBeds=()=>{const km=$('#phKamar',m.el).value;const beds=SRIT.Store.read('TEMPAT_TIDUR').filter(b=>b.KAMAR===km&&(b.STATUS!=='TERISI'||b.ANAK_ID===id));
      $('#phBed',m.el).innerHTML='<option value="">— Pilih —</option>'+beds.map(b=>`<option value="${b.ID}" ${a.TEMPAT_TIDUR===b.ID?'selected':''}>${b.KODE} (${b.POSISI})</option>`).join('');};
    $('#phKamar',m.el).onchange=fillBeds;fillBeds();
    $('#phSave',m.el).onclick=()=>{
      const d=Object.fromEntries(new FormData($('#phForm',m.el)));
      // free old bed
      if(a.TEMPAT_TIDUR&&a.TEMPAT_TIDUR!==d.TEMPAT_TIDUR){SRIT.Repo.update('TEMPAT_TIDUR',a.TEMPAT_TIDUR,{STATUS:'KOSONG',ANAK_ID:''});}
      if(d.TEMPAT_TIDUR){SRIT.Repo.update('TEMPAT_TIDUR',d.TEMPAT_TIDUR,{STATUS:'TERISI',ANAK_ID:id});}
      const km=SRIT.Repo.getById('KAMAR',d.KAMAR)||{};
      SRIT.Repo.update('ANAK',id,{KAMAR:d.KAMAR,GEDUNG:km.GEDUNG,LANTAI:km.LANTAI,TEMPAT_TIDUR:d.TEMPAT_TIDUR,WALI_ASUH:d.WALI_ASUH,KELOMPOK:d.KELOMPOK});
      // placement history
      SRIT.Repo.insert('PLACEMENT_HISTORY',{ID:SRIT.Util.uid('PH'),ANAK_ID:id,KAMAR:d.KAMAR,TEMPAT_TIDUR:d.TEMPAT_TIDUR,TANGGAL:new Date().toISOString(),BY:SRIT.Auth.user.ID});
      SRIT.Audit.log('MOVE','penghuni',id);SRIT.Cache.invalidate('dash');
      m.close();SRIT.Notify('Penempatan tersimpan','ok');this.load();
    };
  },
  destroy(){}
};
</script>

<script>
//# sourceURL=View_Penilaian.html
// ---------- PENILAIAN + RAPOR ----------
SRIT.Features.penilaian={
  aspects:['KARAKTER','DISIPLIN','KEMANDIRIAN','KEBERSIHAN','KEAGAMAAN','LEADERSHIP','SOSIAL','KEBAHASAAN'],

      ${SRIT.Auth.can('penilaian:CREATE')?'<div><button class="btn btn-primary btn-sm" id="pnAdd"><i class="bi bi-plus-lg"></i> Nilai Anak</button></div>':''}
    </div></div>
    <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="pnTable"></table></div><div class="p-3 border-top" id="pnPag"></div></div>`;
    $('#pnSearch').oninput=e=>{
      $('#pnSearchClear').style.display=e.target.value?'flex':'none';

  load(){
    const r=SRIT.Api.list('PENILAIAN',{page:this.state.page,size:this.state.size,search:this.state.search,searchFields:['NAMA_ANAK']});
    $('#pnTable').innerHTML=`<thead><tr><th>Anak</th><th>Periode</th>${this.aspects.map(a=>`<th title="${a}">${a.slice(0,4)}</th>`).join('')}<th>Rata</th><th></th></tr></thead><tbody>
    ${r.rows.length?r.rows.map(p=>{const vals=this.aspects.map(a=>+p[a]||0);const avg=(vals.reduce((x,y)=>x+y,0)/this.aspects.length).toFixed(1);return `<tr>
      <td class="fw-semibold">${SRIT.Util.esc(SRIT.nm('ANAK',p.ANAK))}</td><td><span class="badge-soft st-IZIN">${p.PERIODE||'-'}</span></td>
      ${this.aspects.map(a=>`<td><span class="badge-soft ${+p[a]>=4?'st-HADIR':+p[a]>=3?'st-IZIN':+p[a]>=2?'st-SAKIT':'st-ALPA'}">${p[a]||'-'}</span></td>`).join('')}
      <td class="fw-bold">${avg}</td>
      <td class="text-end"><button class="btn btn-sm btn-outline-primary py-0" onclick="SRIT.Features.penilaian.rapor('${p.ID}')"><i class="bi bi-file-earmark-text"></i> Rapor</button>
      ${SRIT.Auth.can('penilaian:UPDATE')?`<button class="btn btn-sm btn-outline-secondary py-0 ms-1" onclick="SRIT.Features.penilaian.form('${p.ID}')"><i class="bi bi-pencil"></i></button>`:''}</td>
    </tr>`;}).join(''):'<tr><td colspan="12"><div class="empty-state"><i class="bi bi-clipboard-check d-block"></i>Belum ada penilaian</div></td></tr>'}
    </tbody>`;
    $('#pnPag').innerHTML=SRIT.UI.pagination(r);
    $$('#pnPag [data-pg]').forEach(a=>a.onclick=()=>{this.state.page=+a.dataset.pg;this.load();});
  },
  form(id){
    const p=id?SRIT.Repo.getById('PENILAIAN',id):{};
    const rubrik=SRIT.Store.readObj('RUBRIK');
    const m=SRIT.Modal.open({title:(id?'Edit':'Input')+' Penilaian',size:'modal-lg',
      body:`<form id="pnForm"><div class="row g-2">
        <div class="col-8"><label class="form-label-sm">Anak</label><select class="form-select form-select-sm" name="ANAK" ${id?'disabled':''}>${anakOpts().map(o=>`<option value="${o.v}" ${p.ANAK===o.v?'selected':''}>${o.t}</option>`).join('')}</select></div>
        <div class="col-4"><label class="form-label-sm">Periode</label><input class="form-control form-control-sm" name="PERIODE" value="${p.PERIODE||'2026-Ganjil'}"></div>
        ${this.aspects.map(a=>`<div class="col-6 col-md-3"><label class="form-label-sm">${a}</label><select class="form-select form-select-sm" name="${a}">${[1,2,3,4].map(n=>`<option value="${n}" ${String(p[a])===String(n)?'selected':''}>${n} - ${rubrik[n]}</option>`).join('')}</select></div>`).join('')}
        <div class="col-12"><label class="form-label-sm">Penilai</label><input class="form-control form-control-sm" name="PENILAI" value="${p.PENILAI||(SRIT.Auth.user||{}).NAME||''}"></div>
      </div></form>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="pnSave">Simpan</button>`});
    $('#pnSave',m.el).onclick=()=>{
      const d=Object.fromEntries(new FormData($('#pnForm',m.el)));
      d.NAMA_ANAK=(SRIT.Repo.getById('ANAK',d.ANAK||p.ANAK)||{}).NAMA||p.NAMA_ANAK;d.TANGGAL=SRIT.Util.todayISO();
      if(id){SRIT.Repo.update('PENILAIAN',id,d);SRIT.Audit.log('UPDATE','penilaian',id);}
      else{d.ID=SRIT.Util.uid('PN');SRIT.Repo.insert('PENILAIAN',d);SRIT.Audit.log('CREATE','penilaian',d.ID);}
      m.close();SRIT.Notify('Penilaian tersimpan','ok');this.load();
    };
  },
  rapor(id){
    const p=SRIT.Repo.getById('PENILAIAN',id);const anak=SRIT.Repo.getById('ANAK',p.ANAK)||{};
    const rubrik=SRIT.Store.readObj('RUBRIK');const set=SRIT.Store.readObj('SETTINGS');
    const rows=this.aspects.map(a=>`<tr><td>${a}</td><td class="text-center">${p[a]||'-'}</td><td>${rubrik[p[a]]||'-'}</td></tr>`).join('');
    const vals=this.aspects.map(a=>+p[a]||0);const avg=(vals.reduce((x,y)=>x+y,0)/this.aspects.length).toFixed(2);
    const html=`<div id="raporPrint" style="font-family:Segoe UI,sans-serif;color:#111">
      <div style="text-align:center;border-bottom:3px double #333;padding-bottom:10px;margin-bottom:16px">
        <h4 style="margin:0">RAPOR PERKEMBANGAN ASRAMA</h4><div>${SRIT.Util.esc(set.SCHOOL_NAME||'')}</div>
        <small>Periode: ${p.PERIODE||'-'}</small>
      </div>
      <table style="width:100%;font-size:13px;margin-bottom:14px"><tr><td>Nama</td><td>: <b>${SRIT.Util.esc(anak.NAMA||p.NAMA_ANAK)}</b></td><td>NIS</td><td>: ${anak.NIS||'-'}</td></tr>
      <tr><td>Jenjang</td><td>: ${anak.JENJANG||'-'}</td><td>Kamar</td><td>: ${(SRIT.Repo.getById('KAMAR',anak.KAMAR)||{}).NAME||'-'}</td></tr>
      <tr><td>Wali Asuh</td><td>: ${(SRIT.Repo.getById('WALI_ASUH',anak.WALI_ASUH)||{}).NAME||'-'}</td><td>Penilai</td><td>: ${p.PENILAI||'-'}</td></tr></table>
      <table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:13px">
        <thead style="background:#eef2f8"><tr><th align="left">Aspek Perkembangan</th><th>Nilai</th><th align="left">Predikat</th></tr></thead>
        <tbody>${rows}<tr style="font-weight:bold;background:#f7f9fc"><td>RATA-RATA</td><td class="text-center" align="center">${avg}</td><td>${avg>=3.5?'Sangat Baik':avg>=2.5?'Berkembang':avg>=1.5?'Mulai Berkembang':'Belum Berkembang'}</td></tr></tbody>
      </table>
      <div style="margin-top:14px;font-size:13px"><b>Rubrik:</b> 1=Belum Berkembang, 2=Mulai Berkembang, 3=Berkembang, 4=Sangat Baik</div>
      <div style="display:flex;justify-content:space-between;margin-top:40px;font-size:13px;text-align:center">
        <div>Wali Asuh<br><br><br>(________________)</div><div>Wali Asrama<br><br><br>(________________)</div><div>Kepala Sekolah<br><br><br>(________________)</div>
      </div></div>`;
    const m=SRIT.Modal.open({title:'Rapor Asrama',size:'modal-lg',body:html,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Tutup</button><button class="btn btn-primary btn-sm" id="raporPrintBtn"><i class="bi bi-printer"></i> Cetak / PDF</button>`});
    $('#raporPrintBtn',m.el).onclick=()=>{const w=window.open('','_blank');w.document.write('<html><head><title>Rapor Asrama</title></head><body>'+$('#raporPrint',m.el).outerHTML+'</body></html>');w.document.close();w.focus();w.print();SRIT.Audit.log('PRINT','rapor',id);};
  },
  destroy(){}
};
</script>

<script>__srit.n('View_Profiling')</script>
<script>
//# sourceURL=View_Profiling.html
// ---------- PROFILING SISWA ----------
// Perkembangan & seluruh catatan satu anak per Bulan / Tribulan / Semester / Tahun Ajaran (TA = Juli–Juni).
// Absensi: server (apiProfilAbsen, 1 panggilan per anak per TA, dicache di browser). Layanan lain: cermin tabel (SRIT.Store).
SRIT.Features.profiling=(function(){
const U=SRIT.Util,esc=U.esc;
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BLN_L=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const ASPEK=['KARAKTER','DISIPLIN','KEMANDIRIAN','KEBERSIHAN','KEAGAMAAN','LEADERSHIP','SOSIAL','KEBAHASAAN'];
const ASPEK_L={KARAKTER:'Karakter',DISIPLIN:'Disiplin',KEMANDIRIAN:'Kemandirian',KEBERSIHAN:'Kebersihan',KEAGAMAAN:'Keagamaan',LEADERSHIP:'Kepemimpinan',SOSIAL:'Sosial',KEBAHASAAN:'Kebahasaan'};
const COL={H:'#16a34a',I:'#0ea5e9',S:'#f59e0b',A:'#ef4444'},TEAL='#00b8a9';
const TRIB=['I','II','III','IV'];
const KAT={AKADEMIK:'Akademik',KARAKTER:'Karakter & Sikap',SOSIAL:'Sosial & Relasi',KEAGAMAAN:'Keagamaan',KEMANDIRIAN:'Kemandirian',KESEHATAN:'Kesehatan',PRESTASI:'Prestasi & Capaian',KELUARGA:'Keluarga & Pengasuhan',LAINNYA:'Lainnya'};
const KAT_C={PRESTASI:'#16a34a',KESEHATAN:'#0ea5e9',KARAKTER:'#8b5cf6',AKADEMIK:'#2a78d6',SOSIAL:'#14b8a6',KEAGAMAAN:'#a16207',KEMANDIRIAN:'#f59e0b',KELUARGA:'#ec4899',LAINNYA:'#64748b'};
const pad=n=>String(n).padStart(2,'0');
const taStart=iso=>{const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=7?y:y-1;};
const monthsOfTA=s=>{const o=[];for(let i=0;i<12;i++){const m=7+i;o.push((m>12?s+1:s)+'-'+pad(m>12?m-12:m));}return o;};
const monthEnd=ym=>{const a=ym.split('-').map(Number);return ym+'-'+pad(new Date(a[0],a[1],0).getDate());};
const ymLabel=ym=>BLN[+ym.slice(5,7)-1]+' '+ym.slice(2,4);
const rd=t=>{try{return SRIT.Store.read(t)||[];}catch(e){return [];}};
const nmOf=(t,id,f)=>{if(!id)return '';const r=SRIT.Repo.getById(t,id);return r?(r[f||'NAME']||''):'';};
const r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ---------- periode ---------- */
function mk(kind,s,idx0,idx1){
  const ms=monthsOfTA(s),mon=ms.slice(idx0,idx1+1);let label,sem='';
  if(kind==='bulan')label=BLN_L[+mon[0].slice(5,7)-1]+' '+mon[0].slice(0,4);
  else if(kind==='tribulan')label='Tribulan '+TRIB[idx0/3]+' ('+BLN[+mon[0].slice(5,7)-1]+'–'+BLN[+mon[2].slice(5,7)-1]+' '+mon[2].slice(0,4)+')';
  else if(kind==='semester'){sem=idx0===0?'ganjil':'genap';label='Semester '+(sem==='ganjil'?'Ganjil':'Genap')+' '+s+'/'+(s+1);}
  else label='Tahun Ajaran '+s+'/'+(s+1);
  return {kind,start:s,sem,label,idx0,idx1,months:mon,from:mon[0]+'-01',to:monthEnd(mon[mon.length-1])};
}
function periodOf(st){
  const s=+st.ta,sub=+st.sub;let idx0=0,idx1=11;
  if(st.mode==='bulan'){idx0=idx1=Math.max(0,Math.min(11,sub));}
  else if(st.mode==='tribulan'){idx0=Math.max(0,Math.min(3,sub))*3;idx1=idx0+2;}
  else if(st.mode==='semester'){idx0=sub?6:0;idx1=idx0+5;}
  const P=mk(st.mode,s,idx0,idx1),len=idx1-idx0+1;
  P.prev=(st.mode!=='ta'&&idx0-len>=0)?mk(st.mode,s,idx0-len,idx1-len):null;
  return P;
}
const inR=(P,iso)=>!!iso&&iso>=P.from&&iso<=P.to;
function penMatch(r,P){
  if(P.kind==='semester'||P.kind==='ta'){
    const m=/(\d{4}).*?(ganjil|genap)/i.exec(r.PERIODE||'');

  const inTA=r=>inR(TA,r.TANGGAL);

      mine('OPS_KOMUNIKASI').filter(inTA).map(r=>({t:'Komunikasi',d:r.TANGGAL,x:(r.KANAL||'-')+': '+(r.ISI||'')})),
      mine('OPS_KEPULANGAN').filter(inTA).map(r=>({t:'Kepulangan',d:r.TANGGAL,x:(r.TUJUAN||'-')+' · dijemput '+(r.PENJEMPUT||'-')+' ('+(r.STATUS||'-')+')'})),
      mine('OPS_KUNJUNGAN').filter(inTA).map(r=>({t:'Kunjungan',d:r.TANGGAL,x:(r.PENGUNJUNG||'-')+' ('+(r.HUBUNGAN||'-')+') '+(r.JAM||'')}))

}
function attSum(hari,P){let h=0,i=0,s=0,a=0,days=0;Object.keys(hari).forEach(d=>{if(d>=P.from&&d<=P.to){const x=hari[d];h+=x[0];i+=x[1];s+=x[2];a+=x[3];days++;}});const t=h+i+s+a;return {h,i,s,a,t,days,pct:t?r1(h/t*100):null};}
function izinDays(r){if(!r.TANGGAL)return 0;const e=r.KEMBALI&&r.KEMBALI>=r.TANGGAL?r.KEMBALI:r.TANGGAL;return Math.round((new Date(e.slice(0,10)+'T00:00:00')-new Date(r.TANGGAL.slice(0,10)+'T00:00:00'))/864e5)+1;}
function stats(D,P,full){
  const att=attSum(D.hari,P),pel=D.pel.filter(r=>inR(P,r.TANGGAL)),pbn=D.pbn.filter(r=>inR(P,r.TANGGAL)),izn=D.izn.filter(r=>inR(P,r.TANGGAL));
  const pen=D.pen.filter(r=>penMatch(r,P)),tamu=D.tamu.filter(r=>inR(P,r.TANGGAL)),ops=D.ops.filter(r=>inR(P,r.d)),cat=D.cat.filter(r=>inR(P,r.TANGGAL)),insp=D.kamarSkor.filter(r=>inR(P,r.TANGGAL));
  const asp={};ASPEK.forEach(a=>{const v=pen.map(r=>+r[a]).filter(x=>x>0);asp[a]=v.length?r2(avg(v)):null;});
  const av=ASPEK.map(a=>asp[a]).filter(x=>x!=null),tk={RINGAN:0,SEDANG:0,BERAT:0};pel.forEach(r=>{tk[r.TINGKAT]=(tk[r.TINGKAT]||0)+1;});
  const S={P,att,pel,pbn,izn,pen,tamu,ops,cat,insp,asp,nilai:av.length?r2(avg(av)):null,tk,izinHari:izn.reduce((s,r)=>s+(['DITOLAK','MENUNGGU'].includes(r.STATUS)?0:izinDays(r)),0),
    terlambat:izn.filter(r=>r.STATUS==='TERLAMBAT').length,pbnAktif:pbn.filter(r=>r.STATUS!=='SELESAI').length};

}
function bench(D,P){

  const rows=rd('PENILAIAN').filter(r=>ids[r.ANAK]&&penMatch(r,P)),o={};

function kategori(S){

function insights(D,S,B,sens){

    const bm=ASPEK.map(x=>B[x]).filter(x=>x!=null);if(bm.length){const bv=r2(avg(bm));add(S.nilai>=bv?'ok':'mut','bi-people','Rata-rata jenjang '+D.anak.JENJANG+' pada periode ini: '+bv+'.');}

  return o;
}

  _rekom(S,sens){

<script>
//# sourceURL=View_Peta.html
// ---------- PETA DIGITAL ASRAMA ----------
SRIT.Features.peta={
  open:{}, // status buka/tutup per gedung
  render(host){SRIT.UI.setPage('Peta Digital Asrama','Peta Asrama');this._host=host;this.draw();},
  draw(){
    const host=this._host;
    const kamar=SRIT.Store.read('KAMAR');const anak=SRIT.Store.read('ANAK');const beds=SRIT.Store.read('TEMPAT_TIDUR');
    const gedung=SRIT.Store.read('GEDUNG');
    host.innerHTML=`
      <div class="card-srit p-2 px-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div style="font-size:13px"><i class="bi bi-diagram-3 text-primary me-1"></i> Klik nama gedung untuk membuka/menutup detail kamar</div>
        <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" id="petaExpand"><i class="bi bi-arrows-expand"></i> Buka Semua</button>
          <button class="btn btn-outline-secondary btn-sm" id="petaCollapse"><i class="bi bi-arrows-collapse"></i> Tutup Semua</button></div>
      </div>
      ${gedung.map(g=>{
        const rooms=kamar.filter(k=>k.GEDUNG===g.ID);
        const gAnak=anak.filter(a=>a.GEDUNG===g.ID&&a.STATUS==='AKTIF').length;
        const gCap=rooms.reduce((s,k)=>s+(+k.KAPASITAS||8),0);
        const gRate=SRIT.Util.pct(gAnak,gCap);
        const opened=!!this.open[g.ID];
        return `<div class="card-srit mb-2" data-ged="${g.ID}">
          <div class="d-flex justify-content-between align-items-center p-3 pointer peta-head" data-ged="${g.ID}" style="gap:10px">
            <div class="d-flex align-items-center gap-2" style="min-width:0">
              <i class="bi bi-chevron-${opened?'down':'right'} peta-chev"></i>
              <i class="bi bi-building text-primary"></i>
              <div style="min-width:0"><b class="text-truncate d-block">${SRIT.Util.esc(g.NAME)}</b>
                <span class="text-muted-2" style="font-size:11px">${(SRIT.Repo.getById('ASRAMA',g.ASRAMA)||{}).NAME||''} · ${rooms.length} kamar</span></div>
            </div>
            <div class="d-flex align-items-center gap-2" style="flex-shrink:0">
              <div class="ltv-progress d-none d-md-block" style="width:100px;background:var(--srit-hover)"><span style="width:${gRate}%;background:${gRate>=90?'var(--srit-danger)':gRate>=75?'var(--srit-warning)':'var(--srit-success)'}"></span></div>
              <span class="badge-soft ${gRate>=90?'st-ALPA':gRate>=75?'st-SAKIT':'st-HADIR'}">${gAnak}/${gCap}</span>
            </div>
          </div>
          <div class="peta-body px-3 pb-3" data-ged="${g.ID}" style="display:${opened?'block':'none'}">
            <div class="row g-2 g-md-3">${rooms.map(k=>{
              const cap=k.KAPASITAS||8;const occ=anak.filter(a=>a.KAMAR===k.ID&&a.STATUS==='AKTIF').length;
              const rate=SRIT.Util.pct(occ,cap);
              const stt=occ>=cap?'PENUH':rate>=80?'HAMPIR PENUH':'NORMAL';
              const col=stt==='PENUH'?'var(--srit-danger)':stt==='HAMPIR PENUH'?'var(--srit-warning)':'var(--srit-success)';
              const roomBeds=beds.filter(b=>b.KAMAR===k.ID);
              return `<div class="col-6 col-md-4 col-lg-3"><div class="card-srit p-3 h-100" style="background:var(--srit-hover)">
                <div class="d-flex justify-content-between align-items-start mb-1"><b style="font-size:13px">${k.NAME}</b><span class="badge-soft" style="background:${col}22;color:${col};font-size:10px">${stt}</span></div>
                <div class="text-muted-2" style="font-size:11px">${k.KODE||''}<br>Wali: ${(SRIT.Repo.getById('WALI_ASUH',k.WALI_ASUH)||{}).NAME||'-'}</div>
                <div class="my-2"><div class="d-flex justify-content-between small"><span>Okupansi</span><b>${occ}/${cap}</b></div>
                <div class="ltv-progress" style="background:var(--srit-surface)"><span style="width:${rate}%;background:${col}"></span></div></div>
                <div class="d-flex flex-wrap gap-1">${roomBeds.map(b=>`<span title="${b.KODE} ${b.STATUS==='TERISI'?'· '+((SRIT.Repo.getById('ANAK',b.ANAK_ID)||{}).NAMA||''):''}" style="width:15px;height:15px;border-radius:4px;display:inline-block;background:${b.STATUS==='TERISI'?'var(--srit-primary)':b.STATUS==='RUSAK'?'var(--srit-danger)':'var(--srit-border)'}"></span>`).join('')}</div>
              </div></div>`;
            }).join('')}</div>
          </div>
        </div>`;
      }).join('')}`;
    // events
    $$('.peta-head',host).forEach(h=>h.onclick=()=>{const id=h.dataset.ged;this.open[id]=!this.open[id];this.draw();});
    $('#petaExpand',host).onclick=()=>{SRIT.Store.read('GEDUNG').forEach(g=>this.open[g.ID]=true);this.draw();};
    $('#petaCollapse',host).onclick=()=>{this.open={};this.draw();};
  },
  destroy(){}
};
</script>

<script>
//# sourceURL=View_Alert.html
// ---------- ALERT CENTER ----------
SRIT.Features['alert-center']={
  render(host){SRIT.UI.setPage('Pusat Peringatan','Pusat Peringatan');
    const alerts=SRIT.computeAlerts();
    host.innerHTML=`<div class="row g-3">${alerts.length?alerts.map(a=>`
      <div class="col-12 col-lg-6"><div class="card-srit p-3 d-flex align-items-start gap-3" style="border-left:4px solid ${a.color}">
        <div class="kpi-icon" style="background:${a.color}"><i class="bi ${a.icon}"></i></div>
        <div class="flex-grow-1"><div class="fw-semibold">${a.title}</div><div class="text-muted-2" style="font-size:12px">${a.desc}</div></div>
        <span class="badge-soft" style="background:${a.color}22;color:${a.color}">${a.level}</span>
      </div></div>`).join(''):'<div class="col-12"><div class="empty-state"><i class="bi bi-check-circle d-block text-success"></i>Tidak ada alert. Semua kondisi normal.</div></div>'}
    </div>`;
  },
  destroy(){}
};
SRIT.computeAlerts=()=>{
  const al=[];const iso=SRIT.Util.todayISO();
  // anak belum kembali (izin BERANGKAT dengan tgl kembali <= today)
  SRIT.Store.read('IZIN').filter(i=>i.STATUS==='BERANGKAT'&&i.KEMBALI<=iso).forEach(i=>al.push({title:'Anak belum kembali: '+SRIT.nm('ANAK',i.ANAK),desc:'Batas kembali '+SRIT.Util.fmtDateShort(i.KEMBALI)+' — '+i.TUJUAN,level:'HIGH',color:'var(--srit-danger)',icon:'bi-person-exclamation'}));
  // izin menunggu
  const wait=SRIT.Store.read('IZIN').filter(i=>i.STATUS==='MENUNGGU').length;
  if(wait)al.push({title:wait+' izin menunggu persetujuan',desc:'Segera validasi pengajuan izin/kepulangan',level:'MEDIUM',color:'var(--srit-warning)',icon:'bi-hourglass-split'});
  // insiden critical/high aktif
  SRIT.Store.read('INSIDEN').filter(i=>(i.PRIORITAS==='HIGH'||i.PRIORITAS==='CRITICAL')&&i.STATUS!=='SELESAI'&&i.STATUS!=='PENYELESAIAN').forEach(i=>al.push({title:'Insiden '+i.PRIORITAS+': '+i.KATEGORI,desc:i.KEJADIAN,level:i.PRIORITAS,color:'var(--srit-danger)',icon:'bi-exclamation-octagon'}));
  // kamar penuh
  const anak=SRIT.Store.read('ANAK');
  SRIT.Store.read('KAMAR').forEach(k=>{const occ=anak.filter(a=>a.KAMAR===k.ID&&a.STATUS==='AKTIF').length;if(occ>=(k.KAPASITAS||8))al.push({title:'Kamar penuh: '+k.NAME,desc:'Okupansi '+occ+'/'+(k.KAPASITAS||8),level:'LOW',color:'var(--srit-info)',icon:'bi-door-closed'});});
  // insiden proses
  const proc=SRIT.Store.read('INSIDEN').filter(i=>i.STATUS!=='SELESAI'&&i.STATUS!=='PENYELESAIAN').length;
  if(proc)al.push({title:proc+' insiden dalam penanganan',desc:'Pantau progres tindak lanjut',level:'MEDIUM',color:'var(--srit-warning)',icon:'bi-clipboard-pulse'});
  return al;
};
</script>

        <div class="text-muted-2 mb-2" style="font-size:12px">Hanya berlaku untuk tema <b>Eksekutif Terang</b> / <b>Eksekutif Gelap</b>. Tema berwarna lain (Emerald, Royal, dst) sudah punya warnanya sendiri.</div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <input type="color" id="setPrimaryColor" value="${/^#[0-9a-f]{6}$/i.test(primary)?primary:'#1c6ef2'}" style="width:44px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--srit-border)">
          <input class="form-control form-control-sm" id="setPrimaryHex" value="${SRIT.Util.esc(primary)}" placeholder="#1c6ef2" style="max-width:120px">
          <button class="btn btn-primary btn-sm" id="setSavePrimary"><i class="bi bi-check2"></i> Terapkan</button>
          <button class="btn btn-outline-secondary btn-sm" id="setResetPrimary">Reset Default</button>
        </div>
        ${activeBase!=='light'&&activeBase!=='dark'?'<div class="mt-2" style="font-size:11px;color:#d97706"><i class="bi bi-exclamation-triangle"></i> Tema aktif saat ini bukan Eksekutif Terang/Gelap, warna kustom tidak akan terlihat sampai Anda beralih ke salah satunya.</div>':''}
      </div></div>

      <div class="col-lg-6"><div class="card-srit p-3">
        <h6 class="section-title mb-3"><i class="bi bi-shield-lock me-1"></i> Keamanan Login</h6>
        <div class="mb-2"><label class="form-label-sm">Durasi Sesi Login (jam, sebelum otomatis logout)</label><input type="number" min="1" max="168" class="form-control form-control-sm" id="setSessHours" value="${Number(s.SESSION_HOURS)||8}" style="max-width:120px"></div>
        <div class="mb-2"><label class="form-label-sm">Batas Percobaan Gagal Login</label><input type="number" min="3" max="20" class="form-control form-control-sm" id="setMaxFail" value="${Number(s.LOGIN_MAX_FAIL)||5}" style="max-width:120px"></div>
        <div class="mb-2"><label class="form-label-sm">Durasi Kunci Akun Setelah Gagal Berkali-kali (detik)</label><input type="number" min="30" max="21600" class="form-control form-control-sm" id="setLockSec" value="${Number(s.LOGIN_LOCK_SEC)||600}" style="max-width:120px"></div>
        <div class="text-muted-2 mb-2" style="font-size:11px">Berlaku untuk percobaan login berikutnya, tidak memutus sesi yang sedang aktif.</div>
        <button class="btn btn-primary btn-sm mt-2" id="setSaveSecurity"><i class="bi bi-save"></i> Simpan Keamanan</button>
      </div></div>
    </div>`;

    const on=(id,evt,fn)=>{const el=document.getElementById(id);if(el)el[evt]=fn;};
    on('setSaveBrand','onclick',()=>{
      this._save({APP_NAME:$('#setAppName').value.trim()||'SRIT ABSENSI',APP_SUBTITLE:$('#setAppSub').value.trim(),
        APP_DESC:$('#setAppDesc').value.trim(),SCHOOL_TAGLINE:$('#setTagline').value.trim()});
      SRIT.Brand.render();
      SRIT.Notify('Identitas aplikasi tersimpan','ok');
    });
    on('setSaveSchool','onclick',()=>{
      this._save({SCHOOL_NAME:$('#setSchoolName').value.trim(),SCHOOL_SHORT:$('#setSchoolShort').value.trim(),
        SCHOOL_ADDRESS:$('#setSchoolAddr').value.trim()});
      SRIT.Notify('Informasi sekolah tersimpan','ok');
    });
    on('setSaveLogo','onclick',()=>{
      this._save({LOGO_URL:$('#setLogoUrl').value.trim(),LOGO_TEXT:($('#setLogoText').value.trim()||'SR').toUpperCase(),
        FAVICON_URL:$('#setFaviconUrl').value.trim()});
      SRIT.Brand.render();
      SRIT.Notify('Logo & ikon tersimpan','ok');
      this.load();
    });
    on('setSaveLtv','onclick',()=>{
      const rot=Math.min(120,Math.max(5,parseInt($('#setLtvRotate').value,10)||10));
      const poll=Math.min(300,Math.max(5,parseInt($('#setLtvPolling').value,10)||15));
      this._save({LIVETV_ROTATE:rot,LIVETV_POLLING:poll});
      SRIT.Notify('Pengaturan Live TV tersimpan','ok');
      this.load();
    });
    $$('#themeGrid .theme-swatch').forEach(el=>{
      el.onclick=()=>{
        const id=el.getAttribute('data-theme');
        SRIT.Theme.apply(id);
        this._save({THEME_MODE:id});
        SRIT.Brand.render();
        SRIT.Notify('Tema diterapkan: '+(SRIT.Theme.THEMES.find(t=>t.id===id)||{}).name,'ok');
        this.load();
      };
    });
    on('setPrimaryColor','oninput',()=>{$('#setPrimaryHex').value=$('#setPrimaryColor').value;});
    on('setSavePrimary','onclick',()=>{
      let hex=$('#setPrimaryHex').value.trim();
      if(!/^#[0-9a-fA-F]{6}$/.test(hex)){SRIT.Notify('Format warna tidak valid, contoh: #1c6ef2','error');return;}
      this._save({THEME_PRIMARY:hex});
      SRIT.Theme.setPrimary(hex);
      SRIT.Notify('Warna utama diterapkan','ok');
    });
    on('setResetPrimary','onclick',()=>{
      this._save({THEME_PRIMARY:''});
      document.documentElement.style.removeProperty('--srit-primary');
      document.documentElement.style.removeProperty('--srit-primary-rgb');
      SRIT.Notify('Warna utama dikembalikan ke default','ok');
      this.load();
    });
    on('setSaveSecurity','onclick',()=>{
      const sh=Math.min(168,Math.max(1,parseInt($('#setSessHours').value,10)||8));
      const mf=Math.min(20,Math.max(3,parseInt($('#setMaxFail').value,10)||5));
      const ls=Math.min(21600,Math.max(30,parseInt($('#setLockSec').value,10)||600));
      this._save({SESSION_HOURS:sh,LOGIN_MAX_FAIL:mf,LOGIN_LOCK_SEC:ls});
      SRIT.Notify('Pengaturan keamanan tersimpan','ok');
      this.load();
    });
  },
  _save(patch){const s=SRIT.Store.readObj('SETTINGS');SRIT.Store.writeObj('SETTINGS',{...s,...patch});SRIT.Cache.invalidate('livetv');SRIT.Audit.log('UPDATE','settings','SETTINGS');},
  destroy(){}
};
</script>
