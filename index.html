<script>
//# sourceURL=View_AbsensiKamera.html
// ---------- ABSENSI: pemindai QR kamera (dipisah agar galat di sini tidak mematikan menu Absensi) ----------
// Tiga jalur, supaya tetap bisa absen walau kamera langsung diblokir (kasus umum di Chrome Android):
//  1) Kamera langsung (live) — memakai BarcodeDetector bila ada, jsQR sebagai cadangan.
//  2) Foto QR — membuka aplikasi kamera HP lewat <input capture>; tidak butuh izin getUserMedia & lolos dari iframe Apps Script.
//  3) Halaman pemindai terpisah (scan_page, HTTPS) — kamera penuh tanpa batasan iframe.
(function(){
  var A=SRIT&&SRIT.Features&&SRIT.Features.absensi;
  if(!A){console.error('View_AbsensiKamera: SRIT.Features.absensi belum ada');return;}
  var framed=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
  var esc=function(s){return SRIT.Util.esc(String(s==null?'':s));};
  Object.assign(A,{
  // ---------- deteksi lingkungan ----------
  _camPolicyOk(){ // true/false bila browser bisa menjawab; null bila tidak diketahui
    try{const p=document.permissionsPolicy||document.featurePolicy;if(p&&typeof p.allowsFeature==='function')return !!p.allowsFeature('camera');}catch(e){}
    return null;
  },
  _camBlock(){ // '' = layak dicoba
    if(window.isSecureContext===false)return 'insecure';
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return 'nomedia';
    if(this._camPolicyOk()===false)return 'policy';
    return '';
  },
  async _permState(){try{return (await navigator.permissions.query({name:'camera'})).state;}catch(e){return 'unknown';}},
  async _camDiag(err){
    const o=[];
    o.push('HTTPS (secure context): '+(window.isSecureContext?'ya':'TIDAK'));
    o.push('Berjalan di dalam iframe: '+(framed?'ya':'tidak'));
    const pol=this._camPolicyOk();
    o.push('Kebijakan kamera untuk halaman ini: '+(pol===null?'tidak diketahui':pol?'diizinkan':'DIBLOKIR oleh halaman pembungkus'));
    o.push('Status izin kamera (origin ini): '+await this._permState());
    o.push('Origin: '+location.origin);
    o.push('BarcodeDetector: '+(window.BarcodeDetector?'ada':'tidak ada')+' | jsQR: '+(typeof jsQR!=='undefined'?'termuat':'belum'));
    try{const d=await navigator.mediaDevices.enumerateDevices();o.push('Kamera terdeteksi: '+d.filter(x=>x.kind==='videoinput').length);}catch(e){}
    if(err)o.push('Galat: '+(err.name||'')+(err.message?' — '+err.message:''));
    o.push('Browser: '+navigator.userAgent);
    return o.join('\n');
  },
  // ---------- tampilan ----------
  _renderQR(body,r){
    const block=this._camBlock();
    const live=!block;
    const msg={
      policy:'Kamera langsung <b>diblokir oleh halaman pembungkus Apps Script</b> (bukan oleh izin Chrome Anda), jadi mengubah izin situs tidak akan membantu.',
      insecure:'Kamera langsung hanya berjalan di halaman HTTPS.',
      nomedia:'Browser ini tidak menyediakan akses kamera langsung untuk halaman ini.'
    }[block]||'';
    body.innerHTML=`<div class="row g-3">
      <div class="col-lg-5"><div class="card-srit p-3">
        <h6 class="section-title mb-2"><i class="bi bi-qr-code-scan me-1"></i>Pindai QR dengan Kamera</h6>
        ${live?`<div style="position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:1/1">
          <video id="abVideo" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video>
          <div style="position:absolute;inset:18%;border:3px solid rgba(255,255,255,.8);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.25)"></div>
          <div id="abQrStat" style="position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:6px;text-align:center">Menyiapkan kamera\u2026</div>
        </div>
        <canvas id="abCanvas" class="d-none"></canvas>
        <div id="abCamErr" class="mt-2 d-none"></div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary btn-sm flex-grow-1" id="abQrStart"><i class="bi bi-camera-video"></i> Mulai Kamera</button>
          <button class="btn btn-outline-secondary btn-sm" id="abQrStop"><i class="bi bi-stop-circle"></i> Stop</button>
        </div>`
        :`<div class="alert alert-warning py-2 mb-2" style="font-size:12.5px"><i class="bi bi-exclamation-triangle"></i> ${msg}<br>Gunakan salah satu cara di bawah ini \u2014 keduanya tetap mencatat <b>HADIR</b> seperti biasa.</div>
        <div id="abCamErr" class="mb-2"></div>
        <button class="btn btn-link btn-sm p-0 mb-2" id="abDiagBtn"><i class="bi bi-wrench-adjustable"></i> Diagnosa kamera</button>
        <div id="abDiag" class="d-none"></div>`}
        <button class="btn btn-${live?'outline-primary':'primary'} btn-sm w-100 mt-3" id="abQrPhotoBtn"><i class="bi bi-camera"></i> Ambil Foto QR (kamera HP)</button>
        <input type="file" id="abQrPhoto" accept="image/*" capture="environment" class="d-none">
        <button class="btn btn-outline-secondary btn-sm w-100 mt-2" id="abQrGalBtn"><i class="bi bi-images"></i> Pilih banyak foto QR (galeri)</button>
        <input type="file" id="abQrGal" accept="image/*" multiple class="d-none">
        <div class="text-muted-2 mt-1" style="font-size:11px">Tips: satu foto boleh berisi beberapa QR sekaligus. Atau ambil banyak foto dengan kamera HP, lalu pilih semuanya di sini.</div>
        <div id="abPhotoStat" class="mt-2 small text-muted-2" style="min-height:18px"></div>
        <button class="btn btn-outline-success btn-sm w-100 mt-2" id="abQrExt"><i class="bi bi-box-arrow-up-right"></i> Buka pemindai QR langsung (halaman terpisah)</button>
        <div class="input-group input-group-sm mt-2 ${this._scanBase()?'d-none':''}" id="abBaseGrp"><input class="form-control" id="abQrBase" placeholder="Alamat halaman pemindai, mis. https://srit-scan.vercel.app"><button class="btn btn-outline-primary" id="abQrBaseSave">Simpan</button></div>
        <div class="mt-3"><label class="form-label-sm">Input QR manual</label>
          <input class="form-control form-control-sm" id="abQrManual" placeholder="Tempel isi QR / NIS / ID lalu Enter"></div>
        <div class="text-muted-2 mt-2" style="font-size:11px">Format QR didukung: <code>SRIT:&lt;ID&gt;</code>, NIS, atau UID. Hasil \u2192 <b>HADIR</b>.</div>
      </div></div>
      <div class="col-lg-7"><div class="card-srit p-0 h-100">
        <div class="p-3 border-bottom d-flex justify-content-between"><h6 class="section-title mb-0"><i class="bi bi-clock-history me-1"></i>Log Scan Terakhir</h6><span class="badge-soft st-HADIR" id="abLogN">${this.state.log.length}</span></div>
        <div id="abLog" style="max-height:360px;overflow:auto"></div>
      </div></div>
    </div>`;
    this._prefetchExec();
    const ext=$('#abQrExt');if(ext)ext.onclick=()=>this._openScan('qr');
    const bs=$('#abQrBaseSave');if(bs)bs.onclick=()=>{const v=($('#abQrBase').value||'').trim();if(!/^https:\/\//i.test(v)){SRIT.Notify('Alamat harus diawali https://','warn');return;}try{localStorage.setItem('srit_scan_url',v);}catch(e){}$('#abBaseGrp').classList.add('d-none');SRIT.Notify('Alamat pemindai disimpan','ok');};
    const man=$('#abQrManual');if(man)man.onkeydown=e=>{if(e.key==='Enter'){const v=man.value.trim();man.value='';if(v)this._doScan('QR',v);}};
    const pb=$('#abQrPhotoBtn'),pi=$('#abQrPhoto');
    if(pb&&pi){pb.onclick=()=>pi.click();pi.onchange=async()=>{const f=pi.files&&pi.files[0];pi.value='';if(f)await this._decodePhoto(f);};}
    const gb=$('#abQrGalBtn'),gi=$('#abQrGal');
    if(gb&&gi){gb.onclick=()=>gi.click();gi.onchange=async()=>{const fs=Array.from(gi.files||[]);gi.value='';if(fs.length)await this._decodeFiles(fs);};}
    const startBtn=$('#abQrStart'),stopBtn=$('#abQrStop');
    if(startBtn)startBtn.onclick=()=>this.startQR();
    if(stopBtn)stopBtn.onclick=()=>this.stopQR();
    const db=$('#abDiagBtn');if(db)db.onclick=()=>this._showDiag(null);
    this._renderLog();
    if(live)this.startQR();
  },
  // ---------- kamera langsung ----------
  async startQR(){
    if(this._qr.stream||this._qr.starting)return;
    const video=$('#abVideo');if(!video)return;
    const stat=$('#abQrStat');
    this._showCamError(null);
    if(stat){stat.textContent='Meminta izin kamera\u2026';stat.style.background='rgba(0,0,0,.6)';}
    this._qr.starting=true;
    const md=navigator.mediaDevices;
    const tries=[{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{facingMode:{ideal:'environment'}},audio:false},{video:true,audio:false}];
    let stream=null,lastErr=null;
    for(const c of tries){
      try{stream=await md.getUserMedia(c);break;}
      catch(e){lastErr=e;
        // izin ditolak / diblokir kebijakan: percobaan berikutnya tidak akan berhasil
        if(e&&(e.name==='NotAllowedError'||e.name==='PermissionDeniedError'||e.name==='SecurityError'||e.name==='NotFoundError'||e.name==='NotReadableError'))break;}
    }
    this._qr.starting=false;
    if(!stream){if(stat)stat.textContent='Gagal akses kamera';this._showCamError(lastErr);return;}
    if(!$('#abVideo')){stream.getTracks().forEach(t=>t.stop());return;}   // pengguna sudah pindah tab
    this._qr.stream=stream;video.srcObject=stream;
    try{await video.play();}catch(e){/* autoplay+muted+playsinline biasanya cukup; lanjut */}
    this._qr.det=null;
    if(window.BarcodeDetector){try{this._qr.det=new BarcodeDetector({formats:['qr_code']});}catch(e){this._qr.det=null;}}
    if(stat){stat.textContent='Arahkan QR ke dalam kotak\u2026';stat.style.background='rgba(0,0,0,.6)';}
    this._qrLoop();
  },
  async _showDiag(err){
    const box=$('#abDiag')||$('#abCamErr');if(!box)return;
    const d=await this._camDiag(err);
    const t=$('#abDiag');if(t){t.classList.remove('d-none');t.innerHTML=`<pre class="p-2 rounded" style="font-size:11px;white-space:pre-wrap;background:var(--srit-hover);margin:0" id="abDiagTxt">${esc(d)}</pre><button class="btn btn-sm btn-outline-secondary py-0 mt-1" id="abDiagCopy"><i class="bi bi-clipboard"></i> Salin</button>`;
      const cp=$('#abDiagCopy');if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(d).then(()=>SRIT.Notify('Diagnosa disalin','ok'));}catch(e){}};}
    return d;
  },
  // ---------- pesan galat yang jujur sesuai penyebab ----------
  async _showCamError(err){
    const box=$('#abCamErr');if(!box)return;
    if(!err){box.classList.add('d-none');box.innerHTML='';return;}
    const perm=await this._permState(),pol=this._camPolicyOk();
    let t,d;
    const n=err.name;
    if(n==='NotAllowedError'||n==='PermissionDeniedError'||n==='SecurityError'){
      if(pol===false||(framed&&perm==='granted')){
        t='Kamera diblokir oleh halaman pembungkus (iframe Apps Script)';
        d='Izin kamera di Chrome sudah benar, tetapi halaman ini berjalan di dalam bingkai yang tidak meneruskan izin kamera. Pakai tombol \u201cAmbil Foto QR\u201d atau \u201cBuka pemindai QR langsung\u201d di bawah.';
      }else if(perm==='denied'){
        t='Izin kamera ditolak untuk alamat ini';
        d='Alamat yang meminta kamera adalah '+location.origin+' (bukan alamat yang Anda ketik di bilah alamat). Di Chrome Android: menu \u22ee \u2192 Setelan \u2192 Setelan situs \u2192 Kamera \u2192 hapus blokir untuk alamat tersebut, atau hapus data situs script.google.com lalu muat ulang. Jika tetap gagal, pakai \u201cAmbil Foto QR\u201d.';
      }else{
        t='Izin kamera tidak diberikan / dibatalkan';
        d='Tidak ada permintaan izin yang bisa ditampilkan di bingkai Apps Script. Pakai \u201cAmbil Foto QR\u201d atau \u201cBuka pemindai QR langsung\u201d \u2014 keduanya tidak terkena batasan ini.';
      }
    }else{
      const info={
        NotFoundError:['Kamera tidak ditemukan','Perangkat tidak punya kamera atau tidak terdeteksi browser.'],
        NotReadableError:['Kamera sedang dipakai aplikasi lain','Tutup aplikasi/tab lain yang memakai kamera (Zoom, Meet, aplikasi Kamera), lalu klik Coba Lagi.'],
        OverconstrainedError:['Kamera tidak mendukung mode yang diminta','Klik Coba Lagi.'],
        AbortError:['Kamera gagal dimulai','Tutup lalu buka lagi tab ini, atau mulai ulang Chrome.'],
        TypeError:['Permintaan kamera tidak valid','Muat ulang halaman lalu coba lagi.']
      }[n]||['Gagal mengakses kamera',err.message||n||'Kesalahan tidak dikenal.'];
      t=info[0];d=info[1];
    }
    box.classList.remove('d-none');
    box.innerHTML=`<div class="alert alert-danger py-2 mb-0" style="font-size:12px">
      <b><i class="bi bi-camera-video-off"></i> ${esc(t)}</b><br>${esc(d)}
      <div class="mt-2 d-flex gap-2 flex-wrap"><button class="btn btn-sm btn-outline-danger py-0" id="abCamRetry"><i class="bi bi-arrow-clockwise"></i> Coba Lagi</button>
      <button class="btn btn-sm btn-outline-secondary py-0" id="abCamDiag"><i class="bi bi-wrench-adjustable"></i> Diagnosa</button></div>
      <div id="abDiag" class="d-none mt-2"></div>
    </div>`;
    const rt=$('#abCamRetry');if(rt)rt.onclick=()=>this.startQR();
    const dg=$('#abCamDiag');if(dg)dg.onclick=()=>this._showDiag(err);
  },
  _qrHit(data){
    const now=Date.now();
    if(data===this._qr.last&&now-this._qr.lastTime<=2500)return;
    this._qr.last=data;this._qr.lastTime=now;
    this._doScan('QR',data);
    try{if(navigator.vibrate)navigator.vibrate(50);}catch(e){}
    const stat=$('#abQrStat');if(stat){stat.textContent='\u2713 '+data;stat.style.background='rgba(22,163,74,.85)';setTimeout(()=>{const s=$('#abQrStat');if(s){s.style.background='rgba(0,0,0,.6)';s.textContent='Arahkan QR ke dalam kotak\u2026';}},1200);}
  },
  _qrLoop(){
    const video=$('#abVideo'),canvas=$('#abCanvas');
    if(!video||!this._qr.stream)return;
    const next=()=>{if(this._qr.stream)this._qr.raf=requestAnimationFrame(()=>this._qrLoop());};
    if(!video.videoWidth||video.readyState<video.HAVE_ENOUGH_DATA||this._qr.busy){next();return;}
    if(this._qr.det){
      this._qr.busy=true;
      this._qr.det.detect(video).then(r=>{this._qr.busy=false;if(r&&r.length&&r[0].rawValue)this._qrHit(r[0].rawValue);})
        .catch(()=>{this._qr.busy=false;this._qr.det=null;}).then(next);   // gagal \u2192 pindah ke jsQR
      return;
    }
    if(typeof jsQR!=='undefined'){
      const s=Math.min(1,720/Math.max(video.videoWidth,video.videoHeight));
      canvas.width=Math.round(video.videoWidth*s);canvas.height=Math.round(video.videoHeight*s);
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      try{
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
        if(code&&code.data)this._qrHit(code.data);
      }catch(e){}
    }
    next();
  },
  stopQR(){
    if(this._qr.raf){cancelAnimationFrame(this._qr.raf);this._qr.raf=null;}
    if(this._qr.stream){this._qr.stream.getTracks().forEach(t=>t.stop());this._qr.stream=null;}
    this._qr.busy=false;this._qr.starting=false;
    const stat=$('#abQrStat');if(stat)stat.textContent='Kamera berhenti.';
  },
  // ---------- foto QR (tanpa getUserMedia) ----------
  _imgFromFile(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Foto tidak bisa dibuka'));};im.src=u;});},
  _loadBitmap(file){return window.createImageBitmap?createImageBitmap(file).catch(()=>this._imgFromFile(file)):this._imgFromFile(file);},
  async _jsqrFromBitmap(bmp){
    for(let i=0;i<25&&typeof jsQR==='undefined';i++)await new Promise(r=>setTimeout(r,150));
    if(typeof jsQR==='undefined')throw new Error('Pustaka pembaca QR belum termuat (periksa koneksi internet)');
    const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    for(const max of [1000,1600,600,2200]){            // beberapa skala: foto HP besar kadang gagal bila terlalu kecil/besar
      const s=Math.min(1,max/Math.max(W,H));c.width=Math.round(W*s);c.height=Math.round(H*s);
      x.drawImage(bmp,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height);
      const q=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
      if(q&&q.data)return q.data;
    }
    return '';
  },
  async _jsqrMulti(bmp){ // semua QR dalam satu foto: baca satu, putihkan area-nya, ulangi
    for(let i=0;i<25&&typeof jsQR==='undefined';i++)await new Promise(r=>setTimeout(r,150));
    if(typeof jsQR==='undefined')throw new Error('Pustaka pembaca QR belum termuat (periksa koneksi internet)');
    const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    for(const max of [1000,1600,600,2200]){
      const s=Math.min(1,max/Math.max(W,H));c.width=Math.round(W*s);c.height=Math.round(H*s);
      x.drawImage(bmp,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height),out=[];
      for(let k=0;k<12;k++){
        const q=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
        if(!q||!q.data)break;
        if(out.indexOf(q.data)<0)out.push(q.data);
        const L=q.location,xs=[L.topLeftCorner.x,L.topRightCorner.x,L.bottomLeftCorner.x,L.bottomRightCorner.x],ys=[L.topLeftCorner.y,L.topRightCorner.y,L.bottomLeftCorner.y,L.bottomRightCorner.y];
        const pad=Math.max(6,(Math.max.apply(null,xs)-Math.min.apply(null,xs))*0.12);
        const x0=Math.max(0,Math.floor(Math.min.apply(null,xs)-pad)),x1=Math.min(c.width-1,Math.ceil(Math.max.apply(null,xs)+pad));
        const y0=Math.max(0,Math.floor(Math.min.apply(null,ys)-pad)),y1=Math.min(c.height-1,Math.ceil(Math.max.apply(null,ys)+pad));
        for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){const o=(yy*c.width+xx)*4;d.data[o]=d.data[o+1]=d.data[o+2]=255;d.data[o+3]=255;}
      }
      if(out.length)return out;
    }
    return [];
  },
  async _decodeAll(file){ // daftar isi QR dari satu foto
    const bmp=await this._loadBitmap(file);let vals=[];
    if(window.BarcodeDetector){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(bmp);vals=(r||[]).map(z=>z.rawValue).filter(Boolean);}catch(e){}}
    if(!vals.length)vals=await this._jsqrMulti(bmp);
    try{if(bmp.close)bmp.close();}catch(e){}
    return Array.from(new Set(vals));
  },
  async _decodeFiles(files){
    const say=(t,c)=>{const e=$('#abPhotoStat');if(e){e.textContent=t;e.className='mt-2 small '+(c||'text-muted-2');}};
    const seen=new Set();let fail=0,n=0,i=0;
    for(const f of files){
      i++;say('Membaca foto '+i+' dari '+files.length+'\u2026');
      try{
        const vals=await this._decodeAll(f);
        if(!vals.length){fail++;continue;}
        for(const v of vals){if(seen.has(v))continue;seen.add(v);n++;await this._doScan('QR',v);}
      }catch(e){fail++;}
    }
    if(!n)say('QR tidak terbaca. Dekatkan kamera, pastikan QR utuh, terang, dan tidak buram, lalu ambil foto lagi.','text-danger');
    else say('\u2713 '+n+' QR diproses'+(fail?' \u00b7 '+fail+' foto tidak terbaca':'')+'.',fail?'text-warning':'text-success');
  },
  async _decodePhoto(file){await this._decodeFiles([file]);},
  });
  A._qr=Object.assign({stream:null,raf:null,last:'',lastTime:0,busy:false,starting:false,det:null},A._qr||{});
})();
</script>

<script>
//# sourceURL=View_Jadwal.html
// JADWAL = template kegiatan rutin mingguan (hari + jam mulai/selesai + jenjang + JK + kelas). ABSENSI=YA → muncul di menu Absensi & dihitung di laporan; TIDAK → hanya jadwal.
regFeature('jadwal',{title:'Jadwal Rutin',table:'JADWAL',perm:'jadwal',idPrefix:'JD',searchFields:['NAMA','LOKASI'],
  cols:[{h:'Kegiatan',k:'NAMA'},{h:'Waktu',f:r=>`${r.JAM_MULAI||''}–${r.JAM_SELESAI||''}`},{h:'Hari',f:r=>`<span style="font-size:11px">${SRIT.Util.esc(r.HARI||'')}</span>`},{h:'Sasaran',f:_scopeBadge},{h:'Absensi',f:_absBtn('jadwal','jadwal')},{h:'Lokasi',k:'LOKASI'},{h:'Bel',f:r=>r.BEL==='AKTIF'?'<span class="badge-soft st-HADIR"><i class="bi bi-bell-fill"></i> Aktif</span>':'<span class="badge-soft st-BELUM">Nonaktif</span>'},{h:'Status',f:r=>`<span class="badge-soft ${(r.STATUS||'AKTIF')==='AKTIF'?'st-HADIR':'st-BELUM'}">${r.STATUS||'AKTIF'}</span>`}],
  filters:[{k:'JENJANG',label:'Jenjang',options:_jjOpts},{k:'ABSENSI',label:'Absensi',options:[{v:'YA',t:'Pakai absensi'},{v:'TIDAK',t:'Tanpa absensi'}]}],
  toolbar:[{id:'tbMuat',label:'Muat Jadwal Asrama',icon:'bi-cloud-download',cls:'btn-outline-primary',perm:'jadwal:CREATE',run(){this.muatBawaan();}},{id:'tbBulk',label:'Absensi Massal',icon:'bi-ui-checks',cls:'btn-outline-secondary',perm:'jadwal:UPDATE',run(){this.bulkAbsensi();}}],
  fields:[
    {k:'NAMA',label:'Nama Kegiatan',col:12,required:true},
    {k:'JAM_MULAI',label:'Jam Mulai',type:'time',required:true},
    {k:'JAM_SELESAI',label:'Jam Selesai',type:'time',required:true},
    {k:'HARI',label:'Hari (pilih)',type:'days',col:12,default:'Senin,Selasa,Rabu,Kamis,Jumat'},
    {k:'JENJANG',label:'Jenjang',type:'select',options:_jjOpts},
    {k:'JK',label:'Jenis Kelamin',type:'select',options:_jkOpts},
    {k:'KELAS',label:'Kelas Sasaran (opsional, mis. 1,2,3; kosong = semua kelas)'},
    {k:'ABSENSI',label:'Gunakan Absensi',type:'select',default:'YA',options:[{v:'YA',t:'Ya, pakai absensi'},{v:'TIDAK',t:'Tidak, hanya jadwal (tanpa absensi)'}]},
    {k:'LOKASI',label:'Lokasi'},
    {k:'PETUGAS',label:'Petugas',type:'select',options:()=>[{v:'',t:'—'}].concat(SRIT.Store.read('USERS').map(u=>({v:u.ID,t:u.NAME})))},
    {k:'STATUS',label:'Status',type:'select',options:[{v:'AKTIF',t:'AKTIF'},{v:'NONAKTIF',t:'NONAKTIF'}]},
    {k:'BEL',label:'Bunyikan Bel Otomatis?',type:'select',options:[{v:'',t:'Tidak'},{v:'AKTIF',t:'Ya, bunyikan saat jam mulai'}]},
    {k:'BEL_TEKS',label:'Teks Pengumuman (opsional, kosongkan = pakai nama kegiatan)',col:12}
  ]});
Object.assign(SRIT.Features.jadwal,{
  // jadwal lama (sebelum ada kolom ABSENSI) dianggap "Ya"; ditulis eksplisit sekali agar filter Absensi akurat
  _normAbsensi(){
    if(!SRIT.Auth.can('jadwal:UPDATE'))return;
    const miss=SRIT.Store.read('JADWAL').filter(r=>!r.ABSENSI);
    if(!miss.length||miss.length>400)return;
    miss.forEach(r=>SRIT.Repo.update('JADWAL',r.ID,{ABSENSI:'YA'}));
  },
  muatBawaan(){
    const m=SRIT.Modal.open({title:'Muat Jadwal Asrama',size:'modal-lg',
      body:`<p style="font-size:13px">Memuat jadwal harian keasramaan dari file Excel: <b>SRD</b> (kelas 1–3 dan kelas 4–6), <b>SRMP</b>, dan <b>SRMA</b>. Nilai awal "Gunakan Absensi" ditentukan otomatis (Apel, Sholat, KBM, TPQ, belajar, mengaji, dst. = Ya) dan bisa diubah setelahnya.</p>
      <ul style="font-size:13px"><li><b>Tambahkan / perbarui</b>: jadwal lain tidak disentuh. Bila jadwal contoh lama masih ada, sesi absensi bisa dobel.</li>
      <li><b>Ganti semua</b>: menghapus seluruh jadwal rutin yang ada, lalu memuat jadwal asrama. Laporan per kegiatan pada tanggal lampau mengikuti jadwal yang berlaku sekarang.</li></ul>`,
      footer:'<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-outline-primary btn-sm" id="mbAdd">Tambahkan / perbarui</button><button class="btn btn-danger btn-sm" id="mbRep">Ganti semua</button>'});
    const go=async mode=>{
      if(mode==='ganti'&&!confirm('Hapus SEMUA jadwal rutin yang ada dan ganti dengan jadwal asrama?'))return;
      $('#mbAdd').disabled=$('#mbRep').disabled=true;
      try{const r=await SRIT.Server.call('apiMuatJadwalAsrama',mode);m.close();SRIT.Cache.invalidate('dash');SRIT.Notify(r.jumlah+' jadwal asrama dimuat','ok');SRIT.Sync.lastPoll=0;try{await SRIT.Sync.poll();}catch(e){}this.load();}
      catch(e){$('#mbAdd').disabled=$('#mbRep').disabled=false;SRIT.Notify(e.message||'Gagal memuat jadwal','err');}
    };
    $('#mbAdd').onclick=()=>go('tambah');$('#mbRep').onclick=()=>go('ganti');

<script>
//# sourceURL=JS_Bell.html
/* =========================================================================
   BEL OTOMATIS — membunyikan lonceng (Web Audio, tanpa file suara eksternal)
   lalu membacakan pengumuman (Web Speech API / text-to-speech bahasa Indonesia)
   persis pada JAM_MULAI kegiatan yang ditandai BEL='AKTIF' (JADWAL Rutin atau
   KEGIATAN Khusus).

   Berjalan 100% di browser — tidak butuh server tambahan, tidak butuh koneksi
   internet selain memuat aplikasi ini (mesin TTS bawaan Chrome/Edge/Safari).
   Hanya berbunyi selama SATU tab tempat ia dijalankan tetap terbuka:
     - Layar Publik (Live TV): otomatis mengikuti setiap kali data disegarkan.
     - Menu "Bel Otomatis": bisa dinyalakan manual (mis. dari PC/tablet kantor).

   Kebijakan browser mengharuskan SATU kali sentuhan/klik pengguna sebelum
   audio & suara TTS boleh diputar otomatis (unlock() dipanggil dari tombol).
   ========================================================================= */
SRIT.Util.nowHM=()=>{try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}catch(e){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}};

SRIT.Bell={
  _timer:null,_unlocked:false,_ctx:null,_ingested:null,_firing:null,

  /** Dipanggil Live TV tiap polling dengan daftar bel dari server (mode publik, tanpa login). */
  ingest(list){this._ingested=Array.isArray(list)?list:[];},

  /** Sesi hari ini yang ditandai bel aktif — dari cermin data (masuk/login) atau data yang di-ingest (publik). */
  _sessionsWithBell(iso){
    if(SRIT.Auth&&SRIT.Auth.user){
      return SRIT.Api.getSessionsForDate(iso,true).filter(s=>s.bel==='AKTIF')
        .map(s=>({id:s.id,nama:s.nama,jam:s.jamMulai,teks:s.belTeks||s.nama}))
        .sort((a,b)=>String(a.jam||'').localeCompare(String(b.jam||'')));
    }
    return iso===SRIT.Util.todayISO()?(this._ingested||[]).slice().sort((a,b)=>String(a.jam||'').localeCompare(String(b.jam||''))):[];
  },
  today(){return this._sessionsWithBell(SRIT.Util.todayISO());},
  next(){const hm=SRIT.Util.nowHM();return this.today().find(s=>s.jam>hm)||null;},

  _firedKey(iso){return 'srit_bel_fired_'+iso;},
  _firedSet(iso){try{return new Set(JSON.parse(localStorage.getItem(this._firedKey(iso))||'[]'));}catch(e){return new Set();}},
  _markFired(iso,id){
    const s=this._firedSet(iso);s.add(id);
    try{
      localStorage.setItem(this._firedKey(iso),JSON.stringify([...s]));
      // beres-beres catatan lama supaya localStorage tidak menumpuk
      const todayKey=this._firedKey(SRIT.Util.todayISO());
      Object.keys(localStorage).forEach(k=>{if(k.indexOf('srit_bel_fired_')===0&&k!==todayKey&&k<todayKey)localStorage.removeItem(k);});
    }catch(e){}
  },

  /** Wajib dipanggil dari klik/sentuhan pengguna (kebijakan autoplay browser) agar audio & TTS boleh berbunyi. */
  unlock(){
    if(this._unlocked)return true;
    try{
      this._ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(this._ctx.state==='suspended')this._ctx.resume();
      const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);   // "panaskan" mesin TTS
      this._unlocked=true;
    }catch(e){}
    return this._unlocked;
  },

  /** Bunyi lonceng sederhana (nada berulang), tanpa file audio eksternal. */
  ring(times=3){
    if(!this._ctx)return Promise.resolve();
    const ctx=this._ctx;let t=ctx.currentTime;
    for(let i=0;i<times;i++){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(880,t);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.9);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.9);
      t+=1.1;
    }
    return new Promise(res=>setTimeout(res,times*1100));
  },
  speak(text){
    return new Promise(res=>{
      try{
        const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.95;
        const idv=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('id'));
        if(idv)u.voice=idv;
        u.onend=res;u.onerror=res;
        speechSynthesis.speak(u);
      }catch(e){res();}
    });
  },
  // ---- Ucapkan jam saat ini dalam kata-kata Indonesia (lebih jelas dibacakan TTS daripada format angka "07:05") ----
  _angkaID(n){
    const s=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan'];
    if(n<10)return s[n];
    if(n===10)return 'sepuluh';
    if(n===11)return 'sebelas';
    if(n<20)return s[n-10]+' belas';
    const p=Math.floor(n/10),r=n%10;
    return s[p]+' puluh'+(r?' '+s[r]:'');
  },
  spokenTime(){
    const [h,m]=SRIT.Util.nowHM().split(':').map(Number);
    return 'pukul '+this._angkaID(h)+(m===0?' tepat':' lewat '+this._angkaID(m)+' menit');
  },
  async fire(sess,{test=false}={}){
    if(test){if(!this._unlocked&&!this.unlock())return;}
    else if(!this._unlocked)return;   // belum diaktifkan di tab ini → lewati (dicoba lagi tiap 15dtk selama menit ini)
    await this.ring(3);
    await this.speak('Perhatian, sekarang menunjukkan '+this.spokenTime()+'. '+(sess.teks||sess.nama)+'.');
    if(!test)this._markFired(SRIT.Util.todayISO(),sess.id);
  },
  test(){
    this.unlock();
    return this.fire({nama:'Uji Coba Bel',teks:'Ini adalah uji coba bel otomatis SRIT Absensi.'},{test:true});
  },
  /** Bunyikan bel untuk satu kegiatan tertentu SEKARANG juga (tombol bel manual per kegiatan di menu Bel Otomatis).
   *  Ditandai "sudah berbunyi" untuk hari ini juga, supaya tidak dobel saat jamnya tiba nanti. */
  ringNow(sess){
    this.unlock();
    return this.fire(sess,{test:false});
  },
  _tick(){
    if(!this._firing)this._firing=new Set();
    const iso=SRIT.Util.todayISO(),hm=SRIT.Util.nowHM();
    const fired=this._firedSet(iso);
    this._sessionsWithBell(iso).filter(s=>s.jam===hm&&!fired.has(s.id)&&!this._firing.has(s.id)).forEach(s=>{
      this._firing.add(s.id);
      this.fire(s).finally(()=>this._firing.delete(s.id));
    });
  },
  start(){if(this._timer)return;this._tick();this._timer=setInterval(()=>this._tick(),15000);},
  stop(){clearInterval(this._timer);this._timer=null;}
};
</script>

            <td class="text-center"><button class="btn btn-sm btn-outline-primary py-0 px-2" data-ring="${SRIT.Util.esc(s.id)}" title="Bunyikan bel kegiatan ini sekarang"><i class="bi bi-bell"></i> Bel Sekarang</button></td>

      <td>${(SRIT.Repo.getById('JABATAN',u.JABATAN)||{}).NAME||'-'}</td>
      <td><span class="badge-soft ${u.ROLE==='SUPER_ADMIN'?'st-ALPA':'st-IZIN'}">${u.ROLE}</span></td>
      <td>${u.SCOPE}</td><td><span class="badge-soft ${u.STATUS==='AKTIF'?'st-HADIR':'st-BELUM'}">${u.STATUS}</span></td>
      <td class="text-end">${SRIT.Auth.can('user:UPDATE')?`<button class="btn btn-sm btn-outline-secondary py-0" onclick="SRIT.Features.user.form('${u.ID}')"><i class="bi bi-pencil"></i></button>`:''}</td>
    </tr>`).join('')}
    </tbody>`;
    $('#usPag').innerHTML=SRIT.UI.pagination(r);
    $$('#usPag [data-pg]').forEach(a=>a.onclick=()=>{this.state.page=+a.dataset.pg;this.load();});},
  form(id){
    const u=id?SRIT.Repo.getById('USERS',id):{};
    const jab=SRIT.Store.read('JABATAN'),roles=SRIT.Store.read('ROLES');
    const m=SRIT.Modal.open({title:(id?'Edit':'Tambah')+' Pengguna',
      body:`<form id="usForm"><div class="row g-2">
        <div class="col-6"><label class="form-label-sm">Nama</label><input class="form-control form-control-sm" name="NAME" value="${u.NAME||''}" required></div>
        <div class="col-6"><label class="form-label-sm">Email / Nama Pengguna</label><input class="form-control form-control-sm" name="EMAIL" value="${u.EMAIL||''}" required></div>
        <div class="col-6"><label class="form-label-sm">Jabatan</label><select class="form-select form-select-sm" name="JABATAN">${jab.map(j=>`<option value="${j.ID}" ${u.JABATAN===j.ID?'selected':''}>${j.NAME}</option>`).join('')}</select></div>
        <div class="col-6"><label class="form-label-sm">Peran</label><select class="form-select form-select-sm" name="ROLE">${roles.map(rr=>`<option value="${rr.ID}" ${u.ROLE===rr.ID?'selected':''}>${rr.NAME}</option>`).join('')}</select></div>
        <div class="col-6"><label class="form-label-sm">Cakupan Akses</label><select class="form-select form-select-sm" name="SCOPE">${['GLOBAL','SEKOLAH','ASRAMA','GEDUNG','KAMAR','WALI_ASUH'].map(s=>`<option ${u.SCOPE===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="col-6"><label class="form-label-sm">Status</label><select class="form-select form-select-sm" name="STATUS"><option ${u.STATUS==='AKTIF'?'selected':''}>AKTIF</option><option ${u.STATUS==='NONAKTIF'?'selected':''}>NONAKTIF</option></select></div>
        <div class="col-12"><label class="form-label-sm">Kata Sandi ${id?'(kosongkan jika tidak diubah)':''}</label><input type="password" class="form-control form-control-sm" name="PW" ${id?'':'required'}></div>
      </div></form>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="usSave">Simpan</button>`});
    $('#usSave',m.el).onclick=()=>{
      const f=$('#usForm',m.el);if(!f.reportValidity())return;
      const d=Object.fromEntries(new FormData(f));
      const pw=d.PW;delete d.PW; // kata sandi tidak disimpan di browser: dikirim ke server (di-hash di sana)
      if(id){SRIT.Repo.update('USERS',id,d);SRIT.Audit.log('UPDATE','user',id);if(pw)SRIT.Sync.setPassword(id,pw);}
      else{d.ID=SRIT.Util.uid('U');d.CREATED_AT=new Date().toISOString();SRIT.Repo.insert('USERS',d);SRIT.Audit.log('CREATE','user',d.ID);if(pw)SRIT.Sync.setPassword(d.ID,pw);}
      m.close();SRIT.Notify('User tersimpan','ok');this.load();
    };},
  destroy(){}
};
</script>

<script>
//# sourceURL=View_Role.html
// ---------- ROLE & PERMISSION (matriks dapat diedit + CRUD peran) ----------
SRIT.Features.role={
  ACT:{VIEW:'Lihat',CREATE:'Tambah',UPDATE:'Ubah',DELETE:'Hapus',EXPORT:'Ekspor',APPROVE:'Setujui',MANAGE:'Kelola'},
  render(host){SRIT.UI.setPage('Peran & Hak Akses','Peran');
    const canManage=SRIT.Auth.can('role:MANAGE')||SRIT.Auth.can('role:UPDATE')||SRIT.Auth.isSuper();
    const roles=SRIT.Store.read('ROLES');
    host.innerHTML=`
    <div class="row g-3">
      <div class="col-lg-4"><div class="card-srit p-3">
        <div class="d-flex justify-content-between align-items-center mb-3"><h6 class="section-title mb-0">Daftar Peran (${roles.length})</h6>
        ${canManage?'<button class="btn btn-primary btn-sm" id="rlAdd"><i class="bi bi-plus-lg"></i></button>':''}</div>
        <table class="table table-sm table-srit mb-0"><tbody id="rlList"></tbody></table>
      </div></div>
      <div class="col-lg-8"><div class="card-srit p-3"><div class="d-flex justify-content-between mb-3 align-items-center flex-wrap gap-2"><h6 class="section-title mb-0">Matriks Hak Akses</h6>
        <div class="d-flex gap-2"><select class="form-select form-select-sm w-auto" id="rlSel">${roles.map(r=>`<option value="${r.ID}">${r.NAME}</option>`).join('')}</select>
        ${canManage?'<button class="btn btn-success btn-sm" id="rlSave"><i class="bi bi-save"></i> Simpan</button>':''}</div></div>
        <div id="rlMatrix"></div>
      </div></div>
    </div>`;
    this._drawList();
    const add=$('#rlAdd');if(add)add.onclick=()=>this.roleForm();
    $('#rlSel').onchange=()=>this._drawMatrix(canManage);
    const sv=$('#rlSave');if(sv)sv.onclick=()=>this._save();
    this._drawMatrix(canManage);
  },
  _drawList(){
    const roles=SRIT.Store.read('ROLES');const canManage=SRIT.Auth.can('role:MANAGE')||SRIT.Auth.isSuper();
    $('#rlList').innerHTML=roles.map(r=>`<tr><td class="fw-semibold">${r.NAME}<div class="text-muted-2" style="font-size:11px">${r.ID}</div></td>
      <td class="text-end"><span class="badge-soft st-IZIN">Tingkat ${r.LEVEL}</span>
      ${canManage&&r.ID!=='SUPER_ADMIN'?`<button class="btn btn-sm btn-outline-secondary py-0 ms-1" onclick="SRIT.Features.role.roleForm('${r.ID}')"><i class="bi bi-pencil"></i></button>`:''}</td></tr>`).join('');
  },
  // Baris matriks = SELURUH menu sidebar (urutan & kelompok mengikuti SRIT.MENU); modul izin tiap menu dari SRIT.permForRoute.
  _menuRows(perms){
    const rows=[],seen={};let sec='';
    SRIT.MENU.forEach(m=>{
      if(m.sec){sec=m.sec;return;}
      if(m.r==='live'){rows.push({sec,t:m.t,live:true});return;}
      const mod=SRIT.permForRoute(m.r);if(seen[mod])return;seen[mod]=1;
      rows.push({sec,t:m.t,mod});
    });
    // modul di tabel izin yang tidak punya menu (mis. data lama) tetap ditampilkan agar bisa dicabut
    [...new Set(perms.map(p=>p.MODULE))].filter(mod=>!seen[mod]).forEach(mod=>rows.push({sec:'LAINNYA',t:mod,mod}));
    return rows;
  },
  _drawMatrix(canManage){
    const role=$('#rlSel').value;const rp=SRIT.Store.read('ROLE_PERMISSIONS');
    const perms=SRIT.Store.read('PERMISSIONS');const have=new Set(perms.map(p=>p.ID));
    const acts=['VIEW','CREATE','UPDATE','DELETE','EXPORT','APPROVE','MANAGE'];
    const isSuper=role==='SUPER_ADMIN',edit=canManage&&!isSuper;
    const granted=new Set(rp.filter(x=>x.ROLE_ID===role).map(x=>x.PERMISSION_ID));
    const rows=this._menuRows(perms);let html='',curSec=null,nOn=0,nAll=0;
    rows.forEach(r=>{
      if(r.sec!==curSec){curSec=r.sec;html+=`<tr class="rl-sec"><td colspan="${acts.length+2}" style="font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--srit-text-2);background:var(--srit-hover)">${curSec}</td></tr>`;}
      if(r.live){html+=`<tr><td class="fw-semibold">${r.t}</td><td colspan="${acts.length+1}" class="text-muted-2" style="font-size:12px"><i class="bi bi-globe2"></i> Terbuka untuk umum tanpa login — tampilannya diatur di menu Pengaturan, bukan lewat hak akses.</td></tr>`;return;}
      let cells='',rowIds=[];
      acts.forEach(a=>{
        const pid=r.mod+':'+a;
        if(!have.has(pid)){cells+='<td class="text-center text-muted-2">–</td>';return;}
        const on=isSuper||granted.has(pid);nAll++;if(on)nOn++;rowIds.push(pid);
        cells+=edit?`<td class="text-center"><input type="checkbox" class="form-check-input rl-cb" data-pid="${pid}" data-row="${r.mod}" ${on?'checked':''}></td>`
          :`<td class="text-center"><i class="bi bi-${on?'check-circle-fill text-success':'dash-circle text-muted-2'}"></i></td>`;
      });
      const all=edit&&rowIds.length>1?`<td class="text-center"><input type="checkbox" class="form-check-input rl-all" data-row="${r.mod}" title="Pilih semua aksi menu ini"></td>`:'<td></td>';
      html+=`<tr><td class="fw-semibold">${r.t}<div class="text-muted-2" style="font-size:10.5px;font-weight:400">${r.mod}</div></td>${cells}${all}</tr>`;
    });
    $('#rlMatrix').innerHTML=`<div class="text-muted-2 mb-2" style="font-size:12px">${nOn} dari ${nAll} izin aktif untuk peran ini · ${rows.filter(r=>!r.live).length} menu</div>
      <div class="table-responsive" style="max-height:68vh;overflow:auto"><table class="table table-sm table-srit mb-0"><thead><tr>
      <th style="position:sticky;top:0;z-index:2;background:var(--srit-card)">Menu</th>${acts.map(a=>`<th class="text-center" style="position:sticky;top:0;z-index:2;background:var(--srit-card)">${this.ACT[a]}</th>`).join('')}<th class="text-center" style="position:sticky;top:0;z-index:2;background:var(--srit-card)">Semua</th></tr></thead><tbody>${html}</tbody></table></div>
      ${isSuper?'<div class="alert alert-info py-2 mt-2 mb-0" style="font-size:12px"><i class="bi bi-shield-lock"></i> SUPER_ADMIN memiliki akses penuh global secara otomatis dan tidak dapat diubah.</div>':''}
      <div class="text-muted-2 mt-2" style="font-size:11px">Tanda “–” berarti aksi itu tidak tersedia di menu tersebut. “Lihat” diperlukan agar menu muncul di sidebar.</div>`;
    if(edit){
      const sync=row=>{const cbs=$$('.rl-cb[data-row="'+row+'"]');const all=$('.rl-all[data-row="'+row+'"]');if(all){all.checked=cbs.length>0&&cbs.every(c=>c.checked);}};
      $$('.rl-all').forEach(el=>{sync(el.dataset.row);el.onchange=()=>{$$('.rl-cb[data-row="'+el.dataset.row+'"]').forEach(c=>c.checked=el.checked);};});
      $$('.rl-cb').forEach(el=>el.addEventListener('change',()=>sync(el.dataset.row)));
    }
  },
  _save(){
    const role=$('#rlSel').value;
    if(role==='SUPER_ADMIN'){SRIT.Notify('SUPER_ADMIN tidak dapat diubah','warn');return;}
    let rows=SRIT.Store.read('ROLE_PERMISSIONS').filter(x=>x.ROLE_ID!==role);
    $$('.rl-cb').forEach(cb=>{if(cb.checked)rows.push({ROLE_ID:role,PERMISSION_ID:cb.dataset.pid});});
    SRIT.Store.write('ROLE_PERMISSIONS',rows);
    SRIT.Cache.invalidate('perm');SRIT.Audit.log('UPDATE','role',role);
    SRIT.Notify('Hak akses peran disimpan','ok');
    if(SRIT.Auth.user&&SRIT.Auth.user.ROLE===role)SRIT.renderNav();
  },
  roleForm(id){
    const r=id?SRIT.Repo.getById('ROLES',id):{};
    const m=SRIT.Modal.open({title:(id?'Edit':'Tambah')+' Peran',
      body:`<form id="rfForm"><div class="row g-2">
        <div class="col-12"><label class="form-label-sm">Kode Peran (huruf besar)</label><input class="form-control form-control-sm" name="ID" value="${r.ID||''}" ${id?'readonly':'required'} placeholder="cth: WALI_KELAS"></div>
        <div class="col-8"><label class="form-label-sm">Nama Peran</label><input class="form-control form-control-sm" name="NAME" value="${r.NAME||''}" required></div>
        <div class="col-4"><label class="form-label-sm">Tingkat</label><input type="number" class="form-control form-control-sm" name="LEVEL" value="${r.LEVEL||10}"></div>
      </div></form>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="rfSave">Simpan</button>`});
    $('#rfSave',m.el).onclick=()=>{
      const f=$('#rfForm',m.el);if(!f.reportValidity())return;
      const d=Object.fromEntries(new FormData(f));d.LEVEL=+d.LEVEL;d.ID=d.ID.toUpperCase().replace(/\s+/g,'_');
      if(id){SRIT.Repo.update('ROLES',id,{NAME:d.NAME,LEVEL:d.LEVEL});SRIT.Audit.log('UPDATE','role',id);}
      else{if(SRIT.Repo.getById('ROLES',d.ID)){SRIT.Notify('Kode peran sudah ada','err');return;}SRIT.Repo.insert('ROLES',d);SRIT.Audit.log('CREATE','role',d.ID);}
      m.close();SRIT.Notify('Peran tersimpan','ok');SRIT.Router.loadFeature('role');
    };
  },
  destroy(){}
};
</script>

<script>__srit.n('View_Analytics')</script>
<script>
//# sourceURL=View_Analytics.html
// ---------- ANALISIS DATA — 4 modul (Absensi / Izin & Kepulangan / Sakit / Pelanggaran) ----------
// Tiap modul: filter Harian/Mingguan/Bulanan + rentang tanggal + filter berjenjang (Jenjang/JK/Asrama).
SRIT.Features.analytics={
  tab:'absensi',
  charts:[],
  _lastAsramaList:[],
  state:{
    absensi:{period:'harian',from:'',to:'',kegName:'',jenjang:'',jk:'',asrama:''},
    izin:{period:'harian',from:'',to:'',jenjang:'',jk:'',asrama:''},
    sakit:{period:'harian',from:'',to:'',jenjang:'',jk:'',asrama:''},
    pelanggaran:{period:'harian',from:'',to:'',jenjang:'',jk:'',asrama:''}
  },
  render(host){
    SRIT.UI.setPage('Analisis Data','Analisis Data');
    this._host=host;
    this.load();
  },
  async load(){
    const host=this._host;this.destroy();
    host.innerHTML=`<ul class="nav nav-pills mb-3" id="anTabs">
      <li class="nav-item"><a class="nav-link ${this.tab==='absensi'?'active':''} pointer" data-tab="absensi"><i class="bi bi-calendar-check me-1"></i>Absensi</a></li>
      <li class="nav-item"><a class="nav-link ${this.tab==='izin'?'active':''} pointer" data-tab="izin"><i class="bi bi-door-open me-1"></i>Izin & Kepulangan</a></li>
      <li class="nav-item"><a class="nav-link ${this.tab==='sakit'?'active':''} pointer" data-tab="sakit"><i class="bi bi-thermometer-half me-1"></i>Sakit</a></li>
      <li class="nav-item"><a class="nav-link ${this.tab==='pelanggaran'?'active':''} pointer" data-tab="pelanggaran"><i class="bi bi-exclamation-triangle me-1"></i>Pelanggaran</a></li>
    </ul>
    <div id="anBody"><div class="skeleton" style="height:320px"></div></div>`;
    $$('#anTabs a').forEach(a=>a.onclick=()=>{if(this.tab===a.dataset.tab)return;this.tab=a.dataset.tab;this.load();});
    const fn={absensi:this.loadAbsensi,izin:this.loadIzin,sakit:this.loadSakit,pelanggaran:this.loadPelanggaran}[this.tab];
    try{ await fn.call(this); }
    catch(e){ const b=$('#anBody'); if(b&&SRIT.currentFeature==='analytics') b.innerHTML='<div class="empty-state"><i class="bi bi-exclamation-triangle d-block text-danger"></i>'+SRIT.Util.esc(e.message||'Gagal memuat analitik')+' <button class="btn btn-sm btn-primary mt-2" onclick="SRIT.Features.analytics.load()">Coba Lagi</button></div>'; }
  },
  // ---------------------------------------------------------------- komponen bersama ----
  kpi(v,l,c){return `<div class="col-6 col-lg-3"><div class="kpi"><div class="kpi-lbl">${l}</div><div class="kpi-val" style="color:${c}">${v}</div></div></div>`;},
  filterBarHTML(st,asramaList,extraHtml){
    this._lastAsramaList=asramaList||[];
    return `<div class="card-srit p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
        <h6 class="section-title mb-0">Filter</h6>
        <div class="btn-group btn-group-sm">
          <button class="btn ${st.period==='harian'?'btn-primary':'btn-outline-secondary'}" data-p="harian">Harian</button>
          <button class="btn ${st.period==='mingguan'?'btn-primary':'btn-outline-secondary'}" data-p="mingguan">Mingguan</button>
          <button class="btn ${st.period==='bulanan'?'btn-primary':'btn-outline-secondary'}" data-p="bulanan">Bulanan</button>
        </div>
      </div>
      <div class="filter-bar">
        <div><label class="form-label-sm">Dari Tanggal</label><input type="date" class="form-control form-control-sm" id="anFrom" value="${st.from||''}" max="${SRIT.Util.todayISO()}"></div>
        <div><label class="form-label-sm">Sampai Tanggal</label><input type="date" class="form-control form-control-sm" id="anTo" value="${st.to||''}" max="${SRIT.Util.todayISO()}"></div>
        <div><label class="form-label-sm">Jenjang</label><select class="form-select form-select-sm" id="anJenjang"><option value="">Semua</option>${['SRD','SRMP','SRMA'].map(j=>`<option ${st.jenjang===j?'selected':''}>${j}</option>`).join('')}</select></div>
        <div><label class="form-label-sm">Jenis Kelamin</label><select class="form-select form-select-sm" id="anJk"><option value="">Semua</option><option value="L" ${st.jk==='L'?'selected':''}>Putra</option><option value="P" ${st.jk==='P'?'selected':''}>Putri</option></select></div>
        <div style="min-width:170px"><label class="form-label-sm">Asrama</label><select class="form-select form-select-sm" id="anAsrama"><option value="">Semua</option>${(asramaList||[]).map(a=>`<option value="${a.id}" ${st.asrama===a.id?'selected':''}>${SRIT.Util.esc(a.nama)}</option>`).join('')}</select></div>
        ${extraHtml||''}
        <div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-primary btn-sm" id="anApply"><i class="bi bi-funnel"></i> Terapkan</button></div>
        <div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-outline-secondary btn-sm" id="anReset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button></div>
      </div>
      <div id="anActiveChips"></div>
    </div>`;
  },
  wireFilterBar(st,afterApply){
    $$('[data-p]').forEach(b=>b.onclick=()=>{st.period=b.dataset.p;afterApply();});
    $('#anApply').onclick=()=>{
      st.from=$('#anFrom').value;st.to=$('#anTo').value;
      st.jenjang=$('#anJenjang').value;st.jk=$('#anJk').value;st.asrama=$('#anAsrama').value;
      const kegEl=$('#anKeg');if(kegEl)st.kegName=kegEl.value;
      afterApply();
    };
    $('#anReset').onclick=()=>{
      st.from='';st.to='';st.jenjang='';st.jk='';st.asrama='';if('kegName' in st)st.kegName='';
      afterApply();
    };
    this.renderChipsFor(st,afterApply);
  },
  renderChipsFor(st,afterApply){
    const box=$('#anActiveChips');if(!box)return;
    const chips=[];
    if(st.from||st.to)chips.push({label:'Tanggal: '+(st.from?SRIT.Util.fmtDateShort(st.from):'awal')+' s/d '+(st.to?SRIT.Util.fmtDateShort(st.to):'kini'),clear:()=>{st.from='';st.to='';}});
    if(st.jenjang)chips.push({label:'Jenjang: '+st.jenjang,clear:()=>{st.jenjang='';}});
    if(st.jk)chips.push({label:'JK: '+(st.jk==='L'?'Putra':'Putri'),clear:()=>{st.jk='';}});
    if(st.asrama){const nm=(this._lastAsramaList||[]).find(a=>a.id===st.asrama);chips.push({label:'Asrama: '+(nm?nm.nama:st.asrama),clear:()=>{st.asrama='';}});}
    if(st.kegName)chips.push({label:'Kegiatan: '+st.kegName,clear:()=>{st.kegName='';}});
    if(!chips.length){box.innerHTML='';return;}
    box.innerHTML=`<div class="d-flex align-items-center gap-2 flex-wrap mt-2">
      <span class="text-muted-2" style="font-size:11px">Filter aktif:</span>
      ${chips.map((c,i)=>`<span class="sf-chip" data-chip="${i}">${SRIT.Util.esc(c.label)} <i class="bi bi-x"></i></span>`).join('')}
      ${chips.length>1?'<span class="text-muted-2 pointer" id="anClearAll" style="font-size:11px;text-decoration:underline">Hapus semua filter</span>':''}
    </div>`;
    box.querySelectorAll('[data-chip]').forEach((el,i)=>{el.onclick=()=>{chips[i].clear();afterApply();};});
    const ca=$('#anClearAll');if(ca)ca.onclick=()=>{st.from='';st.to='';st.jenjang='';st.jk='';st.asrama='';if('kegName' in st)st.kegName='';afterApply();};
  },
  rankTable(title,rows,icon){
    if(!rows.length)return `<div class="card-srit p-3"><h6 class="section-title mb-2">${title}</h6><div class="text-center text-muted-2 py-3" style="font-size:12px">Tidak ada data pada periode ini.</div></div>`;
    return `<div class="card-srit p-3"><h6 class="section-title mb-2"><i class="bi ${icon} me-1"></i>${title}</h6>
      <table class="table table-sm table-srit mb-0"><tbody>${rows.map((r,i)=>`<tr><td style="width:24px;color:var(--srit-text-2)">${i+1}</td><td>${SRIT.Util.esc(r.nama||r.judul)}</td><td class="text-muted-2" style="font-size:11px">${SRIT.Util.esc(r.jenjang||r.tingkat||'')}</td><td class="text-end fw-semibold">${r.count}</td></tr>`).join('')}</tbody></table></div>`;
  },
  // ============================================================= TAB 1: ABSENSI =====
  async loadAbsensi(){
    const st=this.state.absensi;
    const d=await SRIT.Api.getAnalytics(st.period,{from:st.from,to:st.to,sessionName:st.kegName,jenjang:st.jenjang,jk:st.jk,asrama:st.asrama});
    if(SRIT.currentFeature!=='analytics'||this.tab!=='absensi')return;
    const kegHtml=`<div style="min-width:200px"><label class="form-label-sm">Kegiatan (opsional)</label><select class="form-select form-select-sm" id="anKeg"><option value="">Semua Kegiatan</option>${d.kegNames.map(n=>`<option value="${SRIT.Util.esc(n)}" ${st.kegName===n?'selected':''}>${SRIT.Util.esc(n)}</option>`).join('')}</select></div>`;
    $('#anBody').innerHTML=`
      ${this.filterBarHTML(st,d.asramaList,kegHtml)}

  // ============================================================= TAB 4: PELANGGARAN =====

<script>
//# sourceURL=View_Laporan.html
// ---------- LAPORAN (Pusat Laporan: Wali Asrama & Wali Asuh) ----------
SRIT.Features.laporan={
  active:null,from:'',to:'',
  _range(){const to=this.to||SRIT.Util.todayISO();const from=this.from||(()=>{const d=new Date(to+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-29);return d.toISOString().slice(0,10);})();return {from,to};},
  _inRange(tgl){if(!tgl)return true;const {from,to}=this._range();return tgl>=from&&tgl<=to;},
  // ===== data absensi berskala besar dihitung server; diambil sekali sebelum build()/cetak =====
  _agg(){return (this._pf&&this._pf.agg)||{total:0,hadir:0,byAnak:{},byKeg:{}};},
  _attDayRows(iso){ // baris ringkas (KEGIATAN_ID,STATUS) dari jumlah per sesi hari itu
    const bs=((this._pf&&this._pf.day)||{}).bySession||{};const out=[];
    Object.keys(bs).forEach(sid=>['HADIR','IZIN','SAKIT','ALPA'].forEach(st=>{for(let i=0;i<(bs[sid][st]||0);i++)out.push({KEGIATAN_ID:sid,STATUS:st});}));
    return out;},
  async _prefetch(id){
    const needAgg=['wr-bulanan','wa-kehadiran','wa-refleksi'].includes(id),needDay=id==='wr-harian';
    if(!needAgg&&!needDay)return;
    const {from,to}=this._range();const iso=this.to||SRIT.Util.todayISO();
    const key=[from,to,iso,needAgg?'a':'',needDay?'d':''].join('|');
    if(this._pf&&this._pf.key===key&&Date.now()-this._pf.t<600000)return;
    SRIT.Loading.show();
    const pf={key,t:Date.now(),agg:null,day:null};
    try{
      if(needAgg)pf.agg=await SRIT.Api.getReportAttAgg(from,to);
      if(needDay)pf.day=await SRIT.Api.getReportAttDay(iso);
    }catch(e){SRIT.Notify(e.message||'Gagal memuat data absensi','err');}
    SRIT.Loading.hide();this._pf=pf;
  },
  _anak(id){const a=SRIT.Repo.getById('ANAK',id)||{};return a;},
  _kamar(id){return (SRIT.Repo.getById('KAMAR',id)||{}).NAME||'-';},
  // ===== Registry laporan =====
  reports(){
    const T=this;
    const attAgg=()=>T._agg(); // agregat absensi rentang tanggal (dihitung server; diambil oleh _prefetch)
    return [
     // ================= WALI ASRAMA =================
     {id:'wr-harian',grp:'WALI ASRAMA',name:'Laporan Harian Keasramaan',periode:'Harian',icon:'bi-calendar-day',build(){
        const iso=T.to||SRIT.Util.todayISO();
        const rek=SRIT.Store.read('REKAP_HARIAN').find(r=>r.TANGGAL===iso)||{TOTAL:0,HADIR:0,IZIN:0,SAKIT:0,ALPA:0};
        const keg=SRIT.Api.getSessionsForDate(iso);
        const mon=SRIT.Store.read('OPS_MONITORING').filter(m=>m.TANGGAL===iso);
        const log=SRIT.Store.read('OPS_LOGKEJADIAN').filter(m=>m.TANGGAL===iso);
        const plg=SRIT.Store.read('PELANGGARAN').filter(m=>m.TANGGAL===iso);
        const cols=['Aspek','Ringkasan'];
        const rows=[
          ['Tanggal',SRIT.Util.fmtDate(iso)],
          ['Total Peserta',rek.TOTAL],['Hadir',rek.HADIR+' ('+SRIT.Util.pct(rek.HADIR,rek.TOTAL)+'%)'],
          ['Izin / Sakit / Alpa',rek.IZIN+' / '+rek.SAKIT+' / '+rek.ALPA],
          ['Jumlah Kegiatan',keg.length],
          ['Monitoring Kondisi',mon.length?mon.map(m=>m.LOKASI+': '+m.KONDISI).join('; '):'-'],
          ['Kejadian 24 Jam',log.length?log.map(l=>(l.JAM||'')+' '+l.KEJADIAN).join('; '):'Nihil'],
          ['Pelanggaran',plg.length?plg.length+' kasus':'Nihil']
        ];
        return {cols,rows,meta:[['Periode','Harian'],['Tanggal',SRIT.Util.fmtDate(iso)]]};
     }},
     {id:'wr-refleksi',grp:'WALI ASRAMA',name:'Laporan Refleksi Mingguan',periode:'Mingguan',icon:'bi-arrow-repeat',build(){
        const rows=SRIT.Store.read('REFLEKSI').filter(r=>T._inRange(r.TANGGAL)).map(r=>[SRIT.Util.fmtDateShort(r.TANGGAL),r.PERIODE,r.PJ,r.CAPAIAN,r.MASALAH,r.TINDAK_LANJUT]);
        return {cols:['Tanggal','Periode','PJ','Capaian','Masalah','Tindak Lanjut'],rows};
     }},
     {id:'wr-bulanan',grp:'WALI ASRAMA',name:'Laporan Pengelolaan Asrama Bulanan',periode:'Bulanan',icon:'bi-calendar-month',build(){
        const AG=attAgg();
        const rekapCount=t=>SRIT.Store.read(t).filter(x=>T._inRange(x.TANGGAL)).length;
        const cols=['Komponen','Jumlah / Ringkasan'];
        const rows=[
          ['Total Rekaman Absensi',AG.total],
          ['Rata-rata Kehadiran',SRIT.Util.pct(AG.hadir,AG.total)+'%'],
          ['Kegiatan Khusus',SRIT.Store.read('KEGIATAN').filter(k=>T._inRange(k.TANGGAL)).length],
          ['Izin & Kepulangan',rekapCount('IZIN')],
          ['Kunjungan / Tamu',rekapCount('BUKU_TAMU')+SRIT.Store.read('OPS_KUNJUNGAN').filter(x=>T._inRange(x.TANGGAL)).length],
          ['Pelanggaran',rekapCount('PELANGGARAN')],['Pembinaan',rekapCount('PEMBINAAN')],
          ['Insiden',SRIT.Store.read('INSIDEN').filter(x=>T._inRange(x.TANGGAL)).length],
          ['Inspeksi Kamar',rekapCount('INSPEKSI')],
          ['Monitoring 24 Jam',rekapCount('OPS_MONITORING')]
        ];
        return {cols,rows};
     }},
     {id:'wr-perkembangan',grp:'WALI ASRAMA',name:'Laporan Perkembangan Peserta Didik',periode:'Bulanan/Semester',icon:'bi-graph-up-arrow',build(){
        const asp=['KARAKTER','DISIPLIN','KEMANDIRIAN','KEBERSIHAN','KEAGAMAAN','LEADERSHIP','SOSIAL','KEBAHASAAN'];
        const rows=SRIT.Store.read('PENILAIAN').filter(r=>T._inRange(r.TANGGAL)).map(r=>{
          const vals=asp.map(a=>+r[a]||0);const avg=(vals.reduce((x,y)=>x+y,0)/asp.length).toFixed(1);
          return [T._anak(r.ANAK).NAMA||r.NAMA_ANAK,r.PERIODE,...asp.map(a=>r[a]||'-'),avg];
        });
        return {cols:['Anak','Periode',...asp.map(a=>a.slice(0,4)),'Rata'],rows};
     }},
     {id:'wr-pembinaan',grp:'WALI ASRAMA',name:'Laporan Kegiatan Pembinaan',periode:'Per Kegiatan',icon:'bi-stars',build(){
        const rows=SRIT.Store.read('PROGRAM').map(p=>[p.NAME,p.KATEGORI,p.TARGET,p.PERIODE,p.STATUS]);
        return {cols:['Program','Kategori','Target','Periode','Status'],rows};

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">

  _kop(set,judul,subtitle){
    return `<div class="head">${set.LOGO_URL?`<img src="${set.LOGO_URL}" style="height:64px;margin-bottom:6px">`:''}
      <div style="font-size:11px;letter-spacing:1px">PEMERINTAH — SEKOLAH RAKYAT</div>
      <h2>${SRIT.Util.esc(set.SCHOOL_NAME||'SEKOLAH RAKYAT')}</h2>
      ${set.SCHOOL_ADDRESS?`<div style="font-size:11px">${SRIT.Util.esc(set.SCHOOL_ADDRESS)}</div>`:''}
      <div class="rule"></div>
      <h3>${SRIT.Util.esc(judul)}</h3>${subtitle?`<div style="font-size:12px;color:#555">${SRIT.Util.esc(subtitle)}</div>`:''}</div>`;
  },
  _signBlock(right,left){
    const to=this.to||SRIT.Util.todayISO();
    return `<div class="sign"><div>${left||'Mengetahui,<br>Kepala Sekolah'}<br><br><br><br><b><u>&nbsp;....................................&nbsp;</u></b></div>
      <div>${SRIT.Util.fmtDateShort(to)}<br>${right||'Wali Asrama'}<br><br><br><br><b><u>&nbsp;....................................&nbsp;</u></b></div></div>`;
  },
  _printDoc(title,inner){
    const html=`<html><head><title>${SRIT.Util.esc(title)}</title><meta charset="utf-8"><style>
      *{box-sizing:border-box}body{font-family:'Times New Roman',serif;color:#000;padding:26px 32px;font-size:12.5px;line-height:1.45}
      .head{text-align:center;margin-bottom:14px}.head h2{margin:0;font-size:17px}.head h3{margin:8px 0 0;font-size:14px;text-decoration:underline}
      .rule{border-top:3px solid #000;border-bottom:1px solid #000;height:3px;margin:6px 0 10px}
      table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
      th,td{border:1px solid #000;padding:4px 7px;text-align:left;vertical-align:top}
      thead{background:#e9edf3}
      .info td{border:0;padding:1px 3px}.info{margin-bottom:6px}
      h4{margin:14px 0 4px;font-size:13px}
      .sign{display:flex;justify-content:space-between;margin-top:38px;text-align:center;font-size:12.5px}

      ul{margin:4px 0 4px 18px}
      @media print{@page{margin:14mm}}
    </style></head><body>${inner}
      <script>window.onload=function(){setTimeout(function(){window.print();},350);}<\/script>
    </body></html>`;
    const w=window.open('','_blank');if(!w){SRIT.Notify('Popup diblokir, izinkan popup untuk mencetak','err');return;}
    w.document.write(html);w.document.close();w.focus();
