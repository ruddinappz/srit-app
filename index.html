<script>
//# sourceURL=JS_Router.html
/* =========================================================================
   ROUTER + FEATURE LOADER (lazy, with lifecycle)
   ========================================================================= */
SRIT.Router={
  routes:['dashboard','anak','absensi','kegiatan','jadwal','jadwal-piket','bel','keasramaan','keasramaan-master','penghuni','peta','program','izin','tamu','tatatertib','pelanggaran','pembinaan','insiden','inspeksi','sarpras','refleksi','penilaian','profiling','alert-center','analytics','laporan','user','jabatan','role','audit','settings'],
  go(){
    const _nav=(this._nav=(this._nav||0)+1);
    let hash=location.hash.replace('#/','')||'live';
    // ----- PUBLIC LIVE TV -----
    if(hash==='live'||hash==='mobile-live'){SRIT.LiveTV.show(hash==='mobile-live');return;}
    SRIT.LiveTV.hide();
    // ----- LOGIN -----
    if(hash==='login'){this._showLogin();return;}
    // ----- AUTH GUARD -----
    if(!SRIT.Auth.user){location.hash='#/login';return;}
    this._showApp();
    // ----- OPS operational sub-module: #/ops/<key> -----
    let opsKey=null;
    if(hash.indexOf('ops/')===0){opsKey=hash.slice(4);hash='ops-module';}
    let route=(hash==='ops-module')?'ops-module':(this.routes.includes(hash)?hash:'dashboard');
    // permission guard
    const permRoute=(route==='ops-module')?'keasramaan':route;
    if(route!=='dashboard'&&!SRIT.Auth.canModule(SRIT.permForRoute(permRoute))){
      SRIT.Notify('Anda tidak memiliki akses ke modul ini','err');
      if(location.hash!=='#/dashboard')location.hash='#/dashboard';return;
    }
    // segarkan cermin data (multi-pengguna) sebelum menampilkan modul; batalkan bila pengguna sudah pindah
    SRIT.Sync.ensureFresh().then(()=>{if(_nav!==this._nav)return;this.loadFeature(route,opsKey);});
  },
  loadFeature(route,arg){
    // destroy previous
    if(SRIT.currentFeature&&SRIT.Features[SRIT.currentFeature]&&SRIT.Features[SRIT.currentFeature].destroy){
      try{SRIT.Features[SRIT.currentFeature].destroy();}catch(e){}
    }
    // active nav (ops modules highlight the Keasramaan menu)
    const navRoute=route==='ops-module'?'keasramaan':route;
    $$('.nav-link-srit').forEach(el=>el.classList.toggle('active',el.dataset.route===navRoute));
    const host=$('#featureHost');host.innerHTML='';
    const feat=SRIT.Features[route];
    if(!feat){host.innerHTML='<div class="empty-state"><i class="bi bi-cone-striped d-block"></i>Modul dalam pengembangan</div>';return;}
    SRIT.currentFeature=route;
    const _fail=e=>{if(SRIT.currentFeature!==route)return;console.error(e);host.innerHTML='<div class="empty-state"><i class="bi bi-exclamation-triangle d-block text-danger"></i>Terjadi kesalahan memuat modul. <button class="btn btn-sm btn-primary mt-2" onclick="SRIT.Router.go()">Coba Lagi</button></div>';};
    try{const _p=feat.render(host,arg);if(_p&&_p.catch)_p.catch(_fail);}catch(e){_fail(e);}
  },
  _showLogin(){$('#appShell').style.display='none';$('#loginRoot').style.display='flex';},
  _showApp(){$('#loginRoot').style.display='none';$('#appShell').style.display='block';
    const u=SRIT.Auth.user;$('#userNameSb').textContent=u.NAME;$('#userRoleSb').textContent=u.ROLE;$('#userAvatar').textContent=u.NAME[0];
    SRIT.renderNav();
    // notifications
    $('#notifList').innerHTML=SRIT.Store.read('NOTIFIKASI').map(n=>`<div class="px-2 py-1 border-bottom" style="font-size:12px">${SRIT.Util.esc(n.TEXT)}</div>`).join('')||'<div class="text-muted-2 small px-2">Tidak ada notifikasi</div>';
  }
};
</script>

<script>__srit.n('View_LiveTV')</script>
<script>
//# sourceURL=View_LiveTV.html
/* =========================================================================
   LIVE TV (public, aggregated) — polling summary only
   ========================================================================= */
SRIT.LiveTV={
  timer:null,clockTimer:null,rotTimer:null,mobile:false,slide:0,slideCount:1,fDate:'',fSesi:'',
  show(mobile){
    this.mobile=mobile;this.slide=0;this.fDate='';this.fSesi='';
    $('#appShell').style.display='none';$('#loginRoot').style.display='none';
    const root=$('#liveTvRoot');root.classList.add('show');root.style.display='flex';
    this.buildShell();
    this.refreshData();
    this.startClock();
    const poll=(SRIT.Store.readObj('SETTINGS').LIVETV_POLLING||15)*1000;
    this.stop();this.timer=setInterval(()=>{ if(!this.fDate)this.refreshData(); },poll);
    this.startRotation();
    SRIT.Bell.start();   // mulai memantau jadwal bel (baru benar-benar berbunyi setelah tombol "Aktifkan Bel" disentuh)
    if(!this._resizeBound){
      this._resizeBound=true;
      window.addEventListener('resize',()=>{
        clearTimeout(this._resizeT);
        this._resizeT=setTimeout(()=>{this.fitScrollzones();this.setupAutoScroll();},200);
      });
    }
  },
  isHist(){return !!(this.fDate&&this.fDate!==SRIT.Util.todayISO());},
  hide(){const root=$('#liveTvRoot');if(root){root.style.display='none';root.classList.remove('show');}this.stop();
    if(this.clockTimer){clearInterval(this.clockTimer);this.clockTimer=null;}
    if(this.rotTimer){clearInterval(this.rotTimer);this.rotTimer=null;}
    SRIT.Bell.stop();},
  stop(){if(this.timer){clearInterval(this.timer);this.timer=null;}},
  startClock(){if(this.clockTimer)clearInterval(this.clockTimer);this.clockTimer=setInterval(()=>{const c=$('#ltvClock');if(c)c.textContent=new Date().toLocaleTimeString('id-ID');},1000);},
  rotateSec(){return Math.max(5,+((SRIT.Store.readObj('SETTINGS').LIVETV_ROTATE)||10));},
  startRotation(){
    if(this.rotTimer){clearInterval(this.rotTimer);this.rotTimer=null;}
    if(this.slideCount<=1)return;
    const ms=this.rotateSec()*1000;
    this.rotTimer=setInterval(()=>this.goto((this.slide+1)%this.slideCount),ms);
  },
  goto(i){
    this.slide=i;
    $$('#ltvSlides .ltv-slide').forEach((el,idx)=>el.classList.toggle('active',idx===i));
    $$('#ltvDots .ltv-dot').forEach((el,idx)=>{el.classList.remove('active');if(idx===i){void el.offsetWidth;el.classList.add('active');}});
    const t=$('#ltvSlideTitle');if(t&&this._titles)t.textContent=this._titles[i]||'';
  },
  buildShell(){
    const root=$('#liveTvRoot');
    root.innerHTML=`
      <div class="ltv-header">
        <div class="ltv-logo" id="ltvLogo"></div>
        <div class="ltv-school flex-grow-1"><b id="ltvSchool"></b><small id="ltvApp"></small></div>
        <div class="ltv-slide-title" id="ltvSlideTitle"></div>
        <div><div class="ltv-clock" id="ltvClock">${new Date().toLocaleTimeString('id-ID')}</div><div class="ltv-date" id="ltvDate"></div></div>
        <div class="ltv-status"><i class="bi bi-broadcast"></i> OPERASIONAL</div>
      </div>
      <div class="ltv-body">
        <div id="ltvSlides" style="position:absolute;inset:0"></div>
        <div class="ltv-dots" id="ltvDots"></div>
      </div>
      <!-- Panel filter data lama -->
      <div id="ltvFilter" style="position:fixed;bottom:64px;right:clamp(10px,1.2vw,18px);z-index:1601;display:none;background:#0e1830;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;width:min(300px,90vw);box-shadow:0 12px 40px rgba(0,0,0,.5)">
        <div class="d-flex justify-content-between align-items-center mb-2"><b style="font-size:13px">Filter Data</b><i class="bi bi-x-lg pointer" onclick="SRIT.LiveTV.toggleFilter(false)"></i></div>
        <label class="form-label-sm" style="color:#9fb6da">Tanggal</label>
        <input type="date" class="form-control form-control-sm mb-2" id="ltvFDate" max="${SRIT.Util.todayISO()}">
        <label class="form-label-sm" style="color:#9fb6da">Kegiatan</label>
        <select class="form-select form-select-sm mb-2" id="ltvFSesi"></select>
        <div class="d-flex gap-2"><button class="ltv-btn flex-grow-1" onclick="SRIT.LiveTV.applyFilter()"><i class="bi bi-funnel"></i> Terapkan</button>
          <button class="ltv-btn" onclick="SRIT.LiveTV.resetFilter()"><i class="bi bi-arrow-counterclockwise"></i> Hari Ini</button></div>
      </div>
      <div class="ltv-adminbar">
        <button class="ltv-btn" id="ltvBelBtn" onclick="SRIT.LiveTV.armBell()"><i class="bi bi-bell"></i> <span class="d-none d-md-inline">Aktifkan Bel</span></button>
        <button class="ltv-btn" id="ltvFilterBtn" onclick="SRIT.LiveTV.toggleFilter()"><i class="bi bi-funnel"></i> <span class="d-none d-md-inline">Filter</span></button>
        <button class="ltv-btn" onclick="SRIT.LiveTV.prev()"><i class="bi bi-chevron-left"></i></button>
        <button class="ltv-btn" onclick="SRIT.LiveTV.next()"><i class="bi bi-chevron-right"></i></button>
        <button class="ltv-btn" onclick="SRIT.LiveTV.fullscreen()"><i class="bi bi-arrows-fullscreen"></i> <span class="d-none d-md-inline">Layar Penuh</span></button>
        <button class="ltv-btn" onclick="location.hash='#/login'"><i class="bi bi-box-arrow-in-right"></i> <span class="d-none d-md-inline">Login</span></button>
      </div>`;
  },
  async toggleFilter(show){
    const p=$('#ltvFilter');if(!p)return;
    const vis=show===undefined?p.style.display==='none':show;
    p.style.display=vis?'block':'none';
    if(vis){
      let d;try{d=await SRIT.Api.getLiveTVSummary(this.fDate||SRIT.Util.todayISO(),this.fSesi);}catch(e){return;}
      $('#ltvFDate').value=this.fDate||SRIT.Util.todayISO();
      $('#ltvFSesi').innerHTML='<option value="">Kegiatan Aktif / Terakhir</option>'+d.sessions.map(s=>`<option value="${s.id}" ${this.fSesi===s.id?'selected':''}>${SRIT.Util.esc(s.label)}</option>`).join('');
    }
  },
  applyFilter(){this.fDate=$('#ltvFDate').value||'';this.fSesi=$('#ltvFSesi').value||'';this.toggleFilter(false);this.refreshData();this.goto(0);},
  resetFilter(){this.fDate='';this.fSesi='';this.toggleFilter(false);this.refreshData();this.goto(0);},
  prev(){this.goto((this.slide-1+this.slideCount)%this.slideCount);this.startRotation();},
  next(){this.goto((this.slide+1)%this.slideCount);this.startRotation();},
  // ---- Komponen chart gaya "BI Dashboard" (dipakai refreshData) ----
  barsSvg(data,color){
    if(!data||!data.length)return '<div class="text-center" style="color:#9fb6da;padding:20px">Belum ada data</div>';
    const max=Math.max(1,...data.map(x=>x.value));
    const barW=34,gap=22,padT=16,padB=20;
    const W=data.length*(barW+gap),H=140;
    const bars=data.map((x,i)=>{
      const cx=i*(barW+gap)+gap/2;
      const h=Math.round((H-padT-padB)*(x.value/max));
      const y=H-padB-h;
      return `<rect x="${cx}" y="${y}" width="${barW}" height="${Math.max(h,1)}" rx="4" fill="${color}"/>
        <text x="${cx+barW/2}" y="${y-5}" text-anchor="middle" style="fill:#e8f0ff;font-weight:700">${x.value}</text>
        <text x="${cx+barW/2}" y="${H-6}" text-anchor="middle">${SRIT.Util.esc(x.label)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="ltv-hist">${bars}</svg>`;
  },
  gridTable(cols,rows,footLabel){
    if(!rows||!rows.length)return '<div class="text-center" style="color:#9fb6da;padding:14px">Belum ada data</div>';
    const thead=`<thead><tr>${cols.map(c=>`<th>${c.h}</th>`).join('')}</tr></thead>`;
    const tbody=`<tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>`;
    const foot=footLabel?`<tfoot><tr>${cols.map((c,i)=>`<td>${i===0?footLabel:(c.foot?c.foot(rows):'')}</td>`).join('')}</tr></tfoot>`:'';
    return `<div style="width:100%;overflow-x:auto"><table class="ltv-grid">${thead}${tbody}${foot}</table></div>`;
  },
  gaugeRow(items){
    if(!items||!items.length)return '<div class="text-center" style="color:#9fb6da;padding:14px">Belum ada data</div>';
    return `<div class="ltv-gauges">${items.map(it=>`<div class="ltv-gauge">
        <div class="ring" style="background:conic-gradient(${it.color} ${it.pct*3.6}deg,rgba(255,255,255,.08) 0)"><i style="color:${it.color}">${it.pct}%</i></div>
        <div class="lbl">${SRIT.Util.esc(it.label)}</div>
        <div class="sub">${SRIT.Util.esc(it.sub||'')}</div>
      </div>`).join('')}</div>`;
  },
  genderPanel(putra,putri){
    const max=Math.max(1,putra,putri);
    return `<div class="ltv-gender2">
      <div class="gr"><span style="color:#f472b6">Putri</span><div class="trk"><span style="width:${putri/max*100}%;background:linear-gradient(90deg,#db2777,#f472b6)"></span></div><b>${putri}</b></div>
      <div class="gr"><span style="color:#38bdf8">Putra</span><div class="trk"><span style="width:${putra/max*100}%;background:linear-gradient(90deg,#0ea5e9,#38bdf8)"></span></div><b>${putra}</b></div>
    </div>`;
  },
  async refreshData(){
    const _seq=(this._rseq=(this._rseq||0)+1);let d;
    try{d=await SRIT.Api.getLiveTVSummary(this.fDate||undefined,this.fSesi||undefined);}catch(e){return;}
    const _root=$('#liveTvRoot');if(_seq!==this._rseq||!_root||!_root.classList.contains('show'))return;
    SRIT.Bell.ingest(d.bel);
    this._updateBelBtn();
    const showAn=d.settings.LIVETV_SHOW_ANALYTICS!==false;
    const hist=this.isHist();
    // header
    $('#ltvLogo').innerHTML=d.logoUrl?`<img src="${d.logoUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:13px">`:SRIT.Util.esc(d.logo);
    $('#ltvSchool').textContent=d.school;
    $('#ltvApp').textContent=(d.settings.APP_NAME||'SRIT ABSENSI')+' · '+(d.settings.APP_SUBTITLE||'COMMAND CENTER');
    $('#ltvDate').textContent=SRIT.Util.fmtDate(d.date);
    // status: operasional (hari ini) atau data historis
    const st=$('#liveTvRoot .ltv-status');if(st)st.innerHTML=hist?`<i class="bi bi-clock-history"></i> DATA ${SRIT.Util.fmtDateShort(d.iso).toUpperCase()}`:`<i class="bi bi-broadcast"></i> OPERASIONAL`;
    if(st)st.style.background=hist?'rgba(245,158,11,.18)':'rgba(22,163,74,.18)';
    if(st)st.style.color=hist?'#fbbf24':'#4ade80';
    const fb=$('#ltvFilterBtn');if(fb)fb.style.background=hist?'rgba(245,158,11,.35)':'';
    // panels shorthand
    const P=(title,inner,cls)=>`<div class="${cls||'col-12 col-md-6 col-lg-4'}"><div class="ltv-panel"><h6>${title}</h6><div class="ltv-scrollzone">${inner}</div></div></div>`;
    const kpiFlat=`<div class="ltv-kpi-flat">
      ${[['Total Peserta',d.total,'#e8f0ff'],['Hadir',d.hadir,'#4ade80'],['Izin',d.izin,'#38bdf8'],['Sakit',d.sakit,'#fbbf24'],['Alpa',d.alpa,'#f87171'],['Belum',d.belum,'#9fb6da']].map(([l,v,c])=>`<div><div class="l">${l}</div><div class="v" style="color:${c}">${v}</div></div>`).join('')}
    </div>`;
    // tren sparkline
    const tr=d.trend;
    const spark=tr.length>1?`<svg viewBox="0 0 ${(tr.length-1)*40} 60" preserveAspectRatio="none" style="width:100%;height:clamp(70px,10vh,140px)">
        <polyline fill="none" stroke="#4ade80" stroke-width="2.5" points="${tr.map((p,i)=>i*40+','+(60-p.pct/100*55)).join(' ')}"/>
        ${tr.map((p,i)=>`<circle cx="${i*40}" cy="${60-p.pct/100*55}" r="3" fill="#4ade80"/>`).join('')}
      </svg><div class="d-flex justify-content-between mt-1" style="font-size:clamp(8px,.7vw,11px);color:#9fb6da">${tr.map(p=>`<span>${SRIT.Util.fmtDateShort(p.date).slice(0,6)}</span>`).join('')}</div>`:'<div class="text-center" style="color:#9fb6da;padding:20px">Belum ada data tren</div>';
    const okup=SRIT.Util.pct(d.stat.bedTerisi,d.stat.bed);
    // donut komposisi kehadiran kegiatan aktif (SVG conic)
    const komp=d.komposisi;const kompTot=komp.hadir+komp.izin+komp.sakit+komp.alpa+komp.belum||1;
    const kompSeg=[['#4ade80',komp.hadir,'Hadir'],['#38bdf8',komp.izin,'Izin'],['#fbbf24',komp.sakit,'Sakit'],['#f87171',komp.alpa,'Alpa'],['#64748b',komp.belum,'Belum']];

  /** Cadangan yang PASTI berhasil: paksa tinggi tiap panel & area-scroll widget lewat ukuran piksel

  fitScrollzones(){
    $$('#ltvSlides .ltv-slide>.row').forEach(row=>{
      const rowH=row.getBoundingClientRect().height;
      if(rowH<30)return;
      row.querySelectorAll(':scope>[class*="col"]>.ltv-panel').forEach(panel=>{
        panel.style.height=rowH+'px';
        const cs=getComputedStyle(panel);
        const padV=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
        const h6=panel.querySelector(':scope>h6');
        let h6Space=0;
        if(h6){const h6cs=getComputedStyle(h6);h6Space=h6.getBoundingClientRect().height+parseFloat(h6cs.marginBottom||0)+parseFloat(h6cs.marginTop||0);}
        const zone=panel.querySelector(':scope>.ltv-scrollzone');
        if(zone){const avail=rowH-padV-h6Space-2;if(avail>16)zone.style.height=avail+'px';}
      });
    });
  },
  /** Widget yang datanya lebih panjang dari tempatnya otomatis discroll pelan-pelan (naik-turun, jeda di ujung)
   *  supaya SEMUA data tetap kelihatan meski tak ada yang menyentuh layar (Live TV tidak ada interaksi orang). */
  setupAutoScroll(){
    if(this._scrollTimers)this._scrollTimers.forEach(t=>clearInterval(t));
    this._scrollTimers=[];
    $$('#ltvSlides .ltv-scrollzone').forEach(el=>{
      if(el.scrollHeight<=el.clientHeight+3)return;   // muat semua, tidak perlu discroll
      let dir=1,pause=24;   // jeda ~1.2dtk di atas sebelum mulai turun
      const t=setInterval(()=>{
        if(!el.isConnected){clearInterval(t);return;}
        if(pause>0){pause--;return;}
        el.scrollTop+=dir*0.7;
        if(dir>0&&el.scrollTop+el.clientHeight>=el.scrollHeight-1){dir=-1;pause=24;}
        else if(dir<0&&el.scrollTop<=0){dir=1;pause=24;}
      },50);
      this._scrollTimers.push(t);
    });
  },
  _syncTitle(){const t=$('#ltvSlideTitle');if(t&&this._titles)t.textContent=this._titles[this.slide]||'';},
  jump(i){this.goto(i);this._syncTitle();this.startRotation();},
  fullscreen(){const el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen&&el.requestFullscreen();else document.exitFullscreen();},
  armBell(){SRIT.Bell.unlock();SRIT.Bell.start();this._updateBelBtn();},
  _updateBelBtn(){
    const b=$('#ltvBelBtn');if(!b)return;
    if(SRIT.Bell._unlocked){b.innerHTML='<i class="bi bi-bell-fill"></i> <span class="d-none d-md-inline">Bel Aktif</span>';b.style.background='rgba(74,222,128,.28)';}
  }
};
</script>

<script>__srit.n('JS_Boot')</script>
<script>
//# sourceURL=JS_Boot.html
/* =========================================================================
   BOOTSTRAP APP — memuat konfigurasi publik, memulihkan sesi, lalu menjalankan router.
   Setiap langkah dilindungi agar satu galat tidak membuat layar kosong; galat tampil di layar (window.__srit).
   ========================================================================= */
document.addEventListener('DOMContentLoaded',async()=>{
  const D=window.__srit;
  const note=(name,e)=>{console.error('SRIT boot: '+name,e);if(D)D.errs.push({kind:'js',msg:name+': '+String((e&&e.message)||e),file:'JS_Boot'});};
  const step=(name,f)=>{try{return f();}catch(e){note(name,e);}};
  // 1) pastikan berkas inti termuat lengkap; berkas menu yang cacat hanya diperingatkan
  const miss=D?D.check():[];
  if(miss.some(m=>m.core)){D.fail(miss);return;}
  // 2) tema awal dari penyimpanan lokal (agar tidak berkedip), lalu disempurnakan oleh pengaturan server
  step('tema awal',()=>{SRIT.Theme.apply(SRIT.LS.get('SRIT_THEME')||'light');SRIT.Brand.render();});
  step('tombol tema',()=>{$('#themeToggle').onclick=()=>{SRIT.Theme.toggle();};});
  step('form login',()=>{$('#loginForm').onsubmit=async e=>{e.preventDefault();
    const btn=$('#loginForm button[type=submit]');if(btn)btn.disabled=true;SRIT.Loading.show();
    const r=await SRIT.Auth.login($('#loginEmail').value.trim(),$('#loginPass').value);
    SRIT.Loading.hide();if(btn)btn.disabled=false;
    if(r.ok){$('#loginErr').classList.add('d-none');location.hash='#/dashboard';SRIT.Router.go();}
    else{$('#loginErr').textContent=r.msg;$('#loginErr').classList.remove('d-none');}
  };});
  step('pencarian dropdown',()=>SRIT.SS.init()); // aktifkan pencarian pada semua dropdown
  step('router hash',()=>window.addEventListener('hashchange',()=>SRIT.Router.go()));
  // 3) konfigurasi publik (branding, tema, pengaturan Live TV)
  try{const cfg=await SRIT.Server.pub('apiPublicConfig');SRIT.Store._set('SETTINGS',cfg.settings||{});}
  catch(e){
    note('apiPublicConfig',e);
    if(/Database belum dibuat/i.test(String(e&&e.message)))step('info',()=>SRIT.Notify('Database belum dibuat. Jalankan runFullSetup() di editor Apps Script, lalu muat ulang halaman.','err',15000));
  }
  step('tema server',()=>{
    const s=SRIT.Store.readObj('SETTINGS');
    const themeId=SRIT.LS.get('SRIT_THEME')||s.THEME_MODE||'light';
    SRIT.Theme.apply(themeId);
    // warna kustom hanya untuk tema light/dark; tema lain punya palet sendiri
    if((themeId==='light'||themeId==='dark')&&s.THEME_PRIMARY)SRIT.Theme.setPrimary(s.THEME_PRIMARY);
    SRIT.Brand.render();
  });
  // 4) restore session
  try{await SRIT.Auth.restore();}catch(e){note('restore sesi',e);}
  // pembaruan cermin data berkala (multi-pengguna)
  setInterval(()=>{if(SRIT.Auth.user)SRIT.Sync.poll();},45000);
  // 5) default landing = Live TV
  if(!location.hash)location.hash='#/live';
  let routed=true;
  try{SRIT.Router.go();}catch(e){routed=false;note('router',e);}
  if(D){if(routed)D.ready();else{D.fail(miss);return;}}   // router gagal → tampilkan penyebab, jangan biarkan layar kosong
  // peringatan non-fatal: menu yang berkasnya cacat & pustaka CDN yang gagal dimuat
  step('peringatan',()=>{
    if(miss.length)SRIT.Notify('Berkas belum termuat lengkap: '+miss.map(m=>m.file).join(', ')+'. Menu terkait tidak akan berfungsi.','warn',15000);
    const lib=['bootstrap','Chart'].filter(k=>!window[k]);
    if(lib.length)SRIT.Notify('Pustaka '+lib.join(' & ')+' dari CDN belum termuat — tampilan/grafik mungkin tidak lengkap. Periksa koneksi internet.','warn',12000);
  });
});
</script>
