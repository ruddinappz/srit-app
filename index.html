  // ---------- SCAN WAJAH (pemindai di halaman terpisah; tab ini = pintu masuk + status pendaftaran) ----------
  _face:{q:'',f:'',page:1},_execUrl:'',
  _scanBase(){try{return (localStorage.getItem('srit_scan_url')||'').trim();}catch(e){return '';}},
  async _prefetchExec(){if(this._execUrl)return;try{const r=await SRIT.Server.call('apiWajahStatus',{size:1});this._execUrl=r.execUrl||'';}catch(e){}},
  _openScan(mode){
    const base=this._scanBase();
    if(!base){SRIT.Notify('Isi alamat halaman pemindai dulu di tab Scan Wajah','warn');this.switchTab('face');return;}
    const u=base.replace(/[#?].*$/,'')+'#'+(this._execUrl?'api='+encodeURIComponent(this._execUrl)+'&':'')+'mode='+mode;
    window.open(u,'_blank','noopener');
  },
  _renderFace(body){
    const esc=SRIT.Util.esc;
    body.innerHTML=`<div class="row g-3">
      <div class="col-lg-5"><div class="card-srit p-3">
        <h6 class="section-title mb-2"><i class="bi bi-person-bounding-box me-1"></i>Absensi Wajah</h6>
        <div class="alert alert-info py-2" style="font-size:12px">Kamera tidak dapat dipakai langsung di dalam Apps Script. Pindai &amp; pendaftaran wajah dilakukan di <b>halaman pemindai</b> terpisah (HTTPS). Hasilnya masuk ke absensi ini dengan metode <b>WAJAH</b>.</div>
        <label class="form-label-sm">Alamat halaman pemindai</label>
        <div class="input-group input-group-sm mb-2"><input class="form-control" id="abScanUrl" placeholder="https://srit-scan.vercel.app" value="${esc(this._scanBase())}"><button class="btn btn-outline-primary" id="abScanSave">Simpan</button></div>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-primary btn-sm" id="abOpenFace"><i class="bi bi-camera"></i> Buka Scan Wajah</button>
          <button class="btn btn-outline-primary btn-sm" id="abOpenEnroll"><i class="bi bi-person-plus"></i> Daftarkan Wajah</button>
        </div>
        <div class="text-muted-2 mt-2" style="font-size:11px">Yang disimpan adalah vektor angka (bukan foto) di sheet WAJAH yang tidak dikirim ke browser. Pastikan ada persetujuan wali sebelum mendaftarkan wajah anak.</div>
        <div id="abFaceSumm" class="mt-3"></div>
      </div></div>
      <div class="col-lg-7"><div class="card-srit p-0 h-100">
        <div class="p-3 border-bottom d-flex gap-2 flex-wrap justify-content-between align-items-center">
          <h6 class="section-title mb-0">Status Pendaftaran Wajah</h6>
          <div class="d-flex gap-2"><input class="form-control form-control-sm" id="abFaceQ" placeholder="Cari nama / NIS" value="${esc(this._face.q)}">
            <select class="form-select form-select-sm" id="abFaceF"><option value="">Semua</option><option value="belum" ${this._face.f==='belum'?'selected':''}>Belum terdaftar</option><option value="sudah" ${this._face.f==='sudah'?'selected':''}>Sudah terdaftar</option></select></div>
        </div>
        <div id="abFaceList"><div class="p-3 text-muted-2">Memuat\u2026</div></div>
      </div></div></div>`;
    $('#abScanSave').onclick=()=>{try{localStorage.setItem('srit_scan_url',$('#abScanUrl').value.trim());SRIT.Notify('Alamat pemindai disimpan','ok');}catch(e){SRIT.Notify('Gagal menyimpan','err');}};
    $('#abOpenFace').onclick=()=>{const v=$('#abScanUrl').value.trim();if(v)try{localStorage.setItem('srit_scan_url',v);}catch(e){}this._openScan('face');};
    $('#abOpenEnroll').onclick=()=>{const v=$('#abScanUrl').value.trim();if(v)try{localStorage.setItem('srit_scan_url',v);}catch(e){}this._openScan('enroll');};
    let tm;$('#abFaceQ').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{this._face.q=e.target.value.trim();this._face.page=1;this._faceLoad();},350);};
    $('#abFaceF').onchange=e=>{this._face.f=e.target.value;this._face.page=1;this._faceLoad();};
    this._faceLoad();
  },
  async _faceLoad(){
    const esc=SRIT.Util.esc;let r;
    try{r=await SRIT.Server.call('apiWajahStatus',{search:this._face.q,f:this._face.f,page:this._face.page,size:25});}
    catch(e){const el=$('#abFaceList');if(el)el.innerHTML='<div class="p-3 text-danger">'+esc(e.message||'Gagal memuat')+'</div>';return;}
    if(SRIT.currentFeature!=='absensi'||!$('#abFaceList'))return;
    this._execUrl=r.execUrl||this._execUrl;
    $('#abFaceSumm').innerHTML=`<span class="badge-soft st-HADIR">${r.summary.terdaftar} dari ${r.summary.aktif} anak aktif sudah terdaftar</span>`;
    const canDel=SRIT.Auth.can('absensi:UPDATE');
    $('#abFaceList').innerHTML=`<div class="table-responsive"><table class="table table-sm mb-0 align-middle"><thead><tr><th>Nama</th><th>NIS</th><th>Kelas</th><th>Wajah</th>${canDel?'<th></th>':''}</tr></thead><tbody>`+
      (r.rows.length?r.rows.map(a=>`<tr><td>${esc(a.NAMA)}</td><td>${esc(a.NIS)}</td><td>${esc(a.KELAS||'-')}</td>
        <td>${a.registered?`<span class="badge-soft st-HADIR">${a.jml} sampel</span>`:'<span class="badge-soft st-BELUM">Belum</span>'}</td>
        ${canDel?`<td class="text-end">${a.registered?`<button class="btn btn-outline-danger btn-sm py-0" data-del="${esc(a.ID)}" title="Hapus data wajah"><i class="bi bi-trash"></i></button>`:''}</td>`:''}</tr>`).join(''):'<tr><td colspan="5" class="text-center text-muted-2 py-3">Tidak ada data</td></tr>')+
      `</tbody></table></div><div class="d-flex justify-content-between align-items-center p-2" style="font-size:12px"><span>${r.total} anak \u00b7 hal ${r.page}/${r.pages}</span>
        <span><button class="btn btn-sm btn-outline-secondary py-0" id="abFaceP" ${r.page<=1?'disabled':''}>\u2039</button> <button class="btn btn-sm btn-outline-secondary py-0" id="abFaceN" ${r.page>=r.pages?'disabled':''}>\u203a</button></span></div>`;
    const pv=$('#abFaceP'),nx=$('#abFaceN');
    if(pv)pv.onclick=()=>{this._face.page--;this._faceLoad();};if(nx)nx.onclick=()=>{this._face.page++;this._faceLoad();};
    $$('#abFaceList [data-del]').forEach(b=>b.onclick=async()=>{
      if(!window.confirm('Hapus data wajah anak ini? Anak perlu didaftarkan ulang untuk absen wajah.'))return;
      try{await SRIT.Server.call('apiWajahDelete',b.dataset.del);SRIT.Notify('Data wajah dihapus','ok');this._faceLoad();}catch(e){SRIT.Notify(e.message||'Gagal menghapus','err');}
    });
  },
  // ---------- QR CAMERA ----------
  async _doScan(method,payload){
    if(!this.state.keg){SRIT.Notify('Pilih sesi kegiatan dulu','warn');return;}
    const r=await (method==='RFID'?SRIT.Api.rfidScan(this.state.date,this.state.keg,payload):method==='WAJAH'?SRIT.Api.faceScan(this.state.date,this.state.keg,payload):SRIT.Api.qrScan(this.state.date,this.state.keg,payload));
    try{if(this._sound)this._sound(r);}catch(e){}
    if(r.ok){
      this.state.log.unshift({time:new Date().toLocaleTimeString('id-ID'),nama:r.anak.NAMA,nis:r.anak.NIS,method,ok:true});
      SRIT.Notify(r.anak.NAMA+' \u2192 HADIR ('+method+')','ok',1800);
    }else if(r.dup){   // sudah tercatat pada tanggal + kegiatan + anak yang sama → tidak ditulis ulang
      this.state.log.unshift({time:new Date().toLocaleTimeString('id-ID'),nama:r.msg,nis:(r.anak&&r.anak.NIS)||payload,method,ok:false,dup:true});
      SRIT.Notify('\u26a0 '+r.msg,'warn',3500);
    }else{
      this.state.log.unshift({time:new Date().toLocaleTimeString('id-ID'),nama:r.msg,nis:payload,method,ok:false});
      SRIT.Notify(r.msg,'err',2000);
    }
    if(this.state.log.length>50)this.state.log.pop();
    // refresh summary quietly + log
    if(!this._sumT){this._sumT=setTimeout(async()=>{ // angka ringkasan (dari server) disegarkan tiap \u00b14 dtk selama pemindaian; log tampil instan
    this._sumT=null;
    try{await Promise.race([SRIT.Api.whenScansSaved(),new Promise(r=>setTimeout(r,9000))]);}catch(e){}
    let q;try{q=await this._query();}catch(e){return;}if(SRIT.currentFeature!=='absensi'||!$('#abSumm'))return;const s=q.summary;
    const totSes=s.HADIR+s.IZIN+s.SAKIT+s.ALPA+s.BELUM;
    const pctSes=SRIT.Util.pct(s.HADIR,totSes);
    const chip=(l,v,cls)=>`<div class="col"><div class="card-srit p-2 text-center"><div class="fw-bold" style="font-size:20px">${v}</div><span class="badge-soft ${cls}">${l}</span></div></div>`;
    $('#abSumm').innerHTML=chip('HADIR',s.HADIR,'st-HADIR')+chip('IZIN',s.IZIN,'st-IZIN')+chip('SAKIT',s.SAKIT,'st-SAKIT')+chip('ALPA',s.ALPA,'st-ALPA')+chip('BELUM',s.BELUM,'st-BELUM')+chip('% HADIR (Kegiatan)',pctSes+'%','st-HADIR');
    },4000);}
    this._renderLog();
    return r;
  },
  _renderLog(){
    const el=$('#abLog');if(!el)return;
    const n=$('#abLogN');if(n)n.textContent=this.state.log.length;
    el.innerHTML=this.state.log.length?this.state.log.map(l=>`<div class="d-flex align-items-center gap-2 px-3 py-2 border-bottom" style="font-size:13px">
      <i class="bi bi-${l.ok?'check-circle-fill text-success':(l.dup?'exclamation-triangle-fill text-warning':'x-circle-fill text-danger')}"></i>
      <div class="flex-grow-1"><div class="fw-semibold">${SRIT.Util.esc(l.nama)}</div><div class="text-muted-2" style="font-size:11px">${SRIT.Util.esc(l.nis)} \u00b7 ${l.method}</div></div>
      <span class="text-muted-2" style="font-size:11px">${l.time}</span></div>`).join(''):'<div class="empty-state py-4"><i class="bi bi-inbox d-block"></i>Belum ada scan</div>';
  },
  _btnCls(st){return {HADIR:'btn-success',IZIN:'btn-info',SAKIT:'btn-warning',ALPA:'btn-danger',BELUM:'btn-secondary'}[st];},
  mark(anakId,status,btn){
    this.state.dirty[anakId]=status;
    const grp=btn.parentElement;$$('button',grp).forEach(b=>{b.className='btn btn-sm btn-outline-secondary py-0 px-2';b.style.fontSize='12px';b.style.fontWeight='700';b.style.minWidth='32px';b.style.borderRadius='6px';});btn.className='btn btn-sm '+this._btnCls(status)+' py-0 px-2';btn.style.fontSize='12px';btn.style.fontWeight='700';btn.style.minWidth='32px';btn.style.borderRadius='6px';
    this._updateDirtyN();
  },
  _updateDirtyN(){const n=$('#abDirtyN');if(n)n.textContent=Object.keys(this.state.dirty).length;},
  async hadirSemua(){
    if(!this.state.keg){SRIT.Notify('Pilih sesi kegiatan dulu','warn');return;}
    // tandai HADIR untuk semua peserta sesuai filter yang sedang tampil (belum absen / apa pun) \u2192 jadi HADIR
    SRIT.Loading.show();let r;
    try{r=await SRIT.Api.getAttendanceSession(this.state.date,this.state.keg,{page:1,size:100000,search:this.state.search,jenjang:this.state.jenjang,jk:this.state.jk,asrama:this.state.asrama,kelas:this.state.kelas});}
    catch(e){SRIT.Loading.hide();SRIT.Notify(e.message||'Gagal memuat peserta','err');return;}
    SRIT.Loading.hide();
    let n=0;r.rows.forEach(a=>{this.state.dirty[a.ID]='HADIR';n++;});
    SRIT.Notify(n+' peserta ditandai HADIR \u2014 klik Simpan Batch untuk menyimpan','ok');
    this.load();
  },
  async save(){
    const changes=Object.entries(this.state.dirty).map(([anakId,status])=>({anakId,status,method:'MANUAL'}));
    if(!changes.length){SRIT.Notify('Tidak ada perubahan','warn');return;}
    SRIT.Loading.show();
    try{
      const r=await SRIT.Api.saveAttendanceBatch(this.state.date,this.state.keg,changes);
      SRIT.Loading.hide();this.state.dirty={};
      SRIT.Notify(`Batch tersimpan: ${r.created} baru, ${r.updated} diperbarui`,'ok');this.load();
    }catch(e){SRIT.Loading.hide();SRIT.Notify(e.message||'Gagal menyimpan absensi','err');}
  },
  destroy(){if(this.stopQR)this.stopQR();this.state.dirty={};this.state.log=[];}
};
</script>

<script>
//# sourceURL=View_AbsensiKamera.html
// ---------- ABSENSI: pemindai QR kamera (dipisah agar galat di sini tidak mematikan menu Absensi) ----------
// Tiga jalur, supaya tetap bisa absen walau kamera langsung diblokir (kasus umum di Chrome Android):
//  1) Kamera langsung (live) — memakai BarcodeDetector bila ada, jsQR sebagai cadangan.
//  2) Foto QR — membuka aplikasi kamera HP lewat <input capture>; tidak butuh izin getUserMedia & lolos dari iframe Apps Script.
//  3) Halaman pemindai terpisah (scan_page, HTTPS) — kamera penuh tanpa batasan iframe.
(function(){
  var A=SRIT&&SRIT.Features&&SRIT.Features.absensi;
  if(!A){console.error('View_AbsensiKamera: SRIT.Features.absensi belum ada');return;}
  var framed=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
  var esc=function(s){return SRIT.Util.esc(String(s==null?'':s));};
  Object.assign(A,{
  // ---------- deteksi lingkungan ----------
  _camPolicyOk(){ // true/false bila browser bisa menjawab; null bila tidak diketahui
    try{const p=document.permissionsPolicy||document.featurePolicy;if(p&&typeof p.allowsFeature==='function')return !!p.allowsFeature('camera');}catch(e){}
    return null;
  },
  _camBlock(){ // '' = layak dicoba
    if(window.isSecureContext===false)return 'insecure';
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return 'nomedia';
    if(this._camPolicyOk()===false)return 'policy';
    return '';
  },
  async _permState(){try{return (await navigator.permissions.query({name:'camera'})).state;}catch(e){return 'unknown';}},
  async _camDiag(err){
    const o=[];
    o.push('HTTPS (secure context): '+(window.isSecureContext?'ya':'TIDAK'));
    o.push('Berjalan di dalam iframe: '+(framed?'ya':'tidak'));
    const pol=this._camPolicyOk();
    o.push('Kebijakan kamera untuk halaman ini: '+(pol===null?'tidak diketahui':pol?'diizinkan':'DIBLOKIR oleh halaman pembungkus'));
    o.push('Status izin kamera (origin ini): '+await this._permState());
    o.push('Origin: '+location.origin);
    o.push('BarcodeDetector: '+(window.BarcodeDetector?'ada':'tidak ada')+' | jsQR: '+(typeof jsQR!=='undefined'?'termuat':'belum'));
    try{const d=await navigator.mediaDevices.enumerateDevices();o.push('Kamera terdeteksi: '+d.filter(x=>x.kind==='videoinput').length);}catch(e){}
    if(err)o.push('Galat: '+(err.name||'')+(err.message?' — '+err.message:''));
    o.push('Browser: '+navigator.userAgent);
    return o.join('\n');
  },
  // ---------- tampilan ----------
  _renderQR(body,r){
    const block=this._camBlock();
    const live=!block;
    body.innerHTML=`<div class="row g-3">
      <div class="col-lg-5"><div class="card-srit p-3">
        <h6 class="section-title mb-2"><i class="bi bi-qr-code-scan me-1"></i>Pindai QR</h6>
        ${live?`<div style="position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:1/1">
          <video id="abVideo" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video>
          <div style="position:absolute;inset:18%;border:3px solid rgba(255,255,255,.8);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.25)"></div>
          <div id="abQrStat" style="position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:6px;text-align:center">Menyiapkan kamera\u2026</div>
        </div>
        <canvas id="abCanvas" class="d-none"></canvas>
        <div id="abCamErr" class="mt-2 d-none"></div>
        <button class="btn btn-outline-secondary btn-sm w-100 mt-2" id="abQrToggle"><i class="bi bi-pause-circle"></i> Jeda kamera</button>`
        :`<div class="alert alert-warning py-2 mb-2" style="font-size:12.5px"><i class="bi bi-exclamation-triangle"></i> Kamera langsung tidak tersedia di halaman ini. Pakai foto QR atau input manual.</div>
        <div id="abCamErr" class="mb-2"></div>
        <button class="btn btn-primary btn-sm w-100" id="abQrPhotoBtn"><i class="bi bi-camera"></i> Ambil Foto QR</button>
        <input type="file" id="abQrPhoto" accept="image/*" capture="environment" class="d-none">
        <div id="abPhotoStat" class="mt-2 small text-muted-2" style="min-height:18px"></div>`}
        <button class="btn btn-outline-secondary btn-sm w-100 mt-2" id="abSoundBtn"></button>
        <input class="form-control form-control-sm mt-3" id="abQrManual" placeholder="Atau ketik / tempel kode QR, NIS, atau ID lalu Enter">
      </div></div>
      <div class="col-lg-7"><div class="card-srit p-0 h-100">
        <div class="p-3 border-bottom d-flex justify-content-between"><h6 class="section-title mb-0"><i class="bi bi-clock-history me-1"></i>Log Scan Terakhir</h6><span class="badge-soft st-HADIR" id="abLogN">${this.state.log.length}</span></div>
        <div id="abLog" style="max-height:420px;overflow:auto"></div>
      </div></div>
    </div>`;
    const man=$('#abQrManual');if(man)man.onkeydown=e=>{if(e.key==='Enter'){const v=man.value.trim();man.value='';if(v)this._doScan('QR',v);}};
    const pb=$('#abQrPhotoBtn'),pi=$('#abQrPhoto');
    if(pb&&pi){pb.onclick=()=>pi.click();pi.onchange=async()=>{const fs=Array.from(pi.files||[]);pi.value='';if(fs.length)await this._decodeFiles(fs);};}
    const tg=$('#abQrToggle');
    if(tg)tg.onclick=()=>{if(this._qr.stream){this.stopQR();tg.innerHTML='<i class="bi bi-camera-video"></i> Lanjutkan kamera';}else{this.startQR();tg.innerHTML='<i class="bi bi-pause-circle"></i> Jeda kamera';}};
    const sb=$('#abSoundBtn');
    if(sb){const paint=()=>{const [ic,tx]=this._soundLabel(this._soundMode());sb.innerHTML='<i class="bi '+ic+'"></i> '+tx;};paint();
      sb.onclick=()=>{const o=['suara','nada','senyap'],n=o[(o.indexOf(this._soundMode())+1)%3];this._soundSet(n);paint();if(n==='suara')this._speak('Suara aktif');else if(n==='nada')this._beep('ok');};}
    this._renderLog();
    if(live)this.startQR();
  },
  // ---------- kamera langsung ----------
  async startQR(){
    if(this._qr.stream||this._qr.starting)return;
    const video=$('#abVideo');if(!video)return;
    const stat=$('#abQrStat');
    this._showCamError(null);
    if(stat){stat.textContent='Meminta izin kamera\u2026';stat.style.background='rgba(0,0,0,.6)';}
    this._qr.starting=true;
    const md=navigator.mediaDevices;
    const tries=[{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{facingMode:{ideal:'environment'}},audio:false},{video:true,audio:false}];
    let stream=null,lastErr=null;
    for(const c of tries){
      try{stream=await md.getUserMedia(c);break;}
      catch(e){lastErr=e;
        // izin ditolak / diblokir kebijakan: percobaan berikutnya tidak akan berhasil
        if(e&&(e.name==='NotAllowedError'||e.name==='PermissionDeniedError'||e.name==='SecurityError'||e.name==='NotFoundError'||e.name==='NotReadableError'))break;}
    }
    this._qr.starting=false;
    if(!stream){if(stat)stat.textContent='Gagal akses kamera';this._showCamError(lastErr);return;}
    if(!$('#abVideo')){stream.getTracks().forEach(t=>t.stop());return;}   // pengguna sudah pindah tab
    this._qr.stream=stream;video.srcObject=stream;
    try{await video.play();}catch(e){/* autoplay+muted+playsinline biasanya cukup; lanjut */}
    this._qr.det=null;
    if(window.BarcodeDetector){try{this._qr.det=new BarcodeDetector({formats:['qr_code']});}catch(e){this._qr.det=null;}}
    if(stat){stat.textContent='Arahkan QR ke dalam kotak\u2026';stat.style.background='rgba(0,0,0,.6)';}
    this._qrLoop();
  },
  async _showDiag(err){
    const box=$('#abDiag')||$('#abCamErr');if(!box)return;
    const d=await this._camDiag(err);
    const t=$('#abDiag');if(t){t.classList.remove('d-none');t.innerHTML=`<pre class="p-2 rounded" style="font-size:11px;white-space:pre-wrap;background:var(--srit-hover);margin:0" id="abDiagTxt">${esc(d)}</pre><button class="btn btn-sm btn-outline-secondary py-0 mt-1" id="abDiagCopy"><i class="bi bi-clipboard"></i> Salin</button>`;
      const cp=$('#abDiagCopy');if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(d).then(()=>SRIT.Notify('Diagnosa disalin','ok'));}catch(e){}};}
    return d;
  },
  // ---------- pesan galat yang jujur sesuai penyebab ----------
  async _showCamError(err){
    const box=$('#abCamErr');if(!box)return;
    if(!err){box.classList.add('d-none');box.innerHTML='';return;}
    const perm=await this._permState(),pol=this._camPolicyOk();
    let t,d;
    const n=err.name;
    if(n==='NotAllowedError'||n==='PermissionDeniedError'||n==='SecurityError'){
      if(pol===false||(framed&&perm==='granted')){
        t='Kamera diblokir oleh halaman pembungkus (iframe Apps Script)';
        d='Halaman ini berjalan di dalam bingkai yang tidak meneruskan izin kamera. Buka aplikasi lewat alamat GitHub Pages, atau pakai input manual.';
      }else if(perm==='denied'){
        t='Izin kamera ditolak untuk alamat ini';
        d='Alamat yang meminta kamera adalah '+location.origin+' (bukan alamat yang Anda ketik di bilah alamat). Di Chrome Android: menu \u22ee \u2192 Setelan \u2192 Setelan situs \u2192 Kamera \u2192 hapus blokir untuk alamat tersebut, atau hapus data situs script.google.com lalu muat ulang. Lalu klik Coba Lagi.';
      }else{
        t='Izin kamera tidak diberikan / dibatalkan';
        d='Izin kamera tidak muncul. Cek ikon gembok di samping alamat \u2192 Izin \u2192 Kamera \u2192 Izinkan, lalu klik Coba Lagi.';
      }
    }else{
      const info={
        NotFoundError:['Kamera tidak ditemukan','Perangkat tidak punya kamera atau tidak terdeteksi browser.'],
        NotReadableError:['Kamera sedang dipakai aplikasi lain','Tutup aplikasi/tab lain yang memakai kamera (Zoom, Meet, aplikasi Kamera), lalu klik Coba Lagi.'],
        OverconstrainedError:['Kamera tidak mendukung mode yang diminta','Klik Coba Lagi.'],
        AbortError:['Kamera gagal dimulai','Tutup lalu buka lagi tab ini, atau mulai ulang Chrome.'],
        TypeError:['Permintaan kamera tidak valid','Muat ulang halaman lalu coba lagi.']
      }[n]||['Gagal mengakses kamera',err.message||n||'Kesalahan tidak dikenal.'];
      t=info[0];d=info[1];
    }
    box.classList.remove('d-none');
    box.innerHTML=`<div class="alert alert-danger py-2 mb-0" style="font-size:12px">
      <b><i class="bi bi-camera-video-off"></i> ${esc(t)}</b><br>${esc(d)}
      <div class="mt-2 d-flex gap-2 flex-wrap"><button class="btn btn-sm btn-outline-danger py-0" id="abCamRetry"><i class="bi bi-arrow-clockwise"></i> Coba Lagi</button>
      <button class="btn btn-sm btn-outline-secondary py-0" id="abCamDiag"><i class="bi bi-wrench-adjustable"></i> Diagnosa</button></div>
      <div id="abDiag" class="d-none mt-2"></div>
    </div>`;
    const rt=$('#abCamRetry');if(rt)rt.onclick=()=>this.startQR();
    const dg=$('#abCamDiag');if(dg)dg.onclick=()=>this._showDiag(err);
  },
  // ---------- suara: 3 mode (Suara = ucapan + nada, Nada saja, Senyap); tersimpan per perangkat ----------
  _soundMode(){try{return localStorage.getItem('srit_sound')||'suara';}catch(e){return 'suara';}},
  _soundSet(m){try{localStorage.setItem('srit_sound',m);}catch(e){}},
  _soundLabel(m){return {suara:['bi-volume-up-fill','Suara: ucapan + nada'],nada:['bi-bell-fill','Suara: nada saja'],senyap:['bi-volume-mute-fill','Suara: senyap']}[m];},
  _beep(kind){ // ok = satu nada tinggi; dup = dua nada rendah; err = nada panjang rendah
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      const ac=this._ac||(this._ac=new C());if(ac.state==='suspended')ac.resume();
      const seq=kind==='ok'?[[880,0,.09]]:kind==='dup'?[[330,0,.11],[330,.16,.11]]:[[200,0,.35]];
      seq.forEach(([f,t,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d);});
    }catch(e){}
  },
  _speak(text){
    try{
      const ss=window.speechSynthesis;if(!ss||!text)return;
      ss.cancel();   // scan beruntun: ucapan terbaru menggantikan yang antre, supaya tidak tertinggal
      const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=1.05;u.volume=1;
      const v=(ss.getVoices()||[]).find(x=>/^id([-_]|$)/i.test(x.lang));if(v)u.voice=v;
      ss.speak(u);
    }catch(e){}
  },
  _shortName(n){return String(n||'').trim().split(/\s+/).slice(0,3).join(' ');},
  /** Dipanggil setiap hasil pindai (QR / RFID): nada + ucapan sesuai mode. r = hasil SRIT.Api.qrScan/rfidScan */
  _sound(r){
    const m=this._soundMode();if(m==='senyap'||!r)return;
    const kind=r.ok?'ok':r.dup?'dup':'err';
    this._beep(kind);
    if(m!=='suara')return;
    const nm=this._shortName(r.anak&&r.anak.NAMA);
    let t;
    if(r.ok)t=nm+', hadir';
    else if(r.dup)t=nm+(r.status==='HADIR'?', sudah absen':', berstatus '+String(r.status||'').toLowerCase());
    else t=/tidak aktif/.test(r.msg||'')?(r.msg||'Anak tidak aktif'):(/tidak dikenali/i.test(r.msg||'')?'Kode tidak dikenali':(r.msg||'Gagal'));
    setTimeout(()=>this._speak(t),kind==='ok'?120:260);   // sesudah nada
  },
  _qrHit(data){
    const now=Date.now();
    // QR yang masih ada di depan kamera tidak diproses/diberitahukan berulang-ulang
    if(data===this._qr.last&&now-this._qr.lastTime<=2500){this._qr.lastTime=now;return;}
    this._qr.last=data;this._qr.lastTime=now;
    Promise.resolve(this._doScan('QR',data)).then(r=>{
      const ok=!!(r&&r.ok),dup=!!(r&&r.dup);
      try{if(navigator.vibrate)navigator.vibrate(ok?50:dup?[90,60,90]:[220]);}catch(e){}
      const stat=$('#abQrStat');if(!stat)return;
      stat.textContent=ok?'\u2713 '+r.anak.NAMA+' \u2192 HADIR':dup?'\u26a0 '+r.msg:'\u2717 '+((r&&r.msg)||data);
      stat.style.background=ok?'rgba(22,163,74,.9)':dup?'rgba(217,119,6,.95)':'rgba(220,38,38,.92)';
      clearTimeout(this._qr.statT);
      this._qr.statT=setTimeout(()=>{const s=$('#abQrStat');if(s){s.style.background='rgba(0,0,0,.6)';s.textContent='Arahkan QR ke dalam kotak\u2026';}},ok?1400:2600);
    });
  },
  _qrLoop(){
    const video=$('#abVideo'),canvas=$('#abCanvas');
    if(!video||!this._qr.stream)return;
    const next=()=>{if(this._qr.stream)this._qr.raf=requestAnimationFrame(()=>this._qrLoop());};
    if(!video.videoWidth||video.readyState<video.HAVE_ENOUGH_DATA||this._qr.busy){next();return;}
    if(this._qr.det){
      this._qr.busy=true;
      this._qr.det.detect(video).then(r=>{this._qr.busy=false;if(r&&r.length&&r[0].rawValue)this._qrHit(r[0].rawValue);})
        .catch(()=>{this._qr.busy=false;this._qr.det=null;}).then(next);   // gagal \u2192 pindah ke jsQR
      return;
    }
    if(typeof jsQR!=='undefined'){
      const s=Math.min(1,720/Math.max(video.videoWidth,video.videoHeight));
      canvas.width=Math.round(video.videoWidth*s);canvas.height=Math.round(video.videoHeight*s);
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      try{
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
        if(code&&code.data)this._qrHit(code.data);
      }catch(e){}
    }
    next();
  },
  stopQR(){
    if(this._qr.raf){cancelAnimationFrame(this._qr.raf);this._qr.raf=null;}
    if(this._qr.stream){this._qr.stream.getTracks().forEach(t=>t.stop());this._qr.stream=null;}
    this._qr.busy=false;this._qr.starting=false;
    const stat=$('#abQrStat');if(stat)stat.textContent='Kamera berhenti.';
  },
  // ---------- foto QR (tanpa getUserMedia) ----------
  _imgFromFile(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Foto tidak bisa dibuka'));};im.src=u;});},
  _loadBitmap(file){return window.createImageBitmap?createImageBitmap(file).catch(()=>this._imgFromFile(file)):this._imgFromFile(file);},
  async _jsqrFromBitmap(bmp){
    for(let i=0;i<25&&typeof jsQR==='undefined';i++)await new Promise(r=>setTimeout(r,150));
    if(typeof jsQR==='undefined')throw new Error('Pustaka pembaca QR belum termuat (periksa koneksi internet)');
    const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    for(const max of [1000,1600,600,2200]){            // beberapa skala: foto HP besar kadang gagal bila terlalu kecil/besar
      const s=Math.min(1,max/Math.max(W,H));c.width=Math.round(W*s);c.height=Math.round(H*s);
      x.drawImage(bmp,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height);
      const q=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
      if(q&&q.data)return q.data;
    }
    return '';
  },
  async _jsqrMulti(bmp){ // semua QR dalam satu foto: baca satu, putihkan area-nya, ulangi
    for(let i=0;i<25&&typeof jsQR==='undefined';i++)await new Promise(r=>setTimeout(r,150));
    if(typeof jsQR==='undefined')throw new Error('Pustaka pembaca QR belum termuat (periksa koneksi internet)');
    const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    for(const max of [1000,1600,600,2200]){
      const s=Math.min(1,max/Math.max(W,H));c.width=Math.round(W*s);c.height=Math.round(H*s);
      x.drawImage(bmp,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height),out=[];
      for(let k=0;k<12;k++){
        const q=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
        if(!q||!q.data)break;
        if(out.indexOf(q.data)<0)out.push(q.data);
        const L=q.location,xs=[L.topLeftCorner.x,L.topRightCorner.x,L.bottomLeftCorner.x,L.bottomRightCorner.x],ys=[L.topLeftCorner.y,L.topRightCorner.y,L.bottomLeftCorner.y,L.bottomRightCorner.y];
        const pad=Math.max(6,(Math.max.apply(null,xs)-Math.min.apply(null,xs))*0.12);
        const x0=Math.max(0,Math.floor(Math.min.apply(null,xs)-pad)),x1=Math.min(c.width-1,Math.ceil(Math.max.apply(null,xs)+pad));
        const y0=Math.max(0,Math.floor(Math.min.apply(null,ys)-pad)),y1=Math.min(c.height-1,Math.ceil(Math.max.apply(null,ys)+pad));
        for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){const o=(yy*c.width+xx)*4;d.data[o]=d.data[o+1]=d.data[o+2]=255;d.data[o+3]=255;}
      }
      if(out.length)return out;
    }
    return [];
  },
  async _decodeAll(file){ // daftar isi QR dari satu foto
    const bmp=await this._loadBitmap(file);let vals=[];
    if(window.BarcodeDetector){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(bmp);vals=(r||[]).map(z=>z.rawValue).filter(Boolean);}catch(e){}}
    if(!vals.length)vals=await this._jsqrMulti(bmp);
    try{if(bmp.close)bmp.close();}catch(e){}
    return Array.from(new Set(vals));
  },
  async _decodeFiles(files){
    const say=(t,c)=>{const e=$('#abPhotoStat');if(e){e.textContent=t;e.className='mt-2 small '+(c||'text-muted-2');}};
    const seen=new Set();let fail=0,n=0,i=0;
    for(const f of files){
      i++;say('Membaca foto '+i+' dari '+files.length+'\u2026');
      try{
        const vals=await this._decodeAll(f);
        if(!vals.length){fail++;continue;}
        for(const v of vals){if(seen.has(v))continue;seen.add(v);n++;await this._doScan('QR',v);}
      }catch(e){fail++;}
    }
    if(!n)say('QR tidak terbaca. Dekatkan kamera, pastikan QR utuh, terang, dan tidak buram, lalu ambil foto lagi.','text-danger');
    else say('\u2713 '+n+' QR diproses'+(fail?' \u00b7 '+fail+' foto tidak terbaca':'')+'.',fail?'text-warning':'text-success');
  },
  async _decodePhoto(file){await this._decodeFiles([file]);},
  });
  SRIT.Api.onScanDup=function(x){   // server menolak karena sudah tercatat (mis. dipindai di perangkat lain)
    A.state.log.unshift({time:new Date().toLocaleTimeString('id-ID'),nama:x.msg,nis:(x.anak&&x.anak.NIS)||'',method:'QR',ok:false,dup:true});
    if(A.state.log.length>50)A.state.log.pop();
    if(A._renderLog)A._renderLog();
    SRIT.Notify('\u26a0 '+x.msg,'warn',4500);
    if(A._sound)A._sound(x);
  };
  A._qr=Object.assign({stream:null,raf:null,last:'',lastTime:0,busy:false,starting:false,det:null},A._qr||{});
})();
</script>

<script>
//# sourceURL=View_AbsensiWajah.html
// ---------- ABSENSI: scan wajah langsung di aplikasi (kamera live + pendaftaran) ----------
// Memakai face-api.js (@vladmandic) dimuat saat tab dibuka. Pencocokan di browser; hasil dikirim lewat jalur scan yang sama
// dengan QR/RFID (anti-ganda, antrean, suara, log) dengan metode 'WAJAH'. Yang disimpan di server hanya vektor angka.
(function(){
  var A=SRIT&&SRIT.Features&&SRIT.Features.absensi;
  if(!A){console.error('View_AbsensiWajah: SRIT.Features.absensi belum ada');return;}
  var esc=function(s){return SRIT.Util.esc(String(s==null?'':s));};
  var VER='1.7.13';
  var LIB_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@'+VER+'/dist/face-api.js';
  var MODEL_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@'+VER+'/model/';
  var MATCH_MAX=0.5;      // jarak Euclidean maksimum agar dianggap cocok (makin kecil makin ketat)
  var MARGIN=0.04;        // selisih minimal dengan anak lain terdekat (mencegah salah orang)
  var NEED_HITS=3;        // wajah harus cocok pada 3 bingkai berturut-turut
  var COOLDOWN=6000;      // anak yang sama tidak diproses ulang dalam 6 dtk
  var ENROLL_MIN=3,ENROLL_MAX=5;

  // ---------- pemuat pustaka & model ----------
  var libP=null;
  function loadLib(setStat){
    if(libP)return libP;
    libP=new Promise(function(res,rej){
      if(window.faceapi){res();return;}
      var s=document.createElement('script');s.src=LIB_URL;s.async=true;
      s.onload=function(){res();};s.onerror=function(){rej(new Error('Pustaka pengenal wajah gagal dimuat. Periksa koneksi internet lalu coba lagi.'));};
      document.head.appendChild(s);
    }).then(function(){
      var fa=window.faceapi;
      if(setStat)setStat('Menyiapkan mesin wajah\u2026');
      return pickBackend(fa).then(function(){
        if(setStat)setStat('Memuat model wajah\u2026');
        return Promise.all([fa.nets.tinyFaceDetector.loadFromUri(MODEL_URL),fa.nets.faceLandmark68Net.loadFromUri(MODEL_URL),fa.nets.faceRecognitionNet.loadFromUri(MODEL_URL)]);
      });
    }).catch(function(e){libP=null;throw e;});
    return libP;
  }
  // Berkas .wasm TIDAK ada di paket jsdelivr face-api (404), tetapi backend 'wasm' tetap terdaftar sebagai prioritas tertinggi
  // dan membuat semua panggilan tf gagal ("highest priority backend 'wasm' has not yet been initialized").
  // Solusi: cabut pendaftaran 'wasm' lebih dulu, lalu pilih WebGL, cadangan CPU.
  async function pickBackend(fa){
    var tf=fa.tf;
    try{tf.removeBackend('wasm');}catch(e){}
    var order=['webgl','cpu'];
    for(var i=0;i<order.length;i++){
      try{
        var ok=await tf.setBackend(order[i]);
        if(ok){await tf.ready();if(tf.getBackend()===order[i]){console.info('Mesin wajah:',order[i]);return order[i];}}
      }catch(e){console.warn('Mesin '+order[i]+' gagal',e&&e.message);}
    }
    throw new Error('Tidak ada mesin hitung yang bisa dipakai di browser ini.');
  }
  function dist(a,b){var s=0;for(var i=0;i<128;i++){var d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);}
  function matchFace(desc,gal){
    var best=1e9,bestId=null,second=1e9;
    for(var i=0;i<gal.length;i++){
      var g=gal[i],m=1e9;
      for(var j=0;j<g.s.length;j++){var d=dist(desc,g.s[j]);if(d<m)m=d;}
      if(m<best){second=best;best=m;bestId=g.id;}else if(m<second){second=m;}
    }
    return {id:bestId,d:best,second:second,ok:!!(bestId&&best<=MATCH_MAX&&(second-best)>=MARGIN)};
  }

  Object.assign(A,{
  _fs:{stream:null,timer:null,mode:'scan',gal:[],galAt:0,votes:{},last:{},samples:[],lastDesc:null,lastDescAt:0,busy:false},
  _face:{q:'',f:'',page:1},

  // ---------- tampilan ----------
  _renderFace(body){
    const block=this._camBlock(),canEnroll=SRIT.Auth.can('absensi:UPDATE');
    body.innerHTML=`<div class="row g-3">
      <div class="col-lg-5"><div class="card-srit p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="section-title mb-0"><i class="bi bi-person-bounding-box me-1"></i>Absensi Wajah</h6>
          <div class="btn-group btn-group-sm" role="group">
            <button class="btn btn-primary" id="abFmScan">Pindai</button>
            ${canEnroll?'<button class="btn btn-outline-primary" id="abFmEnroll">Daftarkan</button>':''}
          </div>
        </div>
        ${block?`<div class="alert alert-warning py-2 mb-2" style="font-size:12.5px"><i class="bi bi-exclamation-triangle"></i> Kamera langsung tidak tersedia di halaman ini. Buka aplikasi lewat alamat GitHub Pages (HTTPS), bukan dari dalam Apps Script.<div id="abCamErr" class="mt-2"></div></div>`:`
        <div style="position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3">
          <video id="abFVideo" playsinline muted autoplay style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)"></video>
          <canvas id="abFCanvas" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1);pointer-events:none"></canvas>
          <div id="abFStat" style="position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:6px;text-align:center">Menyiapkan\u2026</div>
        </div>
        <div id="abCamErr" class="mt-2 d-none"></div>
        <div id="abFEnroll" class="mt-2 d-none"></div>
        <button class="btn btn-outline-secondary btn-sm w-100 mt-2" id="abFToggle"><i class="bi bi-pause-circle"></i> Jeda kamera</button>`}
        <button class="btn btn-outline-secondary btn-sm w-100 mt-2" id="abSoundBtn"></button>
        <div class="text-muted-2 mt-2" style="font-size:11px">Yang disimpan hanya vektor angka (bukan foto). Pastikan ada persetujuan wali sebelum mendaftarkan wajah anak. Pencocokan wajah membantu, bukan pengganti: bila ragu, pakai QR/manual.</div>
        <div id="abFaceSumm" class="mt-2"></div>
      </div>
      <div class="card-srit p-0 mt-3">
        <div class="p-3 border-bottom d-flex justify-content-between"><h6 class="section-title mb-0"><i class="bi bi-clock-history me-1"></i>Log Scan Terakhir</h6><span class="badge-soft st-HADIR" id="abLogN">0</span></div>
        <div id="abLog" style="max-height:260px;overflow:auto"></div>
      </div></div>
      <div class="col-lg-7"><div class="card-srit p-0 h-100">
        <div class="p-3 border-bottom d-flex gap-2 flex-wrap justify-content-between align-items-center">
          <h6 class="section-title mb-0">Status Pendaftaran Wajah</h6>
          <div class="d-flex gap-2"><input class="form-control form-control-sm" id="abFaceQ" placeholder="Cari nama / NIS" value="${esc(this._face.q)}">
            <select class="form-select form-select-sm" id="abFaceF"><option value="">Semua</option><option value="belum" ${this._face.f==='belum'?'selected':''}>Belum terdaftar</option><option value="sudah" ${this._face.f==='sudah'?'selected':''}>Sudah terdaftar</option></select></div>
        </div>
        <div id="abFaceList"><div class="p-3 text-muted-2">Memuat\u2026</div></div>
      </div></div></div>`;
    let tm;$('#abFaceQ').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{this._face.q=e.target.value.trim();this._face.page=1;this._faceLoad();},350);};
    $('#abFaceF').onchange=e=>{this._face.f=e.target.value;this._face.page=1;this._faceLoad();};
    const sb=$('#abSoundBtn');
    if(sb){const paint=()=>{const [ic,tx]=this._soundLabel(this._soundMode());sb.innerHTML='<i class="bi '+ic+'"></i> '+tx;};paint();
      sb.onclick=()=>{const o=['suara','nada','senyap'],n=o[(o.indexOf(this._soundMode())+1)%3];this._soundSet(n);paint();if(n==='suara')this._speak('Suara aktif');else if(n==='nada')this._beep('ok');};}
    const ms=$('#abFmScan'),me=$('#abFmEnroll');
    if(ms)ms.onclick=()=>this._faceMode('scan');
    if(me)me.onclick=()=>this._faceMode('enroll');
    const tg=$('#abFToggle');
    if(tg)tg.onclick=()=>{if(this._fs.stream){this.stopFace();tg.innerHTML='<i class="bi bi-camera-video"></i> Lanjutkan kamera';}else{this.startFace();tg.innerHTML='<i class="bi bi-pause-circle"></i> Jeda kamera';}};
    this._renderLog();
    this._faceLoad();
    if(!block){this._fs.mode='scan';this.startFace();}
  },
  _faceStat(txt,color){const s=$('#abFStat');if(!s)return;s.textContent=txt;s.style.background=color||'rgba(0,0,0,.6)';},

  _faceMode(m){
    this._fs.mode=m;this._fs.samples=[];this._fs.votes={};
    const ms=$('#abFmScan'),me=$('#abFmEnroll');
    if(ms)ms.className='btn '+(m==='scan'?'btn-primary':'btn-outline-primary');
    if(me)me.className='btn '+(m==='enroll'?'btn-primary':'btn-outline-primary');
    const box=$('#abFEnroll');if(!box)return;
    if(m==='scan'){box.classList.add('d-none');box.innerHTML='';this._faceStat('Arahkan wajah ke kamera\u2026');return;}
    box.classList.remove('d-none');
    box.innerHTML=`<input class="form-control form-control-sm mb-1" id="abFeQ" placeholder="Cari nama / NIS anak yang didaftarkan">
      <select class="form-select form-select-sm mb-2" id="abFeSel" size="4"></select>
      <div class="d-flex gap-2 align-items-center mb-2"><button class="btn btn-sm btn-outline-primary" id="abFeShot"><i class="bi bi-camera"></i> Ambil sampel</button>
        <span id="abFeCnt" class="small text-muted-2"></span></div>
      <div class="d-flex gap-2"><button class="btn btn-sm btn-success flex-grow-1" id="abFeSave" disabled><i class="bi bi-check2-circle"></i> Simpan pendaftaran</button>
        <button class="btn btn-sm btn-outline-secondary" id="abFeReset">Ulang</button></div>
      <div class="text-muted-2 mt-1" style="font-size:11px">Ambil ${ENROLL_MIN}\u2013${ENROLL_MAX} sampel: hadap depan, sedikit menoleh kiri/kanan, pencahayaan cukup, tanpa masker/topi. Hanya satu wajah di layar.</div>`;
    const fill=()=>{
      const q=($('#abFeQ').value||'').trim().toLowerCase();
      const rows=SRIT.Store.read('ANAK').filter(a=>a.STATUS==='AKTIF'&&(!q||String(a.NAMA||'').toLowerCase().indexOf(q)>=0||String(a.NIS||'').toLowerCase().indexOf(q)>=0)).slice(0,60);
      $('#abFeSel').innerHTML=rows.map(a=>`<option value="${esc(a.ID)}">${esc(a.NAMA)} (${esc(a.NIS||'-')})</option>`).join('');
      if(rows.length===1)$('#abFeSel').value=rows[0].ID;
    };
    $('#abFeQ').oninput=fill;fill();
    $('#abFeShot').onclick=()=>this._faceShot();
    $('#abFeSave').onclick=()=>this._faceSave();
    $('#abFeReset').onclick=()=>{this._fs.samples=[];this._faceCnt();};
    this._faceCnt();this._faceStat('Mode pendaftaran: pilih anak, lalu Ambil sampel');
  },
  _faceCnt(){
    const c=$('#abFeCnt'),sv=$('#abFeSave'),n=this._fs.samples.length;
    if(c)c.textContent=n+' / '+ENROLL_MAX+' sampel'+(n<ENROLL_MIN?' (min '+ENROLL_MIN+')':'');
    if(sv)sv.disabled=n<ENROLL_MIN;
  },
  _faceShot(){
    const fs=this._fs;
    if(!fs.lastDesc||Date.now()-fs.lastDescAt>1500){SRIT.Notify('Wajah belum terdeteksi tepat satu. Hadap kamera, satu orang saja.','warn');return;}
    if(fs.samples.length>=ENROLL_MAX){SRIT.Notify('Sampel sudah cukup. Simpan atau Ulang.','warn');return;}
    const id=($('#abFeSel')||{}).value;
    // peringatan bila wajah ini sangat mirip anak LAIN yang sudah terdaftar (salah pilih nama / kembar)
    const m=matchFace(fs.lastDesc,fs.gal.filter(g=>g.id!==id));
    if(m.id&&m.d<0.4){const g=fs.gal.find(x=>x.id===m.id);SRIT.Notify('Wajah ini sangat mirip dengan '+(g?g.nama:'anak lain')+' yang sudah terdaftar. Pastikan nama yang dipilih benar.','warn',6000);}
    fs.samples.push(Array.from(fs.lastDesc).map(x=>Math.round(x*10000)/10000));
    try{if(navigator.vibrate)navigator.vibrate(40);}catch(e){}
    this._faceCnt();
  },
  async _faceSave(){
    const id=($('#abFeSel')||{}).value;
    if(!id){SRIT.Notify('Pilih anak dulu','warn');return;}
    if(this._fs.samples.length<ENROLL_MIN){SRIT.Notify('Ambil minimal '+ENROLL_MIN+' sampel','warn');return;}
    const sv=$('#abFeSave');if(sv)sv.disabled=true;
    try{
      const r=await SRIT.Server.call('apiWajahEnroll',id,this._fs.samples,'replace');
      SRIT.Notify('Wajah '+((r&&r.nama)||'')+' terdaftar ('+((r&&r.jml)||this._fs.samples.length)+' sampel)','ok');
      this._fs.samples=[];this._fs.galAt=0;this._faceCnt();this._faceLoad();this._galSafe(true,true);
    }catch(e){
      const m=(e&&e.message)||'Gagal menyimpan';
      if(this._localSave(id,this._fs.samples)){SRIT.Notify('Server belum bisa menyimpan ('+m+'). Wajah disimpan di PERANGKAT INI saja.','warn',8000);this._fs.samples=[];this._faceCnt();this._galSafe(true,true);}
      else{SRIT.Notify(m,'err');this._faceCnt();}
    }
  },

  // ---------- galeri vektor ----------
  async _galLoad(force){
    const fs=this._fs;
    if(!force&&fs.gal.length&&Date.now()-fs.galAt<300000)return;
    const r=await SRIT.Server.call('apiWajahList');
    const gal=((r&&r.faces)||[]).map(f=>({id:String(f.id),nama:f.nama,s:(f.s||[]).map(v=>Float32Array.from(v))}));
    const have={};gal.forEach(g=>{have[g.id]=1;});
    this._localGal().forEach(g=>{if(!have[g.id])gal.push(g);});   // pendaftaran yang tersimpan di perangkat ini ikut dipakai
    fs.gal=gal;fs.galAt=Date.now();
  },
  // galeri cadangan di perangkat ini (dipakai bila server belum bisa dipakai)
  _localRaw(){try{return JSON.parse(localStorage.getItem('srit_face_local')||'{}')||{};}catch(e){return {};}},
  _localGal(){const m=this._localRaw();return Object.keys(m).map(id=>({id:id,nama:m[id].nama||'',s:(m[id].s||[]).map(v=>Float32Array.from(v))}));},
  _localSave(id,samples){
    try{
      const m=this._localRaw(),a=SRIT.Store.read('ANAK').find(x=>String(x.ID)===String(id));
      m[id]={nama:a?a.NAMA:'',s:samples.slice(-5)};
      localStorage.setItem('srit_face_local',JSON.stringify(m));return true;
    }catch(e){return false;}
  },
  async _galSafe(force,quiet){
    const fs=this._fs;
    try{await this._galLoad(force);return true;}
    catch(e){
      fs.galErr=(e&&e.message)||'gagal';
      fs.gal=this._localGal();fs.galAt=Date.now();
      if(!quiet)this._faceNote('Daftar wajah dari server belum bisa dimuat: '+fs.galErr+'. '+(fs.gal.length?'Memakai data wajah yang tersimpan di perangkat ini.':'Kamera tetap berfungsi; wajah yang Anda daftarkan sementara disimpan di perangkat ini.'));
      return false;
    }
  },
  _faceNote(msg,retry){
    const b=$('#abCamErr');if(!b)return;
    b.classList.remove('d-none');
    b.innerHTML='<div class="alert alert-warning py-2 mb-0" style="font-size:12px"><i class="bi bi-exclamation-triangle"></i> '+esc(msg)+(retry?' <button class="btn btn-sm btn-outline-warning py-0 ms-2" id="abFRetry">Coba Lagi</button>':'')+'</div>';
    const rt=$('#abFRetry');if(rt)rt.onclick=()=>this._faceInit();
  },

  // ---------- kamera & loop deteksi ----------
  // Urutan: (1) kamera dulu supaya gambar selalu tampil, (2) pustaka wajah, (3) daftar wajah dari server (boleh gagal).
  async startFace(){
    const fs=this._fs;
    if(fs.stream||fs.starting)return;
    const video=$('#abFVideo');if(!video)return;
    this._showFaceCamError(null);
    fs.starting=true;this._faceStat('Meminta izin kamera\u2026');
    const tries=[{video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}},audio:false},{video:{facingMode:{ideal:'user'}},audio:false},{video:true,audio:false}];
    let stream=null,lastErr=null;
    for(const c of tries){
      try{stream=await navigator.mediaDevices.getUserMedia(c);break;}
      catch(e){lastErr=e;if(e&&(e.name==='NotAllowedError'||e.name==='PermissionDeniedError'||e.name==='SecurityError'||e.name==='NotFoundError'||e.name==='NotReadableError'))break;}
    }
    fs.starting=false;
    if(!stream){this._faceStat('Gagal akses kamera','rgba(220,38,38,.92)');await this._showFaceCamError(lastErr);return;}
    if(!$('#abFVideo')){stream.getTracks().forEach(t=>t.stop());return;}   // pengguna sudah pindah tab
    fs.stream=stream;video.srcObject=stream;
    try{await video.play();}catch(e){}
    fs.votes={};
    this._faceInit();
  },
  async _faceInit(){
    const fs=this._fs;
    if(!fs.stream)return;
    this._showFaceCamError(null);
    this._faceStat('Memuat pengenal wajah\u2026');
    try{await loadLib(t=>this._faceStat(t));}
    catch(e){this._faceNote((e&&e.message)||'Pengenal wajah gagal dimuat','retry');this._faceStat('Pengenal wajah gagal dimuat \u2014 kamera tetap aktif','rgba(217,119,6,.95)');return;}
    await this._galSafe(true);
    if(!fs.stream||!$('#abFVideo'))return;
    this._faceStat(fs.mode==='scan'?(fs.gal.length?'Arahkan wajah ke kamera\u2026':'Belum ada wajah terdaftar \u2014 buka mode Daftarkan'):'Mode pendaftaran: pilih anak, lalu Ambil sampel');
    clearTimeout(fs.timer);this._faceLoop();
  },
  async _showFaceCamError(err){
    await this._showCamError(err);
    const rt=$('#abCamRetry');if(rt)rt.onclick=()=>this.startFace();
  },
  stopFace(){
    const fs=this._fs;
    if(fs.timer){clearTimeout(fs.timer);fs.timer=null;}
    if(fs.stream){fs.stream.getTracks().forEach(t=>t.stop());fs.stream=null;}
    fs.busy=false;fs.starting=false;fs.lastDesc=null;
    const v=$('#abFVideo');if(v)v.srcObject=null;
    const c=$('#abFCanvas');if(c){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);}
    this._faceStat('Kamera berhenti.');
  },
  async _faceLoop(){
    const fs=this._fs,video=$('#abFVideo'),canvas=$('#abFCanvas');
    if(!video||!fs.stream)return;
    const next=(ms)=>{if(fs.stream)fs.timer=setTimeout(()=>this._faceLoop(),ms||180);};
    if(!video.videoWidth||video.readyState<video.HAVE_ENOUGH_DATA||fs.busy){next(120);return;}
    fs.busy=true;
    let dets=[];
    try{
      const fa=window.faceapi;
      dets=await fa.detectAllFaces(video,new fa.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5})).withFaceLandmarks().withFaceDescriptors();
    }catch(e){console.error('deteksi wajah',e);}
    fs.busy=false;
    if(!fs.stream||!$('#abFVideo'))return;
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.lineWidth=Math.max(3,canvas.width/200);
    const now=Date.now();
    if(fs.mode==='enroll'){
      const one=dets.length===1;
      dets.forEach(d=>{const b=d.detection.box;ctx.strokeStyle=one?'#22c55e':'#f59e0b';ctx.strokeRect(b.x,b.y,b.width,b.height);});
      if(one){fs.lastDesc=dets[0].descriptor;fs.lastDescAt=now;this._faceStat('Wajah terdeteksi \u2014 tekan Ambil sampel');}
      else{fs.lastDesc=null;this._faceStat(dets.length?'Terdeteksi '+dets.length+' wajah \u2014 harus satu saja':'Wajah belum terdeteksi','rgba(0,0,0,.6)');}
      next(200);return;
    }
    // ---- mode pindai ----
    const seen={};
    dets.forEach(d=>{
      const b=d.detection.box,m=matchFace(d.descriptor,fs.gal);
      ctx.strokeStyle=m.ok?'#22c55e':'#f59e0b';ctx.strokeRect(b.x,b.y,b.width,b.height);
      if(!m.ok)return;
      seen[m.id]=1;
      const v=fs.votes[m.id]||(fs.votes[m.id]={n:0,t:now});
      v.n=(now-v.t>1500)?1:v.n+1;v.t=now;
      if(v.n>=NEED_HITS&&now-(fs.last[m.id]||0)>COOLDOWN){fs.last[m.id]=now;v.n=0;this._faceHit(m.id);}
    });
    Object.keys(fs.votes).forEach(id=>{if(!seen[id]&&now-fs.votes[id].t>1500)delete fs.votes[id];});
    if(!dets.length&&!fs.statLock)this._faceStat(fs.gal.length?'Arahkan wajah ke kamera\u2026':'Belum ada wajah terdaftar \u2014 buka mode Daftarkan');
    next(180);
  },
  _faceHit(id){
    const fs=this._fs;
    Promise.resolve(this._doScan('WAJAH',id)).then(r=>{
      if(!r)return;   // sesi belum dipilih
      const ok=!!r.ok,dup=!!r.dup;
      try{if(navigator.vibrate)navigator.vibrate(ok?50:dup?[90,60,90]:[220]);}catch(e){}
      this._faceStat(ok?'\u2713 '+r.anak.NAMA+' \u2192 HADIR':dup?'\u26a0 '+r.msg:'\u2717 '+(r.msg||id),ok?'rgba(22,163,74,.9)':dup?'rgba(217,119,6,.95)':'rgba(220,38,38,.92)');
      fs.statLock=true;clearTimeout(fs.statT);
      fs.statT=setTimeout(()=>{fs.statLock=false;this._faceStat('Arahkan wajah ke kamera\u2026');},ok?1500:2600);
      this._renderLog();
    });
  }
  });

  // semua jalur penghentian kamera (ganti tab / keluar menu) ikut mematikan kamera wajah
  var _stopQR=A.stopQR;
  A.stopQR=function(){try{if(_stopQR)_stopQR.apply(this,arguments);}catch(e){}try{this.stopFace();}catch(e){}};

  // jalur scan 'WAJAH': pola sama dengan qrScan/rfidScan (anti-ganda instan, antrean, kirim berkelompok ke apiAttScan)
  SRIT.Api.faceScan=function(iso,sessionId,anakId){
    const a=this._anakIdx().id[String(anakId)];
    if(!a){this._staleCheck();return Promise.resolve({ok:false,msg:'Anak tidak dikenali'});}
    if(a.STATUS!=='AKTIF')return Promise.resolve({ok:false,msg:a.NAMA+' tidak aktif'});
    const done=this._isDone(iso,sessionId,a.ID);if(done)return Promise.resolve(this._dupResult(a,done));
    this._markDone(iso,sessionId,a.ID,'HADIR');
    this._enqueue('WAJAH',iso,sessionId,a.ID,a.ID);
    return Promise.resolve({ok:true,anak:Object.assign({},a)});
  };
})();
</script>

Object.assign(SRIT.Features.jadwal,{

<script>
//# sourceURL=JS_Bell.html
/* =========================================================================
   BEL OTOMATIS — membunyikan lonceng (Web Audio, tanpa file suara eksternal)
   lalu membacakan pengumuman (Web Speech API / text-to-speech bahasa Indonesia)
   persis pada JAM_MULAI kegiatan yang ditandai BEL='AKTIF' (JADWAL Rutin atau
   KEGIATAN Khusus).

   Berjalan 100% di browser — tidak butuh server tambahan, tidak butuh koneksi
   internet selain memuat aplikasi ini (mesin TTS bawaan Chrome/Edge/Safari).
   Hanya berbunyi selama SATU tab tempat ia dijalankan tetap terbuka:
     - Layar Publik (Live TV): otomatis mengikuti setiap kali data disegarkan.
     - Menu "Bel Otomatis": bisa dinyalakan manual (mis. dari PC/tablet kantor).

   Kebijakan browser mengharuskan SATU kali sentuhan/klik pengguna sebelum
   audio & suara TTS boleh diputar otomatis (unlock() dipanggil dari tombol).
   ========================================================================= */
SRIT.Util.nowHM=()=>{try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}catch(e){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}};

SRIT.Bell={
  _timer:null,_unlocked:false,_ctx:null,_ingested:null,_firing:null,

  /** Dipanggil Live TV tiap polling dengan daftar bel dari server (mode publik, tanpa login). */
  ingest(list){this._ingested=Array.isArray(list)?list:[];},

  /** Sesi hari ini yang ditandai bel aktif — dari cermin data (masuk/login) atau data yang di-ingest (publik). */
  _sessionsWithBell(iso){
    if(SRIT.Auth&&SRIT.Auth.user){
      return SRIT.Api.getSessionsForDate(iso,true).filter(s=>s.bel==='AKTIF')
        .map(s=>({id:s.id,nama:s.nama,jam:s.jamMulai,teks:s.belTeks||s.nama}))
        .sort((a,b)=>String(a.jam||'').localeCompare(String(b.jam||'')));
    }
    return iso===SRIT.Util.todayISO()?(this._ingested||[]).slice().sort((a,b)=>String(a.jam||'').localeCompare(String(b.jam||''))):[];
  },
  today(){return this._sessionsWithBell(SRIT.Util.todayISO());},
  next(){const hm=SRIT.Util.nowHM();return this.today().find(s=>s.jam>hm)||null;},

  _firedKey(iso){return 'srit_bel_fired_'+iso;},
  _firedSet(iso){try{return new Set(JSON.parse(localStorage.getItem(this._firedKey(iso))||'[]'));}catch(e){return new Set();}},
  _markFired(iso,id){
    const s=this._firedSet(iso);s.add(id);
    try{
      localStorage.setItem(this._firedKey(iso),JSON.stringify([...s]));
      // beres-beres catatan lama supaya localStorage tidak menumpuk
      const todayKey=this._firedKey(SRIT.Util.todayISO());
      Object.keys(localStorage).forEach(k=>{if(k.indexOf('srit_bel_fired_')===0&&k!==todayKey&&k<todayKey)localStorage.removeItem(k);});
    }catch(e){}
  },

  /** Wajib dipanggil dari klik/sentuhan pengguna (kebijakan autoplay browser) agar audio & TTS boleh berbunyi. */
  unlock(){
    if(this._unlocked)return true;
    try{
      this._ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(this._ctx.state==='suspended')this._ctx.resume();
      const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);   // "panaskan" mesin TTS
      this._unlocked=true;
    }catch(e){}
    return this._unlocked;
  },

  /** Bunyi lonceng sederhana (nada berulang), tanpa file audio eksternal. */
  ring(times=3){
    if(!this._ctx)return Promise.resolve();
    const ctx=this._ctx;let t=ctx.currentTime;
    for(let i=0;i<times;i++){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(880,t);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.9);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.9);
      t+=1.1;
    }
    return new Promise(res=>setTimeout(res,times*1100));
  },
  speak(text){
    return new Promise(res=>{
      try{
        const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.95;
        const idv=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('id'));
        if(idv)u.voice=idv;
        u.onend=res;u.onerror=res;
        speechSynthesis.speak(u);
      }catch(e){res();}
    });
  },
  // ---- Ucapkan jam saat ini dalam kata-kata Indonesia (lebih jelas dibacakan TTS daripada format angka "07:05") ----
  _angkaID(n){
    const s=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan'];
    if(n<10)return s[n];
    if(n===10)return 'sepuluh';
    if(n===11)return 'sebelas';
    if(n<20)return s[n-10]+' belas';
    const p=Math.floor(n/10),r=n%10;
    return s[p]+' puluh'+(r?' '+s[r]:'');
  },
  spokenTime(){
    const [h,m]=SRIT.Util.nowHM().split(':').map(Number);
    return 'pukul '+this._angkaID(h)+(m===0?' tepat':' lewat '+this._angkaID(m)+' menit');
  },
  async fire(sess,{test=false}={}){
    if(test){if(!this._unlocked&&!this.unlock())return;}
    else if(!this._unlocked)return;   // belum diaktifkan di tab ini → lewati (dicoba lagi tiap 15dtk selama menit ini)
    await this.ring(3);
    await this.speak('Perhatian, sekarang menunjukkan '+this.spokenTime()+'. '+(sess.teks||sess.nama)+'.');
    if(!test)this._markFired(SRIT.Util.todayISO(),sess.id);
  },
  test(){
    this.unlock();
    return this.fire({nama:'Uji Coba Bel',teks:'Ini adalah uji coba bel otomatis SRIT Absensi.'},{test:true});
  },
  /** Bunyikan bel untuk satu kegiatan tertentu SEKARANG juga (tombol bel manual per kegiatan di menu Bel Otomatis).
   *  Ditandai "sudah berbunyi" untuk hari ini juga, supaya tidak dobel saat jamnya tiba nanti. */
  ringNow(sess){
    this.unlock();
    return this.fire(sess,{test:false});
  },
  _tick(){
    if(!this._firing)this._firing=new Set();
    const iso=SRIT.Util.todayISO(),hm=SRIT.Util.nowHM();
    const fired=this._firedSet(iso);
    this._sessionsWithBell(iso).filter(s=>s.jam===hm&&!fired.has(s.id)&&!this._firing.has(s.id)).forEach(s=>{
      this._firing.add(s.id);
      this.fire(s).finally(()=>this._firing.delete(s.id));
    });
  },
  start(){if(this._timer)return;this._tick();this._timer=setInterval(()=>this._tick(),15000);},
  stop(){clearInterval(this._timer);this._timer=null;}
};
</script>

<script>

// BEL OTOMATIS — pantau & uji coba bel; aktifkan mesin bel di tab ini (mis. PC/tablet kantor tanpa Live TV)
SRIT.Features.bel={
  _tmr:null,
  render(host){
    SRIT.UI.setPage('Bel Otomatis','Bel Otomatis');
    this._host=host;
    this.load();
    this._tmr=setInterval(()=>this.load(),15000);
  },
  load(){
    const host=this._host;if(!host)return;
    const iso=SRIT.Util.todayISO();
    const sesi=SRIT.Bell.today();
    const fired=SRIT.Bell._firedSet(iso);
    const hm=SRIT.Util.nowHM();
    const running=!!SRIT.Bell._timer;
    const unlocked=SRIT.Bell._unlocked;
    host.innerHTML=`
      <div class="card-srit p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h6 class="section-title mb-1"><i class="bi bi-bell-fill me-1"></i>Status Bel di Tab Ini</h6>
            <div class="text-muted-2" style="font-size:12px">Bel hanya berbunyi selama tab ini (atau Layar Publik Live TV) tetap terbuka di perangkat dengan speaker. Aktifkan pada perangkat yang memang dibiarkan menyala, mis. PC kantor atau layar TV.</div>
            <div class="mt-1" style="font-size:12px">Status: ${running?(unlocked?'<span class="text-success fw-semibold"><i class="bi bi-check-circle-fill"></i> Aktif & suara siap</span>':'<span class="text-warning fw-semibold"><i class="bi bi-exclamation-triangle-fill"></i> Berjalan, tapi suara belum diizinkan — klik "Aktifkan Bel"</span>'):'<span class="text-muted-2">Tidak aktif di tab ini</span>'}</div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm ${running?'btn-outline-danger':'btn-primary'}" id="belToggle">${running?'<i class="bi bi-stop-circle"></i> Hentikan':'<i class="bi bi-play-circle"></i> Aktifkan Bel di Tab Ini'}</button>
            <button class="btn btn-sm btn-outline-secondary" id="belTest"><i class="bi bi-volume-up"></i> Uji Bel</button>
          </div>
        </div>
      </div>
      <div class="card-srit p-3">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h6 class="section-title mb-0">Jadwal Bel Hari Ini — ${SRIT.Util.fmtDateShort(iso)} <span class="text-muted-2" style="font-size:12px">(jam sekarang ${hm})</span></h6>
          <span class="text-muted-2" style="font-size:12px">Atur lewat menu <b>Jadwal Rutin</b> / <b>Kegiatan Khusus</b>, kolom "Bunyikan Bel Otomatis?"</span>
        </div>
        <div class="table-responsive"><table class="table table-sm table-srit mb-0">
          <thead><tr><th>Jam</th><th>Kegiatan</th><th>Teks Pengumuman</th><th class="text-center">Status</th><th class="text-center">Aksi</th></tr></thead>
          <tbody>${sesi.length?sesi.map(s=>`<tr>
            <td class="fw-semibold">${SRIT.Util.esc(s.jam||'-')}</td>
            <td>${SRIT.Util.esc(s.nama)}</td>
            <td class="text-muted-2">${SRIT.Util.esc(s.teks)}</td>
            <td class="text-center">${fired.has(s.id)?'<span class="badge-soft st-HADIR">Sudah berbunyi</span>':(s.jam&&s.jam<=hm?'<span class="badge-soft st-SAKIT">Terlewat (tab baru aktif?)</span>':'<span class="badge-soft st-BELUM">Menunggu</span>')}</td>
            <td class="text-center"><button class="btn btn-sm btn-outline-primary py-0 px-2" data-ring="${SRIT.Util.esc(s.id)}" title="Bunyikan bel kegiatan ini sekarang"><i class="bi bi-bell"></i> Bel Sekarang</button></td>
          </tr>`).join(''):'<tr><td colspan="5"><div class="empty-state py-3"><i class="bi bi-bell-slash d-block"></i>Belum ada kegiatan yang ditandai berbunyi bel hari ini.</div></td></tr>'}</tbody>
        </table></div>
      </div>`;
    $('#belToggle').onclick=()=>{
      if(SRIT.Bell._timer){SRIT.Bell.stop();}
      else{SRIT.Bell.unlock();SRIT.Bell.start();}
      this.load();
    };
    $('#belTest').onclick=()=>{SRIT.Notify('Memutar uji bel…','ok');SRIT.Bell.test();};
    host.querySelectorAll('[data-ring]').forEach(btn=>{
      btn.onclick=()=>{
        const sess=sesi.find(x=>String(x.id)===btn.getAttribute('data-ring'));
        if(!sess)return;
        SRIT.Notify('Membunyikan bel: '+sess.nama,'ok');
        SRIT.Bell.ringNow(sess).then(()=>this.load());
      };
    });
  },
  destroy(){if(this._tmr){clearInterval(this._tmr);this._tmr=null;}}
};
</script>
