<script>
//# sourceURL=View_Penghuni.html
// ---------- PENGHUNI & PENEMPATAN ----------
SRIT.Features.penghuni={
  state:{page:1,size:25,search:'',asrama:'',status:''},
  render(host){SRIT.UI.setPage('Penghuni Asrama','Penghuni');
    const asr=SRIT.Store.read('ASRAMA');
    host.innerHTML=`
      <div class="row g-3 mb-3" id="phKpi"></div>
      <div class="card-srit p-3 mb-3"><div class="filter-bar">
        <div style="flex:1;min-width:180px"><label class="form-label-sm">Cari Nama / NIS</label>
          <div style="position:relative">
            <input class="form-control form-control-sm" id="phSearch" style="padding-right:26px" value="${SRIT.Util.esc(this.state.search||'')}">
            <button type="button" id="phSearchClear" class="sf-clear-x" style="display:${this.state.search?'flex':'none'}" title="Hapus pencarian"><i class="bi bi-x-circle-fill"></i></button>
          </div>
        </div>
        <div><label class="form-label-sm">Asrama</label><select class="form-select form-select-sm" id="phAsrama"><option value="">Semua</option>${asr.map(a=>`<option value="${a.ID}" ${this.state.asrama===a.ID?'selected':''}>${a.NAME}</option>`).join('')}</select></div>
        <div><label class="form-label-sm">Status</label><select class="form-select form-select-sm" id="phStatus"><option value="">Semua</option>${['AKTIF','IZIN','PULANG','SAKIT','PINDAH','NONAKTIF','LULUS'].map(s=>`<option ${this.state.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div><div id="phActiveChips"></div></div>
      <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="phTable"></table></div><div class="p-3 border-top" id="phPag"></div></div>`;
    $('#phSearch').oninput=e=>{
      $('#phSearchClear').style.display=e.target.value?'flex':'none';
      clearTimeout(this._searchT);
      this._searchT=setTimeout(()=>{this.state.search=e.target.value;this.state.page=1;this.load();},350);
    };
    $('#phSearchClear').onclick=()=>{$('#phSearch').value='';$('#phSearchClear').style.display='none';this.state.search='';this.state.page=1;this.load();};
    $('#phAsrama').onchange=e=>{this.state.asrama=e.target.value;this.state.page=1;this.load();};
    $('#phStatus').onchange=e=>{this.state.status=e.target.value;this.state.page=1;this.load();};
    this.load();
  },
  renderChips(){
    const box=$('#phActiveChips');if(!box)return;
    const asr=SRIT.Store.read('ASRAMA');
    const chips=[];
    if(this.state.search)chips.push({label:'Cari: "'+this.state.search+'"',clear:()=>{this.state.search='';$('#phSearch').value='';$('#phSearchClear').style.display='none';}});
    if(this.state.asrama)chips.push({label:'Asrama: '+((asr.find(a=>a.ID===this.state.asrama)||{}).NAME||this.state.asrama),clear:()=>{this.state.asrama='';$('#phAsrama').value='';}});
    if(this.state.status)chips.push({label:'Status: '+this.state.status,clear:()=>{this.state.status='';$('#phStatus').value='';}});
    if(!chips.length){box.innerHTML='';return;}
    box.innerHTML=`<div class="d-flex align-items-center gap-2 flex-wrap mt-2">
      <span class="text-muted-2" style="font-size:11px">Filter aktif:</span>
      ${chips.map((c,i)=>`<span class="sf-chip" data-chip="${i}">${SRIT.Util.esc(c.label)} <i class="bi bi-x"></i></span>`).join('')}
      ${chips.length>1?'<span class="text-muted-2 pointer" id="phClearAll" style="font-size:11px;text-decoration:underline">Hapus semua filter</span>':''}
    </div>`;
    box.querySelectorAll('[data-chip]').forEach((el,i)=>{el.onclick=()=>{chips[i].clear();this.state.page=1;this.load();};});
    const ca=$('#phClearAll');if(ca)ca.onclick=()=>{
      this.state.search='';this.state.asrama='';this.state.status='';
      $('#phSearch').value='';$('#phSearchClear').style.display='none';$('#phAsrama').value='';$('#phStatus').value='';
      this.state.page=1;this.load();
    };
  },
  load(){
    const anak=SRIT.Store.read('ANAK');
    const cap=SRIT.Store.read('TEMPAT_TIDUR').length;
    const terisi=SRIT.Store.read('TEMPAT_TIDUR').filter(b=>b.STATUS==='TERISI').length;
    const kpi=(v,l,c)=>`<div class="col-6 col-lg-3"><div class="kpi"><div class="kpi-lbl">${l}</div><div class="kpi-val">${v}</div><div class="trend text-muted-2">${c||''}</div></div></div>`;
    $('#phKpi').innerHTML=kpi(anak.filter(a=>a.STATUS==='AKTIF').length,'Penghuni Aktif')+kpi(cap,'Kapasitas Bed')+kpi(terisi,'Bed Terisi',SRIT.Util.pct(terisi,cap)+'% okupansi')+kpi(cap-terisi,'Bed Tersedia');
    const r=SRIT.Api.list('ANAK',{page:this.state.page,size:this.state.size,search:this.state.search,searchFields:['NAMA','NIS'],filters:{ASRAMA:this.state.asrama,STATUS:this.state.status}});
    $('#phTable').innerHTML=`<thead><tr><th>NIS</th><th>Nama</th><th>Jenjang</th><th>Kamar</th><th>Tempat Tidur</th><th>Wali Asuh</th><th>Status</th><th></th></tr></thead><tbody>
    ${r.rows.length?r.rows.map(a=>`<tr><td>${a.NIS}</td><td class="fw-semibold">${SRIT.Util.esc(a.NAMA)}</td><td><span class="badge-soft st-IZIN">${a.JENJANG}</span></td>
      <td>${(SRIT.Repo.getById('KAMAR',a.KAMAR)||{}).NAME||'-'}</td>
      <td>${(SRIT.Repo.getById('TEMPAT_TIDUR',a.TEMPAT_TIDUR)||{}).KODE||'<span class="text-muted-2">belum</span>'}</td>
      <td>${(SRIT.Repo.getById('WALI_ASUH',a.WALI_ASUH)||{}).NAME||'-'}</td>
      <td><span class="badge-soft ${a.STATUS==='AKTIF'?'st-HADIR':'st-BELUM'}">${a.STATUS}</span></td>
      <td class="text-end">${SRIT.Auth.can('penghuni:UPDATE')?`<button class="btn btn-sm btn-outline-primary py-0" onclick="SRIT.Features.penghuni.place('${a.ID}')"><i class="bi bi-door-open"></i> Tempatkan</button>`:''}</td>
    </tr>`).join(''):'<tr><td colspan="8"><div class="empty-state"><i class="bi bi-people d-block"></i>Tidak ada penghuni</div></td></tr>'}
    </tbody>`;
    $('#phPag').innerHTML=SRIT.UI.pagination(r);
    $$('#phPag [data-pg]').forEach(a=>a.onclick=()=>{this.state.page=+a.dataset.pg;this.load();});
    this.renderChips();
  },
  place(id){
    const a=SRIT.Repo.getById('ANAK',id);
    const kamar=SRIT.Store.read('KAMAR');
    const m=SRIT.Modal.open({title:'Penempatan: '+a.NAMA,
      body:`<form id="phForm"><div class="row g-2">
        <div class="col-12"><label class="form-label-sm">Kamar</label><select class="form-select form-select-sm" name="KAMAR" id="phKamar">${kamar.map(k=>`<option value="${k.ID}" ${a.KAMAR===k.ID?'selected':''}>${k.NAME} (${SRIT.Store.read('ANAK').filter(x=>x.KAMAR===k.ID&&x.STATUS==='AKTIF').length}/${k.KAPASITAS||8})</option>`).join('')}</select></div>
        <div class="col-12"><label class="form-label-sm">Tempat Tidur</label><select class="form-select form-select-sm" name="TEMPAT_TIDUR" id="phBed"></select></div>
        <div class="col-6"><label class="form-label-sm">Wali Asuh</label><select class="form-select form-select-sm" name="WALI_ASUH">${SRIT.Store.read('WALI_ASUH').map(w=>`<option value="${w.ID}" ${a.WALI_ASUH===w.ID?'selected':''}>${w.NAME}</option>`).join('')}</select></div>
        <div class="col-6"><label class="form-label-sm">Kelompok Asuh</label><select class="form-select form-select-sm" name="KELOMPOK">${SRIT.Store.read('KELOMPOK_ASUH').map(k=>`<option value="${k.ID}" ${a.KELOMPOK===k.ID?'selected':''}>${k.NAME}</option>`).join('')}</select></div>
      </div></form>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="phSave">Simpan Penempatan</button>`});
    const fillBeds=()=>{const km=$('#phKamar',m.el).value;const beds=SRIT.Store.read('TEMPAT_TIDUR').filter(b=>b.KAMAR===km&&(b.STATUS!=='TERISI'||b.ANAK_ID===id));
      $('#phBed',m.el).innerHTML='<option value="">— Pilih —</option>'+beds.map(b=>`<option value="${b.ID}" ${a.TEMPAT_TIDUR===b.ID?'selected':''}>${b.KODE} (${b.POSISI})</option>`).join('');};
    $('#phKamar',m.el).onchange=fillBeds;fillBeds();
    $('#phSave',m.el).onclick=()=>{
      const d=Object.fromEntries(new FormData($('#phForm',m.el)));
      // free old bed
      if(a.TEMPAT_TIDUR&&a.TEMPAT_TIDUR!==d.TEMPAT_TIDUR){SRIT.Repo.update('TEMPAT_TIDUR',a.TEMPAT_TIDUR,{STATUS:'KOSONG',ANAK_ID:''});}
      if(d.TEMPAT_TIDUR){SRIT.Repo.update('TEMPAT_TIDUR',d.TEMPAT_TIDUR,{STATUS:'TERISI',ANAK_ID:id});}
      const km=SRIT.Repo.getById('KAMAR',d.KAMAR)||{};
      SRIT.Repo.update('ANAK',id,{KAMAR:d.KAMAR,GEDUNG:km.GEDUNG,LANTAI:km.LANTAI,TEMPAT_TIDUR:d.TEMPAT_TIDUR,WALI_ASUH:d.WALI_ASUH,KELOMPOK:d.KELOMPOK});
      // placement history
      SRIT.Repo.insert('PLACEMENT_HISTORY',{ID:SRIT.Util.uid('PH'),ANAK_ID:id,KAMAR:d.KAMAR,TEMPAT_TIDUR:d.TEMPAT_TIDUR,TANGGAL:new Date().toISOString(),BY:SRIT.Auth.user.ID});
      SRIT.Audit.log('MOVE','penghuni',id);SRIT.Cache.invalidate('dash');
      m.close();SRIT.Notify('Penempatan tersimpan','ok');this.load();
    };
  },
  destroy(){}
};
</script>


<script>__srit.n('View_Penilaian')</script>
<script>
//# sourceURL=View_Penilaian.html
// ---------- PENILAIAN + RAPOR ----------
// Tab 1  Rapor Asrama  : 34 indikator, skala 1-4, sesuai Permensos 9/2026 (Pasal 15-21) → tabel RAPOR_ASRAMA
// Tab 2  Penilaian Cepat: 8 aspek (versi lama) → tabel PENILAIAN
SRIT.RaporAsrama=(function(){
  const SKALA={1:'Kurang',2:'Cukup',3:'Baik',4:'Sangat Baik'};
  // Empat kegiatan Program Asrama (Pasal 15 ayat 2). K4 hanya untuk jenjang SMA (Pasal 21 ayat 2).
  const KEG=[
    {k:'K1',nama:'Penguatan Karakter serta Pemahaman Nilai dan Praktik Keagamaan',pendek:'Karakter & Keagamaan',grup:[
      {nama:'Pembinaan Keagamaan',items:[
        {n:'Ibadah bersama'},{n:'Membaca kitab suci'},{n:'Menghafal kitab suci'},{n:'Kajian keilmuan keagamaan'},
        {n:'Pembinaan ibadah harian'},{n:'Memimpin ibadah'},{n:'Ceramah atau pidato keagamaan'},{n:'Zikir dan doa'},
        {n:'Pemahaman dan pengamalan nilai keagamaan'}]},
      {nama:'Pembinaan Kehidupan Keasramaan',items:[
        {n:'Akhlak mulia'},{n:'Belajar kelompok'},{n:'Literasi'},{n:'Olahraga'},{n:'Budaya bersih'},
        {n:'Kedisiplinan'},{n:'Kepemimpinan dan organisasi'},{n:'Nasionalisme'}]}]},
    {k:'K2',nama:'Pengasuhan',pendek:'Pengasuhan',grup:[{nama:'',items:[
      {n:'Kemandirian dalam kegiatan harian',d:'activity daily living'},
      {n:'Kelekatan dan relasi',d:'dengan wali asuh, wali asrama, dan teman sebaya'},
      {n:'Pemahaman hak dan perlindungan diri',d:'serta keberanian menyampaikan keluhan'},
      {n:'Kesejahteraan dan penyesuaian diri',d:'dalam kehidupan berasrama'},
      {n:'Pemenuhan hak sipil',d:'identitas dan dokumen kependudukan'},
      {n:'Penyaluran bakat, minat, dan kemampuan',d:'sesuai tumbuh kembang'}]}]},
    {k:'K3',nama:'Pelatihan Kecakapan Hidup',pendek:'Kecakapan Hidup',grup:[{nama:'',items:[
      {n:'Kecakapan personal',d:'pengelolaan diri, emosi, tanggung jawab'},
      {n:'Kecakapan sosial',d:'kerja sama, komunikasi, penyelesaian konflik'},
      {n:'Kecakapan fisik',d:'kebugaran, kesehatan diri, keterampilan praktis'},
      {n:'Kebahasaan',d:'public speaking, kosakata, bahasa asing, pidato, literasi bahasa'},
      {n:'Literasi digital yang sehat',d:'gawai secara aman dan bertanggung jawab'},
      {n:'Literasi finansial',d:'uang saku, menabung, perencanaan sederhana'}]}]},
    {k:'K4',nama:'Pelatihan Vokasional dan/atau Kewirausahaan',pendek:'Vokasional/Kewirausahaan',jenjang:['SRMA'],grup:[{nama:'',items:[
      {n:'Kehadiran dalam kegiatan pelatihan'},
      {n:'Keaktifan dan inisiatif'},
      {n:'Kreativitas dan inovasi'},
      {n:'Hasil karya atau produk'},
      {n:'Sikap kerja, kedisiplinan, dan keselamatan kerja'}]}]}
  ];
  // beri ID berurutan i01..i34 (urutan tetap = urutan modul; jangan diubah agar data lama tetap terbaca)
  let seq=0;
  KEG.forEach(g=>{g.items=[];g.grup.forEach(gr=>gr.items.forEach(it=>{seq++;it.id='i'+String(seq).padStart(2,'0');it.keg=g.k;g.items.push(it);}));});
  const ALL=[].concat.apply([],KEG.map(g=>g.items));
  const aktif=jenjang=>KEG.filter(g=>!g.jenjang||g.jenjang.indexOf(jenjang)>=0);
  const predikat=p=>p>=87.5?'Sangat Baik':p>=62.5?'Baik':p>=37.5?'Cukup':'Kurang';
  const parse=v=>{try{const o=JSON.parse(v||'{}');return (o&&typeof o==='object')?o:{};}catch(e){return {};}};
  const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
  // hitung skor per kegiatan + total. Persentase terhadap skor MAKSIMAL jenjang (136 atau 116), bukan terhadap yang terisi.
  function hitung(nilai,jenjang){
    nilai=nilai||{};
    const per=aktif(jenjang).map(g=>{
      const vals=g.items.map(it=>+nilai[it.id]||0);
      const terisi=vals.filter(v=>v>=1&&v<=4).length;
      const skor=vals.reduce((s,v)=>s+(v>=1&&v<=4?v:0),0),maks=g.items.length*4;
      return {k:g.k,nama:g.nama,pendek:g.pendek,skor,maks,terisi,n:g.items.length,persen:pct(skor,maks),pred:predikat(skor/maks*100),lengkap:terisi===g.items.length};
    });
    const skor=per.reduce((s,x)=>s+x.skor,0),maks=per.reduce((s,x)=>s+x.maks,0),terisi=per.reduce((s,x)=>s+x.terisi,0),n=per.reduce((s,x)=>s+x.n,0);
    return {per,skor,maks,terisi,n,persen:pct(skor,maks),pred:predikat(skor/maks*100),lengkap:terisi===n};
  }
  const badge=p=>({'Sangat Baik':'st-HADIR','Baik':'st-IZIN','Cukup':'st-SAKIT','Kurang':'st-ALPA'}[p]||'st-BELUM');
  // Tahun ajaran Juli–Juni: Juli–Des = Ganjil, Jan–Jun = Genap
  function periodeDefault(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return m>=7?(y+'/'+(y+1)+' Ganjil'):((y-1)+'/'+y+' Genap');}
  // draf narasi deskriptif (objektif, mendidik; bukan pengganti penilaian wali asrama) — hanya berdasar skor yang diinput
  function draf(nama,hit,nilai){
    const depan=String(nama||'Ananda').trim().split(/\s+/)[0];
    const kuat=ALL.filter(it=>+nilai[it.id]===4).slice(0,3).map(it=>it.n.toLowerCase());
    const kurang=ALL.filter(it=>+nilai[it.id]>=1&&+nilai[it.id]<=2).slice(0,3);
    const j=a=>a.length>1?a.slice(0,-1).join(', ')+' dan '+a[a.length-1]:a.join('');
    let t='Ananda '+depan+' menunjukkan capaian '+hit.pred.toLowerCase()+' pada Program Asrama ('+String(hit.persen).replace('.',',')+'%).';
    if(kuat.length)t+=' Capaian yang menonjol terlihat pada '+j(kuat)+'.';
    if(kurang.length)t+=' Ananda masih memerlukan pendampingan pada '+j(kurang.map(it=>it.n.toLowerCase()))+'.';
    t+=' Dengan pembiasaan dan pendampingan yang konsisten, Ananda diharapkan berkembang lebih baik pada periode berikutnya.';
    const rek=kurang.map(it=>'Pendampingan dan pembiasaan rutin pada '+it.n.toLowerCase()+' bersama wali asuh.').join('\n');
    return {catatan:t,rekomendasi:rek};
  }
  return {SKALA,KEG,ALL,aktif,predikat,parse,hitung,badge,periodeDefault,draf,pct};
})();

SRIT.Features.penilaian={
  aspects:['KARAKTER','DISIPLIN','KEMANDIRIAN','KEBERSIHAN','KEAGAMAAN','LEADERSHIP','SOSIAL','KEBAHASAAN'],
  state:{tab:'rapor',page:1,size:25,search:'',periode:''},
  render(host){SRIT.UI.setPage('Penilaian & Rapor','Penilaian');
    const t=this.state.tab;
    host.innerHTML=`<ul class="nav nav-pills mb-3 gap-1" id="pnTabs">
        <li class="nav-item"><button type="button" class="nav-link py-1 px-3 ${t==='rapor'?'active':''}" data-tab="rapor"><i class="bi bi-journal-check"></i> Rapor Asrama (Permensos 9/2026)</button></li>
        <li class="nav-item"><button type="button" class="nav-link py-1 px-3 ${t==='cepat'?'active':''}" data-tab="cepat"><i class="bi bi-lightning-charge"></i> Penilaian Cepat 8 Aspek</button></li>
      </ul><div id="pnBody"></div>`;
    $$('#pnTabs [data-tab]').forEach(b=>b.onclick=()=>{this.state.tab=b.dataset.tab;this.state.page=1;this.render(host);});
    const body=$('#pnBody');
    if(t==='rapor')this.renderRapor(body);else this.renderCepat(body);
  },

  /* =================== TAB 1: RAPOR ASRAMA (34 indikator) =================== */
  renderRapor(host){
    const R=SRIT.RaporAsrama,s=this.state;
    const periodes=Array.from(new Set(SRIT.Store.read('RAPOR_ASRAMA').map(r=>r.PERIODE).filter(Boolean))).sort().reverse();
    host.innerHTML=`<div class="card-srit p-3 mb-3"><div class="filter-bar">
      <div style="flex:1;min-width:180px"><label class="form-label-sm">Cari Anak</label>
        <div style="position:relative"><input class="form-control form-control-sm" id="rpSearch" style="padding-right:26px" value="${SRIT.Util.esc(s.search||'')}">
        <button type="button" id="rpSearchClear" class="sf-clear-x" style="display:${s.search?'flex':'none'}" title="Hapus pencarian"><i class="bi bi-x-circle-fill"></i></button></div></div>
      <div><label class="form-label-sm">Periode</label><select class="form-select form-select-sm" id="rpPeriode"><option value="">Semua</option>${periodes.map(p=>`<option ${s.periode===p?'selected':''}>${SRIT.Util.esc(p)}</option>`).join('')}</select></div>
      ${SRIT.Auth.can('penilaian:CREATE')?'<div><button class="btn btn-primary btn-sm" id="rpAdd"><i class="bi bi-plus-lg"></i> Buat Rapor</button></div>':''}
      ${SRIT.Approval.canRapor()?'<div><button class="btn btn-outline-success btn-sm" id="rpKnow"><i class="bi bi-patch-check"></i> Ketahui semua yang final</button></div>':''}
    </div>
    <div class="text-muted-2 mt-2" style="font-size:12px">4 kegiatan Program Asrama · 34 indikator (SD/SMP: 29) · skala 1–4 · skor maks 136 (SD/SMP 116) · predikat dari persentase skor.</div></div>
    <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="rpTable"></table></div><div class="p-3 border-top" id="rpPag"></div></div>`;
    $('#rpSearch').oninput=e=>{
      $('#rpSearchClear').style.display=e.target.value?'flex':'none';
      clearTimeout(this._rpT);this._rpT=setTimeout(()=>{s.search=e.target.value;s.page=1;this.loadRapor();},350);
    };
    $('#rpSearchClear').onclick=()=>{$('#rpSearch').value='';$('#rpSearchClear').style.display='none';s.search='';s.page=1;this.loadRapor();};
    $('#rpPeriode').onchange=e=>{s.periode=e.target.value;s.page=1;this.loadRapor();};
    const add=$('#rpAdd');if(add)add.onclick=()=>this.formRapor();
    const kn=$('#rpKnow');if(kn)kn.onclick=()=>this.ketahuiSemua();
    this.loadRapor();
  },
  loadRapor(){
    const R=SRIT.RaporAsrama,s=this.state,esc=SRIT.Util.esc;
    const r=SRIT.Api.list('RAPOR_ASRAMA',{page:s.page,size:s.size,search:s.search,searchFields:['NAMA_ANAK'],filters:{PERIODE:s.periode}});
    const canU=SRIT.Auth.can('penilaian:UPDATE');
    $('#rpTable').innerHTML=`<thead><tr><th>Anak</th><th>Periode</th><th title="Penguatan Karakter & Keagamaan">Karakter</th><th>Pengasuhan</th><th>Kec. Hidup</th><th>Vokasional</th><th>Total</th><th>Predikat</th><th></th></tr></thead><tbody>
    ${r.rows.length?r.rows.map(p=>{
      const nilai=R.parse(p.NILAI),h=R.hitung(nilai,p.JENJANG),fin=(p.STATUS==='FINAL'||p.STATUS==='DIKETAHUI'),known=p.STATUS==='DIKETAHUI';
      const cell=k=>{const x=h.per.find(q=>q.k===k);return x?`<span class="badge-soft ${R.badge(x.pred)}" title="${x.skor}/${x.maks}">${String(x.persen).replace('.',',')}%</span>`:'<span class="text-muted-2">–</span>';};
      return `<tr>
      <td class="fw-semibold">${esc(SRIT.nm('ANAK',p.ANAK)||p.NAMA_ANAK)}<div class="text-muted-2" style="font-size:11px">${esc(p.JENJANG||'')}</div></td>
      <td><span class="badge-soft st-IZIN">${esc(p.PERIODE||'-')}</span></td>
      <td>${cell('K1')}</td><td>${cell('K2')}</td><td>${cell('K3')}</td><td>${cell('K4')}</td>
      <td class="fw-bold">${h.skor}/${h.maks}</td>
      <td>${fin?`<span class="badge-soft ${R.badge(h.pred)}">${h.pred}</span>`:`<span class="badge-soft st-BELUM">Draf ${h.terisi}/${h.n}</span>`}${known?'<div class="text-muted-2" style="font-size:10px"><i class="bi bi-patch-check-fill text-success"></i> diketahui '+esc(p.DIKETAHUI_OLEH||'')+'</div>':(fin?'<div class="text-muted-2" style="font-size:10px">menunggu diketahui '+esc(SRIT.Approval.roleName(SRIT.Approval.R.RAPOR))+'</div>':'')}</td>
      <td class="text-end text-nowrap">
        <button class="btn btn-sm btn-outline-primary py-0" onclick="SRIT.Features.penilaian.raporAsrama('${p.ID}')"><i class="bi bi-file-earmark-text"></i> Rapor</button>
        ${(p.STATUS==='FINAL'&&SRIT.Approval.canRapor())?`<button class="btn btn-sm btn-outline-success py-0 ms-1" title="Ketahui (Kepala Sekolah)" onclick="SRIT.Features.penilaian.ketahui('${p.ID}')"><i class="bi bi-patch-check"></i></button>`:''}

        <div class="col-12"><div class="text-muted-2" style="font-size:12px">Skala: <b>1</b> Kurang · <b>2</b> Cukup · <b>3</b> Baik · <b>4</b> Sangat Baik. Beri skor berdasarkan pengamatan harian dan jurnal kegiatan, bukan kesan pribadi.</div></div>

        <div class="col-6 col-md-3"><label class="form-label-sm">Sakit</label><input type="number" min="0" class="form-control form-control-sm" name="SAKIT" value="${esc(p.SAKIT===undefined?'':p.SAKIT)}"></div>

        <div class="col-6 col-md-3"><label class="form-label-sm">Alfa</label><input type="number" min="0" class="form-control form-control-sm" name="ALFA" value="${esc(p.ALFA===undefined?'':p.ALFA)}"></div>
        <div class="col-12"><div class="d-flex justify-content-between align-items-end"><label class="form-label-sm mb-1">Catatan Pendamping Asrama</label><button type="button" class="btn btn-sm btn-outline-secondary py-0" id="rpDraf"><i class="bi bi-magic"></i> Buat draf dari skor</button></div>
          <textarea class="form-control form-control-sm" name="CATATAN" rows="4" placeholder="Narasi deskriptif: kekuatan dan area yang perlu dikembangkan (bukan kalimat yang hanya menilai).">${esc(p.CATATAN||'')}</textarea></div>

      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-outline-primary btn-sm" id="rpSaveDraf">Simpan Draf</button><button class="btn btn-primary btn-sm" id="rpSaveFinal"><i class="bi bi-check2-circle"></i> Simpan & Finalkan</button>`});
    const el=m.el,cur={...nilai};
    const readScores=()=>{const o={};R.ALL.forEach(it=>{const c=$('input[name="'+it.id+'"]:checked',el);if(c)o[it.id]=+c.value;});return o;};
    const drawSum=()=>{
      Object.assign(cur,readScores());
      const h=R.hitung(cur,jenjang);
      $('#rpSum',el).innerHTML=`<div class="d-flex flex-wrap gap-2 align-items-center" style="font-size:13px">

          gr.items.forEach(it=>{
            html+=`<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 py-1 border-bottom" style="font-size:13px">

      if(!periode){SRIT.Notify('Periode wajib diisi','err');return;}
      if(!id&&SRIT.Store.read('RAPOR_ASRAMA').some(r=>r.ANAK===aid&&r.PERIODE===periode)){SRIT.Notify('Rapor anak ini untuk periode tersebut sudah ada. Buka dari daftar untuk mengubahnya.','err');return;}
      if(final&&!h.lengkap){SRIT.Notify('Belum lengkap: '+(h.n-h.terisi)+' indikator belum diberi skor.','err');return;}
      const num=v=>(v===''||v==null)?'':Math.max(0,parseInt(v,10)||0);
      const row={ANAK:aid,NAMA_ANAK:anakOf(aid).NAMA||p.NAMA_ANAK||'',PERIODE:periode,TANGGAL:p.TANGGAL||SRIT.Util.todayISO(),JENJANG:jenjang||'',
        NILAI:JSON.stringify(Object.fromEntries(R.aktif(jenjang).flatMap(g=>g.items).filter(it=>cur[it.id]).map(it=>[it.id,cur[it.id]]))),TOTAL:h.skor,MAKS:h.maks,PERSEN:h.persen,PREDIKAT:final?h.pred:'',
        CATATAN:String(f.CATATAN||'').trim(),REKOMENDASI:String(f.REKOMENDASI||'').trim(),
        HADIR:num(f.HADIR),SAKIT:num(f.SAKIT),IZIN:num(f.IZIN),ALFA:num(f.ALFA),PENILAI:String(f.PENILAI||'').trim(),STATUS:final?'FINAL':'DRAFT'};
      if(id){SRIT.Repo.update('RAPOR_ASRAMA',id,row);SRIT.Audit.log('UPDATE','penilaian',id);}
      else{row.ID=SRIT.Util.uid('RA');SRIT.Repo.insert('RAPOR_ASRAMA',row);SRIT.Audit.log('CREATE','penilaian',row.ID);}
      m.close();SRIT.Notify(final?'Rapor difinalkan':'Draf rapor tersimpan','ok');self.renderRapor($('#pnBody'));
    };

    $('#rpSaveFinal',el).onclick=()=>simpan(true);

<script>
//# sourceURL=View_Profiling.html
// ---------- PROFILING SISWA ----------
// Perkembangan & seluruh catatan satu anak per Bulan / Tribulan / Semester / Tahun Ajaran (TA = Juli–Juni).

const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

const ASPEK_L={KARAKTER:'Karakter',DISIPLIN:'Disiplin',KEMANDIRIAN:'Kemandirian',KEBERSIHAN:'Kebersihan',KEAGAMAAN:'Keagamaan',LEADERSHIP:'Kepemimpinan',SOSIAL:'Sosial',KEBAHASAAN:'Kebahasaan'};
const COL={H:'#16a34a',I:'#0ea5e9',S:'#f59e0b',A:'#ef4444'},TEAL='#00b8a9';
const TRIB=['I','II','III','IV'];
const KAT={AKADEMIK:'Akademik',KARAKTER:'Karakter & Sikap',SOSIAL:'Sosial & Relasi',KEAGAMAAN:'Keagamaan',KEMANDIRIAN:'Kemandirian',KESEHATAN:'Kesehatan',PRESTASI:'Prestasi & Capaian',KELUARGA:'Keluarga & Pengasuhan',LAINNYA:'Lainnya'};
const KAT_C={PRESTASI:'#16a34a',KESEHATAN:'#0ea5e9',KARAKTER:'#8b5cf6',AKADEMIK:'#2a78d6',SOSIAL:'#14b8a6',KEAGAMAAN:'#a16207',KEMANDIRIAN:'#f59e0b',KELUARGA:'#ec4899',LAINNYA:'#64748b'};
const pad=n=>String(n).padStart(2,'0');
const taStart=iso=>{const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=7?y:y-1;};
const monthsOfTA=s=>{const o=[];for(let i=0;i<12;i++){const m=7+i;o.push((m>12?s+1:s)+'-'+pad(m>12?m-12:m));}return o;};
const monthEnd=ym=>{const a=ym.split('-').map(Number);return ym+'-'+pad(new Date(a[0],a[1],0).getDate());};
const ymLabel=ym=>BLN[+ym.slice(5,7)-1]+' '+ym.slice(2,4);
const rd=t=>{try{return SRIT.Store.read(t)||[];}catch(e){return [];}};
const nmOf=(t,id,f)=>{if(!id)return '';const r=SRIT.Repo.getById(t,id);return r?(r[f||'NAME']||''):'';};
const r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ---------- periode ---------- */
function mk(kind,s,idx0,idx1){
  const ms=monthsOfTA(s),mon=ms.slice(idx0,idx1+1);let label,sem='';
  if(kind==='bulan')label=BLN_L[+mon[0].slice(5,7)-1]+' '+mon[0].slice(0,4);
  else if(kind==='tribulan')label='Tribulan '+TRIB[idx0/3]+' ('+BLN[+mon[0].slice(5,7)-1]+'–'+BLN[+mon[2].slice(5,7)-1]+' '+mon[2].slice(0,4)+')';
  else if(kind==='semester'){sem=idx0===0?'ganjil':'genap';label='Semester '+(sem==='ganjil'?'Ganjil':'Genap')+' '+s+'/'+(s+1);}
  else label='Tahun Ajaran '+s+'/'+(s+1);
  return {kind,start:s,sem,label,idx0,idx1,months:mon,from:mon[0]+'-01',to:monthEnd(mon[mon.length-1])};
}
function periodOf(st){
  const s=+st.ta,sub=+st.sub;let idx0=0,idx1=11;
  if(st.mode==='bulan'){idx0=idx1=Math.max(0,Math.min(11,sub));}
  else if(st.mode==='tribulan'){idx0=Math.max(0,Math.min(3,sub))*3;idx1=idx0+2;}
  else if(st.mode==='semester'){idx0=sub?6:0;idx1=idx0+5;}
  const P=mk(st.mode,s,idx0,idx1),len=idx1-idx0+1;
  P.prev=(st.mode!=='ta'&&idx0-len>=0)?mk(st.mode,s,idx0-len,idx1-len):null;
  return P;
}
const inR=(P,iso)=>!!iso&&iso>=P.from&&iso<=P.to;
function penMatch(r,P){
  if(P.kind==='semester'||P.kind==='ta'){
    const m=/(\d{4}).*?(ganjil|genap)/i.exec(r.PERIODE||'');
    if(m){const y=+m[1],g=m[2].toLowerCase(),inTA=(y===P.start)||(g==='genap'&&y===P.start+1);if(!inTA)return false;return P.kind==='ta'||g===P.sem;}
  }
  return inR(P,r.TANGGAL);
}

/* ---------- data ---------- */
function build(anak,ta,absen){
  const TA=mk('ta',ta,0,11),mine=(t,f)=>rd(t).filter(r=>r[f||'ANAK']===anak.ID);
  const inTA=r=>inR(TA,r.TANGGAL);
  const D={anak,ta,hari:absen.hari||{},sekolah:absen.sekolah||{},partial:!!absen.partial,sampai:absen.sampai||'',
    pel:mine('PELANGGARAN').filter(inTA),pbn:mine('PEMBINAAN').filter(inTA),izn:mine('IZIN').filter(inTA),
    pen:mine('PENILAIAN').filter(r=>penMatch(r,TA)),tamu:mine('BUKU_TAMU').filter(inTA),
    ops:[].concat(
      mine('OPS_PENILAIAN').filter(inTA).map(r=>({t:'Penilaian',d:r.TANGGAL,x:(r.ASPEK||'-')+': '+(r.NILAI||'-')+(r.CATATAN?' — '+r.CATATAN:'')})),
      mine('OPS_KOMUNIKASI').filter(inTA).map(r=>({t:'Komunikasi',d:r.TANGGAL,x:(r.KANAL||'-')+': '+(r.ISI||'')})),
      mine('OPS_KEPULANGAN').filter(inTA).map(r=>({t:'Kepulangan',d:r.TANGGAL,x:(r.TUJUAN||'-')+' · dijemput '+(r.PENJEMPUT||'-')+' ('+(r.STATUS||'-')+')'})),
      mine('OPS_KUNJUNGAN').filter(inTA).map(r=>({t:'Kunjungan',d:r.TANGGAL,x:(r.PENGUNJUNG||'-')+' ('+(r.HUBUNGAN||'-')+') '+(r.JAM||'')}))
    ).sort((a,b)=>String(b.d).localeCompare(String(a.d))),
    cat:mine('CATATAN_PERKEMBANGAN').filter(inTA),
    kamarSkor:rd('INSPEKSI').filter(r=>inTA(r)&&anak.KAMAR&&r.KAMAR===anak.KAMAR)
  };
  D.tt={};rd('TATA_TERTIB').forEach(t=>D.tt[t.ID]=t);
  return D;
}
function attSum(hari,P){let h=0,i=0,s=0,a=0,days=0;Object.keys(hari).forEach(d=>{if(d>=P.from&&d<=P.to){const x=hari[d];h+=x[0];i+=x[1];s+=x[2];a+=x[3];days++;}});const t=h+i+s+a;return {h,i,s,a,t,days,pct:t?r1(h/t*100):null};}
function izinDays(r){if(!r.TANGGAL)return 0;const e=r.KEMBALI&&r.KEMBALI>=r.TANGGAL?r.KEMBALI:r.TANGGAL;return Math.round((new Date(e.slice(0,10)+'T00:00:00')-new Date(r.TANGGAL.slice(0,10)+'T00:00:00'))/864e5)+1;}
function stats(D,P,full){
  const att=attSum(D.hari,P),pel=D.pel.filter(r=>inR(P,r.TANGGAL)),pbn=D.pbn.filter(r=>inR(P,r.TANGGAL)),izn=D.izn.filter(r=>inR(P,r.TANGGAL));
  const pen=D.pen.filter(r=>penMatch(r,P)),tamu=D.tamu.filter(r=>inR(P,r.TANGGAL)),ops=D.ops.filter(r=>inR(P,r.d)),cat=D.cat.filter(r=>inR(P,r.TANGGAL)),insp=D.kamarSkor.filter(r=>inR(P,r.TANGGAL));
  const asp={};ASPEK.forEach(a=>{const v=pen.map(r=>+r[a]).filter(x=>x>0);asp[a]=v.length?r2(avg(v)):null;});
  const av=ASPEK.map(a=>asp[a]).filter(x=>x!=null),tk={RINGAN:0,SEDANG:0,BERAT:0};pel.forEach(r=>{tk[r.TINGKAT]=(tk[r.TINGKAT]||0)+1;});
  const S={P,att,pel,pbn,izn,pen,tamu,ops,cat,insp,asp,nilai:av.length?r2(avg(av)):null,tk,izinHari:izn.reduce((s,r)=>s+(['DITOLAK','MENUNGGU'].includes(r.STATUS)?0:izinDays(r)),0),
    terlambat:izn.filter(r=>r.STATUS==='TERLAMBAT').length,pbnAktif:pbn.filter(r=>r.STATUS!=='SELESAI').length};
  if(full&&P.prev)S.prev=stats(D,P.prev,false);
  return S;
}
function bench(D,P){
  const ids={};rd('ANAK').forEach(a=>{if(a.JENJANG===D.anak.JENJANG)ids[a.ID]=1;});
  const rows=rd('PENILAIAN').filter(r=>ids[r.ANAK]&&penMatch(r,P)),o={};
  ASPEK.forEach(a=>{const v=rows.map(r=>+r[a]).filter(x=>x>0);o[a]=v.length?r2(avg(v)):null;});
  return o;
}
function kategori(S){
  const p=S.att.pct,n=S.nilai,b=S.tk.BERAT||0,t=S.pel.length;
  if((p!=null&&p<80)||b>0||(n!=null&&n<2.5))return {k:'Perlu Perhatian Khusus',c:'#ef4444',i:'bi-exclamation-octagon'};
  if((p!=null&&p<90)||t>=3||(n!=null&&n<3)||S.att.a>0)return {k:'Perlu Pendampingan',c:'#f59e0b',i:'bi-exclamation-triangle'};
  if(p==null&&n==null&&!t)return {k:'Belum Cukup Data',c:'#64748b',i:'bi-hourglass-split'};
  return {k:'Berkembang Baik',c:'#16a34a',i:'bi-emoji-smile'};
}
function insights(D,S,B,sens){
  const o=[],a=S.att,pv=S.prev;
  const add=(c,i,t)=>o.push({c,i,t});
  if(a.t){
    const lv=a.pct>=95?['ok','Kehadiran sangat baik']:a.pct>=90?['ok','Kehadiran baik']:a.pct>=80?['wr','Kehadiran perlu ditingkatkan']:['bad','Kehadiran rendah, perlu pendampingan'];
    add(lv[0],'bi-calendar-check',lv[1]+': '+a.pct+'% dari '+a.t+' sesi tercatat ('+a.h+' hadir).');
    if(pv&&pv.att.pct!=null){const d=r1(a.pct-pv.att.pct);if(Math.abs(d)>=3)add(d>0?'ok':'bad',d>0?'bi-graph-up-arrow':'bi-graph-down-arrow','Kehadiran '+(d>0?'naik ':'turun ')+Math.abs(d)+' poin dibanding '+S.P.prev.label.split(' (')[0]+'.');}
    if(a.a>0)add('bad','bi-x-octagon','Ada '+a.a+' sesi ALPA (tanpa keterangan).');

  }else add('mut','bi-calendar-x','Belum ada data absensi pada periode ini.');

  else{
    add(S.tk.BERAT?'bad':S.pel.length>=3?'wr':'mut','bi-exclamation-diamond',S.pel.length+' pelanggaran ('+['RINGAN','SEDANG','BERAT'].map(k=>S.tk[k]?S.tk[k]+' '+k.toLowerCase():'').filter(Boolean).join(', ')+').');
    if(pv&&pv.pel.length!==S.pel.length)add(S.pel.length<pv.pel.length?'ok':'wr','bi-arrow-left-right','Pelanggaran '+(S.pel.length<pv.pel.length?'berkurang':'bertambah')+' dari '+pv.pel.length+' menjadi '+S.pel.length+' dibanding periode sebelumnya.');
  }
  if(S.pbn.length)add(S.pbnAktif?'wr':'ok','bi-heart-pulse',S.pbn.length+' kegiatan pembinaan'+(S.pbnAktif?', '+S.pbnAktif+' masih berlangsung.':', seluruhnya selesai.'));
  if(S.nilai!=null){
    const ks=ASPEK.filter(x=>S.asp[x]!=null).sort((x,y)=>S.asp[y]-S.asp[x]),top=ks.slice(0,2),low=ks.slice(-2).reverse();
    add(S.nilai>=3?'ok':S.nilai>=2.5?'wr':'bad','bi-award','Rata-rata penilaian '+S.nilai+' dari 4. Terkuat: '+top.map(x=>ASPEK_L[x]+' ('+S.asp[x]+')').join(', ')+'.');
    const lw=low.filter(x=>S.asp[x]<3);if(lw.length)add('wr','bi-flag','Perlu dikembangkan: '+lw.map(x=>ASPEK_L[x]+' ('+S.asp[x]+')').join(', ')+'.');
    if(pv&&pv.nilai!=null){const d=r2(S.nilai-pv.nilai);if(Math.abs(d)>=0.15)add(d>0?'ok':'wr','bi-arrow-up-right','Rata-rata penilaian '+(d>0?'naik ':'turun ')+Math.abs(d)+' dari periode sebelumnya.');}
    const bm=ASPEK.map(x=>B[x]).filter(x=>x!=null);if(bm.length){const bv=r2(avg(bm));add(S.nilai>=bv?'ok':'mut','bi-people','Rata-rata jenjang '+D.anak.JENJANG+' pada periode ini: '+bv+'.');}
  }else add('mut','bi-award','Belum ada penilaian pada periode ini.');

  if(S.tamu.length+S.ops.filter(x=>x.t==='Kunjungan').length)add('mut','bi-person-badge','Kunjungan keluarga/tamu: '+(S.tamu.length+S.ops.filter(x=>x.t==='Kunjungan').length)+' kali.');
  if(S.cat.length){const pr=S.cat.filter(r=>r.KATEGORI==='PRESTASI').length;add(pr?'ok':'mut','bi-journal-text',S.cat.length+' catatan perkembangan tercatat'+(pr?', termasuk '+pr+' prestasi/capaian positif':'')+'.');}

}

/* ---------- potongan tampilan ---------- */
const dl=(cur,prev,suffix,lowerBetter)=>{if(cur==null||prev==null)return '';const d=r1(cur-prev);if(!d)return '<span class="text-muted-2">= sama</span>';const good=lowerBetter?d<0:d>0;return `<span style="color:${good?'#16a34a':'#ef4444'};font-weight:700">${d>0?'▲':'▼'} ${Math.abs(d)}${suffix||''}</span> <span class="text-muted-2">vs sebelumnya</span>`;};
const kpi=(l,v,sub,c)=>`<div class="col-6 col-md-4 col-xl-2"><div class="kpi"><div class="kpi-lbl">${l}</div><div class="kpi-val" style="color:${c||'inherit'}">${v}</div><div class="mt-1" style="font-size:11px">${sub||'&nbsp;'}</div></div></div>`;
const tbl=(cols,rows,empty)=>`<div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr>${cols.map(c=>'<th>'+c+'</th>').join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''):`<tr><td colspan="${cols.length}" class="text-center text-muted-2 py-3">${empty||'Tidak ada catatan pada periode ini'}</td></tr>`}</tbody></table></div>`;

const tkCls={RINGAN:'SAKIT',SEDANG:'IZIN',BERAT:'ALPA'};
function cal(ym,hari){
  const y=+ym.slice(0,4),m=+ym.slice(5,7),dim=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7;
  let h=`<div class="pf-cal"><div class="fw-semibold mb-1" style="font-size:12px">${BLN_L[m-1]} ${y}</div><div class="pf-grid">`+['Sn','Sl','Rb','Km','Jm','Sb','Mg'].map(d=>`<div class="pf-dh">${d}</div>`).join('');

  _charts(D,P,S,B,mrow,sens){

    mk2('pfC2',{type:'doughnut',data:{labels:['Hadir','Izin','Sakit','Alpa'],datasets:[{data:[S.att.h,S.att.i,S.att.s,S.att.a],backgroundColor:[COL.H,COL.I,COL.S,COL.A]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});

    mk2('pfC3',{type:'radar',data:{labels:ASPEK.map(a=>ASPEK_L[a]),datasets:ds},options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:4,ticks:{stepSize:1}}},plugins:{legend:{position:'bottom'}}}});
    mk2('pfC4',{type:'bar',data:{labels:lbl,datasets:[{label:'Ringan',data:mrow.map(m=>m.x.pel.filter(r=>r.TINGKAT==='RINGAN').length),backgroundColor:COL.S,stack:'p'},{label:'Sedang',data:mrow.map(m=>m.x.pel.filter(r=>r.TINGKAT==='SEDANG').length),backgroundColor:COL.I,stack:'p'},{label:'Berat',data:mrow.map(m=>m.x.pel.filter(r=>r.TINGKAT==='BERAT').length),backgroundColor:COL.A,stack:'p'},{type:'line',label:'Pembinaan',data:mrow.map(m=>m.x.pbn.length),borderColor:'#8b5cf6',backgroundColor:'#8b5cf6',tension:.3,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}}},plugins:{legend:{position:'bottom'}}}});

  /* ---------- laporan resmi ---------- */
  _report(){

  _rekom(S,sens){

    const pred=v=>v==null?'-':(R[Math.round(v)]||['','Belum Berkembang','Mulai Berkembang','Berkembang','Sangat Baik'][Math.round(v)]||'-');
    const fd=d=>d?U.fmtDateShort(String(d).slice(0,10)):'-',byD=(x,y)=>String(x.TANGGAL).localeCompare(String(y.TANGGAL));

    let k=0;const H=t=>'<h3>'+String.fromCharCode(65+(k++))+'. '+t+'</h3>';const body=[];
    const kuma=[nmOf('ASRAMA',a.ASRAMA),nmOf('GEDUNG',a.GEDUNG),nmOf('LANTAI',a.LANTAI),nmOf('KAMAR',a.KAMAR)].filter(Boolean).join(' › ')||'-';
    body.push(H('Identitas Siswa')+T(['Keterangan','Data','Keterangan','Data'],[['Nama',`<b>${esc(a.NAMA)}</b>`,'NIS',esc(a.NIS||'-')],['Jenjang / Kelas',esc((a.JENJANG||'-')+' / '+(a.KELAS||'-')),'Jenis kelamin',a.JK==='P'||a.JK==='Perempuan'?'Perempuan':'Laki-laki'],['Penempatan asrama',esc(kuma),'Tempat tidur',esc(nmOf('TEMPAT_TIDUR',a.TEMPAT_TIDUR,'KODE')||'-')],['Wali asuh',esc(nmOf('WALI_ASUH',a.WALI_ASUH)||'-'),'Kelompok asuh',esc(nmOf('KELOMPOK_ASUH',a.KELOMPOK)||'-')],['Tanggal masuk',fd(a.TANGGAL_MASUK),'Status',esc(a.STATUS||'-')]]));
    body.push(H('Ringkasan Perkembangan')+`<div class="chips"><span><b>${cat.k}</b></span><span>Kehadiran <b>${S.att.pct==null?'-':S.att.pct+'%'}</b> (${S.att.h} dari ${S.att.t} sesi)</span>${sens?`<span>Pelanggaran <b>${S.pel.length}</b></span><span>Pembinaan <b>${S.pbn.length}</b></span><span>Penilaian <b>${S.nilai==null?'-':S.nilai}</b>/4</span><span>Catatan perkembangan <b>${S.cat.length}</b></span>`:''}</div><ul>${ins.map(x=>'<li>'+esc(x.t)+'</li>').join('')}</ul>`);
    if(inc('grafik')){const g=img('pfC1')+img('pfC3');if(g)body.push('<div style="text-align:center;margin-top:6px">'+g+'</div>');}

    }

      if(lem&&S.ops.filter(x=>x.t==='Penilaian').length)body.push('<b>Observasi penilaian lain</b>'+T(['Tanggal','Keterangan'],S.ops.filter(x=>x.t==='Penilaian').map(x=>[fd(x.d),esc(x.x)])));
    }
    if(sens&&inc('pelanggaran')){
      const tt=r=>D.tt[r.ATURAN]||{},rd2=S.pel.slice().sort(byD);
      body.push(H('Pelanggaran dan Pembinaan')+`<div>Pelanggaran: <b>${S.pel.length}</b> (ringan ${S.tk.RINGAN||0}, sedang ${S.tk.SEDANG||0}, berat ${S.tk.BERAT||0}). Pembinaan: <b>${S.pbn.length}</b> kegiatan, ${S.pbnAktif} masih berlangsung.</div><b>Pelanggaran</b>`+T(['Tanggal','Aturan','Tingkat','Kronologi','Tindakan / sanksi pembinaan','Status'],rd2.map(r=>[fd(r.TANGGAL),esc((tt(r).KODE?tt(r).KODE+' — ':'')+(tt(r).JUDUL||'-')),esc(r.TINGKAT||'-'),esc(r.KEJADIAN||'-'),esc(r.TINDAKAN||'-'),esc(r.STATUS||'-')]))+'<b>Pembinaan</b>'+T(['Tanggal','Jenis','Materi','Hasil','Pembina','Status'],S.pbn.slice().sort(byD).map(r=>[fd(r.TANGGAL),esc(r.JENIS||'-'),esc(r.MATERI||'-'),esc(r.HASIL||'-'),esc(r.PEMBINA||'-'),esc(r.STATUS||'-')])));
    }
    if(sens&&inc('izin')){
      const kj=S.tamu.map(r=>[fd(r.TANGGAL),esc(r.NAMA||'-'),'-',esc(r.KEPERLUAN||'-')]).concat(S.ops.filter(x=>x.t==='Kunjungan').map(x=>[fd(x.d),esc(x.x),'','']));

      const sk=S.insp.map(r=>+r.SKOR).filter(z=>z>0);
      body.push(H('Kondisi Hunian (Inspeksi Kamar)')+(sk.length?'<div>Rata-rata skor inspeksi kamar: <b>'+r1(avg(sk))+'</b> ('+sk.length+' inspeksi).</div>':'')+T(['Tanggal','Kamar','Kebersihan','Kerapian','Tempat tidur','Fasilitas','Skor','Catatan'],S.insp.slice().sort(byD).map(r=>[fd(r.TANGGAL),esc(nmOf('KAMAR',r.KAMAR)||r.KAMAR||'-'),esc(r.KEBERSIHAN||'-'),esc(r.KERAPIAN||'-'),esc(r.TEMPAT_TIDUR||'-'),esc(r.FASILITAS||'-'),r.SKOR||'-',esc(r.CATATAN||'-')])));
    }
    body.push(H('Kesimpulan dan Rekomendasi')+'<ol>'+this._rekom(S,sens).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'+(o.cat?'<div><b>Catatan petugas:</b><br>'+esc(o.cat).replace(/\n/g,'<br>')+'</div>':''));
    const ttd=`<table class="ttd"><tr><td>Mengetahui,<br>Orang tua / Wali<br><br><br><br>( ${esc(o.ortu||'……………………………')} )</td><td><br>Wali Asuh<br><br><br><br>( ${esc(o.wa||'……………………………')} )</td><td>${esc(o.kota)}, ${fd(o.tgl)}<br>${esc(o.jab||'Kepala Sekolah')}<br><br><br><br>( ${esc(o.ks||'……………………………')} )</td></tr></table>`;
    if(inc('lampiran')&&dayRows.length)body.push('<div style="page-break-before:always"></div><h3>Lampiran. Rincian Absensi Harian (jumlah sesi)</h3>'+T(['Tanggal','Hadir','Izin','Sakit','Alpa'],dayRows.map(d=>[fd(d),D.hari[d][0]||'-',D.hari[d][1]||'-',D.hari[d][2]||'-',D.hari[d][3]||'-']),'num'));
    const html=`<html><head><meta charset="utf-8"><title>${esc(docNo)}</title><style>@page{size:A4;margin:15mm 14mm}body{font:11.5px/1.45 "Segoe UI",Arial,sans-serif;color:#111;margin:0}.kop{text-align:center;border-bottom:3px double #222;padding-bottom:6px;margin-bottom:8px}.kop b{font-size:15px}h1{font-size:14px;text-align:center;margin:8px 0 2px}h3{font-size:12.5px;margin:14px 0 4px;border-bottom:1px solid #888;padding-bottom:2px;page-break-after:avoid}table{width:100%;border-collapse:collapse;margin:4px 0 8px}th,td{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}th{background:#eee}tr{page-break-inside:avoid}table.num td:not(:first-child){text-align:right}.chips span{display:inline-block;border:1px solid #999;border-radius:5px;padding:3px 9px;margin:2px 4px 2px 0}.ttd td{border:none;text-align:center;height:100px;vertical-align:bottom;width:33%}.foot{margin-top:12px;font-size:9.5px;color:#555;border-top:1px solid #999;padding-top:4px}</style></head><body>
      ${SRIT.Kop.html()}
      <h1>LAPORAN PERKEMBANGAN DAN PERTANGGUNGJAWABAN PEMBINAAN SISWA</h1><div style="text-align:center">${lem?'(Untuk Lembaga / Pembina)':'(Untuk Orang Tua / Wali)'}<br>Nomor: ${esc(docNo)} · Periode: ${esc(P.label)}</div>
      ${body.join('')}${ttd}
      <div class="foot">Dokumen dihasilkan oleh SRITi pada ${fd(today)} oleh ${esc((SRIT.Auth.user||{}).NAME||'-')}. Data bersumber dari absensi, penilaian, dan catatan pembinaan pada sistem. Dokumen bersifat rahasia (data pembinaan anak); keabsahan mengikuti pengesahan tanda tangan.</div></body></html>`;
    const w=window.open('','_blank');if(!w){SRIT.Notify('Pop-up diblokir browser','warn');return;}
    w.document.write(html);w.document.close();w.focus();
    try{SRIT.Audit.log('PRINT','profiling',a.ID,null,{laporan:o.jenis,periode:P.label,nomor:docNo});}catch(e){}
    setTimeout(()=>w.print(),500);
  }
};

<script>

// ---------- GAMIFIKASI & PERINGKAT ----------
// Poin, level, dan lencana anak dihitung otomatis tiap bulan oleh server (Api_Gamifikasi.gs) dari kehadiran, penilaian,
// prestasi, pembinaan, dan pelanggaran (mengurangi poin). Peringkat kamar & kelompok asuh memakai rata-rata poin per anak.
// Nama & poin individu hanya tampil di menu ini; Live TV publik hanya menampilkan agregat kamar/kelompok.
SRIT.Features.gamifikasi={
  tab:'anak',period:'',data:null,q:'',jj:'',
  LV:{PERUNGGU:['Perunggu','#b8732f'],PERAK:['Perak','#64748b'],EMAS:['Emas','#c98a00'],PLATINUM:['Platinum','#0d9488']},
  BD:{HADIR_PENUH:['Hadir Penuh','bi-calendar-check','#16a34a'],BINTANG_PRESTASI:['Bintang Prestasi','bi-star-fill','#c98a00'],
      TELADAN_KARAKTER:['Teladan Karakter','bi-emoji-smile','#8b5cf6'],BEBAS_PELANGGARAN:['Bebas Pelanggaran','bi-shield-check','#0ea5e9']},
  render(host){
    SRIT.UI.setPage('Gamifikasi & Peringkat','Gamifikasi & Peringkat');
    this._host=host;
    if(!this.period)this.period=SRIT.Util.todayISO().slice(0,7);
    this.load();
  },
  esc(s){return SRIT.Util.esc(s);},
  bulan(p){const [y,m]=String(p).split('-');const n=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][(+m||1)-1];return n+' '+y;},
  lvBadge(k){const l=this.LV[k]||['-','#64748b'];return `<span class="badge-soft" style="background:${l[1]}22;color:${l[1]};font-weight:700">${l[0]}</span>`;},
  bdIcons(list){return (list||[]).map(b=>{const d=this.BD[b];return d?`<i class="bi ${d[1]}" title="${d[0]}" style="color:${d[2]};font-size:16px;margin-right:4px"></i>`:'';}).join('')||'<span class="text-muted-2">–</span>';},
  async load(){
    const host=this._host;
    host.innerHTML=`<div class="card-srit p-3 mb-3 d-flex flex-wrap align-items-center gap-2">
        <div class="fw-semibold me-2"><i class="bi bi-trophy me-1"></i>Gamifikasi & Peringkat</div>
        <input type="month" class="form-control form-control-sm" id="gmPeriod" value="${this.esc(this.period)}" style="max-width:170px">
        <button class="btn btn-outline-primary btn-sm" id="gmGo"><i class="bi bi-arrow-clockwise"></i> Muat</button>
        <span class="text-muted-2 small ms-auto">Poin dihitung otomatis dari kehadiran, penilaian, prestasi, pembinaan, dan pelanggaran.</span>
      </div><div id="gmBody"><div class="skeleton" style="height:320px"></div></div>`;
    const go=()=>{const v=$('#gmPeriod').value;if(v){this.period=v;this.load();}};
    $('#gmGo').onclick=go;$('#gmPeriod').onchange=go;
    try{
      const d=await SRIT.Server.call('apiGamifikasi',this.period);
      if(SRIT.currentFeature!=='gamifikasi')return;
      this.data=d;this.draw();
    }catch(e){
      const b=$('#gmBody');
      if(b&&SRIT.currentFeature==='gamifikasi')b.innerHTML='<div class="empty-state"><i class="bi bi-exclamation-triangle d-block text-danger"></i>'+this.esc(e.message||'Gagal memuat data gamifikasi')+'</div>';
    }
  },
  kpi(v,l,c){return `<div class="col-6 col-lg-3"><div class="kpi"><div class="kpi-lbl">${l}</div><div class="kpi-val" style="color:${c||'inherit'}">${v}</div></div></div>`;},
  draw(){
    const d=this.data,b=$('#gmBody');if(!b)return;
    const nBd=Object.values(d.bd||{}).reduce((a,x)=>a+x,0);
    const hi=(d.lv.EMAS||0)+(d.lv.PLATINUM||0);
    b.innerHTML=`<div class="row g-2 mb-3">
        ${this.kpi(d.n,'Anak aktif · '+this.bulan(d.period),'#2a78d6')}
        ${this.kpi(String(d.avg).replace('.',','),'Rata-rata poin per anak','#0d9488')}
        ${this.kpi(hi,'Level Emas & Platinum','#c98a00')}
        ${this.kpi(nBd,'Lencana diraih bulan ini','#8b5cf6')}
      </div>
      <ul class="nav nav-pills mb-3" id="gmTabs">
        ${[['anak','bi-people','Peringkat Anak'],['kamar','bi-door-closed','Peringkat Kamar'],['kelompok','bi-diagram-2','Peringkat Kelompok Asuh'],['aturan','bi-info-circle','Aturan Poin']].map(t=>`<li class="nav-item"><a class="nav-link ${this.tab===t[0]?'active':''} pointer" data-tab="${t[0]}"><i class="bi ${t[1]} me-1"></i>${t[2]}</a></li>`).join('')}
      </ul><div id="gmTab"></div>`;
    $$('#gmTabs a').forEach(a=>a.onclick=()=>{this.tab=a.dataset.tab;$$('#gmTabs a').forEach(x=>x.classList.toggle('active',x===a));this.drawTab();});
    this.drawTab();
  },
  drawTab(){const t=$('#gmTab');if(!t)return;({anak:this.tabAnak,kamar:this.tabKamar,kelompok:this.tabKelompok,aturan:this.tabAturan})[this.tab].call(this,t);},
  podium(items,label){
    if(!items.length)return '';
    const med=['#c98a00','#64748b','#b8732f'];
    return `<div class="row g-2 mb-3">${items.slice(0,3).map((x,i)=>`<div class="col-12 col-md-4"><div class="card-srit p-3 h-100" style="border-top:4px solid ${med[i]}">
        <div class="d-flex align-items-center gap-2"><i class="bi bi-trophy-fill" style="font-size:26px;color:${med[i]}"></i><div class="fw-bold" style="font-size:13px;color:${med[i]}">JUARA ${i+1}</div></div>
        <div class="fw-bold mt-1 text-truncate" style="font-size:17px">${this.esc(x.nama)}</div>
        <div class="text-muted-2 small">${this.esc(x.sub||'')}</div>
        <div class="mt-1"><span class="fw-bold" style="font-size:24px">${String(x.val).replace('.',',')}</span> <span class="text-muted-2 small">${label}</span></div>
      </div></div>`).join('')}</div>`;
  },
  tabAnak(el){
    const d=this.data,kam={};d.kamar.forEach(k=>kam[k.id]=k.nama);
    const jjs=[...new Set(d.anak.map(a=>a.jj).filter(Boolean))].sort();
    el.innerHTML=this.podium(d.anak.map(a=>({nama:a.nama,sub:[a.jj,a.kelas&&('Kelas '+a.kelas),kam[a.kamar]].filter(Boolean).join(' · '),val:a.total})),'poin')+
      `<div class="card-srit p-3">
        <div class="d-flex flex-wrap gap-2 mb-2">
          <input class="form-control form-control-sm" id="gmQ" placeholder="Cari nama anak…" value="${this.esc(this.q)}" style="max-width:240px">
          <select class="form-select form-select-sm" id="gmJJ" style="max-width:150px"><option value="">Semua jenjang</option>${jjs.map(j=>`<option ${this.jj===j?'selected':''}>${this.esc(j)}</option>`).join('')}</select>
        </div>
        <div class="table-responsive" style="max-height:62vh;overflow:auto"><table class="table table-sm table-srit mb-0"><thead><tr><th>#</th><th>Nama</th><th>Kamar</th><th class="text-end">Poin</th><th>Level</th><th>Lencana</th><th>Rincian poin</th></tr></thead><tbody id="gmRows"></tbody></table></div>
      </div>`;
    const rows=()=>{
      const q=this.q.trim().toLowerCase();
      const L=d.anak.filter(a=>(!this.jj||a.jj===this.jj)&&(!q||String(a.nama).toLowerCase().indexOf(q)>=0));
      $('#gmRows').innerHTML=L.length?L.map(a=>{const p=a.poin;
        return `<tr><td>${a.rank}</td><td><div class="fw-semibold">${this.esc(a.nama)}</div><div class="text-muted-2" style="font-size:11px">${this.esc(a.jj)} ${a.kelas?'· Kelas '+this.esc(a.kelas):''}</div></td>
          <td>${this.esc(kam[a.kamar]||'-')}</td><td class="text-end fw-bold">${a.total}</td><td>${this.lvBadge(a.level)}</td><td>${this.bdIcons(a.lencana)}</td>
          <td class="text-muted-2" style="font-size:11.5px">Hadir ${p.hadir} · Nilai ${p.nilai} · Prestasi ${p.prestasi} · Pembinaan ${p.pembinaan} · Bonus ${p.bonus} · <span style="color:#dc2626">Pelanggaran ${p.pelanggaran}</span></td></tr>`;}).join('')
        :'<tr><td colspan="7" class="text-center text-muted-2 py-4">Tidak ada anak yang cocok</td></tr>';
    };
    $('#gmQ').oninput=e=>{this.q=e.target.value;rows();};
    $('#gmJJ').onchange=e=>{this.jj=e.target.value;rows();};
    rows();
  },
  groupTable(list,withInsp){
    if(!list.length)return '<div class="empty-state"><i class="bi bi-inbox d-block"></i>Belum ada data untuk bulan ini</div>';
    const mx=Math.max(1,...list.map(x=>x.skor));
    return `<div class="table-responsive"><table class="table table-sm table-srit mb-0"><thead><tr><th>#</th><th>${withInsp?'Kamar':'Kelompok'}</th><th class="text-end">Anak</th><th class="text-end">Rata-rata poin</th>${withInsp?'<th class="text-end">Skor inspeksi</th><th class="text-end">Bonus</th>':''}<th style="min-width:180px">Skor peringkat</th><th>Lencana</th></tr></thead><tbody>
      ${list.map(x=>`<tr><td>${x.rank}</td><td><div class="fw-semibold">${this.esc(x.nama)}</div><div class="text-muted-2" style="font-size:11px">${this.esc(x.jj)} ${x.jk?'· '+(x.jk==='L'?'Putra':'Putri'):''}</div></td>
        <td class="text-end">${x.n}</td><td class="text-end">${String(x.avg).replace('.',',')}</td>
        ${withInsp?`<td class="text-end">${x.insp==null?'–':String(x.insp).replace('.',',')}</td><td class="text-end">${x.bonus?'+'+x.bonus:'–'}</td>`:''}
        <td><div class="d-flex align-items-center gap-2"><div class="ltv-progress flex-grow-1" style="background:var(--srit-hover)"><span style="width:${x.skor/mx*100}%;background:linear-gradient(90deg,#2a78d6,#0d9488)"></span></div><b>${String(x.skor).replace('.',',')}</b></div></td>
        <td>${Object.keys(this.BD).map(k=>x.bd[k]?`<span title="${this.BD[k][0]}" style="margin-right:6px"><i class="bi ${this.BD[k][1]}" style="color:${this.BD[k][2]}"></i> ${x.bd[k]}</span>`:'').join('')||'<span class="text-muted-2">–</span>'}</td></tr>`).join('')}
      </tbody></table></div>`;
  },
  tabKamar(el){
    const k=this.data.kamar;
    el.innerHTML=this.podium(k.map(x=>({nama:x.nama,sub:x.n+' anak'+(x.insp==null?'':' · inspeksi '+String(x.insp).replace('.',',')),val:x.skor})),'skor')+
      `<div class="card-srit p-3"><div class="text-muted-2 small mb-2">Skor kamar = rata-rata poin per anak + bonus inspeksi kamar (maks. ${this.data.rules.poin.INSPEKSI_MAKS}). Kamar besar dan kecil dibandingkan secara adil.</div>${this.groupTable(k,true)}</div>`;
  },
  tabKelompok(el){
    const k=this.data.kelompok;
    el.innerHTML=this.podium(k.map(x=>({nama:x.nama,sub:x.n+' anak',val:x.skor})),'rata-rata poin')+
      `<div class="card-srit p-3"><div class="text-muted-2 small mb-2">Skor kelompok = rata-rata poin per anak anggota.</div>${this.groupTable(k,false)}</div>`;
  },
  tabAturan(el){
    const R=this.data.rules.poin,P=R.PELANGGARAN;
    const row=(a,b,c,neg)=>`<tr><td>${a}</td><td class="text-end fw-bold" style="color:${neg?'#dc2626':'#16a34a'}">${b}</td><td class="text-muted-2">${c}</td></tr>`;
    el.innerHTML=`<div class="row g-3"><div class="col-lg-7"><div class="card-srit p-3"><h6 class="section-title mb-2">Cara poin didapat (per bulan)</h6>
      <table class="table table-sm table-srit mb-0"><thead><tr><th>Sumber</th><th class="text-end">Poin</th><th>Keterangan</th></tr></thead><tbody>
      ${row('Hadir penuh (per hari)','+'+R.HARI_PENUH,'Semua kegiatan pada hari itu dihadiri')}
      ${row('Hadir sebagian (per hari)','+'+R.HARI_SEBAGIAN,'Hadir sebagian kegiatan')}
      ${row('Penilaian karakter','maks +20','Rata-rata aspek (skala 1–4) × '+R.NILAI_KALI+' per catatan penilaian')}
      ${row('Catatan prestasi','+'+R.PRESTASI,'Tiap catatan perkembangan berkategori Prestasi')}
      ${row('Pembinaan selesai','+'+R.PEMBINAAN,'Jenis Kegiatan Positif: +'+R.KEGIATAN_POSITIF)}
      ${row('Pelanggaran ringan','−'+Math.abs(P.RINGAN),'Mengurangi poin',1)}
      ${row('Pelanggaran sedang','−'+Math.abs(P.SEDANG),'Mengurangi poin',1)}
      ${row('Pelanggaran berat','−'+Math.abs(P.BERAT),'Mengurangi poin',1)}
      </tbody></table><div class="text-muted-2 small mt-2">Total poin tidak pernah di bawah 0.</div></div></div>
      <div class="col-lg-5"><div class="card-srit p-3 mb-3"><h6 class="section-title mb-2">Lencana (bonus poin)</h6>
        <div class="small">${[['HADIR_PENUH','≥ '+R.PERSEN_HADIR_PENUH+'% hari hadir penuh (min. '+R.MIN_HARI+' hari tercatat)','+'+R.BONUS_HADIR],['BINTANG_PRESTASI','Minimal 1 catatan prestasi','—'],['TELADAN_KARAKTER','Rata-rata penilaian ≥ '+String(R.NILAI_TELADAN).replace('.',','),'+'+R.BONUS_TELADAN],['BEBAS_PELANGGARAN','Tanpa pelanggaran sebulan penuh (min. '+R.MIN_HARI+' hari tercatat)','+'+R.BONUS_BERSIH]].map(x=>`<div class="d-flex gap-2 align-items-start mb-2"><i class="bi ${this.BD[x[0]][1]}" style="color:${this.BD[x[0]][2]};font-size:18px"></i><div><b>${this.BD[x[0]][0]}</b> <span class="text-muted-2">${x[2]}</span><br><span class="text-muted-2">${x[1]}</span></div></div>`).join('')}</div></div>
        <div class="card-srit p-3"><h6 class="section-title mb-2">Level</h6><div class="d-flex flex-wrap gap-2">${R.LEVEL.map(l=>`<span>${this.lvBadge(l[1])} <span class="text-muted-2 small">≥ ${l[0]}</span></span>`).join('')}</div></div></div></div>`;
  }
};
</script>

<script>
//# sourceURL=View_Peta.html
// ---------- PETA DIGITAL ASRAMA ----------
SRIT.Features.peta={
  open:{}, // status buka/tutup per gedung
  render(host){SRIT.UI.setPage('Peta Digital Asrama','Peta Asrama');this._host=host;this.draw();},
  draw(){
    const host=this._host;
    const kamar=SRIT.Store.read('KAMAR');const anak=SRIT.Store.read('ANAK');const beds=SRIT.Store.read('TEMPAT_TIDUR');
    const gedung=SRIT.Store.read('GEDUNG');
    host.innerHTML=`
      <div class="card-srit p-2 px-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div style="font-size:13px"><i class="bi bi-diagram-3 text-primary me-1"></i> Klik nama gedung untuk membuka/menutup detail kamar</div>
        <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" id="petaExpand"><i class="bi bi-arrows-expand"></i> Buka Semua</button>
          <button class="btn btn-outline-secondary btn-sm" id="petaCollapse"><i class="bi bi-arrows-collapse"></i> Tutup Semua</button></div>
      </div>
      ${gedung.map(g=>{
        const rooms=kamar.filter(k=>k.GEDUNG===g.ID);
        const gAnak=anak.filter(a=>a.GEDUNG===g.ID&&a.STATUS==='AKTIF').length;
        const gCap=rooms.reduce((s,k)=>s+(+k.KAPASITAS||8),0);
        const gRate=SRIT.Util.pct(gAnak,gCap);
        const opened=!!this.open[g.ID];
        return `<div class="card-srit mb-2" data-ged="${g.ID}">
          <div class="d-flex justify-content-between align-items-center p-3 pointer peta-head" data-ged="${g.ID}" style="gap:10px">
            <div class="d-flex align-items-center gap-2" style="min-width:0">
              <i class="bi bi-chevron-${opened?'down':'right'} peta-chev"></i>
              <i class="bi bi-building text-primary"></i>
              <div style="min-width:0"><b class="text-truncate d-block">${SRIT.Util.esc(g.NAME)}</b>
                <span class="text-muted-2" style="font-size:11px">${(SRIT.Repo.getById('ASRAMA',g.ASRAMA)||{}).NAME||''} · ${rooms.length} kamar</span></div>
            </div>
            <div class="d-flex align-items-center gap-2" style="flex-shrink:0">
              <div class="ltv-progress d-none d-md-block" style="width:100px;background:var(--srit-hover)"><span style="width:${gRate}%;background:${gRate>=90?'var(--srit-danger)':gRate>=75?'var(--srit-warning)':'var(--srit-success)'}"></span></div>
              <span class="badge-soft ${gRate>=90?'st-ALPA':gRate>=75?'st-SAKIT':'st-HADIR'}">${gAnak}/${gCap}</span>
            </div>
          </div>
          <div class="peta-body px-3 pb-3" data-ged="${g.ID}" style="display:${opened?'block':'none'}">
            <div class="row g-2 g-md-3">${rooms.map(k=>{
              const cap=k.KAPASITAS||8;const occ=anak.filter(a=>a.KAMAR===k.ID&&a.STATUS==='AKTIF').length;
              const rate=SRIT.Util.pct(occ,cap);
              const stt=occ>=cap?'PENUH':rate>=80?'HAMPIR PENUH':'NORMAL';
              const col=stt==='PENUH'?'var(--srit-danger)':stt==='HAMPIR PENUH'?'var(--srit-warning)':'var(--srit-success)';
              const roomBeds=beds.filter(b=>b.KAMAR===k.ID);
              return `<div class="col-6 col-md-4 col-lg-3"><div class="card-srit p-3 h-100" style="background:var(--srit-hover)">
                <div class="d-flex justify-content-between align-items-start mb-1"><b style="font-size:13px">${k.NAME}</b><span class="badge-soft" style="background:${col}22;color:${col};font-size:10px">${stt}</span></div>
                <div class="text-muted-2" style="font-size:11px">${k.KODE||''}<br>Wali: ${(SRIT.Repo.getById('WALI_ASUH',k.WALI_ASUH)||{}).NAME||'-'}</div>
                <div class="my-2"><div class="d-flex justify-content-between small"><span>Okupansi</span><b>${occ}/${cap}</b></div>
                <div class="ltv-progress" style="background:var(--srit-surface)"><span style="width:${rate}%;background:${col}"></span></div></div>
                <div class="d-flex flex-wrap gap-1">${roomBeds.map(b=>`<span title="${b.KODE} ${b.STATUS==='TERISI'?'· '+((SRIT.Repo.getById('ANAK',b.ANAK_ID)||{}).NAMA||''):''}" style="width:15px;height:15px;border-radius:4px;display:inline-block;background:${b.STATUS==='TERISI'?'var(--srit-primary)':b.STATUS==='RUSAK'?'var(--srit-danger)':'var(--srit-border)'}"></span>`).join('')}</div>
              </div></div>`;
            }).join('')}</div>
          </div>
        </div>`;
      }).join('')}`;
    // events
    $$('.peta-head',host).forEach(h=>h.onclick=()=>{const id=h.dataset.ged;this.open[id]=!this.open[id];this.draw();});
    $('#petaExpand',host).onclick=()=>{SRIT.Store.read('GEDUNG').forEach(g=>this.open[g.ID]=true);this.draw();};
    $('#petaCollapse',host).onclick=()=>{this.open={};this.draw();};
  },
  destroy(){}
};
</script>


<script>__srit.n('View_Alert')</script>
<script>
//# sourceURL=View_Alert.html
// ---------- ALERT CENTER ----------
SRIT.Features['alert-center']={
  render(host){SRIT.UI.setPage('Pusat Peringatan','Pusat Peringatan');
    const alerts=SRIT.computeAlerts();
    host.innerHTML=`<div class="row g-3">${alerts.length?alerts.map(a=>`
      <div class="col-12 col-lg-6"><div class="card-srit p-3 d-flex align-items-start gap-3" style="border-left:4px solid ${a.color}">
        <div class="kpi-icon" style="background:${a.color}"><i class="bi ${a.icon}"></i></div>
        <div class="flex-grow-1"><div class="fw-semibold">${a.title}</div><div class="text-muted-2" style="font-size:12px">${a.desc}</div></div>
        <span class="badge-soft" style="background:${a.color}22;color:${a.color}">${a.level}</span>
      </div></div>`).join(''):'<div class="col-12"><div class="empty-state"><i class="bi bi-check-circle d-block text-success"></i>Tidak ada alert. Semua kondisi normal.</div></div>'}
    </div>`;
  },
  destroy(){}
};
SRIT.computeAlerts=()=>{
  const al=[];const iso=SRIT.Util.todayISO();
  // anak belum kembali (izin BERANGKAT dengan tgl kembali <= today)
  SRIT.Store.read('IZIN').filter(i=>i.STATUS==='BERANGKAT'&&i.KEMBALI<=iso).forEach(i=>al.push({title:'Anak belum kembali: '+SRIT.nm('ANAK',i.ANAK),desc:'Batas kembali '+SRIT.Util.fmtDateShort(i.KEMBALI)+' — '+i.TUJUAN,level:'HIGH',color:'var(--srit-danger)',icon:'bi-person-exclamation'}));
  // izin menunggu
  const wait=SRIT.Store.read('IZIN').filter(i=>i.STATUS==='MENUNGGU').length;
  if(wait)al.push({title:wait+' izin menunggu persetujuan',desc:'Segera validasi pengajuan izin/kepulangan',level:'MEDIUM',color:'var(--srit-warning)',icon:'bi-hourglass-split'});
  // insiden critical/high aktif
  SRIT.Store.read('INSIDEN').filter(i=>(i.PRIORITAS==='HIGH'||i.PRIORITAS==='CRITICAL')&&i.STATUS!=='SELESAI'&&i.STATUS!=='PENYELESAIAN').forEach(i=>al.push({title:'Insiden '+i.PRIORITAS+': '+i.KATEGORI,desc:i.KEJADIAN,level:i.PRIORITAS,color:'var(--srit-danger)',icon:'bi-exclamation-octagon'}));
  // kasus: batas lapor terlewat & wajib-teruskan belum dilaporkan (Modul Permasalahan di Asrama)
  if(SRIT.Kasus)SRIT.Store.read('INSIDEN').filter(i=>SRIT.Kasus.aktif(i)).forEach(i=>{const st=SRIT.Kasus.lapor(i);
    if(st.k==='LEWAT')al.push({title:'Batas lapor terlewat: '+(i.KATEGORI||'kasus'),desc:'Lewat '+SRIT.Kasus.fmtDur(st.jam)+' dari batas '+SRIT.Kasus.jamBatas(i)+' jam. Segera laporkan ke Satgas SR / Kepala Sekolah.',level:'CRITICAL',color:'var(--srit-danger)',icon:'bi-alarm'});
    else if(i.WAJIB_JENIS&&!i.WAKTU_LAPOR)al.push({title:'Kasus wajib diteruskan belum dilaporkan: '+(i.KATEGORI||'kasus'),desc:'Laporkan ke Satgas SR / Kepala Sekolah sebelum batas waktu.',level:'HIGH',color:'var(--srit-danger)',icon:'bi-megaphone'});});
  // menunggu keputusan Anda (sesuai kewenangan/jenjang peran)
  const AP=SRIT.Approval;
  if(AP){
    const sah=SRIT.Store.read('IZIN').filter(i=>i.PENGESAHAN==='MENUNGGU'&&AP.canSah(i)).length;
    if(sah)al.push({title:sah+' izin darurat menunggu pengesahan Anda',desc:'Izin darurat oleh petugas piket perlu disahkan',level:'HIGH',color:'var(--srit-warning)',icon:'bi-patch-check'});
    const izinKu=SRIT.Store.read('IZIN').filter(i=>i.STATUS==='MENUNGGU'&&AP.canIzin(i.JENIS)).length;
    if(izinKu)al.push({title:izinKu+' izin menunggu persetujuan Anda',desc:'Sesuai jenjang: reguler Wali Asrama, khusus Wakasek Keasramaan',level:'MEDIUM',color:'var(--srit-warning)',icon:'bi-hourglass-split'});
    [['KEGIATAN','kegiatan','kegiatan khusus'],['PROGRAM','program','program pembinaan']].forEach(x=>{const n=SRIT.Store.read(x[0]).filter(r=>r.STATUS==='USULAN').length;if(n&&AP.canUsulan(x[1]))al.push({title:n+' usulan '+x[2]+' menunggu persetujuan Anda',desc:'Diusulkan wali asrama',level:'MEDIUM',color:'var(--srit-info)',icon:'bi-lightbulb'});});
    if(AP.canKasus()){const kn=SRIT.Store.read('INSIDEN').filter(i=>(!SRIT.Kasus||SRIT.Kasus.aktif(i))&&i.TINGKAT&&i.TINGKAT!=='RINGAN'&&i.KLASIFIKASI_STATUS!=='DITETAPKAN').length;
      if(kn)al.push({title:kn+' kasus sedang/berat menunggu penetapan klasifikasi',desc:'Tetapkan melalui case conference; eskalasikan ke Satgas Pusat',level:'HIGH',color:'var(--srit-danger)',icon:'bi-shield-exclamation'});}
    if(AP.canRapor()){const rp=SRIT.Store.read('RAPOR_ASRAMA').filter(r=>r.STATUS==='FINAL').length;if(rp)al.push({title:rp+' rapor asrama final menunggu diketahui',desc:'Kepala Sekolah mengetahui sebelum dibagikan',level:'LOW',color:'var(--srit-info)',icon:'bi-journal-check'});}
    if(AP.canJurnal()){const u=(SRIT.Auth.user||{}).ID,jp=SRIT.Store.read('JURNAL_PIKET').filter(j=>j.STATUS==='DISERAHKAN'&&j.PETUGAS!==u).length;if(jp)al.push({title:jp+' jurnal piket menunggu diketahui koordinator',desc:'Periksa catatan kejadian dan anak perlu perhatian khusus',level:'LOW',color:'var(--srit-info)',icon:'bi-journal-bookmark'});}
  }
  // kamar penuh
  const anak=SRIT.Store.read('ANAK');
  SRIT.Store.read('KAMAR').forEach(k=>{const occ=anak.filter(a=>a.KAMAR===k.ID&&a.STATUS==='AKTIF').length;if(occ>=(k.KAPASITAS||8))al.push({title:'Kamar penuh: '+k.NAME,desc:'Okupansi '+occ+'/'+(k.KAPASITAS||8),level:'LOW',color:'var(--srit-info)',icon:'bi-door-closed'});});
  // insiden proses
  const proc=SRIT.Store.read('INSIDEN').filter(i=>i.STATUS!=='SELESAI'&&i.STATUS!=='PENYELESAIAN').length;
  if(proc)al.push({title:proc+' insiden dalam penanganan',desc:'Pantau progres tindak lanjut',level:'MEDIUM',color:'var(--srit-warning)',icon:'bi-clipboard-pulse'});
  return al;
};
</script>
