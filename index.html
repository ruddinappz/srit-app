<script>__srit.n('View_User')</script>
<script>
//# sourceURL=View_User.html
// ---------- TENAGA KEPENDIDIKAN & AKUN (satu data: pegawai sekaligus akun pengguna) ----------
// Guru, wali asuh, wali asrama, kepala sekolah, keamanan, dll. didata di sini. Setiap orang BOLEH dijadikan akun login
// (saklar "Jadikan akun pengguna"), tanpa input ulang. Wali Asuh / Wali Asrama otomatis tersambung ke Data Induk (server).
SRIT.Features.user={
  state:{page:1,size:25,search:'',jab:'',akun:'',status:''},
  STD_JABATAN:['Kepala Sekolah','Wakasek Keasramaan','Wali Asrama','Wali Asuh','Guru','Tenaga Kesehatan','Petugas Keamanan','Petugas Sarpras','Tenaga Administrasi','Operator Absensi'],
  ROLE_HINT:[[/super/i,'SUPER_ADMIN'],[/wakasek|wakil/i,'WAKASEK_KEASRAMAAN'],[/kepala\s*sekolah/i,'KEPALA_SEKOLAH'],[/wali\s*asrama/i,'WALI_ASRAMA'],[/wali\s*asuh/i,'WALI_ASUH'],
    [/guru/i,'GURU'],[/kesehatan|perawat|bidan/i,'TENAGA_KESEHATAN'],[/keamanan|satpam|security/i,'PETUGAS_KEAMANAN'],[/sarpras|sarana/i,'PETUGAS_SARPRAS'],
    [/operator/i,'OPERATOR_ABSENSI'],[/^\s*(admin|administrator)\s*$/i,'ADMIN']],
  SCOPE_BY_ROLE:{SUPER_ADMIN:'GLOBAL',ADMIN:'GLOBAL',KEPALA_SEKOLAH:'GLOBAL',WAKASEK_KEASRAMAAN:'GLOBAL',WALI_ASRAMA:'ASRAMA',WALI_ASUH:'WALI_ASUH'},

  _esc:s=>SRIT.Util.esc(String(s==null?'':s)),
  _hasAkun(u){return u.AKUN!=='TIDAK'&&!!String(u.EMAIL||'').trim();},
  _jabName(id){return (SRIT.Repo.getById('JABATAN',id)||{}).NAME||'';},
  _roleFor(jabId){
    const nm=this._jabName(jabId),roles=SRIT.Store.read('ROLES');
    for(const [re,rid] of this.ROLE_HINT){if(re.test(nm)&&roles.some(r=>r.ID===rid))return rid;}
    return roles.some(r=>r.ID==='GURU')?'GURU':(roles[0]||{}).ID||'';
  },
  _waliTable(jabId){const n=this._jabName(jabId);return /wali\s*asuh/i.test(n)?'WALI_ASUH':(/wali\s*asrama/i.test(n)?'WALI_ASRAMA':'');},
  /** Daftar gabungan: semua baris USERS + wali asuh/asrama dari Data Induk yang belum tersambung ke tendik. */
  _rows(){
    const users=SRIT.Store.read('USERS'),have={},hint={},names={};
    const nn=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
    users.forEach(u=>{have[u.ID]=1;if(u._WALI)hint[u._WALI]=1;const t=this._waliTable(u.JABATAN);if(t)names[t+'|'+nn(u.NAME)]=1;});
    const out=users.map(u=>Object.assign({},u,{_k:'U'}));
    [['WALI_ASUH','Wali Asuh'],['WALI_ASRAMA','Wali Asrama']].forEach(([t,jn])=>{
      const jab=SRIT.Store.read('JABATAN').find(j=>String(j.NAME).toLowerCase()===jn.toLowerCase());
      SRIT.Store.read(t).forEach(w=>{
        if(w.USER_ID&&have[w.USER_ID])return;
        // sudah didaftarkan namun tautan di server belum sampai ke perangkat ini: jangan tampil dobel
        if(hint[t+'|'+w.ID]||names[t+'|'+nn(w.NAME)])return;
        out.push({_k:'W',_t:t,_wid:w.ID,ID:'w:'+t+':'+w.ID,NAME:w.NAME,JABATAN:jab?jab.ID:'',HP:w.HP||'',ASRAMA:w.ASRAMA||'',GEDUNG:w.GEDUNG||'',JENJANG:w.JENJANG||'',STATUS:w.STATUS||'AKTIF',AKUN:'TIDAK',EMAIL:'',NIP:'',JK:''});
      });
    });
    return out;
  },
  _ensureJabatan(){
    if(this._jabChecked||!SRIT.Auth.can('jabatan:CREATE'))return;this._jabChecked=true;
    try{
      const have=SRIT.Store.read('JABATAN').map(j=>String(j.NAME).toLowerCase());
      this.STD_JABATAN.forEach(n=>{if(have.indexOf(n.toLowerCase())<0)SRIT.Repo.insert('JABATAN',{ID:SRIT.Util.uid('JB'),NAME:n});});
    }catch(e){console.warn('jabatan standar',e);}
  },

  /** Cermin lokal logika server (syncStaffToWali_) agar menu lain (Anak, Penghuni, Kelompok Asuh, dll.) langsung melihat wali tanpa menunggu sinkronisasi. */
  _syncLocalWali(u,hint){
    const types=[{re:/wali\s*asuh/i,t:'WALI_ASUH',p:'WS'},{re:/wali\s*asrama/i,t:'WALI_ASRAMA',p:'WR'}];
    const jn=this._jabName(u.JABATAN),want=types.find(w=>w.re.test(jn));
    const nn=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
    types.forEach(w=>{
      const rows=SRIT.Store.read(w.t);let linked=rows.find(r=>r.USER_ID===u.ID);
      if(want&&want.t===w.t){
        if(!linked&&hint&&hint[0]===w.t)linked=rows.find(r=>String(r.ID)===hint[1]);
        if(!linked)linked=rows.find(r=>!r.USER_ID&&nn(r.NAME)===nn(u.NAME));
        const patch={NAME:u.NAME,USER_ID:u.ID,STATUS:u.STATUS||'AKTIF'};
        ['ASRAMA','GEDUNG','JENJANG','HP'].forEach(k=>{if(u[k])patch[k]=u[k];});
        if(linked)Object.assign(linked,patch);else rows.push(Object.assign({ID:w.p+'-'+u.ID,ASRAMA:'',GEDUNG:'',JENJANG:'',HP:''},patch));
      }else if(linked&&linked.STATUS!=='NONAKTIF'){linked.STATUS='NONAKTIF';}
      else return;
      SRIT.Store._set(w.t,rows);   // tanpa antrean: server melakukan hal yang sama
    });
  },

  render(host){
    SRIT.UI.setPage('Tenaga Kependidikan & Akun','Tenaga Kependidikan');
    this._ensureJabatan();
    const jab=SRIT.Store.read('JABATAN'),S=this.state,esc=this._esc;
    host.innerHTML=`<div class="card-srit p-3 mb-3">
      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-start mb-2">
        <div><div class="fw-semibold">Data Tenaga Kependidikan</div>
          <div class="text-muted-2" style="font-size:12px">Satu data untuk pegawai sekaligus akun login: wali asuh, wali asrama, kepala sekolah, guru, keamanan, dll.</div></div>
        ${SRIT.Auth.can('user:CREATE')?'<button class="btn btn-primary btn-sm" id="usAdd"><i class="bi bi-plus-lg"></i> Tambah Tenaga Kependidikan</button>':''}
      </div>
      <div id="usSumm" class="d-flex flex-wrap gap-2 mb-2"></div>
      <div class="filter-bar">
        <div style="flex:1;min-width:200px"><label class="form-label-sm">Cari Nama / NIP / Email</label>
          <div style="position:relative"><input class="form-control form-control-sm" id="usSearch" style="padding-right:26px" value="${esc(S.search)}" placeholder="Ketik untuk mencari\u2026">
            <button type="button" id="usSearchClear" class="sf-clear-x" style="display:${S.search?'flex':'none'}" title="Hapus pencarian"><i class="bi bi-x-circle-fill"></i></button></div></div>
        <div style="min-width:170px"><label class="form-label-sm">Jabatan</label><select class="form-select form-select-sm" id="usJab"><option value="">Semua jabatan</option>${jab.map(j=>`<option value="${esc(j.ID)}" ${S.jab===j.ID?'selected':''}>${esc(j.NAME)}</option>`).join('')}</select></div>
        <div style="min-width:160px"><label class="form-label-sm">Akun login</label><select class="form-select form-select-sm" id="usAkun"><option value="">Semua</option><option value="ya" ${S.akun==='ya'?'selected':''}>Punya akun</option><option value="tidak" ${S.akun==='tidak'?'selected':''}>Belum punya akun</option></select></div>
        <div style="min-width:140px"><label class="form-label-sm">Status</label><select class="form-select form-select-sm" id="usStatus"><option value="">Semua</option><option value="AKTIF" ${S.status==='AKTIF'?'selected':''}>Aktif</option><option value="NONAKTIF" ${S.status==='NONAKTIF'?'selected':''}>Nonaktif</option></select></div>
      </div></div>
      <div class="card-srit p-0"><div class="table-responsive"><table class="table table-srit mb-0" id="usTable"></table></div><div class="p-3 border-top" id="usPag"></div></div>`;
    $('#usSearch').oninput=e=>{
      $('#usSearchClear').style.display=e.target.value?'flex':'none';
      clearTimeout(this._searchT);
      this._searchT=setTimeout(()=>{S.search=e.target.value;S.page=1;this.load();},350);
    };
    $('#usSearchClear').onclick=()=>{$('#usSearch').value='';$('#usSearchClear').style.display='none';S.search='';S.page=1;this.load();};
    $('#usJab').onchange=e=>{S.jab=e.target.value;S.page=1;this.load();};
    $('#usAkun').onchange=e=>{S.akun=e.target.value;S.page=1;this.load();};
    $('#usStatus').onchange=e=>{S.status=e.target.value;S.page=1;this.load();};
    const add=$('#usAdd');if(add)add.onclick=()=>this.form();
    this.load();
  },

  load(){
    const S=this.state,esc=this._esc,all=this._rows(),q=S.search.trim().toLowerCase();
    const sumAkun=all.filter(u=>this._hasAkun(u)&&u.STATUS!=='NONAKTIF').length;
    $('#usSumm').innerHTML=[['Tenaga kependidikan',all.length,'#1c6ef2'],['Akun login aktif',sumAkun,'#16a34a'],['Belum punya akun',all.filter(u=>!this._hasAkun(u)).length,'#f59e0b']]
      .map(([l,n,c])=>`<span class="badge-soft" style="background:${c}1a;color:${c};font-size:12px;padding:5px 10px"><b>${n}</b> ${l}</span>`).join('');
    let rows=all.filter(u=>{
      if(S.jab&&u.JABATAN!==S.jab)return false;
      if(S.status&&(u.STATUS||'AKTIF')!==S.status)return false;
      if(S.akun==='ya'&&!this._hasAkun(u))return false;
      if(S.akun==='tidak'&&this._hasAkun(u))return false;
      if(q&&[u.NAME,u.NIP,u.EMAIL,u.HP,this._jabName(u.JABATAN)].every(v=>String(v||'').toLowerCase().indexOf(q)<0))return false;
      return true;
    }).sort((a,b)=>String(a.NAME||'').localeCompare(String(b.NAME||''),'id'));
    const total=rows.length,pages=Math.ceil(total/S.size)||1;if(S.page>pages)S.page=pages;
    const r={rows:rows.slice((S.page-1)*S.size,S.page*S.size),total,page:S.page,size:S.size,pages};
    const canU=SRIT.Auth.can('user:UPDATE'),canC=SRIT.Auth.can('user:CREATE');
    const unit=u=>[(SRIT.Repo.getById('ASRAMA',u.ASRAMA)||{}).NAME,u.JENJANG].filter(Boolean).join(' \u00b7 ')||'-';
    $('#usTable').innerHTML=`<thead><tr><th>Nama</th><th>Jabatan</th><th>Penempatan</th><th>HP</th><th>Akun login</th><th>Status</th><th></th></tr></thead><tbody>
    ${r.rows.map(u=>{
      const has=this._hasAkun(u),pseudo=u._k==='W',idq=esc(u.ID).replace(/'/g,'');
      const akunCell=pseudo
        ?'<span class="badge-soft st-BELUM">Belum terdaftar</span><div class="text-muted-2" style="font-size:11px">dari Data Induk</div>'
        :(has?`<span class="badge-soft st-HADIR">Punya akun</span><div class="text-muted-2" style="font-size:11px">${esc(u.EMAIL)} \u00b7 ${esc((SRIT.Repo.getById('ROLES',u.ROLE)||{}).NAME||u.ROLE||'-')}</div>`
        :'<span class="badge-soft st-BELUM">Belum punya akun</span>');
      const acts=pseudo
        ?(canC?`<button class="btn btn-sm btn-primary py-0" onclick="SRIT.Features.user.form('${idq}')"><i class="bi bi-person-plus"></i> Daftarkan</button>`:'')
        :(canU?`<div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary py-0" title="Ubah data" onclick="SRIT.Features.user.form('${idq}')"><i class="bi bi-pencil"></i></button>
            ${has?`<button class="btn btn-outline-secondary py-0" title="Atur ulang kata sandi" onclick="SRIT.Features.user.resetPw('${idq}')"><i class="bi bi-key"></i></button>
                   <button class="btn btn-outline-secondary py-0" title="Nonaktifkan akun login" onclick="SRIT.Features.user.toggleAkun('${idq}')"><i class="bi bi-person-x"></i></button>`
                 :`<button class="btn btn-outline-primary py-0" title="Jadikan akun pengguna" onclick="SRIT.Features.user.form('${idq}',true)"><i class="bi bi-person-check"></i> Aktifkan akun</button>`}
          </div>`:'');
      return `<tr><td><div class="fw-semibold">${esc(u.NAME)}</div><div class="text-muted-2" style="font-size:11px">${u.NIP?'NIP/NIK '+esc(u.NIP):'&nbsp;'}</div></td>
        <td>${esc(this._jabName(u.JABATAN)||'-')}</td><td>${esc(unit(u))}</td><td>${esc(u.HP||'-')}</td><td>${akunCell}</td>
        <td><span class="badge-soft ${(u.STATUS||'AKTIF')==='AKTIF'?'st-HADIR':'st-BELUM'}">${esc(u.STATUS||'AKTIF')}</span></td><td class="text-end">${acts}</td></tr>`;
    }).join('')||'<tr><td colspan="7" class="text-center text-muted-2 py-4">Belum ada data tenaga kependidikan</td></tr>'}
    </tbody>`;
    $('#usPag').innerHTML=SRIT.UI.pagination(r);
    $$('#usPag [data-pg]').forEach(a=>a.onclick=()=>{S.page=+a.dataset.pg;this.load();});
  },

  _find(id){return this._rows().find(x=>x.ID===id);},

  /** id kosong = baru; id 'w:TABEL:ID' = daftarkan wali dari Data Induk; openAkun = langsung aktifkan bagian akun. */
  form(id,openAkun){
    const esc=this._esc,u=id?(this._find(id)||{}):{},pseudo=u._k==='W',isNew=!id||pseudo;
    const jab=SRIT.Store.read('JABATAN'),roles=SRIT.Store.read('ROLES'),asr=SRIT.Store.read('ASRAMA'),ged=SRIT.Store.read('GEDUNG');
    const hasAk=!isNew&&this._hasAkun(u),wantAk=hasAk||!!openAkun;
    const jabId=u.JABATAN||(jab[0]||{}).ID||'',role0=u.ROLE||this._roleFor(jabId);
    const scopes=['GLOBAL','SEKOLAH','ASRAMA','GEDUNG','KAMAR','WALI_ASUH'];
    const m=SRIT.Modal.open({size:'modal-lg',title:(isNew?(pseudo?'Daftarkan Tenaga Kependidikan':'Tambah Tenaga Kependidikan'):'Ubah Tenaga Kependidikan'),
      body:`<form id="usForm" autocomplete="off"><div class="row g-2">
        <div class="col-12"><div class="fw-semibold" style="font-size:13px"><i class="bi bi-person-vcard"></i> Data pegawai</div></div>
        <div class="col-md-6"><label class="form-label-sm">Nama lengkap</label><input class="form-control form-control-sm" name="NAME" value="${esc(u.NAME)}" required></div>
        <div class="col-md-6"><label class="form-label-sm">NIP / NIK (opsional)</label><input class="form-control form-control-sm" name="NIP" value="${esc(u.NIP)}"></div>
        <div class="col-md-4"><label class="form-label-sm">Jenis kelamin</label><select class="form-select form-select-sm" name="JK"><option value="">-</option><option value="L" ${u.JK==='L'?'selected':''}>Laki-laki</option><option value="P" ${u.JK==='P'?'selected':''}>Perempuan</option></select></div>
        <div class="col-md-4"><label class="form-label-sm">No. HP / WhatsApp</label><input class="form-control form-control-sm" name="HP" value="${esc(u.HP)}"></div>
        <div class="col-md-4"><label class="form-label-sm">Status</label><select class="form-select form-select-sm" name="STATUS"><option value="AKTIF" ${(u.STATUS||'AKTIF')==='AKTIF'?'selected':''}>Aktif</option><option value="NONAKTIF" ${u.STATUS==='NONAKTIF'?'selected':''}>Nonaktif</option></select></div>
        <div class="col-md-6"><label class="form-label-sm">Jabatan</label><select class="form-select form-select-sm" name="JABATAN" id="usFJab" required>${jab.map(j=>`<option value="${esc(j.ID)}" ${jabId===j.ID?'selected':''}>${esc(j.NAME)}</option>`).join('')}</select></div>
        <div class="col-md-6"><label class="form-label-sm">Jenjang (opsional)</label><select class="form-select form-select-sm" name="JENJANG"><option value="">-</option>${['SRD','SRMP','SRMA'].map(j=>`<option ${u.JENJANG===j?'selected':''}>${j}</option>`).join('')}</select></div>
        <div class="col-md-6"><label class="form-label-sm">Asrama (opsional)</label><select class="form-select form-select-sm" name="ASRAMA" id="usFAsr"><option value="">-</option>${asr.map(a=>`<option value="${esc(a.ID)}" ${u.ASRAMA===a.ID?'selected':''}>${esc(a.NAME)}</option>`).join('')}</select></div>
        <div class="col-md-6"><label class="form-label-sm">Gedung (opsional)</label><select class="form-select form-select-sm" name="GEDUNG" id="usFGed"></select></div>
        <div class="col-12 d-none" id="usWaliNote"><div class="alert alert-info py-2 mb-0" style="font-size:12px"><i class="bi bi-link-45deg"></i> Jabatan ini otomatis tersambung ke Data Induk (<span id="usWaliTbl"></span>) sehingga relasi anak, kamar, dan kelompok asuh tetap berfungsi.</div></div>
        <div class="col-12 mt-2"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="usAkunSw" ${wantAk?'checked':''}>
          <label class="form-check-label fw-semibold" for="usAkunSw" style="font-size:13px"><i class="bi bi-person-lock"></i> Jadikan akun pengguna (bisa login ke aplikasi)</label></div></div>
        <div class="col-12" id="usAkunBox" style="display:${wantAk?'block':'none'}"><div class="row g-2 p-2 rounded" style="border:1px dashed var(--srit-border)">
          <div class="col-md-6"><label class="form-label-sm">Email / Nama pengguna</label><input class="form-control form-control-sm" name="EMAIL" id="usFEmail" value="${esc(u.EMAIL)}" autocomplete="off"></div>
          <div class="col-md-6"><label class="form-label-sm">Peran (hak akses)</label><select class="form-select form-select-sm" name="ROLE" id="usFRole">${roles.map(rr=>`<option value="${esc(rr.ID)}" ${role0===rr.ID?'selected':''}>${esc(rr.NAME)}</option>`).join('')}</select></div>
          <div class="col-md-6"><label class="form-label-sm">Cakupan akses</label><select class="form-select form-select-sm" name="SCOPE" id="usFScope">${scopes.map(s=>`<option ${(u.SCOPE||this.SCOPE_BY_ROLE[role0]||'SEKOLAH')===s?'selected':''}>${s}</option>`).join('')}</select></div>
          <div class="col-md-6"><label class="form-label-sm">Kata sandi ${hasAk?'<span class="text-muted-2">(kosongkan jika tidak diubah)</span>':'<span class="text-muted-2">(min. 6 karakter)</span>'}</label>
            <div class="input-group input-group-sm"><input type="text" class="form-control form-control-sm" name="PW" id="usFPw" autocomplete="new-password">
              <button class="btn btn-outline-secondary" type="button" id="usGen" title="Buat kata sandi acak"><i class="bi bi-magic"></i></button></div></div>
          <div class="col-12 text-muted-2" style="font-size:11px">Peran terisi otomatis sesuai jabatan dan bisa diubah. Hak akses detail diatur di menu Peran & Hak Akses.</div>
        </div></div>
      </div></form>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="usSave">Simpan</button>`});
    const el=m.el;
    // Gedung mengikuti Asrama; catatan tautan Wali Asuh/Wali Asrama mengikuti Jabatan
    const fillGed=()=>{const a=$('#usFAsr',el).value,cur=u.GEDUNG||$('#usFGed',el).value;
      $('#usFGed',el).innerHTML='<option value="">-</option>'+ged.filter(g=>!a||!g.ASRAMA||g.ASRAMA===a).map(g=>`<option value="${esc(g.ID)}" ${cur===g.ID?'selected':''}>${esc(g.NAME)}</option>`).join('');};
    const noteWali=()=>{const t=this._waliTable($('#usFJab',el).value);$('#usWaliNote',el).classList.toggle('d-none',!t);$('#usWaliTbl',el).textContent=t==='WALI_ASRAMA'?'Wali Asrama':'Wali Asuh';};
    let roleTouched=!!u.ROLE;
    $('#usFAsr',el).onchange=()=>{u.GEDUNG='';fillGed();};
    $('#usFRole',el).onchange=()=>{roleTouched=true;const sc=this.SCOPE_BY_ROLE[$('#usFRole',el).value];if(sc)$('#usFScope',el).value=sc;};
    $('#usFJab',el).onchange=()=>{noteWali();if(!roleTouched){const r=this._roleFor($('#usFJab',el).value);$('#usFRole',el).value=r;const sc=this.SCOPE_BY_ROLE[r];if(sc)$('#usFScope',el).value=sc;}};
    $('#usAkunSw',el).onchange=e=>{$('#usAkunBox',el).style.display=e.target.checked?'block':'none';};
    $('#usGen',el).onclick=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let p='';for(let i=0;i<8;i++)p+=c[Math.floor(Math.random()*c.length)];$('#usFPw',el).value=p;};
    fillGed();noteWali();
    $('#usSave',el).onclick=()=>{
      const f=$('#usForm',el);if(!f.reportValidity())return;
      const d=Object.fromEntries(new FormData(f)),akun=$('#usAkunSw',el).checked,pw=(d.PW||'').trim();
      const row={NAME:d.NAME.trim(),NIP:(d.NIP||'').trim(),JK:d.JK||'',HP:(d.HP||'').trim(),JABATAN:d.JABATAN,STATUS:d.STATUS,JENJANG:d.JENJANG||'',ASRAMA:d.ASRAMA||'',GEDUNG:d.GEDUNG||'',AKUN:akun?'YA':'TIDAK'};
      if(akun){
        const em=(d.EMAIL||'').trim();
        if(!em){SRIT.Notify('Email / nama pengguna wajib diisi untuk akun login','warn');return;}
        if(SRIT.Store.read('USERS').some(x=>x.ID!==u.ID&&String(x.EMAIL||'').trim().toLowerCase()===em.toLowerCase())){SRIT.Notify('Email / nama pengguna sudah dipakai orang lain','warn');return;}
        if((isNew||!hasAk)&&pw.length<6){SRIT.Notify('Kata sandi wajib diisi (minimal 6 karakter)','warn');return;}
        if(pw&&pw.length<6){SRIT.Notify('Kata sandi minimal 6 karakter','warn');return;}
        Object.assign(row,{EMAIL:em,ROLE:d.ROLE,SCOPE:d.SCOPE});
      }
      if(isNew){
        row.ID=SRIT.Util.uid('U');row.CREATED_AT=new Date().toISOString();
        if(!akun){row.EMAIL='';row.ROLE='';row.SCOPE='';}
        if(pseudo)row._WALI=u._t+'|'+u._wid;   // petunjuk: sambungkan ke baris wali yang sudah ada (ID wali lama tidak berganti)
        SRIT.Repo.insert('USERS',row);SRIT.Audit.log('CREATE','user',row.ID);
        if(akun&&pw)SRIT.Sync.setPassword(row.ID,pw);
        this._syncLocalWali(row,pseudo?[u._t,u._wid]:null);
      }else{
        SRIT.Repo.update('USERS',id,row);SRIT.Audit.log('UPDATE','user',id);
        if(akun&&pw)SRIT.Sync.setPassword(id,pw);
        this._syncLocalWali(SRIT.Repo.getById('USERS',id)||Object.assign({ID:id},row),null);
      }
      m.close();SRIT.Notify(akun?'Tersimpan. Akun login aktif.':'Data tenaga kependidikan tersimpan','ok');this.load();
    };
  },

  resetPw(id){
    const u=this._find(id);if(!u)return;const esc=this._esc;
    const m=SRIT.Modal.open({title:'Atur Ulang Kata Sandi',body:`<div class="mb-2"><b>${esc(u.NAME)}</b><div class="text-muted-2" style="font-size:12px">${esc(u.EMAIL)}</div></div>
      <label class="form-label-sm">Kata sandi baru (min. 6 karakter)</label>
      <div class="input-group input-group-sm"><input type="text" class="form-control form-control-sm" id="usRpPw" autocomplete="new-password"><button class="btn btn-outline-secondary" id="usRpGen" type="button" title="Buat acak"><i class="bi bi-magic"></i></button></div>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="usRpSave">Simpan</button>`});
    $('#usRpGen',m.el).onclick=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let p='';for(let i=0;i<8;i++)p+=c[Math.floor(Math.random()*c.length)];$('#usRpPw',m.el).value=p;};
    $('#usRpSave',m.el).onclick=()=>{
      const pw=($('#usRpPw',m.el).value||'').trim();
      if(pw.length<6){SRIT.Notify('Kata sandi minimal 6 karakter','warn');return;}
      SRIT.Sync.setPassword(id,pw);SRIT.Audit.log('UPDATE','user',id);m.close();SRIT.Notify('Kata sandi diperbarui','ok');
    };
  },
  toggleAkun(id){
    const u=this._find(id);if(!u)return;
    if(!confirm('Nonaktifkan akun login '+u.NAME+'? Data pegawai tetap ada, hanya tidak bisa masuk ke aplikasi. Akun dapat diaktifkan lagi kapan saja.'))return;
    SRIT.Repo.update('USERS',id,{AKUN:'TIDAK'});SRIT.Audit.log('UPDATE','user',id);SRIT.Notify('Akun login dinonaktifkan','ok');this.load();
  },
  destroy(){}
};
</script>

<script>
//# sourceURL=View_Role.html
// ---------- ROLE & PERMISSION (matriks dapat diedit + CRUD peran) ----------
SRIT.Features.role={
  ACT:{VIEW:'Lihat',CREATE:'Tambah',UPDATE:'Ubah',DELETE:'Hapus',EXPORT:'Ekspor',APPROVE:'Setujui',MANAGE:'Kelola'},
  render(host){SRIT.UI.setPage('Peran & Hak Akses','Peran');
    const canManage=SRIT.Auth.can('role:MANAGE')||SRIT.Auth.can('role:UPDATE')||SRIT.Auth.isSuper();
    const roles=SRIT.Store.read('ROLES');
    host.innerHTML=`
    <div class="row g-3">
      <div class="col-lg-4"><div class="card-srit p-3">
        <div class="d-flex justify-content-between align-items-center mb-3"><h6 class="section-title mb-0">Daftar Peran (${roles.length})</h6>
        ${canManage?'<button class="btn btn-primary btn-sm" id="rlAdd"><i class="bi bi-plus-lg"></i></button>':''}</div>
        <table class="table table-sm table-srit mb-0"><tbody id="rlList"></tbody></table>
      </div></div>
      <div class="col-lg-8"><div class="card-srit p-3"><div class="d-flex justify-content-between mb-3 align-items-center flex-wrap gap-2"><h6 class="section-title mb-0">Matriks Hak Akses</h6>
        <div class="d-flex gap-2"><select class="form-select form-select-sm w-auto" id="rlSel">${roles.map(r=>`<option value="${r.ID}">${r.NAME}</option>`).join('')}</select>
        ${canManage?'<button class="btn btn-success btn-sm" id="rlSave"><i class="bi bi-save"></i> Simpan</button>':''}</div></div>
        <div id="rlMatrix"></div>
      </div></div>
    </div>`;
    this._drawList();
    const add=$('#rlAdd');if(add)add.onclick=()=>this.roleForm();
    $('#rlSel').onchange=()=>this._drawMatrix(canManage);
    const sv=$('#rlSave');if(sv)sv.onclick=()=>this._save();
    this._drawMatrix(canManage);
  },
  _drawList(){
    const roles=SRIT.Store.read('ROLES');const canManage=SRIT.Auth.can('role:MANAGE')||SRIT.Auth.isSuper();
    $('#rlList').innerHTML=roles.map(r=>`<tr><td class="fw-semibold">${r.NAME}<div class="text-muted-2" style="font-size:11px">${r.ID}</div></td>
      <td class="text-end"><span class="badge-soft st-IZIN">Tingkat ${r.LEVEL}</span>
      ${canManage&&r.ID!=='SUPER_ADMIN'?`<button class="btn btn-sm btn-outline-secondary py-0 ms-1" onclick="SRIT.Features.role.roleForm('${r.ID}')"><i class="bi bi-pencil"></i></button>`:''}</td></tr>`).join('');
  },
  // Baris matriks = SELURUH menu sidebar (urutan & kelompok mengikuti SRIT.MENU); modul izin tiap menu dari SRIT.permForRoute.
  _menuRows(perms){
    const rows=[],seen={};let sec='';
    SRIT.MENU.forEach(m=>{
      if(m.sec){sec=m.sec;return;}
      if(m.r==='live'){rows.push({sec,t:m.t,live:true});return;}
      const mod=SRIT.permForRoute(m.r);if(seen[mod])return;seen[mod]=1;
      rows.push({sec,t:m.t,mod});
    });
    // modul di tabel izin yang tidak punya menu (mis. data lama) tetap ditampilkan agar bisa dicabut
    [...new Set(perms.map(p=>p.MODULE))].filter(mod=>!seen[mod]).forEach(mod=>rows.push({sec:'LAINNYA',t:mod,mod}));
    return rows;
  },
  _drawMatrix(canManage){
    const role=$('#rlSel').value;const rp=SRIT.Store.read('ROLE_PERMISSIONS');
    const perms=SRIT.Store.read('PERMISSIONS');const have=new Set(perms.map(p=>p.ID));
    const acts=['VIEW','CREATE','UPDATE','DELETE','EXPORT','APPROVE','MANAGE'];
    const isSuper=role==='SUPER_ADMIN',edit=canManage&&!isSuper;
    const granted=new Set(rp.filter(x=>x.ROLE_ID===role).map(x=>x.PERMISSION_ID));
    const rows=this._menuRows(perms);let html='',curSec=null,nOn=0,nAll=0;
    rows.forEach(r=>{
      if(r.sec!==curSec){curSec=r.sec;html+=`<tr class="rl-sec"><td colspan="${acts.length+2}" style="font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--srit-text-2);background:var(--srit-hover)">${curSec}</td></tr>`;}
      if(r.live){html+=`<tr><td class="fw-semibold">${r.t}</td><td colspan="${acts.length+1}" class="text-muted-2" style="font-size:12px"><i class="bi bi-globe2"></i> Terbuka untuk umum tanpa login — tampilannya diatur di menu Pengaturan, bukan lewat hak akses.</td></tr>`;return;}
      let cells='',rowIds=[];
      acts.forEach(a=>{
        const pid=r.mod+':'+a;
        if(!have.has(pid)){cells+='<td class="text-center text-muted-2">–</td>';return;}
        const on=isSuper||granted.has(pid);nAll++;if(on)nOn++;rowIds.push(pid);
        cells+=edit?`<td class="text-center"><input type="checkbox" class="form-check-input rl-cb" data-pid="${pid}" data-row="${r.mod}" ${on?'checked':''}></td>`
          :`<td class="text-center"><i class="bi bi-${on?'check-circle-fill text-success':'dash-circle text-muted-2'}"></i></td>`;
      });
      const all=edit&&rowIds.length>1?`<td class="text-center"><input type="checkbox" class="form-check-input rl-all" data-row="${r.mod}" title="Pilih semua aksi menu ini"></td>`:'<td></td>';
      html+=`<tr><td class="fw-semibold">${r.t}<div class="text-muted-2" style="font-size:10.5px;font-weight:400">${r.mod}</div></td>${cells}${all}</tr>`;
    });
    $('#rlMatrix').innerHTML=`<div class="text-muted-2 mb-2" style="font-size:12px">${nOn} dari ${nAll} izin aktif untuk peran ini · ${rows.filter(r=>!r.live).length} menu</div>
      <div class="table-responsive" style="max-height:68vh;overflow:auto"><table class="table table-sm table-srit mb-0"><thead><tr>
      <th style="position:sticky;top:0;z-index:2;background:var(--srit-card)">Menu</th>${acts.map(a=>`<th class="text-center" style="position:sticky;top:0;z-index:2;background:var(--srit-card)">${this.ACT[a]}</th>`).join('')}<th class="text-center" style="position:sticky;top:0;z-index:2;background:var(--srit-card)">Semua</th></tr></thead><tbody>${html}</tbody></table></div>
      ${isSuper?'<div class="alert alert-info py-2 mt-2 mb-0" style="font-size:12px"><i class="bi bi-shield-lock"></i> SUPER_ADMIN memiliki akses penuh global secara otomatis dan tidak dapat diubah.</div>':''}
      <div class="text-muted-2 mt-2" style="font-size:11px">Tanda “–” berarti aksi itu tidak tersedia di menu tersebut. “Lihat” diperlukan agar menu muncul di sidebar.</div>`;
    if(edit){
      const sync=row=>{const cbs=$$('.rl-cb[data-row="'+row+'"]');const all=$('.rl-all[data-row="'+row+'"]');if(all){all.checked=cbs.length>0&&cbs.every(c=>c.checked);}};
      $$('.rl-all').forEach(el=>{sync(el.dataset.row);el.onchange=()=>{$$('.rl-cb[data-row="'+el.dataset.row+'"]').forEach(c=>c.checked=el.checked);};});
      $$('.rl-cb').forEach(el=>el.addEventListener('change',()=>sync(el.dataset.row)));
    }
  },
  _save(){
    const role=$('#rlSel').value;
    if(role==='SUPER_ADMIN'){SRIT.Notify('SUPER_ADMIN tidak dapat diubah','warn');return;}
    let rows=SRIT.Store.read('ROLE_PERMISSIONS').filter(x=>x.ROLE_ID!==role);
    $$('.rl-cb').forEach(cb=>{if(cb.checked)rows.push({ROLE_ID:role,PERMISSION_ID:cb.dataset.pid});});
    SRIT.Store.write('ROLE_PERMISSIONS',rows);
    SRIT.Cache.invalidate('perm');SRIT.Audit.log('UPDATE','role',role);
    SRIT.Notify('Hak akses peran disimpan','ok');
    if(SRIT.Auth.user&&SRIT.Auth.user.ROLE===role)SRIT.renderNav();
  },
  roleForm(id){
    const r=id?SRIT.Repo.getById('ROLES',id):{};
    const m=SRIT.Modal.open({title:(id?'Edit':'Tambah')+' Peran',
      body:`<form id="rfForm"><div class="row g-2">
        <div class="col-12"><label class="form-label-sm">Kode Peran (huruf besar)</label><input class="form-control form-control-sm" name="ID" value="${r.ID||''}" ${id?'readonly':'required'} placeholder="cth: WALI_KELAS"></div>
        <div class="col-8"><label class="form-label-sm">Nama Peran</label><input class="form-control form-control-sm" name="NAME" value="${r.NAME||''}" required></div>
        <div class="col-4"><label class="form-label-sm">Tingkat</label><input type="number" class="form-control form-control-sm" name="LEVEL" value="${r.LEVEL||10}"></div>
      </div></form>`,
      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" id="rfSave">Simpan</button>`});
    $('#rfSave',m.el).onclick=()=>{
      const f=$('#rfForm',m.el);if(!f.reportValidity())return;
      const d=Object.fromEntries(new FormData(f));d.LEVEL=+d.LEVEL;d.ID=d.ID.toUpperCase().replace(/\s+/g,'_');
      if(id){SRIT.Repo.update('ROLES',id,{NAME:d.NAME,LEVEL:d.LEVEL});SRIT.Audit.log('UPDATE','role',id);}
      else{if(SRIT.Repo.getById('ROLES',d.ID)){SRIT.Notify('Kode peran sudah ada','err');return;}SRIT.Repo.insert('ROLES',d);SRIT.Audit.log('CREATE','role',d.ID);}
      m.close();SRIT.Notify('Peran tersimpan','ok');SRIT.Router.loadFeature('role');
    };
  },
  destroy(){}
};
</script>

<script>__srit.n('View_Analytics')</script>
<script>
//# sourceURL=View_Analytics.html
// ---------- ANALISIS DATA — 4 modul (Absensi / Izin & Kepulangan / Sakit / Pelanggaran) ----------
// Tiap modul: filter Harian/Mingguan/Bulanan + rentang tanggal + filter berjenjang (Jenjang/JK/Asrama).
SRIT.Features.analytics={
  tab:'absensi',
  charts:[],
  _lastAsramaList:[],
  state:{
    absensi:{period:'harian',from:'',to:'',kegName:'',jenjang:'',jk:'',asrama:''},
    izin:{period:'harian',from:'',to:'',jenjang:'',jk:'',asrama:''},
    sakit:{period:'harian',from:'',to:'',jenjang:'',jk:'',asrama:''},
    pelanggaran:{period:'harian',from:'',to:'',jenjang:'',jk:'',asrama:''},
    profil:{status:'AKTIF',jenjang:'',jk:'',asrama:'',ta:''}
  },
  render(host){
    SRIT.UI.setPage('Analisis Data','Analisis Data');
    this._host=host;
    this.load();
  },
  async load(){
    const host=this._host;this.destroy();
    host.innerHTML=`<ul class="nav nav-pills mb-3" id="anTabs">
      <li class="nav-item"><a class="nav-link ${this.tab==='absensi'?'active':''} pointer" data-tab="absensi"><i class="bi bi-calendar-check me-1"></i>Absensi</a></li>
      <li class="nav-item"><a class="nav-link ${this.tab==='izin'?'active':''} pointer" data-tab="izin"><i class="bi bi-door-open me-1"></i>Izin & Kepulangan</a></li>
      <li class="nav-item"><a class="nav-link ${this.tab==='sakit'?'active':''} pointer" data-tab="sakit"><i class="bi bi-thermometer-half me-1"></i>Sakit</a></li>
      <li class="nav-item"><a class="nav-link ${this.tab==='pelanggaran'?'active':''} pointer" data-tab="pelanggaran"><i class="bi bi-exclamation-triangle me-1"></i>Pelanggaran</a></li>
      <li class="nav-item"><a class="nav-link ${this.tab==='profil'?'active':''} pointer" data-tab="profil"><i class="bi bi-bar-chart-steps me-1"></i>Profil Data</a></li>
    </ul>
    <div id="anBody"><div class="skeleton" style="height:320px"></div></div>`;
    $$('#anTabs a').forEach(a=>a.onclick=()=>{if(this.tab===a.dataset.tab)return;this.tab=a.dataset.tab;this.load();});
    const fn={absensi:this.loadAbsensi,izin:this.loadIzin,sakit:this.loadSakit,pelanggaran:this.loadPelanggaran,profil:this.loadProfil}[this.tab];
    try{ await fn.call(this); }
    catch(e){ const b=$('#anBody'); if(b&&SRIT.currentFeature==='analytics') b.innerHTML='<div class="empty-state"><i class="bi bi-exclamation-triangle d-block text-danger"></i>'+SRIT.Util.esc(e.message||'Gagal memuat analitik')+' <button class="btn btn-sm btn-primary mt-2" onclick="SRIT.Features.analytics.load()">Coba Lagi</button></div>'; }
  },
  // ---------------------------------------------------------------- komponen bersama ----
  kpi(v,l,c){return `<div class="col-6 col-lg-3"><div class="kpi"><div class="kpi-lbl">${l}</div><div class="kpi-val" style="color:${c}">${v}</div></div></div>`;},
  filterBarHTML(st,asramaList,extraHtml){
    this._lastAsramaList=asramaList||[];
    return `<div class="card-srit p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
        <h6 class="section-title mb-0">Filter</h6>
        <div style="min-width:180px"><select class="form-select form-select-sm" id="anPeriod">${[['harian','Harian'],['mingguan','Mingguan'],['bulanan','Bulanan']].map(p=>`<option value="${p[0]}" ${st.period===p[0]?'selected':''}>Periode: ${p[1]}</option>`).join('')}</select></div>
      </div>
      <div class="filter-bar">
        <div><label class="form-label-sm">Dari Tanggal</label><input type="date" class="form-control form-control-sm" id="anFrom" value="${st.from||''}" max="${SRIT.Util.todayISO()}"></div>
        <div><label class="form-label-sm">Sampai Tanggal</label><input type="date" class="form-control form-control-sm" id="anTo" value="${st.to||''}" max="${SRIT.Util.todayISO()}"></div>
        <div><label class="form-label-sm">Jenjang</label><select class="form-select form-select-sm" id="anJenjang"><option value="">Semua</option>${['SRD','SRMP','SRMA'].map(j=>`<option ${st.jenjang===j?'selected':''}>${j}</option>`).join('')}</select></div>
        <div><label class="form-label-sm">Jenis Kelamin</label><select class="form-select form-select-sm" id="anJk"><option value="">Semua</option><option value="L" ${st.jk==='L'?'selected':''}>Putra</option><option value="P" ${st.jk==='P'?'selected':''}>Putri</option></select></div>
        <div style="min-width:170px"><label class="form-label-sm">Asrama</label><select class="form-select form-select-sm" id="anAsrama"><option value="">Semua</option>${(asramaList||[]).map(a=>`<option value="${a.id}" ${st.asrama===a.id?'selected':''}>${SRIT.Util.esc(a.nama)}</option>`).join('')}</select></div>
        ${extraHtml||''}
        <div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-primary btn-sm" id="anApply"><i class="bi bi-funnel"></i> Terapkan</button></div>
        <div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-outline-secondary btn-sm" id="anReset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button></div>
      </div>
      <div id="anActiveChips"></div>
    </div>`;
  },
  wireFilterBar(st,afterApply){
    $('#anPeriod').onchange=e=>{st.period=e.target.value;afterApply();};
    $('#anApply').onclick=()=>{
      st.from=$('#anFrom').value;st.to=$('#anTo').value;
      st.jenjang=$('#anJenjang').value;st.jk=$('#anJk').value;st.asrama=$('#anAsrama').value;
      const kegEl=$('#anKeg');if(kegEl)st.kegName=kegEl.value;
      afterApply();
    };
    $('#anReset').onclick=()=>{
      st.from='';st.to='';st.jenjang='';st.jk='';st.asrama='';if('kegName' in st)st.kegName='';
      afterApply();
    };
    this.renderChipsFor(st,afterApply);
  },
  renderChipsFor(st,afterApply){
    const box=$('#anActiveChips');if(!box)return;
    const chips=[];
    if(st.from||st.to)chips.push({label:'Tanggal: '+(st.from?SRIT.Util.fmtDateShort(st.from):'awal')+' s/d '+(st.to?SRIT.Util.fmtDateShort(st.to):'kini'),clear:()=>{st.from='';st.to='';}});
    if(st.jenjang)chips.push({label:'Jenjang: '+st.jenjang,clear:()=>{st.jenjang='';}});
    if(st.jk)chips.push({label:'JK: '+(st.jk==='L'?'Putra':'Putri'),clear:()=>{st.jk='';}});
    if(st.asrama){const nm=(this._lastAsramaList||[]).find(a=>a.id===st.asrama);chips.push({label:'Asrama: '+(nm?nm.nama:st.asrama),clear:()=>{st.asrama='';}});}
    if(st.kegName)chips.push({label:'Kegiatan: '+st.kegName,clear:()=>{st.kegName='';}});
    if(!chips.length){box.innerHTML='';return;}
    box.innerHTML=`<div class="d-flex align-items-center gap-2 flex-wrap mt-2">
      <span class="text-muted-2" style="font-size:11px">Filter aktif:</span>
      ${chips.map((c,i)=>`<span class="sf-chip" data-chip="${i}">${SRIT.Util.esc(c.label)} <i class="bi bi-x"></i></span>`).join('')}
      ${chips.length>1?'<span class="text-muted-2 pointer" id="anClearAll" style="font-size:11px;text-decoration:underline">Hapus semua filter</span>':''}
    </div>`;
    box.querySelectorAll('[data-chip]').forEach((el,i)=>{el.onclick=()=>{chips[i].clear();afterApply();};});
    const ca=$('#anClearAll');if(ca)ca.onclick=()=>{st.from='';st.to='';st.jenjang='';st.jk='';st.asrama='';if('kegName' in st)st.kegName='';afterApply();};
  },
  rankTable(title,rows,icon){
    if(!rows.length)return `<div class="card-srit p-3"><h6 class="section-title mb-2">${title}</h6><div class="text-center text-muted-2 py-3" style="font-size:12px">Tidak ada data pada periode ini.</div></div>`;
    return `<div class="card-srit p-3"><h6 class="section-title mb-2"><i class="bi ${icon} me-1"></i>${title}</h6>
      <table class="table table-sm table-srit mb-0"><tbody>${rows.map((r,i)=>`<tr><td style="width:24px;color:var(--srit-text-2)">${i+1}</td><td>${SRIT.Util.esc(r.nama||r.judul)}</td><td class="text-muted-2" style="font-size:11px">${SRIT.Util.esc(r.jenjang||r.tingkat||'')}</td><td class="text-end fw-semibold">${r.count}</td></tr>`).join('')}</tbody></table></div>`;
  },
  // ============================================================= TAB 1: ABSENSI =====
  async loadAbsensi(){
    const st=this.state.absensi;
    const d=await SRIT.Api.getAnalytics(st.period,{from:st.from,to:st.to,sessionName:st.kegName,jenjang:st.jenjang,jk:st.jk,asrama:st.asrama});
    if(SRIT.currentFeature!=='analytics'||this.tab!=='absensi')return;
    const kegHtml=`<div style="min-width:200px"><label class="form-label-sm">Kegiatan (opsional)</label><select class="form-select form-select-sm" id="anKeg"><option value="">Semua Kegiatan</option>${d.kegNames.map(n=>`<option value="${SRIT.Util.esc(n)}" ${st.kegName===n?'selected':''}>${SRIT.Util.esc(n)}</option>`).join('')}</select></div>`;
    $('#anBody').innerHTML=`
      ${this.filterBarHTML(st,d.asramaList,kegHtml)}
      <div class="text-muted-2 mb-2" style="font-size:11px"><i class="bi bi-info-circle"></i> % Kehadiran = Jumlah Hadir ÷ (Jumlah Siswa <b>${d.jmlSiswa}</b> × Jumlah Kegiatan)</div>
      <div class="row g-3 mb-3">
        ${this.kpi(d.pctToday+'%','% Hadir Hari Ini','#16a34a')}
        ${this.kpi(d.pctMonth+'%','% Hadir Bulan Ini','#0ea5e9')}
        ${this.kpi(d.pctOverall+'%','% Hadir Keseluruhan','#00b8a9')}
        ${this.kpi(d.todayKeg||0,'Kegiatan Hari Ini','#7c3aed')}
      </div>
      <div class="row g-3">
      <div class="col-12"><div class="card-srit p-3"><h6 class="section-title mb-2">Tren Persentase Kehadiran</h6><div class="chart-box"><canvas id="anTrend"></canvas></div></div></div>
      <div class="col-lg-6"><div class="card-srit p-3"><h6 class="section-title mb-2">Persentase Kehadiran Per Jenis Kelamin</h6>
        ${d.perJK.map(j=>`<div class="mb-2"><div class="d-flex justify-content-between small mb-1"><b>${j.label}</b><span class="text-muted-2">${j.hadir}/${j.denom} (${j.pct}%)</span></div><div class="ltv-progress" style="background:var(--srit-hover)"><span style="width:${j.pct}%;background:${j.jk==='L'?'linear-gradient(90deg,#0ea5e9,#38bdf8)':'linear-gradient(90deg,#db2777,#f472b6)'}"></span></div></div>`).join('')}
        <div class="text-muted-2 mt-2" style="font-size:11px">Hadir ÷ (siswa × kegiatan berlaku), periode terpilih</div></div></div>
      <div class="col-lg-6"><div class="card-srit p-3"><h6 class="section-title mb-2">Komposisi Total</h6><div class="chart-box sm"><canvas id="anComp"></canvas></div></div></div>
      <div class="col-12"><div class="card-srit p-3"><h6 class="section-title mb-2">Persentase Kehadiran Per Gedung Asrama</h6><div class="chart-box"><canvas id="anGedung"></canvas></div></div></div>
      <div class="col-12"><div class="card-srit p-3"><h6 class="section-title mb-2">Kehadiran Per Jenjang (Hari Ini)</h6><div class="chart-box"><canvas id="anJenjang"></canvas></div></div></div>
    </div>`;
    this.wireFilterBar(st,()=>this.loadAbsensi());
    this.charts.push(new Chart($('#anTrend'),{type:'line',data:{labels:d.trend.map(t=>t.label),datasets:[{label:'% Hadir',data:d.trend.map(t=>t.pct),borderColor:'#00b8a9',backgroundColor:'rgba(0,184,169,.12)',fill:true,tension:.35}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{max:100,beginAtZero:true}}}}));
    this.charts.push(new Chart($('#anComp'),{type:'doughnut',data:{labels:['Hadir','Izin','Sakit','Alpa'],datasets:[{data:[d.composition.HADIR,d.composition.IZIN,d.composition.SAKIT,d.composition.ALPA],backgroundColor:['#16a34a','#0ea5e9','#f59e0b','#dc2626'],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}}));
    this.charts.push(new Chart($('#anJenjang'),{type:'bar',data:{labels:d.perJenjang.map(j=>j.jenjang+' ('+j.pct+'%)'),datasets:[
      {label:'Hadir',data:d.perJenjang.map(j=>j.hadir),backgroundColor:'#16a34a'},
      {label:'Izin',data:d.perJenjang.map(j=>j.izin),backgroundColor:'#0ea5e9'},
      {label:'Sakit',data:d.perJenjang.map(j=>j.sakit),backgroundColor:'#f59e0b'},
      {label:'Alpa',data:d.perJenjang.map(j=>j.alpa),backgroundColor:'#dc2626'}]},
      options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}}}}));
    if($('#anGedung')&&d.perGedung.length){
      this.charts.push(new Chart($('#anGedung'),{type:'bar',data:{labels:d.perGedung.map(g=>g.nama),datasets:[{label:'% Hadir',data:d.perGedung.map(g=>g.pct),
        backgroundColor:d.perGedung.map(g=>g.jk==='L'?'#38bdf8':'#f472b6'),borderRadius:4}]},
        options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{afterLabel:ctx=>{const g=d.perGedung[ctx.dataIndex];return 'Hadir '+g.hadir+' / '+g.denom;}}}},scales:{y:{max:100,beginAtZero:true,ticks:{callback:v=>v+'%'}}}}}));
    }
  },
  // ============================================================= TAB 2: IZIN & KEPULANGAN =====
  async loadIzin(){
    const st=this.state.izin;
    const d=await SRIT.Api.getAnalyticsIzin(st.period,{from:st.from,to:st.to,jenjang:st.jenjang,jk:st.jk,asrama:st.asrama});
    if(SRIT.currentFeature!=='analytics'||this.tab!=='izin')return;
    const statusColor={MENUNGGU:'#94a3b8',DISETUJUI:'#16a34a',DITOLAK:'#dc2626',BERANGKAT:'#0ea5e9',KEMBALI:'#00b8a9',TERLAMBAT:'#f59e0b',SELESAI:'#7c3aed'};
    const jenisColor={REGULER:'#0ea5e9',KHUSUS:'#7c3aed',DARURAT:'#dc2626'};
    $('#anBody').innerHTML=`
      ${this.filterBarHTML(st,d.asramaList)}
      <div class="row g-3 mb-3">
        ${this.kpi(d.total,'Total Pengajuan','#0ea5e9')}
        ${this.kpi(d.disetujuiRate+'%','% Disetujui','#16a34a')}
        ${this.kpi(d.terlambatRate+'%','% Terlambat Kembali','#f59e0b')}

      <div class="row g-3">

        <div class="col-lg-6"><div class="card-srit p-3"><h6 class="section-title mb-2">Komposisi Status</h6><div class="chart-box sm"><canvas id="anComp"></canvas></div></div></div>
        <div class="col-lg-6"><div class="card-srit p-3"><h6 class="section-title mb-2">Komposisi Jenis</h6><div class="chart-box sm"><canvas id="anJenis"></canvas></div></div></div>
        <div class="col-lg-6"><div class="card-srit p-3"><h6 class="section-title mb-2">Per Jenjang</h6><div class="chart-box"><canvas id="anJenjang"></canvas></div></div></div>
        <div class="col-lg-6"><div class="card-srit p-3"><h6 class="section-title mb-2">Per Asrama</h6><div class="chart-box"><canvas id="anAsramaChart"></canvas></div></div></div>

    this.charts.push(new Chart($('#anComp'),{type:'doughnut',data:{labels:statKeys,datasets:[{data:statKeys.map(k=>d.compStatus[k]),backgroundColor:statKeys.map(k=>statusColor[k]||'#94a3b8'),borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}}}}));
    const jenisKeys=Object.keys(d.compJenis);
    this.charts.push(new Chart($('#anJenis'),{type:'doughnut',data:{labels:jenisKeys,datasets:[{data:jenisKeys.map(k=>d.compJenis[k]),backgroundColor:jenisKeys.map(k=>jenisColor[k]||'#94a3b8'),borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}}));
    this.charts.push(new Chart($('#anJenjang'),{type:'bar',data:{labels:d.perJenjang.map(j=>j.jenjang),datasets:[{label:'Jumlah',data:d.perJenjang.map(j=>j.count),backgroundColor:'#0ea5e9',borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}}));
    this.charts.push(new Chart($('#anAsramaChart'),{type:'bar',data:{labels:d.perAsrama.map(a=>a.nama),datasets:[{label:'Jumlah',data:d.perAsrama.map(a=>a.count),backgroundColor:'#7c3aed',borderRadius:4}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1}}}}}));
  },

    const tingkatKeys=Object.keys(d.compTingkat);
    this.charts.push(new Chart($('#anTrend'),{type:'bar',data:{labels:d.trend.map(t=>t.label),datasets:[{label:'Pelanggaran',data:d.trend.map(t=>t.count),backgroundColor:'#dc2626',borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}}));
    this.charts.push(new Chart($('#anComp'),{type:'doughnut',data:{labels:tingkatKeys,datasets:[{data:tingkatKeys.map(k=>d.compTingkat[k]),backgroundColor:tingkatKeys.map(k=>tingkatColor[k]||'#94a3b8'),borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}}));
    this.charts.push(new Chart($('#anJenjang'),{type:'bar',data:{labels:d.perJenjang.map(j=>j.jenjang),datasets:[{label:'Jumlah',data:d.perJenjang.map(j=>j.count),backgroundColor:'#dc2626',borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}}));
    this.charts.push(new Chart($('#anAsramaChart'),{type:'bar',data:{labels:d.perAsrama.map(a=>a.nama),datasets:[{label:'Jumlah',data:d.perAsrama.map(a=>a.count),backgroundColor:'#f59e0b',borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}}));
  },
  // ---------------------------------------------------------------- PROFIL DATA (siswa & tenaga kependidikan) ----
  // Dihitung langsung dari data yang sudah ada di perangkat (tanpa panggilan server): komposisi, penempatan, usia,
  // asal sekolah & wilayah, kelengkapan data, dan profil tenaga kependidikan. Bisa diunduh sebagai CSV.
  async loadProfil(){
    this.destroy();
    const S=this.state.profil,esc=SRIT.Util.esc,BLANK='(Belum diisi)',JKN={L:'Putra',P:'Putri'};
    const nf=n=>Number(n||0).toLocaleString('id-ID');
    const semua=SRIT.Store.read('ANAK'),asramaL=SRIT.Store.read('ASRAMA'),gedungL=SRIT.Store.read('GEDUNG'),waliL=SRIT.Store.read('WALI_ASUH');
    const nm=(list,id)=>((list.find(x=>x.ID===id)||{}).NAME)||'';
    const rows=semua.filter(a=>(!S.status||(a.STATUS||'AKTIF')===S.status)&&(!S.jenjang||a.JENJANG===S.jenjang)&&(!S.jk||a.JK===S.jk)&&(!S.asrama||a.ASRAMA===S.asrama)&&(!S.ta||String(a.TAHUN_AJARAN||'')===S.ta));
    const N=rows.length,L=rows.filter(a=>a.JK==='L').length,P=rows.filter(a=>a.JK==='P').length;
    const pct=(n,t)=>t?Math.round(n*1000/t)/10:0;
    const countBy=(arr,f)=>{const m={};arr.forEach(x=>{const k=String(f(x)==null?'':f(x)).trim()||BLANK;m[k]=(m[k]||0)+1;});return m;};
    const sorted=(m,n)=>{let e=Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'id'));return n?e.slice(0,n):e;};
    const byJK=(arr,f)=>{const m={};arr.forEach(x=>{const k=String(f(x)==null?'':f(x)).trim()||BLANK;(m[k]=m[k]||{L:0,P:0,X:0});m[k][x.JK==='L'?'L':x.JK==='P'?'P':'X']++;});return m;};
    const tot=o=>o.L+o.P+o.X;
    const natural=(a,b)=>String(a).localeCompare(String(b),'id',{numeric:true});
    const sections=[];   // untuk unduhan CSV
    const tbl=(title,head,body,opts={})=>{
      sections.push({title,head,body});
      return `<div class="table-responsive"><table class="table table-srit mb-0"><thead><tr>${head.map((h,i)=>`<th${i?' class="text-end"':''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
        body.map((r,ri)=>`<tr${opts.lastTotal&&ri===body.length-1?' class="fw-semibold"':''}>${r.map((c,i)=>`<td${i?' class="text-end"':''}>${i===0?esc(c):c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${head.length}" class="text-center text-muted-2 py-3">Tidak ada data</td></tr>`}</tbody></table></div>`;
    };
    const card=(title,inner,cols='col-12',note='')=>`<div class="${cols}"><div class="card-srit p-3 h-100"><h6 class="section-title mb-2">${title}</h6>${inner}${note?`<div class="text-muted-2 mt-2" style="font-size:11px">${note}</div>`:''}</div></div>`;
    const chartBox=(id,sm)=>`<div class="chart-box${sm?' sm':''}"><canvas id="${id}"></canvas></div>`;

    // ---- usia
    const ageOf=a=>{const s=String(a.TANGGAL_LAHIR||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const b=new Date(s+'T00:00:00'),n=new Date();let y=n.getFullYear()-b.getFullYear();const md=n.getMonth()-b.getMonth();if(md<0||(md===0&&n.getDate()<b.getDate()))y--;return(y>=0&&y<60)?y:null;};
    const ages=rows.map(ageOf).filter(v=>v!==null),ageMap={};ages.forEach(v=>{ageMap[v]=(ageMap[v]||0)+1;});
    const ageKeys=Object.keys(ageMap).map(Number).sort((a,b)=>a-b);
    const avgAge=ages.length?(ages.reduce((s,v)=>s+v,0)/ages.length).toFixed(1):'-';

    // ---- kelengkapan
    const OPT=[['NIK','NIK'],['NO_KK','Nomor KK'],['NISN','NISN'],['TEMPAT_LAHIR','Tempat Lahir'],['TANGGAL_LAHIR','Tanggal Lahir'],['SEKOLAH_ASAL','Sekolah Asal'],['ALAMAT','Alamat'],['DESA','Desa'],['KECAMATAN','Kecamatan'],['ORANG_TUA','Orang Tua / Wali'],['NO_HP','No. HP'],['TAHUN_AJARAN','Tahun Ajaran']];
    const isF=(a,k)=>String(a[k]==null?'':a[k]).trim()!=='';
    const fillN=k=>rows.filter(a=>isF(a,k)).length;
    const lengkapN=rows.filter(a=>OPT.every(([k])=>isF(a,k))).length;
    const avgLengkap=N?pct(OPT.reduce((s,[k])=>s+fillN(k),0),N*OPT.length):0;
    const colorOf=p=>p>=90?'#16a34a':p>=60?'#f59e0b':'#dc2626';

    // ---- tabel-tabel
    const jenjangKeys=['SRD','SRMP','SRMA'].concat(Object.keys(countBy(rows,a=>a.JENJANG)).filter(k=>['SRD','SRMP','SRMA'].indexOf(k)<0&&k!==BLANK));
    const jMap=byJK(rows,a=>a.JENJANG);
    const jRows=jenjangKeys.filter(k=>jMap[k]).map(k=>{const o=jMap[k],t=tot(o);return [k,nf(o.L),nf(o.P),nf(t),pct(t,N)+'%'];});
    jRows.push(['Total',nf(L),nf(P),nf(N),N?'100%':'0%']);
    const kMap=byJK(rows,a=>a.KELAS),kKeys=Object.keys(kMap).sort(natural);
    const kRows=kKeys.map(k=>{const o=kMap[k],t=tot(o);return [k,nf(o.L),nf(o.P),nf(t),pct(t,N)+'%'];});
    const aMap=byJK(rows,a=>nm(asramaL,a.ASRAMA)),aKeys=Object.keys(aMap).sort(natural);
    const aRows=aKeys.map(k=>{const o=aMap[k],t=tot(o);return [k,nf(o.L),nf(o.P),nf(t),pct(t,N)+'%'];});
    const gMap=byJK(rows,a=>{const g=nm(gedungL,a.GEDUNG),as=nm(asramaL,a.ASRAMA);return g?(as?as+' · '+g:g):'';}),gKeys=Object.keys(gMap).sort(natural);
    const gRows=gKeys.map(k=>{const o=gMap[k],t=tot(o);return [k,nf(o.L),nf(o.P),nf(t)];});
    const wMap=byJK(rows,a=>nm(waliL,a.WALI_ASUH)),wKeys=Object.keys(wMap).sort((a,b)=>tot(wMap[b])-tot(wMap[a])||natural(a,b));
    const wRows=wKeys.map(k=>{const o=wMap[k],t=tot(o);return [k===BLANK?'(Belum ada wali asuh)':k,nf(o.L),nf(o.P),nf(t)];});
    const taMap=countBy(rows,a=>a.TAHUN_AJARAN),taKeys=Object.keys(taMap).sort(natural);
    const sekolah=sorted(countBy(rows,a=>a.SEKOLAH_ASAL),10),kec=sorted(countBy(rows,a=>a.KECAMATAN),10),desa=sorted(countBy(rows,a=>a.DESA),10);
    const rankRows=(e)=>e.map(([k,v])=>[k,nf(v),pct(v,N)+'%']);

    // ---- tenaga kependidikan
    const users=SRIT.Store.read('USERS'),jabL=SRIT.Store.read('JABATAN');
    const hasAkun=u=>u.AKUN!=='TIDAK'&&!!String(u.EMAIL||'').trim();
    const tMap={};users.forEach(u=>{const k=nm(jabL,u.JABATAN)||BLANK;(tMap[k]=tMap[k]||{L:0,P:0,X:0,akun:0});tMap[k][u.JK==='L'?'L':u.JK==='P'?'P':'X']++;if(hasAkun(u))tMap[k].akun++;});
    const tKeys=Object.keys(tMap).sort((a,b)=>tot(tMap[b])-tot(tMap[a])||natural(a,b));
    const tRows=tKeys.map(k=>{const o=tMap[k];return [k,nf(tot(o)),nf(o.L),nf(o.P),nf(o.X),nf(o.akun)];});
    tRows.push(['Total',nf(users.length),nf(users.filter(u=>u.JK==='L').length),nf(users.filter(u=>u.JK==='P').length),nf(users.filter(u=>u.JK!=='L'&&u.JK!=='P').length),nf(users.filter(hasAkun).length)]);

    const taOpts=[...new Set(semua.map(a=>String(a.TAHUN_AJARAN||'').trim()).filter(Boolean))].sort(natural);
    const sel=(id,label,opts,cur)=>`<div style="min-width:150px"><label class="form-label-sm">${label}</label><select class="form-select form-select-sm" id="${id}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
    const kpi=(v,l,c,sub)=>`<div class="col-6 col-lg-3"><div class="kpi"><div class="kpi-lbl">${l}</div><div class="kpi-val" style="color:${c}">${v}</div>${sub?`<div class="text-muted-2" style="font-size:11px">${sub}</div>`:''}</div></div>`;

    $('#anBody').innerHTML=`
      <div class="card-srit p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
          <h6 class="section-title mb-0">Profil Data Siswa & Tenaga Kependidikan</h6>
          <button class="btn btn-outline-secondary btn-sm" id="prExport"><i class="bi bi-download"></i> Unduh Profil (CSV)</button>
        </div>
        <div class="filter-bar">
          ${sel('prStatus','Status',[['AKTIF','Aktif'],['NONAKTIF','Tidak aktif'],['','Semua']],S.status)}
          ${sel('prJenjang','Jenjang',[['','Semua']].concat(['SRD','SRMP','SRMA'].map(j=>[j,j])),S.jenjang)}
          ${sel('prJk','Jenis Kelamin',[['','Semua'],['L','Putra'],['P','Putri']],S.jk)}
          ${sel('prAsrama','Asrama',[['','Semua']].concat(asramaL.map(a=>[a.ID,a.NAME])),S.asrama)}
          ${sel('prTa','Tahun Ajaran',[['','Semua']].concat(taOpts.map(t=>[t,t])),S.ta)}
          <div><label class="form-label-sm d-block">&nbsp;</label><button class="btn btn-outline-secondary btn-sm" id="prReset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button></div>
        </div>
        <div class="text-muted-2 mt-2" style="font-size:11px"><i class="bi bi-info-circle"></i> Dihitung dari data siswa terkini. Isian yang kosong dihitung sebagai "${BLANK}". Filter berlaku untuk bagian Siswa; bagian Tenaga Kependidikan selalu menampilkan seluruh data.</div>
      </div>
      <div class="d-flex align-items-center gap-2 mb-2"><span class="badge-soft st-HADIR">SISWA</span><span class="text-muted-2" style="font-size:12px">${nf(N)} siswa sesuai filter</span></div>
      <div class="row g-3 mb-3">
        ${kpi(nf(N),'Total Siswa','#1c6ef2')}
        ${kpi(nf(L),'Putra','#3b82f6',pct(L,N)+'% dari total')}
        ${kpi(nf(P),'Putri','#ec4899',pct(P,N)+'% dari total')}
        ${kpi(avgAge+(ages.length?' th':''),'Rata-rata Usia','#7c3aed',ages.length?('termuda '+Math.min(...ages)+' · tertua '+Math.max(...ages)+' th'):'belum ada tanggal lahir')}
        ${kpi(avgLengkap+'%','Rata-rata Kelengkapan Data','#16a34a',nf(lengkapN)+' siswa data lengkap')}
        ${kpi(nf(Object.keys(kMap).length),'Jumlah Kelas','#0ea5e9')}
        ${kpi(nf(aKeys.filter(k=>k!==BLANK).length),'Asrama Terisi','#f59e0b')}
        ${kpi(nf(rows.filter(a=>a.WALI_ASUH).length),'Punya Wali Asuh','#00b8a9',pct(rows.filter(a=>a.WALI_ASUH).length,N)+'% dari total')}
      </div>
      <div class="row g-3 mb-3">
        ${card('Komposisi Jenis Kelamin',chartBox('prJk',true),'col-lg-4')}
        ${card('Jenjang × Jenis Kelamin',chartBox('prJenjang',true),'col-lg-4')}
        ${card('Tabel Jenjang × Jenis Kelamin',tbl('Jenjang × Jenis Kelamin',['Jenjang','Putra','Putri','Total','%'],jRows,{lastTotal:true}),'col-lg-4')}
        ${card('Sebaran Per Kelas (Putra / Putri)',chartBox('prKelas'),'col-lg-7')}
        ${card('Tabel Per Kelas',tbl('Per Kelas',['Kelas','Putra','Putri','Total','%'],kRows),'col-lg-5')}
      </div>
      <div class="row g-3 mb-3">
        ${card('Penempatan Per Asrama (Putra / Putri)',chartBox('prAsrama'),'col-lg-7')}
        ${card('Tabel Per Asrama',tbl('Per Asrama',['Asrama','Putra','Putri','Total','%'],aRows),'col-lg-5')}
        ${card('Per Gedung',tbl('Per Gedung',['Asrama · Gedung','Putra','Putri','Total'],gRows),'col-lg-6')}
        ${card('Jumlah Anak Per Wali Asuh',tbl('Per Wali Asuh',['Wali Asuh','Putra','Putri','Total'],wRows),'col-lg-6')}
      </div>
      <div class="row g-3 mb-3">
        ${card('Sebaran Usia',ages.length?chartBox('prUsia'):'<div class="text-muted-2 py-4 text-center">Belum ada data tanggal lahir</div>','col-lg-6',ages.length?(nf(N-ages.length)+' siswa belum memiliki tanggal lahir'):'')}
        ${card('Tahun Ajaran',chartBox('prTa',true),'col-lg-6')}
        ${card('10 Sekolah Asal Terbanyak',chartBox('prSekolah'),'col-lg-6')}
        ${card('10 Kecamatan Terbanyak',chartBox('prKec'),'col-lg-6')}
        ${card('10 Desa / Kelurahan Terbanyak',tbl('Desa',['Desa / Kelurahan','Jumlah','%'],rankRows(desa)),'col-lg-6')}
        ${card('Rincian Sekolah Asal',tbl('Sekolah Asal',['Sekolah Asal','Jumlah','%'],rankRows(sekolah)),'col-lg-6')}
      </div>
      <div class="card-srit p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
          <h6 class="section-title mb-0">Kelengkapan Data Siswa</h6>
          <button class="btn btn-primary btn-sm" id="prBelum"><i class="bi bi-person-lines-fill"></i> Lihat siswa yang belum lengkap</button>
        </div>
        <div class="row g-2">${OPT.map(([k,l])=>{const n=fillN(k),p=pct(n,N);return `<div class="col-md-6"><div class="d-flex justify-content-between small mb-1"><b>${l}</b><span class="text-muted-2">${nf(n)}/${nf(N)} (${p}%)</span></div><div class="ltv-progress" style="background:var(--srit-hover)"><span style="width:${p}%;background:${colorOf(p)}"></span></div></div>`;}).join('')}</div>
        <div class="text-muted-2 mt-2" style="font-size:11px">Hijau ≥ 90% · kuning 60–89% · merah &lt; 60%. Seluruh kolom ini opsional; hanya NIS, Nama, Jenjang, dan Jenis Kelamin yang wajib.</div>
      </div>
      <div class="d-flex align-items-center gap-2 mb-2"><span class="badge-soft st-IZIN">TENAGA KEPENDIDIKAN</span><span class="text-muted-2" style="font-size:12px">${nf(users.length)} orang · ${nf(users.filter(hasAkun).length)} punya akun login</span></div>
      <div class="row g-3">
        ${card('Per Jabatan',chartBox('prJabatan'),'col-lg-6')}
        ${card('Tabel Jabatan × Jenis Kelamin',tbl('Tenaga Kependidikan',['Jabatan','Jumlah','Putra','Putri','JK belum diisi','Punya akun'],tRows,{lastTotal:true}),'col-lg-6')}
      </div>`;

    // ---- interaksi
    const re=()=>this.loadProfil();
    $('#prStatus').onchange=e=>{S.status=e.target.value;re();};
    $('#prJenjang').onchange=e=>{S.jenjang=e.target.value;re();};
    $('#prJk').onchange=e=>{S.jk=e.target.value;re();};
    $('#prAsrama').onchange=e=>{S.asrama=e.target.value;re();};
    $('#prTa').onchange=e=>{S.ta=e.target.value;re();};
    $('#prReset').onclick=()=>{Object.assign(S,{status:'AKTIF',jenjang:'',jk:'',asrama:'',ta:''});re();};
    $('#prBelum').onclick=()=>{const A=SRIT.Features.anak;if(A&&A.state){A.state.lengkap='belum';A.state.status=S.status;A.state.jenjang=S.jenjang;A.state.jk=S.jk;A.state.asrama=S.asrama;A.state.page=1;}location.hash='#/anak';};
    $('#prExport').onclick=()=>{
      const q=v=>'"'+String(v==null?'':v).replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"';
      let csv='\ufeffPROFIL DATA SRIT,'+q(SRIT.Util.todayISO())+'\n'+'Filter,'+q('Status: '+(S.status||'Semua')+' | Jenjang: '+(S.jenjang||'Semua')+' | JK: '+(S.jk?JKN[S.jk]:'Semua')+' | Asrama: '+(S.asrama?nm(asramaL,S.asrama):'Semua')+' | TA: '+(S.ta||'Semua'))+'\n\n';
      csv+=['KELENGKAPAN DATA SISWA'].map(q)+'\n'+['Kolom','Terisi','Total','%'].map(q).join(',')+'\n'+OPT.map(([k,l])=>[l,fillN(k),N,pct(fillN(k),N)].map(q).join(',')).join('\n')+'\n\n';
      sections.forEach(s=>{csv+=q(s.title.toUpperCase())+'\n'+s.head.map(q).join(',')+'\n'+s.body.map(r=>r.map(q).join(',')).join('\n')+'\n\n';});
      const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='profil_data_'+SRIT.Util.todayISO()+'.csv';a.click();
    };

    // ---- grafik
    const C={L:'#3b82f6',P:'#ec4899',X:'#94a3b8'},PAL=['#3b82f6','#10b981','#f59e0b','#8b5cf6','#06b6d4','#ef4444','#84cc16','#f97316','#64748b','#14b8a6'];
    const mk=(id,cfg)=>{const el=$('#'+id);if(el)this.charts.push(new Chart(el,cfg));};
    const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}}}};
    const stacked=(labels,map)=>({type:'bar',data:{labels,datasets:[{label:'Putra',data:labels.map(k=>(map[k]||{L:0}).L),backgroundColor:C.L,borderRadius:3},{label:'Putri',data:labels.map(k=>(map[k]||{P:0}).P),backgroundColor:C.P,borderRadius:3}].concat(labels.some(k=>(map[k]||{X:0}).X)?[{label:'JK belum diisi',data:labels.map(k=>(map[k]||{X:0}).X),backgroundColor:C.X,borderRadius:3}]:[])},options:{...base,scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{precision:0}}}}});
    const horiz=(entries,color)=>({type:'bar',data:{labels:entries.map(e=>e[0]),datasets:[{label:'Jumlah',data:entries.map(e=>e[1]),backgroundColor:color,borderRadius:4}]},options:{...base,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}}});
    mk('prJk',{type:'doughnut',data:{labels:['Putra','Putri'].concat(rows.some(a=>a.JK!=='L'&&a.JK!=='P')?['Belum diisi']:[]),datasets:[{data:[L,P].concat(rows.some(a=>a.JK!=='L'&&a.JK!=='P')?[N-L-P]:[]),backgroundColor:[C.L,C.P,C.X],borderWidth:0}]},options:base});
    const jl=jenjangKeys.filter(k=>jMap[k]);mk('prJenjang',stacked(jl,jMap));
    mk('prKelas',stacked(kKeys,kMap));
    mk('prAsrama',stacked(aKeys,aMap));
    if(ages.length)mk('prUsia',{type:'bar',data:{labels:ageKeys.map(a=>a+' th'),datasets:[{label:'Jumlah siswa',data:ageKeys.map(a=>ageMap[a]),backgroundColor:'#8b5cf6',borderRadius:4}]},options:{...base,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0}}}}});
    mk('prTa',{type:'bar',data:{labels:taKeys,datasets:[{label:'Jumlah siswa',data:taKeys.map(k=>taMap[k]),backgroundColor:'#0ea5e9',borderRadius:4}]},options:{...base,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0}}}}});
    mk('prSekolah',horiz(sekolah,'#10b981'));
    mk('prKec',horiz(kec,'#f59e0b'));
    mk('prJabatan',{type:'bar',data:{labels:tKeys,datasets:[{label:'Jumlah',data:tKeys.map(k=>tot(tMap[k])),backgroundColor:tKeys.map((k,i)=>PAL[i%PAL.length]),borderRadius:4}]},options:{...base,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}}});
  },
  destroy(){this.charts.forEach(c=>{try{c.destroy();}catch(e){}});this.charts=[];}
};
</script>

<script>__srit.n('View_Laporan')</script>
<script>
//# sourceURL=View_Laporan.html
// ---------- LAPORAN (Pusat Laporan: Wali Asrama & Wali Asuh) ----------
SRIT.Features.laporan={
  active:null,from:'',to:'',
  _range(){const to=this.to||SRIT.Util.todayISO();const from=this.from||(()=>{const d=new Date(to+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-29);return d.toISOString().slice(0,10);})();return {from,to};},
  _inRange(tgl){if(!tgl)return true;const {from,to}=this._range();return tgl>=from&&tgl<=to;},
  // ===== data absensi berskala besar dihitung server; diambil sekali sebelum build()/cetak =====
  _agg(){return (this._pf&&this._pf.agg)||{total:0,hadir:0,byAnak:{},byKeg:{}};},
  _attDayRows(iso){ // baris ringkas (KEGIATAN_ID,STATUS) dari jumlah per sesi hari itu
    const bs=((this._pf&&this._pf.day)||{}).bySession||{};const out=[];
    Object.keys(bs).forEach(sid=>['HADIR','IZIN','SAKIT','ALPA'].forEach(st=>{for(let i=0;i<(bs[sid][st]||0);i++)out.push({KEGIATAN_ID:sid,STATUS:st});}));
    return out;},
  async _prefetch(id){
    const needAgg=['wr-bulanan','wa-kehadiran','wa-refleksi'].includes(id),needDay=id==='wr-harian';
    if(!needAgg&&!needDay)return;
    const {from,to}=this._range();const iso=this.to||SRIT.Util.todayISO();
    const key=[from,to,iso,needAgg?'a':'',needDay?'d':''].join('|');
    if(this._pf&&this._pf.key===key&&Date.now()-this._pf.t<600000)return;
    SRIT.Loading.show();
    const pf={key,t:Date.now(),agg:null,day:null};
    try{
      if(needAgg)pf.agg=await SRIT.Api.getReportAttAgg(from,to);
      if(needDay)pf.day=await SRIT.Api.getReportAttDay(iso);
    }catch(e){SRIT.Notify(e.message||'Gagal memuat data absensi','err');}
    SRIT.Loading.hide();this._pf=pf;
  },
  _anak(id){const a=SRIT.Repo.getById('ANAK',id)||{};return a;},
  _kamar(id){return (SRIT.Repo.getById('KAMAR',id)||{}).NAME||'-';},
