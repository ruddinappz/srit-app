SRIT.Features.peta={
  open:{}, // status buka/tutup per gedung
  render(host){SRIT.UI.setPage('Peta Digital Asrama','Peta Asrama');this._host=host;this.draw();},
  draw(){
    const host=this._host;
    const kamar=SRIT.Store.read('KAMAR');const anak=SRIT.Store.read('ANAK');const beds=SRIT.Store.read('TEMPAT_TIDUR');
    const gedung=SRIT.Store.read('GEDUNG');
    host.innerHTML=`
      <div class="card-srit p-2 px-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div style="font-size:13px"><i class="bi bi-diagram-3 text-primary me-1"></i> Klik nama gedung untuk membuka/menutup detail kamar</div>
        <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" id="petaExpand"><i class="bi bi-arrows-expand"></i> Buka Semua</button>
          <button class="btn btn-outline-secondary btn-sm" id="petaCollapse"><i class="bi bi-arrows-collapse"></i> Tutup Semua</button></div>
      </div>
      ${gedung.map(g=>{
        const rooms=kamar.filter(k=>k.GEDUNG===g.ID);
        const gAnak=anak.filter(a=>a.GEDUNG===g.ID&&a.STATUS==='AKTIF').length;
        const gCap=rooms.reduce((s,k)=>s+(+k.KAPASITAS||8),0);
        const gRate=SRIT.Util.pct(gAnak,gCap);
        const opened=!!this.open[g.ID];
        return `<div class="card-srit mb-2" data-ged="${g.ID}">
          <div class="d-flex justify-content-between align-items-center p-3 pointer peta-head" data-ged="${g.ID}" style="gap:10px">
            <div class="d-flex align-items-center gap-2" style="min-width:0">
              <i class="bi bi-chevron-${opened?'down':'right'} peta-chev"></i>
              <i class="bi bi-building text-primary"></i>
              <div style="min-width:0"><b class="text-truncate d-block">${SRIT.Util.esc(g.NAME)}</b>
                <span class="text-muted-2" style="font-size:11px">${(SRIT.Repo.getById('ASRAMA',g.ASRAMA)||{}).NAME||''} · ${rooms.length} kamar</span></div>
            </div>
            <div class="d-flex align-items-center gap-2" style="flex-shrink:0">
              <div class="ltv-progress d-none d-md-block" style="width:100px;background:var(--srit-hover)"><span style="width:${gRate}%;background:${gRate>=90?'var(--srit-danger)':gRate>=75?'var(--srit-warning)':'var(--srit-success)'}"></span></div>
              <span class="badge-soft ${gRate>=90?'st-ALPA':gRate>=75?'st-SAKIT':'st-HADIR'}">${gAnak}/${gCap}</span>
            </div>
          </div>
          <div class="peta-body px-3 pb-3" data-ged="${g.ID}" style="display:${opened?'block':'none'}">
            <div class="row g-2 g-md-3">${rooms.map(k=>{
              const cap=k.KAPASITAS||8;const occ=anak.filter(a=>a.KAMAR===k.ID&&a.STATUS==='AKTIF').length;
              const rate=SRIT.Util.pct(occ,cap);
              const stt=occ>=cap?'PENUH':rate>=80?'HAMPIR PENUH':'NORMAL';
              const col=stt==='PENUH'?'var(--srit-danger)':stt==='HAMPIR PENUH'?'var(--srit-warning)':'var(--srit-success)';
              const roomBeds=beds.filter(b=>b.KAMAR===k.ID);
              return `<div class="col-6 col-md-4 col-lg-3"><div class="card-srit p-3 h-100" style="background:var(--srit-hover)">
                <div class="d-flex justify-content-between align-items-start mb-1"><b style="font-size:13px">${k.NAME}</b><span class="badge-soft" style="background:${col}22;color:${col};font-size:10px">${stt}</span></div>
                <div class="text-muted-2" style="font-size:11px">${k.KODE||''}<br>Wali: ${(SRIT.Repo.getById('WALI_ASUH',k.WALI_ASUH)||{}).NAME||'-'}</div>
                <div class="my-2"><div class="d-flex justify-content-between small"><span>Okupansi</span><b>${occ}/${cap}</b></div>
                <div class="ltv-progress" style="background:var(--srit-surface)"><span style="width:${rate}%;background:${col}"></span></div></div>
                <div class="d-flex flex-wrap gap-1">${roomBeds.map(b=>`<span title="${b.KODE} ${b.STATUS==='TERISI'?'· '+((SRIT.Repo.getById('ANAK',b.ANAK_ID)||{}).NAMA||''):''}" style="width:15px;height:15px;border-radius:4px;display:inline-block;background:${b.STATUS==='TERISI'?'var(--srit-primary)':b.STATUS==='RUSAK'?'var(--srit-danger)':'var(--srit-border)'}"></span>`).join('')}</div>
              </div></div>`;
            }).join('')}</div>
          </div>
        </div>`;
      }).join('')}`;
    // events
    $$('.peta-head',host).forEach(h=>h.onclick=()=>{const id=h.dataset.ged;this.open[id]=!this.open[id];this.draw();});
    $('#petaExpand',host).onclick=()=>{SRIT.Store.read('GEDUNG').forEach(g=>this.open[g.ID]=true);this.draw();};
    $('#petaCollapse',host).onclick=()=>{this.open={};this.draw();};
  },
  destroy(){}
};
</script>

<script>
//# sourceURL=View_Alert.html
// ---------- ALERT CENTER ----------
SRIT.Features['alert-center']={
  render(host){SRIT.UI.setPage('Pusat Peringatan','Pusat Peringatan');
    const alerts=SRIT.computeAlerts();
    host.innerHTML=`<div class="row g-3">${alerts.length?alerts.map(a=>`
      <div class="col-12 col-lg-6"><div class="card-srit p-3 d-flex align-items-start gap-3" style="border-left:4px solid ${a.color}">
        <div class="kpi-icon" style="background:${a.color}"><i class="bi ${a.icon}"></i></div>
        <div class="flex-grow-1"><div class="fw-semibold">${a.title}</div><div class="text-muted-2" style="font-size:12px">${a.desc}</div></div>
        <span class="badge-soft" style="background:${a.color}22;color:${a.color}">${a.level}</span>
      </div></div>`).join(''):'<div class="col-12"><div class="empty-state"><i class="bi bi-check-circle d-block text-success"></i>Tidak ada alert. Semua kondisi normal.</div></div>'}
    </div>`;
  },
  destroy(){}
};
SRIT.computeAlerts=()=>{
  const al=[];const iso=SRIT.Util.todayISO();
  // anak belum kembali (izin BERANGKAT dengan tgl kembali <= today)
  SRIT.Store.read('IZIN').filter(i=>i.STATUS==='BERANGKAT'&&i.KEMBALI<=iso).forEach(i=>al.push({title:'Anak belum kembali: '+SRIT.nm('ANAK',i.ANAK),desc:'Batas kembali '+SRIT.Util.fmtDateShort(i.KEMBALI)+' — '+i.TUJUAN,level:'HIGH',color:'var(--srit-danger)',icon:'bi-person-exclamation'}));
  // izin menunggu
  const wait=SRIT.Store.read('IZIN').filter(i=>i.STATUS==='MENUNGGU').length;
  if(wait)al.push({title:wait+' izin menunggu persetujuan',desc:'Segera validasi pengajuan izin/kepulangan',level:'MEDIUM',color:'var(--srit-warning)',icon:'bi-hourglass-split'});
  // insiden critical/high aktif
  SRIT.Store.read('INSIDEN').filter(i=>(i.PRIORITAS==='HIGH'||i.PRIORITAS==='CRITICAL')&&i.STATUS!=='SELESAI'&&i.STATUS!=='PENYELESAIAN').forEach(i=>al.push({title:'Insiden '+i.PRIORITAS+': '+i.KATEGORI,desc:i.KEJADIAN,level:i.PRIORITAS,color:'var(--srit-danger)',icon:'bi-exclamation-octagon'}));
  // kamar penuh
  const anak=SRIT.Store.read('ANAK');
  SRIT.Store.read('KAMAR').forEach(k=>{const occ=anak.filter(a=>a.KAMAR===k.ID&&a.STATUS==='AKTIF').length;if(occ>=(k.KAPASITAS||8))al.push({title:'Kamar penuh: '+k.NAME,desc:'Okupansi '+occ+'/'+(k.KAPASITAS||8),level:'LOW',color:'var(--srit-info)',icon:'bi-door-closed'});});
  // insiden proses
  const proc=SRIT.Store.read('INSIDEN').filter(i=>i.STATUS!=='SELESAI'&&i.STATUS!=='PENYELESAIAN').length;
  if(proc)al.push({title:proc+' insiden dalam penanganan',desc:'Pantau progres tindak lanjut',level:'MEDIUM',color:'var(--srit-warning)',icon:'bi-clipboard-pulse'});
  return al;
};
</script>

// ---------- AUDIT ----------
SRIT.Features.audit={

    ${rows.length?rows.map(r=>`<tr><td style="font-size:12px">${new Date(r.TIMESTAMP).toLocaleString('id-ID')}</td>
      <td>${(SRIT.Repo.getById('USERS',r.USER_ID)||{}).NAME||r.USER_ID}</td>
      <td><span class="badge-soft st-IZIN">${r.ACTION}</span></td><td>${r.MODULE}</td><td><code style="font-size:11px">${r.RECORD_ID||'-'}</code></td>

<script>__srit.n('View_Settings')</script>
<script>
//# sourceURL=View_Settings.html
// ---------- SETTINGS: Identitas Aplikasi, Info Sekolah, Logo & Ikon, Tema, Warna, Live TV, Keamanan ----------
SRIT.Features.settings={
  render(host){
    SRIT.UI.setPage('Pengaturan','Pengaturan');
    this._host=host;
    this.load();
  },
  load(){
    const host=this._host;
    const s=SRIT.Store.readObj('SETTINGS');
    const activeTheme=SRIT.Theme.current||SRIT.LS.get('SRIT_THEME')||s.THEME_MODE||'light';
    const activeBase=(SRIT.Theme.THEMES.find(t=>t.id===activeTheme)||{}).base||'light';
    const primary=s.THEME_PRIMARY||'#1c6ef2';
    host.innerHTML=`
    <div class="row g-3">
      <div class="col-lg-6"><div class="card-srit p-3">
        <h6 class="section-title mb-3"><i class="bi bi-app-indicator me-1"></i> Identitas Aplikasi</h6>
        <div class="mb-2"><label class="form-label-sm">Nama Aplikasi</label><input class="form-control form-control-sm" id="setAppName" value="${SRIT.Util.esc(s.APP_NAME||'SRIT ABSENSI')}"></div>
        <div class="mb-2"><label class="form-label-sm">Subjudul Aplikasi</label><input class="form-control form-control-sm" id="setAppSub" value="${SRIT.Util.esc(s.APP_SUBTITLE||'COMMAND CENTER')}"></div>
        <div class="mb-2"><label class="form-label-sm">Deskripsi Singkat (tampil di halaman login)</label><input class="form-control form-control-sm" id="setAppDesc" value="${SRIT.Util.esc(s.APP_DESC||'Sistem Rekam Informasi Terintegrasi')}"></div>
        <div class="mb-2"><label class="form-label-sm">Tagline Sekolah (opsional, tampil di login & Live TV)</label><input class="form-control form-control-sm" id="setTagline" value="${SRIT.Util.esc(s.SCHOOL_TAGLINE||'')}"></div>
        <button class="btn btn-primary btn-sm mt-2" id="setSaveBrand"><i class="bi bi-save"></i> Simpan Identitas</button>
      </div></div>

      <div class="col-lg-6"><div class="card-srit p-3">
        <h6 class="section-title mb-3"><i class="bi bi-bank me-1"></i> Informasi Sekolah (untuk surat & laporan resmi)</h6>
        <div class="text-muted-2 mb-2" style="font-size:12px">Dipakai di kop surat izin, rapor perkembangan, dan laporan cetak — berbeda dari nama aplikasi di atas.</div>
        <div class="mb-2"><label class="form-label-sm">Nama Resmi Sekolah</label><input class="form-control form-control-sm" id="setSchoolName" value="${SRIT.Util.esc(s.SCHOOL_NAME||'')}" placeholder="Sekolah Rakyat Terintegrasi 8 Jombang"></div>
        <div class="mb-2"><label class="form-label-sm">Nama Singkat</label><input class="form-control form-control-sm" id="setSchoolShort" value="${SRIT.Util.esc(s.SCHOOL_SHORT||'')}" placeholder="SRT 8 Jombang" style="max-width:220px"></div>
        <div class="mb-2"><label class="form-label-sm">Alamat Sekolah</label><input class="form-control form-control-sm" id="setSchoolAddr" value="${SRIT.Util.esc(s.SCHOOL_ADDRESS||'')}" placeholder="Jl. ... Kab. Jombang"></div>
        <button class="btn btn-primary btn-sm mt-2" id="setSaveSchool"><i class="bi bi-save"></i> Simpan Info Sekolah</button>
      </div></div>

      <div class="col-lg-6"><div class="card-srit p-3">
        <h6 class="section-title mb-3"><i class="bi bi-image me-1"></i> Logo & Ikon</h6>
        <div class="d-flex gap-3 align-items-start mb-2">
          <div id="setLogoPreview" style="width:60px;height:60px;border-radius:14px;flex-shrink:0;background:var(--srit-primary);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden">${SRIT.Brand.logoHTML(60)}</div>
          <div class="flex-grow-1">
            <label class="form-label-sm">URL Gambar Logo</label>
            <input class="form-control form-control-sm" id="setLogoUrl" value="${SRIT.Util.esc(s.LOGO_URL||'')}" placeholder="https://... (kosongkan untuk pakai teks inisial)">
          </div>
        </div>
        <div class="mb-2"><label class="form-label-sm">Teks Inisial Logo (dipakai jika URL gambar kosong)</label><input class="form-control form-control-sm" id="setLogoText" maxlength="3" value="${SRIT.Util.esc(s.LOGO_TEXT||'SR')}" style="max-width:100px"></div>
        <div class="mb-2"><label class="form-label-sm">URL Favicon (ikon tab browser)</label><input class="form-control form-control-sm" id="setFaviconUrl" value="${SRIT.Util.esc(s.FAVICON_URL||'')}" placeholder="https://.../icon.png"></div>
        <button class="btn btn-primary btn-sm mt-2" id="setSaveLogo"><i class="bi bi-save"></i> Simpan Logo & Ikon</button>
      </div></div>

      <div class="col-lg-6"><div class="card-srit p-3">
        <h6 class="section-title mb-3"><i class="bi bi-tv me-1"></i> Layar Live TV</h6>
        <div class="mb-2"><label class="form-label-sm">Rotasi Slide (detik per slide)</label><input type="number" min="5" max="120" class="form-control form-control-sm" id="setLtvRotate" value="${Number(s.LIVETV_ROTATE)||10}" style="max-width:120px"></div>
        <div class="mb-2"><label class="form-label-sm">Interval Refresh Data (detik)</label><input type="number" min="5" max="300" class="form-control form-control-sm" id="setLtvPolling" value="${Number(s.LIVETV_POLLING)||15}" style="max-width:120px"></div>
        <button class="btn btn-primary btn-sm mt-2" id="setSaveLtv"><i class="bi bi-save"></i> Simpan Pengaturan Live TV</button>
      </div></div>

      <div class="col-12"><div class="card-srit p-3">
        <h6 class="section-title mb-3"><i class="bi bi-palette me-1"></i> Tema Tampilan</h6>
        <div class="text-muted-2 mb-3" style="font-size:12px">Pilih salah satu — langsung diterapkan dan tersimpan untuk semua yang login.</div>
        <div class="row g-2" id="themeGrid">
          ${SRIT.Theme.THEMES.map(th=>`
          <div class="col-6 col-md-4 col-lg-3">
            <div class="theme-swatch ${th.id===activeTheme?'active':''}" data-theme="${th.id}" style="cursor:pointer">
              <div class="d-flex gap-1 mb-2">${th.sw.map(c=>`<span style="width:18px;height:18px;border-radius:5px;background:${c};display:inline-block;border:1px solid rgba(255,255,255,.15)"></span>`).join('')}</div>
              <div style="font-size:12px;font-weight:700">${SRIT.Util.esc(th.name)}</div>
              <div class="text-muted-2" style="font-size:10px;text-transform:uppercase">${th.base==='dark'?'Gelap':'Terang'}</div>
            </div>
          </div>`).join('')}
        </div>
      </div></div>

      <div class="col-lg-6"><div class="card-srit p-3">
        <h6 class="section-title mb-3"><i class="bi bi-droplet-fill me-1"></i> Warna Utama Kustom</h6>
        <div class="text-muted-2 mb-2" style="font-size:12px">Hanya berlaku untuk tema <b>Eksekutif Terang</b> / <b>Eksekutif Gelap</b>. Tema berwarna lain (Emerald, Royal, dst) sudah punya warnanya sendiri.</div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <input type="color" id="setPrimaryColor" value="${/^#[0-9a-f]{6}$/i.test(primary)?primary:'#1c6ef2'}" style="width:44px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--srit-border)">
          <input class="form-control form-control-sm" id="setPrimaryHex" value="${SRIT.Util.esc(primary)}" placeholder="#1c6ef2" style="max-width:120px">
          <button class="btn btn-primary btn-sm" id="setSavePrimary"><i class="bi bi-check2"></i> Terapkan</button>
          <button class="btn btn-outline-secondary btn-sm" id="setResetPrimary">Reset Default</button>
        </div>
        ${activeBase!=='light'&&activeBase!=='dark'?'<div class="mt-2" style="font-size:11px;color:#d97706"><i class="bi bi-exclamation-triangle"></i> Tema aktif saat ini bukan Eksekutif Terang/Gelap, warna kustom tidak akan terlihat sampai Anda beralih ke salah satunya.</div>':''}
      </div></div>

      <div class="col-lg-6"><div class="card-srit p-3">
        <h6 class="section-title mb-3"><i class="bi bi-shield-lock me-1"></i> Keamanan Login</h6>
        <div class="mb-2"><label class="form-label-sm">Durasi Sesi Login (jam, sebelum otomatis logout)</label><input type="number" min="1" max="168" class="form-control form-control-sm" id="setSessHours" value="${Number(s.SESSION_HOURS)||8}" style="max-width:120px"></div>
        <div class="mb-2"><label class="form-label-sm">Batas Percobaan Gagal Login</label><input type="number" min="3" max="20" class="form-control form-control-sm" id="setMaxFail" value="${Number(s.LOGIN_MAX_FAIL)||5}" style="max-width:120px"></div>
        <div class="mb-2"><label class="form-label-sm">Durasi Kunci Akun Setelah Gagal Berkali-kali (detik)</label><input type="number" min="30" max="21600" class="form-control form-control-sm" id="setLockSec" value="${Number(s.LOGIN_LOCK_SEC)||600}" style="max-width:120px"></div>
        <div class="text-muted-2 mb-2" style="font-size:11px">Berlaku untuk percobaan login berikutnya, tidak memutus sesi yang sedang aktif.</div>
        <button class="btn btn-primary btn-sm mt-2" id="setSaveSecurity"><i class="bi bi-save"></i> Simpan Keamanan</button>
      </div></div>
      ${SRIT.Auth.isSuper()?`<div class="col-12"><div class="card-srit p-3" id="setBackupCard">
        <h6 class="section-title mb-2"><i class="bi bi-database-check me-1"></i> Cadangan & Pemulihan Database</h6>
        <div class="text-muted-2 mb-3" style="font-size:12px">Mencakup seluruh data induk: siswa, tenaga kependidikan & akun, struktur asrama, jadwal, layanan, pengaturan, dan data wajah. Data absensi harian tersimpan di spreadsheet bulanan terpisah sehingga tidak ikut. Cadangan otomatis dibuat setiap tanggal 1 (disimpan ${40} terbaru).</div>
        <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
          <div style="min-width:200px"><label class="form-label-sm">Catatan cadangan (opsional)</label><input class="form-control form-control-sm" id="setBkLabel" maxlength="30" placeholder="cth: sebelum_naik_kelas"></div>
          <button class="btn btn-primary btn-sm" id="setBkCreate"><i class="bi bi-cloud-arrow-up"></i> Buat Cadangan Sekarang</button>
          <button class="btn btn-outline-secondary btn-sm" id="setBkExport"><i class="bi bi-download"></i> Unduh Cadangan (.json)</button>
          <button class="btn btn-outline-danger btn-sm" id="setBkImport"><i class="bi bi-upload"></i> Pulihkan dari File (.json)</button>
          <input type="file" id="setBkFile" accept=".json,application/json" style="display:none">
        </div>
        <div class="d-flex justify-content-between align-items-center mb-1"><div class="fw-semibold" style="font-size:13px">Cadangan di Google Drive</div><a class="small pointer" id="setBkRefresh"><i class="bi bi-arrow-clockwise"></i> Muat ulang</a></div>
        <div id="setBkList" class="table-responsive"><div class="text-muted-2 py-2" style="font-size:12px">Memuat\u2026</div></div>
        <div class="alert alert-warning py-2 mt-3 mb-0" style="font-size:12px"><i class="bi bi-shield-exclamation"></i> Berkas .json berisi data pribadi siswa dan hash kata sandi. Simpan di tempat aman dan jangan dibagikan.</div>
      </div></div>`:''}
    </div>`;

    const on=(id,evt,fn)=>{const el=document.getElementById(id);if(el)el[evt]=fn;};
    on('setSaveBrand','onclick',()=>{
      this._save({APP_NAME:$('#setAppName').value.trim()||'SRIT ABSENSI',APP_SUBTITLE:$('#setAppSub').value.trim(),
        APP_DESC:$('#setAppDesc').value.trim(),SCHOOL_TAGLINE:$('#setTagline').value.trim()});
      SRIT.Brand.render();
      SRIT.Notify('Identitas aplikasi tersimpan','ok');
    });
    on('setSaveSchool','onclick',()=>{
      this._save({SCHOOL_NAME:$('#setSchoolName').value.trim(),SCHOOL_SHORT:$('#setSchoolShort').value.trim(),
        SCHOOL_ADDRESS:$('#setSchoolAddr').value.trim()});
      SRIT.Notify('Informasi sekolah tersimpan','ok');
    });
    on('setSaveLogo','onclick',()=>{
      this._save({LOGO_URL:$('#setLogoUrl').value.trim(),LOGO_TEXT:($('#setLogoText').value.trim()||'SR').toUpperCase(),
        FAVICON_URL:$('#setFaviconUrl').value.trim()});
      SRIT.Brand.render();
      SRIT.Notify('Logo & ikon tersimpan','ok');
      this.load();
    });
    on('setSaveLtv','onclick',()=>{
      const rot=Math.min(120,Math.max(5,parseInt($('#setLtvRotate').value,10)||10));
      const poll=Math.min(300,Math.max(5,parseInt($('#setLtvPolling').value,10)||15));
      this._save({LIVETV_ROTATE:rot,LIVETV_POLLING:poll});
      SRIT.Notify('Pengaturan Live TV tersimpan','ok');
      this.load();
    });
    $$('#themeGrid .theme-swatch').forEach(el=>{
      el.onclick=()=>{
        const id=el.getAttribute('data-theme');
        SRIT.Theme.apply(id);
        this._save({THEME_MODE:id});
        SRIT.Brand.render();
        SRIT.Notify('Tema diterapkan: '+(SRIT.Theme.THEMES.find(t=>t.id===id)||{}).name,'ok');
        this.load();
      };
    });
    on('setPrimaryColor','oninput',()=>{$('#setPrimaryHex').value=$('#setPrimaryColor').value;});
    on('setSavePrimary','onclick',()=>{
      let hex=$('#setPrimaryHex').value.trim();
      if(!/^#[0-9a-fA-F]{6}$/.test(hex)){SRIT.Notify('Format warna tidak valid, contoh: #1c6ef2','error');return;}
      this._save({THEME_PRIMARY:hex});
      SRIT.Theme.setPrimary(hex);
      SRIT.Notify('Warna utama diterapkan','ok');
    });
    on('setResetPrimary','onclick',()=>{
      this._save({THEME_PRIMARY:''});
      document.documentElement.style.removeProperty('--srit-primary');
      document.documentElement.style.removeProperty('--srit-primary-rgb');
      SRIT.Notify('Warna utama dikembalikan ke default','ok');
      this.load();
    });
    if(SRIT.Auth.isSuper()){
      on('setBkCreate','onclick',()=>this._bkCreate());
      on('setBkExport','onclick',()=>this._bkExport());
      on('setBkRefresh','onclick',()=>this._bkList());
      on('setBkImport','onclick',()=>$('#setBkFile').click());
      const fi=$('#setBkFile');if(fi)fi.onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)this._bkFile(f);};
      this._bkList();
    }
    on('setSaveSecurity','onclick',()=>{
      const sh=Math.min(168,Math.max(1,parseInt($('#setSessHours').value,10)||8));
      const mf=Math.min(20,Math.max(3,parseInt($('#setMaxFail').value,10)||5));

  async _bkList(){

  _bkFile(file){

  },
  _bkConfirm({title,info,run}){
    const m=SRIT.Modal.open({title,body:`<div class="alert alert-danger py-2" style="font-size:13px"><b><i class="bi bi-exclamation-octagon"></i> Tindakan berisiko.</b> Seluruh data induk saat ini akan <b>DIGANTI</b> dengan isi cadangan. Sebelum diganti, sistem otomatis membuat salinan pengaman bernama <i>SEBELUM_PEMULIHAN</i> di Google Drive.</div>
      <div class="mb-2">${info}</div>

      footer:`<button class="btn btn-light btn-sm" data-bs-dismiss="modal" id="bkCancel">Batal</button><button class="btn btn-danger btn-sm" id="bkGo" disabled><i class="bi bi-arrow-counterclockwise"></i> Pulihkan Sekarang</button>`});
    const go=$('#bkGo',m.el),inp=$('#bkConf',m.el);
    inp.oninput=()=>{go.disabled=inp.value.trim()!=='PULIHKAN';};

  destroy(){}
};
</script>

<script>
//# sourceURL=JS_Router.html
/* =========================================================================
   ROUTER + FEATURE LOADER (lazy, with lifecycle)
   ========================================================================= */
SRIT.Router={
  routes:['dashboard','anak','absensi','kegiatan','jadwal','jadwal-piket','bel','keasramaan','keasramaan-master','penghuni','peta','program','izin','tamu','tatatertib','pelanggaran','pembinaan','insiden','inspeksi','sarpras','refleksi','penilaian','profiling','alert-center','analytics','laporan','user','jabatan','role','audit','settings'],
  go(){
    const _nav=(this._nav=(this._nav||0)+1);
    let hash=location.hash.replace('#/','')||'live';
    // ----- PUBLIC LIVE TV -----
    if(hash==='live'||hash==='mobile-live'){SRIT.LiveTV.show(hash==='mobile-live');return;}
    SRIT.LiveTV.hide();
    // ----- LOGIN -----
    if(hash==='login'){this._showLogin();return;}
    // ----- AUTH GUARD -----
    if(!SRIT.Auth.user){location.hash='#/login';return;}
    this._showApp();
    // ----- OPS operational sub-module: #/ops/<key> -----
    let opsKey=null;
    if(hash.indexOf('ops/')===0){opsKey=hash.slice(4);hash='ops-module';}
    let route=(hash==='ops-module')?'ops-module':(this.routes.includes(hash)?hash:'dashboard');
    // permission guard
    const permRoute=(route==='ops-module')?'keasramaan':route;
    if(route!=='dashboard'&&!SRIT.Auth.canModule(SRIT.permForRoute(permRoute))){
      SRIT.Notify('Anda tidak memiliki akses ke modul ini','err');
      if(location.hash!=='#/dashboard')location.hash='#/dashboard';return;
    }
    // segarkan cermin data (multi-pengguna) sebelum menampilkan modul; batalkan bila pengguna sudah pindah
    SRIT.Sync.ensureFresh().then(()=>{if(_nav!==this._nav)return;this.loadFeature(route,opsKey);});
  },
  loadFeature(route,arg){
    // destroy previous
    if(SRIT.currentFeature&&SRIT.Features[SRIT.currentFeature]&&SRIT.Features[SRIT.currentFeature].destroy){
      try{SRIT.Features[SRIT.currentFeature].destroy();}catch(e){}
    }
    // active nav (ops modules highlight the Keasramaan menu)
    const navRoute=route==='ops-module'?'keasramaan':route;
    $$('.nav-link-srit').forEach(el=>el.classList.toggle('active',el.dataset.route===navRoute));
    const host=$('#featureHost');host.innerHTML='';
    const feat=SRIT.Features[route];
    if(!feat){host.innerHTML='<div class="empty-state"><i class="bi bi-cone-striped d-block"></i>Modul dalam pengembangan</div>';return;}
    SRIT.currentFeature=route;
    const _fail=e=>{if(SRIT.currentFeature!==route)return;console.error(e);host.innerHTML='<div class="empty-state"><i class="bi bi-exclamation-triangle d-block text-danger"></i>Terjadi kesalahan memuat modul. <button class="btn btn-sm btn-primary mt-2" onclick="SRIT.Router.go()">Coba Lagi</button></div>';};
    try{const _p=feat.render(host,arg);if(_p&&_p.catch)_p.catch(_fail);}catch(e){_fail(e);}
  },
  _showLogin(){$('#appShell').style.display='none';$('#loginRoot').style.display='flex';},
  _showApp(){$('#loginRoot').style.display='none';$('#appShell').style.display='block';
    const u=SRIT.Auth.user;$('#userNameSb').textContent=u.NAME;$('#userRoleSb').textContent=u.ROLE;$('#userAvatar').textContent=u.NAME[0];
    SRIT.renderNav();
    // notifications
    $('#notifList').innerHTML=SRIT.Store.read('NOTIFIKASI').map(n=>`<div class="px-2 py-1 border-bottom" style="font-size:12px">${SRIT.Util.esc(n.TEXT)}</div>`).join('')||'<div class="text-muted-2 small px-2">Tidak ada notifikasi</div>';
  }
};
</script>

#ltvFilter{position:fixed;bottom:110px;right:12px;z-index:1601;display:none;background:#0e1830;border:1px solid var(--ln);border-radius:12px;padding:14px;width:min(300px,90vw);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#ltvFilter label{font-size:12px;color:var(--mu);display:block;margin:6px 0 3px}
/* ---- HP (mobile-live): tanpa skala, halaman bertumpuk ---- */
.lv-mob{overflow-y:auto!important}
.lv-mob .lv-stage{position:relative;width:100%;height:auto;transform:none!important}
.lv-mob .lv-head,.lv-mob .lv-bar{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
.lv-mob .lv-ptitle,.lv-mob .lv-tabs,.lv-mob .lv-foot>b{display:none}
.lv-mob .lv-clock{font-size:24px}.lv-mob .lv-school b{font-size:18px}
.lv-mob .lv-body{flex:none}
.lv-mob .lv-pg{position:relative;opacity:1;visibility:visible;display:block;padding:10px 12px}
.lv-mob .lv-pg>*{margin-bottom:12px;min-height:200px}
.lv-mob .lv-pg>.lv-k{min-height:100px}
.lv-mob .lv-pg::before{content:attr(data-t);display:block;font-size:20px;font-weight:700;margin:10px 0 12px;color:var(--acc)}
.lv-mob .sb{grid-template-columns:100px 1fr 80px;font-size:14px}
.lv-mob .lv-k .v{font-size:36px}
.lv-mob .lv-foot{height:40px}
.lv-mob .lv-admin{opacity:1;pointer-events:auto;bottom:0;left:0;right:0;flex-wrap:wrap;justify-content:center;background:#0a1428;border-top:1px solid var(--ln);padding:8px;gap:6px}
.lv-mob .lv-btn{white-space:nowrap;padding:7px 10px}
.lv-mob .lv-stage{padding-bottom:96px}
.lv-mob .lv-fg{flex-wrap:wrap}
.lv-mob .lv-pb>div[style*="gap:20px"]{flex-direction:column;align-items:stretch}
.lv-mob .lv-pb>div[style*="gap:20px"]>svg{align-self:center;height:220px}
.lv-mob:not(.lv-act){cursor:auto}
</style>
<script>
//# sourceURL=View_LiveTV.html
/* =========================================================================
   LIVE TV v2 — dashboard analitik publik. Mengambil SATU payload (apiLiveSummary + blok `profil`),
   lalu memfilter Jenjang × Jenis Kelamin di sisi klien tanpa panggilan server.
   ========================================================================= */
SRIT.LiveTV={
  timer:null,clockTimer:null,rotTimer:null,mobile:false,slide:0,slideCount:7,fDate:'',fSesi:'',fJJ:'',fJK:'',autoJJ:false,data:null,_rounds:0,
  JJ:['SRD','SRMP','SRMA'],
  COL:{hadir:'#34d399',izin:'#818cf8',sakit:'#fbbf24',alpa:'#f87171',belum:'#64748b',L:'#38bdf8',P:'#f472b6',SRD:'#fb923c',SRMP:'#c084fc',SRMA:'#2dd4bf',baik:'#34d399',perbaikan:'#fbbf24',rusak:'#f87171'},
  PAGES:[['Ringkasan Eksekutif','Ringkasan'],['Profil Peserta Didik','Profil'],['Absensi & Kehadiran','Kehadiran'],['Kesehatan','Kesehatan'],['Kedisiplinan & Pembinaan','Disiplin'],['Aset & Sarana Prasarana','Aset'],['Operasional Hari Ini','Operasional']],
  /* ---------- siklus hidup ---------- */
  show(mobile){
    this._forceMobile=!!mobile;this.mobile=this._forceMobile||this.isNarrow();this.slide=0;this.fDate='';this.fSesi='';this.fJJ='';this.fJK='';this._rounds=0;this.data=null;
    try{this.autoJJ=localStorage.getItem('ltvAutoJJ')==='1';}catch(e){this.autoJJ=false;}
    $('#appShell').style.display='none';$('#loginRoot').style.display='none';
    const root=$('#liveTvRoot');root.classList.add('show');root.classList.toggle('lv-mob',this.mobile);root.style.display='flex';
    this.buildShell();
    this.refreshData();
    this.startClock();
    const poll=(SRIT.Store.readObj('SETTINGS').LIVETV_POLLING||15)*1000;
    this.stop();this.timer=setInterval(()=>{ if(!this.fDate)this.refreshData(); },poll);
    this.startRotation();
    SRIT.Bell.start();
    if(!this._bound){
      this._bound=true;
      const act=()=>{const r=$('#liveTvRoot');if(!r)return;r.classList.add('lv-act');clearTimeout(this._at);this._at=setTimeout(()=>{const f=$('#ltvFilter');if(!f||f.style.display!=='block')r.classList.remove('lv-act');},4000);};
      window.addEventListener('orientationchange',()=>setTimeout(()=>{this.syncMode();this.fit();},300));document.addEventListener('mousemove',act);document.addEventListener('touchstart',act,{passive:true});document.addEventListener('keydown',act);
      window.addEventListener('resize',()=>{clearTimeout(this._rt);this._rt=setTimeout(()=>{this.syncMode();this.fit();this.setupAutoScroll();},150);});
      document.addEventListener('keydown',e=>{
        const r=$('#liveTvRoot');if(!r||!r.classList.contains('show')||/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||''))return;
        if(e.key==='ArrowRight')this.next();else if(e.key==='ArrowLeft')this.prev();
        else if(e.key==='f'||e.key==='F')this.fullscreen();
        else if(e.key==='j'||e.key==='J')this.setJJ(this.JJ[(this.JJ.indexOf(this.fJJ)+1)%(this.JJ.length+1)]||'');
        else if(e.key==='g'||e.key==='G')this.setJK({'':'L',L:'P',P:''}[this.fJK]);
      });
    }
  },
  isHist(){return !!(this.fDate&&this.fDate!==SRIT.Util.todayISO());},
  hide(){const root=$('#liveTvRoot');if(root){root.style.display='none';root.classList.remove('show');}this.stop();
    if(this.clockTimer){clearInterval(this.clockTimer);this.clockTimer=null;}
    if(this.rotTimer){clearInterval(this.rotTimer);this.rotTimer=null;}
    if(this._scrollTimers)this._scrollTimers.forEach(t=>clearInterval(t));
    SRIT.Bell.stop();},
  stop(){if(this.timer){clearInterval(this.timer);this.timer=null;}},
  startClock(){if(this.clockTimer)clearInterval(this.clockTimer);this.clockTimer=setInterval(()=>{const c=$('#ltvClock');if(c)c.textContent=new Date().toLocaleTimeString('id-ID');},1000);},
  rotateSec(){return Math.max(5,+((SRIT.Store.readObj('SETTINGS').LIVETV_ROTATE)||10));},
  startRotation(){
    if(this.rotTimer){clearInterval(this.rotTimer);this.rotTimer=null;}
    const r=$('#liveTvRoot');if(r)r.classList.toggle('lv-noauto',this.mobile);
    if(this.mobile)return;
    this.rotTimer=setInterval(()=>{
      const n=(this.slide+1)%this.PAGES.length;
      if(n===0){this._rounds++;if(this.autoJJ){const seq=['',...this.JJ];this.fJJ=seq[this._rounds%seq.length];this.render();}}
      this.goto(n);
    },this.rotateSec()*1000);
  },
  goto(i){
    this.slide=i;
    $$('#ltvPages .lv-pg').forEach((el,ix)=>el.classList.toggle('on',ix===i));
    $$('#ltvTabs .lv-tab').forEach((el,ix)=>{el.classList.remove('on');if(ix===i){void el.offsetWidth;el.classList.add('on');}});
    const t=$('#ltvPT');if(t)t.innerHTML=this.PAGES[i][0]+'<em>'+(i+1)+' / '+this.PAGES.length+'</em>';
    this.setupAutoScroll();
  },
  prev(){this.goto((this.slide-1+this.PAGES.length)%this.PAGES.length);this.startRotation();},
  next(){this.goto((this.slide+1)%this.PAGES.length);this.startRotation();},
  jump(i){this.goto(i);this.startRotation();},
  setJJ(v){this.fJJ=v||'';this.render();},
  setJK(v){this.fJK=v||'';this.render();},
  toggleAuto(){this.autoJJ=!this.autoJJ;try{localStorage.setItem('ltvAutoJJ',this.autoJJ?'1':'0');}catch(e){}this.render();},
  fullscreen(){const el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen&&el.requestFullscreen();else document.exitFullscreen();},
  armBell(){SRIT.Bell.unlock();SRIT.Bell.start();this._updateBelBtn();},
  _updateBelBtn(){const b=$('#ltvBelBtn');if(!b)return;if(SRIT.Bell._unlocked){b.innerHTML='Bel aktif';b.classList.add('on');}},
  /* layar sempit (HP, tablet potret) -> layout bertumpuk; selain itu panggung 1920x1080 diskalakan */
  isNarrow(){return innerWidth<820||Math.min(innerWidth,innerHeight)<600;},
  syncMode(){
    const root=$('#liveTvRoot');if(!root||!root.classList.contains('show'))return;
    const m=!!this._forceMobile||this.isNarrow();
    if(m===this.mobile)return;
    this.mobile=m;root.classList.toggle('lv-mob',m);
    this.startRotation();this.fit();
    if(this.data)this.render();
    this.goto(this.slide);
  },
  fit(){
    const st=$('#ltvStage');if(!st)return;
    if(this.mobile){st.style.transform='';st.style.left='';st.style.top='';return;}
    const s=Math.min(innerWidth/1920,innerHeight/1080);
    st.style.transform='scale('+s+')';st.style.left=((innerWidth-1920*s)/2)+'px';st.style.top=((innerHeight-1080*s)/2)+'px';
  },
  /* ---------- rangka ---------- */
  buildShell(){
    const root=$('#liveTvRoot');
    root.innerHTML=`<div class="lv-stage" id="ltvStage">
      <div class="lv-head">
        <div class="lv-logo" id="ltvLogo"></div>
        <div class="lv-school"><b id="ltvSchool"></b><small id="ltvApp"></small></div>
        <div class="lv-ptitle" id="ltvPT"></div>
        <div class="lv-clockbox"><div class="lv-clock" id="ltvClock">${new Date().toLocaleTimeString('id-ID')}</div><div class="lv-date" id="ltvDate"></div></div>
        <div class="lv-status" id="ltvSt"><i></i>OPERASIONAL</div>
      </div>
      <div class="lv-bar">
        <div class="lv-fg" id="ltvFJJ"></div><div class="lv-fg" id="ltvFJK"></div>
        <div class="lv-tabs" id="ltvTabs"></div>
      </div>
      <div class="lv-body" id="ltvPages"></div>
      <div class="lv-foot"><b>Sorotan</b><div class="lv-tick"><div id="ltvTick"></div></div></div>
    </div>
    <div id="ltvFilter">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">Data tanggal lain</b><span style="cursor:pointer" onclick="SRIT.LiveTV.toggleFilter(false)">✕</span></div>
      <label>Tanggal</label><input type="date" class="form-control form-control-sm" id="ltvFDate" max="${SRIT.Util.todayISO()}">
      <label>Kegiatan (untuk kartu kegiatan aktif)</label><select class="form-select form-select-sm" id="ltvFSesi"></select>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="lv-btn" style="flex:1" onclick="SRIT.LiveTV.applyFilter()">Terapkan</button><button class="lv-btn" onclick="SRIT.LiveTV.resetFilter()">Hari ini</button></div>
    </div>
    <div class="lv-admin">
      <button class="lv-btn" id="ltvBelBtn" onclick="SRIT.LiveTV.armBell()">Aktifkan bel</button>
      <button class="lv-btn ${this.autoJJ?'on':''}" id="ltvAutoBtn" onclick="SRIT.LiveTV.toggleAuto()" title="Setiap putaran semua halaman, filter pindah: Semua → SRD → SRMP → SRMA">Putar jenjang</button>
      <button class="lv-btn" onclick="SRIT.LiveTV.toggleFilter()">Tanggal</button>
      <button class="lv-btn" onclick="SRIT.LiveTV.prev()">‹</button><button class="lv-btn" onclick="SRIT.LiveTV.next()">›</button>
      <button class="lv-btn" onclick="SRIT.LiveTV.fullscreen()">Layar penuh</button>
      <button class="lv-btn" onclick="location.hash='#/login'">Masuk</button>
    </div>`;
    root.style.setProperty('--lv-dur',this.rotateSec()+'s');
    this.fit();
  },
  async toggleFilter(show){
    const p=$('#ltvFilter');if(!p)return;
    const vis=show===undefined?p.style.display==='none'||!p.style.display:show;
    p.style.display=vis?'block':'none';
    if(vis){
      let d;try{d=await SRIT.Api.getLiveTVSummary(this.fDate||SRIT.Util.todayISO(),this.fSesi);}catch(e){return;}
      $('#ltvFDate').value=this.fDate||SRIT.Util.todayISO();
      $('#ltvFSesi').innerHTML='<option value="">Kegiatan aktif / terakhir</option>'+d.sessions.map(s=>`<option value="${s.id}" ${this.fSesi===s.id?'selected':''}>${SRIT.Util.esc(s.label)}</option>`).join('');
    }
  },
  applyFilter(){this.fDate=$('#ltvFDate').value||'';this.fSesi=$('#ltvFSesi').value||'';this.toggleFilter(false);this.refreshData();this.goto(0);},
  resetFilter(){this.fDate='';this.fSesi='';this.toggleFilter(false);this.refreshData();this.goto(0);},
  async refreshData(){
    const seq=(this._rseq=(this._rseq||0)+1);let d;
    try{d=await SRIT.Api.getLiveTVSummary(this.fDate||undefined,this.fSesi||undefined);}catch(e){return;}
    const root=$('#liveTvRoot');if(seq!==this._rseq||!root||!root.classList.contains('show'))return;
    this.data=d;
    SRIT.Bell.ingest(d.bel);this._updateBelBtn();
    this.render();
  },
  /* ---------- pembantu angka ---------- */
  pc(a,b){return b?Math.round(a/b*1000)/10:0;},
  f1(v){return (Math.round(v*10)/10).toString().replace('.',',');},
  fn(v){return Number(v||0).toLocaleString('id-ID');},
  segName(c){return c.jj+' '+(c.jk==='L'?'Putra':'Putri');},
  inSel(c){return (!this.fJJ||c.jj===this.fJJ)&&(!this.fJK||c.jk===this.fJK);},
  keyIn(k){if(k==='UMUM')return true;const [j,s]=k.split('|');return (!this.fJJ||j===this.fJJ)&&(!this.fJK||s===this.fJK);},
  sum(cs,f){return cs.reduce((a,c)=>a+(f(c)||0),0);},
  tally(cs){const t={n:this.sum(cs,c=>c.n)};['hadir','izin','sakit','alpa','belum'].forEach(k=>t[k]=this.sum(cs,c=>c.att[k]));return t;},
  trend(cs,dates){return dates.map((d,i)=>{const o={d};['hadir','izin','sakit','alpa'].forEach(k=>o[k]=this.sum(cs,c=>c.attTrend[i][k]));o.rec=o.hadir+o.izin+o.sakit+o.alpa;return o;});},
  filterLabel(){const j=this.fJJ||'Semua jenjang',k=this.fJK==='L'?'Putra':this.fJK==='P'?'Putri':'Putra & Putri';return j+' · '+k;},
  /* ---------- komponen grafik (SVG/HTML murni) ---------- */
  emp(m){return `<div class="lv-empty">${m||'Belum ada data'}</div>`;},
  pnl(title,sub,body,cls,scroll){return `<section class="lv-p ${cls||''}"><h4>${title}</h4>${sub?`<div class="lv-sub">${sub}</div>`:''}<div class="lv-pb ${scroll?'lv-scroll':''}">${body}</div></section>`;},
  kpi(l,v,s,color,spark,cls,unit){return `<div class="lv-k ${cls||'c2'}" style="--kc:${color||'var(--acc)'}"><div class="l">${l}</div><div class="v">${v}${unit?`<small>${unit}</small>`:''}</div><div class="s">${s||''}</div>${spark?`<svg class="sp" viewBox="0 0 100 30" preserveAspectRatio="none">${this.spark(spark,color)}</svg>`:''}</div>`;},
  spark(vals,color){
    const v=vals.map(x=>x==null?null:+x);const ok=v.filter(x=>x!=null);if(ok.length<2)return '';
    const mn=Math.min(...ok),mx=Math.max(...ok),rg=(mx-mn)||1;
    const pts=v.map((x,i)=>x==null?null:[i/(v.length-1)*100,28-(x-mn)/rg*24]).filter(Boolean);
    const last=pts[pts.length-1];
    return `<polyline fill="none" stroke="${color||'#5eead4'}" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color||'#5eead4'}" stroke="#0e1830" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
  },
  legend(items){return `<div class="lv-leg">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`;},
  donut(segs,big,small,legendRows=true){
    const tot=segs.reduce((a,s)=>a+s.v,0),R=72,C=2*Math.PI*R;let off=0;
    const arcs=tot?segs.filter(s=>s.v>0).map(s=>{const len=s.v/tot*C;const el=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${s.c}" stroke-width="26" stroke-dasharray="${Math.max(0,len-2.5).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 100 100)"/>`;off+=len;return el;}).join(''):`<circle cx="100" cy="100" r="${R}" fill="none" stroke="#21314f" stroke-width="26"/>`;
    const lg=legendRows?`<div style="flex:1;min-width:0">${segs.map(s=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:16px"><i class="lv-dot" style="background:${s.c};margin:0"></i><span style="flex:1">${s.l}</span><b>${this.fn(s.v)}</b><span style="color:var(--mu);min-width:56px;text-align:right">${this.f1(this.pc(s.v,tot))}%</span></div>`).join('')}</div>`:'';
    return `<div style="display:flex;align-items:center;gap:20px;flex:1;min-height:0"><svg viewBox="0 0 200 200" style="height:100%;max-height:230px;aspect-ratio:1;flex:none">${arcs}<text x="100" y="${small?98:106}" text-anchor="middle" style="fill:#e8eefc;font-size:34px;font-weight:700">${big}</text>${small?`<text x="100" y="124" text-anchor="middle" style="fill:#8fa3c7;font-size:14px">${small}</text>`:''}</svg>${lg}</div>`;
  },
  /** baris batang bertumpuk. rows:[{label,parts:[{v,c}],right,sub,dim}] */
  stack(rows,maxV){
    if(!rows.length)return this.emp();
    const mx=maxV||Math.max(1,...rows.map(r=>r.parts.reduce((a,p)=>a+p.v,0)));
    return rows.map(r=>{const tot=r.parts.reduce((a,p)=>a+p.v,0);
      return `<div class="sb ${r.dim?'dim':''}"><span class="lb">${r.label}</span><div class="tr">${r.parts.filter(p=>p.v>0).map(p=>`<i style="width:${p.v/mx*100}%;background:${p.c}" title="${p.t||''}"></i>`).join('')}</div><span class="rt">${r.right!=null?r.right:this.fn(tot)}${r.sub?`<small>${r.sub}</small>`:''}</span></div>`;}).join('');
  },
  /** garis multi-seri. series:[{name,color,vals:[v|null],dim}] labels:[str]; fmt untuk sumbu-y */
  line(series,labels,o={}){
    const W=760,H=o.h||330,pl=50,pr=96,pt=14,pb=32,all=series.flatMap(s=>s.vals).filter(v=>v!=null);
    if(!all.length)return this.emp('Belum ada data tren');
    let lo=o.min!=null?o.min:Math.min(...all),hi=o.max!=null?o.max:Math.max(...all);
    if(!o.fmt){ // sumbu persen: 0–100, tiap garis kisi = kelipatan bulat
      if(o.max==null)hi=Math.min(100,Math.ceil((hi+1)/5)*5);
      if(o.min==null)lo=Math.max(0,Math.floor((lo-4)/5)*5);
      const rg=Math.max(20,Math.ceil((hi-lo)/20)*20);lo=hi-rg;if(lo<0){lo=0;hi=Math.min(100,rg);}
    }else{hi=Math.ceil(hi*1.1);lo=Math.max(0,Math.floor(lo*.9));}
    if(hi<=lo)hi=lo+4;
    const X=i=>pl+(labels.length>1?i/(labels.length-1):.5)*(W-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
    const fmt=o.fmt||(v=>v+'%');let g='';
    for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#21314f" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end" style="fill:#8fa3c7;font-size:13px">${fmt(Math.round(v*10)/10)}</text>`;}
    g+=labels.map((l,i)=>`<text x="${X(i)}" y="${H-10}" text-anchor="middle" style="fill:#8fa3c7;font-size:13px">${l}</text>`).join('');
    const ends=[];let body='';
    series.forEach(s=>{
      let seg=[],paths=[];s.vals.forEach((v,i)=>{if(v==null){if(seg.length)paths.push(seg);seg=[];}else seg.push([X(i),Y(v),v]);});if(seg.length)paths.push(seg);
      const op=s.dim?.28:1;
      body+=`<g opacity="${op}">`+paths.map(p=>`<polyline fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/>`).join('')+paths.flat().map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4.5" fill="${s.color}" stroke="#0e1830" stroke-width="2"/>`).join('')+`</g>`;
      const lastP=paths.length?paths[paths.length-1].slice(-1)[0]:null;if(lastP)ends.push({y:lastP[1],x:lastP[0],c:s.color,t:s.name+' '+fmt(Math.round(lastP[2]*10)/10),dim:s.dim});
    });
    ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<16)ends[i].y=ends[i-1].y+16;
    body+=ends.map(e=>`<text x="${e.x+10}" y="${e.y+4}" opacity="${e.dim?.4:1}" style="fill:#e8eefc;font-size:14px;font-weight:600">${e.t}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${body}</svg>`;
  },
  /** kolom sederhana. vals:[n], labels:[str] */
  cols(vals,labels,color,o={}){
    const W=620,H=o.h||300,pl=34,pb=30,pt=24,n=vals.length,mx=Math.max(1,...vals),bw=Math.min(64,(W-pl)/n*.62),st=(W-pl)/n;
    let s=`<line x1="${pl}" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="#21314f"/>`;
    vals.forEach((v,i)=>{const h=(H-pt-pb)*v/mx,x=pl+st*i+(st-bw)/2,y=H-pb-h;
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,v?3:0)}" rx="5" fill="${color}"/><text x="${x+bw/2}" y="${y-7}" text-anchor="middle" style="fill:#e8eefc;font-size:16px;font-weight:700">${v}</text><text x="${x+bw/2}" y="${H-9}" text-anchor="middle" style="fill:#8fa3c7;font-size:13px">${labels[i]}</text>`;});
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
  },
  radar(labels,a,b,ca){
    const S=340,cx=S/2,cy=S/2+4,R=112,n=labels.length,ang=i=>-Math.PI/2+i*2*Math.PI/n,P=(i,v)=>[cx+Math.cos(ang(i))*R*v/4,cy+Math.sin(ang(i))*R*v/4];

  /* =====================  HALAMAN 3 — ABSENSI  ===================== */
  pg3(v){

      +this.kpi('Izin berlangsung',this.fn(this.sum(cs,c=>c.izin.aktif)),`${this.sum(cs,c=>c.izin.telat)} belum kembali sesuai jadwal`,C.izin,null,'c3')

      +this.pnl('Tingkat sakit tiap segmen','Persentase peserta berstatus sakit hari ini · merah bila ≥ 5%',rateHtml||this.emp(),'c4')
      +this.pnl('Insiden 30 hari menurut kategori','Seluruh peserta · kesehatan disorot',katHtml,'c3',true)
      +this.pnl('Insiden yang masih ditangani','Tanpa uraian kejadian demi privasi',aktifList?`<table class="lv-t"><thead><tr><th>Tanggal</th><th>Kategori</th><th>Prioritas</th><th>Status</th></tr></thead><tbody>${aktifList}</tbody></table>`:`<div class="lv-empty" style="color:var(--hadir)">Tidak ada insiden aktif</div>`,'c6',true)
      +this.pnl('Catatan data','Sumber angka kesehatan',`<div style="font-size:16px;line-height:1.55;color:var(--mu)">Jumlah sakit diambil dari <b style="color:var(--tx)">status absensi “Sakit”</b>, sehingga bisa difilter per jenjang dan jenis kelamin. Kasus kesehatan diambil dari <b style="color:var(--tx)">modul Insiden kategori Kesehatan</b> yang belum mencatat jenjang peserta, jadi angkanya menyeluruh.</div>`,'c6');

  /* =====================  HALAMAN 7 — OPERASIONAL  ===================== */
  pg7(v){

    const insH=priOrder.map(x=>`<div class="sb" style="grid-template-columns:100px 1fr 50px"><span class="lb">${x[1]}</span><div class="tr"><i style="width:${(ins.pri[x[0]]||0)/Math.max(1,...Object.values(ins.pri))*100}%;background:${x[2]}"></i></div><span class="rt">${ins.pri[x[0]]||0}</span></div>`).join('');
    const pk=d.piket||[];
    const pkH=pk.length?pk.map(x=>`<div class="in" style="align-items:center"><span style="flex:1"><b>${E(x.nama)}</b><br><span style="color:var(--mu);font-size:14px">${E(x.shift||'')} · ${E(x.lokasi||'')}</span></span><span class="lv-b b-ok">${E(x.status||'')}</span></div>`).join(''):this.emp('Tidak ada piket terjadwal');
    const prog=d.program||[];
    return this.kpi('Izin & kepulangan',this.fn(L.izinAktif||0),'sedang berlangsung / menunggu',C.izin,null,'c3')
      +this.kpi('Belum kembali',this.fn(L.belumKembali||0),'melewati tanggal kembali',(L.belumKembali||0)?C.alpa:C.hadir,null,'c3')
      +this.kpi('Kunjungan & tamu',this.fn(L.kunjungan||0),'tercatat hari ini','#5eead4',null,'c3')
      +this.kpi('Insiden aktif',this.fn((d.insiden||{}).aktif||0),'sedang ditangani',((d.insiden||{}).aktif)?C.sakit:C.hadir,null,'c3')
      +this.pnl('Jadwal kegiatan hari ini',`Berikutnya: ${E(d.next||'-')}`,tlH,'c5 r2',true)
      +this.pnl('Hunian asrama','Tempat tidur terisi per segmen',this.stack(bedRows,bMax)+this.legend([[C.L,'Putra terisi'],[C.P,'Putri terisi'],['#2a3a5c','Kosong']]),'c4')
      +this.pnl('Insiden aktif menurut prioritas','',insH,'c3')
      +this.pnl('Petugas piket hari ini','',pkH,'c4',true)
      +this.pnl('Program pembinaan aktif','',prog.length?prog.map(x=>`<div class="in" style="align-items:center"><span style="flex:1">${E(x.nama)}</span><span class="lv-b b-in">${E(x.kategori||'')}</span></div>`).join(''):this.emp('Belum ada program aktif'),'c3',true);
  }
};
</script>

<script>__srit.n('JS_Dropdown')</script>
<script>
//# sourceURL=JS_Dropdown.html
// ---------- DROPDOWN FILTER BARU (global) ----------
// Mengubah SEMUA <select> filter di seluruh menu menjadi dropdown bergaya (panel melayang, cari di dalam daftar panjang,
// tombol X untuk melepas, navigasi keyboard). <select> asli tetap ada (disembunyikan) sehingga seluruh kode lama yang membaca
// .value / menangkap event change / mengganti isi option tetap berjalan tanpa perubahan.
// Berlaku di semua tempat (halaman, modal, formulir). Dikecualikan hanya: multiple, daftar terbuka (size>1), atau yang diberi atribut data-native.
(function(){
  if(window.__sdInit)return;window.__sdInit=true;
  function boot(){
  var css=
'.sd{position:relative;display:block;width:100%}'+
'.sd-native{display:none!important}'+
'.sd-btn{display:flex;align-items:center;gap:6px;min-height:31px;padding:4px 10px;background:var(--srit-surface);border:1px solid var(--srit-border);border-radius:8px;color:var(--srit-text);font-size:.875rem;cursor:pointer;transition:border-color .15s,box-shadow .15s;user-select:none;-webkit-tap-highlight-color:transparent}'+
'.sd-btn:hover{border-color:var(--srit-primary)}'+
'.sd-btn:focus-visible,.sd.open .sd-btn{outline:none;border-color:var(--srit-primary);box-shadow:0 0 0 3px rgba(var(--srit-primary-rgb),.18)}'+
'.sd-v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'+
'.sd.sd-has-val .sd-v{font-weight:600}.sd.sd-has-val .sd-btn{border-color:var(--srit-primary)}'+
'.sd-v.ph{color:var(--srit-text-2)}'+
'.sd-x{display:none;opacity:.55;font-size:14px}.sd-x:hover{opacity:1}.sd.sd-has-val .sd-x{display:inline}'+
'.sd-ch{font-size:11px;opacity:.7;transition:transform .15s}.sd.open .sd-ch{transform:rotate(180deg)}'+
'.sd.sd-dis .sd-btn{opacity:.55;cursor:not-allowed;pointer-events:none}'+
'.sd.sd-invalid .sd-btn{border-color:var(--srit-danger,#dc3545);box-shadow:0 0 0 3px rgba(220,53,69,.2)}'+
'.sd-panel{position:fixed;z-index:2000;background:var(--srit-card);border:1px solid var(--srit-border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.3);overflow:hidden;outline:none}'+
'.sd-search{padding:8px;border-bottom:1px solid var(--srit-border)}'+
'.sd-search input{width:100%;padding:6px 10px;font-size:13px;border:1px solid var(--srit-border);border-radius:8px;background:var(--srit-surface);color:var(--srit-text);outline:none}'+
'.sd-search input:focus{border-color:var(--srit-primary)}'+
'.sd-list{overflow:auto;padding:4px;-webkit-overflow-scrolling:touch}'+
'.sd-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--srit-text)}'+
'.sd-opt:hover,.sd-opt.act{background:var(--srit-hover)}'+
'.sd-opt.sel{background:rgba(var(--srit-primary-rgb),.14);color:var(--srit-primary);font-weight:600}'+
'.sd-opt.dis{opacity:.45;cursor:not-allowed}.sd-opt .ck{margin-left:auto;flex:none}'+
'.sd-grp{padding:8px 10px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--srit-text-2)}'+
'.sd-empty{padding:12px;text-align:center;font-size:12px;color:var(--srit-text-2)}';
  var st=document.createElement('style');st.id='sd-style';st.textContent=css;document.head.appendChild(st);

  var cur=null;   // dropdown yang sedang terbuka: {sel,wrap,btn,panel,list,q,build,pos}
  var valDesc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  var idxDesc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'selectedIndex');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

  function eligible(s){
    if(s.__sd||s.multiple||s.hasAttribute('data-native')||s.dataset.nosearch)return false;
    if(s.size>1)return false;
    return true;
  }
  function closeAny(){
    if(!cur)return;
    try{cur.panel.remove();}catch(e){}
    cur.wrap.classList.remove('open');cur=null;
  }
  function position(){
    if(!cur)return;
    if(!document.body.contains(cur.wrap)){closeAny();return;}
    var r=cur.btn.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
    var w=Math.min(Math.max(r.width,220),vw-16);
    var left=Math.max(8,Math.min(r.left,vw-w-8));
    var below=vh-r.bottom-12,above=r.top-12;
    var up=below<200&&above>below;
    var avail=Math.max(140,up?above:below);
    var sh=cur.panel.querySelector('.sd-search')?52:0;
    cur.list.style.maxHeight=Math.max(110,Math.min(300,avail-sh))+'px';
    var p=cur.panel.style;p.width=w+'px';p.left=left+'px';
    if(up){p.top='auto';p.bottom=(vh-r.top+4)+'px';}else{p.bottom='auto';p.top=(r.bottom+4)+'px';}
  }

  function enhance(sel){
    sel.__sd=true;
    var wrap=document.createElement('div');wrap.className='sd';
    (sel.className||'').split(/\s+/).forEach(function(c){
      if(/^(m[tbsexy]?-\d|w-\d+|w-auto|d-inline-block|flex-.+|col-.+|me-.+|ms-.+)$/.test(c))wrap.classList.add(c);
    });
    ['width','minWidth','maxWidth','flex','margin'].forEach(function(k){if(sel.style[k])wrap.style[k]=sel.style[k];});
    var btn=document.createElement('div');
    btn.className='sd-btn';btn.tabIndex=0;btn.setAttribute('role','combobox');btn.setAttribute('aria-haspopup','listbox');
    btn.innerHTML='<span class="sd-v"></span><i class="bi bi-x-circle-fill sd-x" title="Hapus pilihan"></i><i class="bi bi-chevron-down sd-ch"></i>';
    wrap.appendChild(btn);
    sel.parentNode.insertBefore(wrap,sel);
    sel.classList.add('sd-native');

    function sync(){
      var o=sel.options[sel.selectedIndex],v=btn.querySelector('.sd-v');
      v.textContent=o?o.text:'';
      var empty=!sel.value;
      v.classList.toggle('ph',empty);
      var hasEmpty=false;for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===''&&!sel.options[i].disabled){hasEmpty=true;break;}}
      wrap.classList.toggle('sd-has-val',!empty&&hasEmpty);
      wrap.classList.toggle('sd-dis',!!sel.disabled);
      wrap.style.display=(sel.hidden||sel.classList.contains('d-none')||sel.style.display==='none')?'none':'';
    }
    // kode lama sering mengubah value/selectedIndex lewat skrip tanpa event → tampilan ikut disinkronkan
    Object.defineProperty(sel,'value',{configurable:true,get:function(){return valDesc.get.call(sel);},set:function(v){valDesc.set.call(sel,v);sync();}});
    Object.defineProperty(sel,'selectedIndex',{configurable:true,get:function(){return idxDesc.get.call(sel);},set:function(v){idxDesc.set.call(sel,v);sync();}});
    new MutationObserver(function(){sync();if(cur&&cur.sel===sel)cur.build(cur.q);}).observe(sel,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['disabled','hidden','class','style','label','selected']});
    sync();
    // select wajib (required) yang kosong: tandai merah & fokuskan (select asli tersembunyi sehingga bubble bawaan browser tidak tampil)
    sel.addEventListener('invalid',function(e){e.preventDefault();wrap.classList.add('sd-invalid');try{btn.focus({preventScroll:false});}catch(x){}});
    sel.addEventListener('change',function(){wrap.classList.remove('sd-invalid');});

    function choose(idx){
      var changed=sel.selectedIndex!==idx;
      if(changed){sel.selectedIndex=idx;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}));}
      closeAny();
      try{btn.focus({preventScroll:true});}catch(e){}
    }
    function clear(){
      for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===''&&!sel.options[i].disabled){choose(i);return;}}
    }
    function openPanel(){
      if(sel.disabled)return;
      closeAny();sync();
      var panel=document.createElement('div');panel.className='sd-panel';panel.tabIndex=-1;
      var many=sel.options.length>8;
      panel.innerHTML=(many?'<div class="sd-search"><input type="text" placeholder="Cari\u2026" autocomplete="off"></div>':'')+'<div class="sd-list" role="listbox"></div>';
      var list=panel.querySelector('.sd-list'),inp=panel.querySelector('input');
      function build(q){
        q=String(q||'').trim().toLowerCase();if(cur)cur.q=q;
        var html='',n=0;
        function opt(o,i){
          var t=o.text;if(q&&t.toLowerCase().indexOf(q)<0)return;
          var isSel=i===sel.selectedIndex;n++;
          html+='<div class="sd-opt'+(isSel?' sel':'')+(o.disabled?' dis':'')+'" role="option" data-i="'+i+'">'+esc(t)+(isSel?'<i class="bi bi-check2 ck"></i>':'')+'</div>';
        }
        var idx=0;
        Array.prototype.forEach.call(sel.children,function(ch){
          if(ch.tagName==='OPTGROUP'){
            var gHtml='',before=html;html='';
            Array.prototype.forEach.call(ch.children,function(o){opt(o,idx);idx++;});
            gHtml=html;html=before+(gHtml?'<div class="sd-grp">'+esc(ch.label)+'</div>'+gHtml:'');
          }else{opt(ch,idx);idx++;}
        });
        list.innerHTML=html||'<div class="sd-empty">Tidak ada hasil</div>';
        var s=list.querySelector('.sel');if(s&&!q)s.scrollIntoView({block:'nearest'});
      }
      (sel.closest('.modal,.offcanvas')||document.body).appendChild(panel);   // di dalam modal agar fokus keyboard tidak direbut Bootstrap
      cur={sel:sel,wrap:wrap,btn:btn,panel:panel,list:list,q:'',build:build};
      wrap.classList.add('open');
      build('');position();
      var sc=list.querySelector('.sel');if(sc)list.scrollTop=Math.max(0,sc.offsetTop-list.clientHeight/2);
      if(inp){inp.oninput=function(){build(inp.value);var f=list.querySelector('.sd-opt:not(.dis)');if(f)f.classList.add('act');};if(!('ontouchstart' in window))inp.focus();}
      else if(!('ontouchstart' in window))panel.focus({preventScroll:true});
      list.onclick=function(e){
        var o=e.target.closest('.sd-opt');if(!o||o.classList.contains('dis'))return;
        choose(parseInt(o.getAttribute('data-i'),10));
      };
      panel.onkeydown=function(e){
        var vis=[].slice.call(list.querySelectorAll('.sd-opt:not(.dis)'));
        var a=list.querySelector('.act'),i=vis.indexOf(a);
        if(e.key==='ArrowDown'||e.key==='ArrowUp'){
          e.preventDefault();
          var nx=e.key==='ArrowDown'?Math.min(vis.length-1,i+1):Math.max(0,i<0?0:i-1);
          if(a)a.classList.remove('act');
          if(vis[nx]){vis[nx].classList.add('act');vis[nx].scrollIntoView({block:'nearest'});}
        }else if(e.key==='Enter'){
          e.preventDefault();var t=a||list.querySelector('.sd-opt.sel')||vis[0];if(t)choose(parseInt(t.getAttribute('data-i'),10));
        }else if(e.key==='Escape'){e.preventDefault();closeAny();try{btn.focus({preventScroll:true});}catch(x){}}
        else if(e.key==='Tab'){closeAny();}
      };
    }
    btn.addEventListener('click',function(e){
      if(e.target.closest('.sd-x')){e.stopPropagation();clear();return;}
      if(cur&&cur.sel===sel)closeAny();else openPanel();
    });
    btn.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();if(!(cur&&cur.sel===sel))openPanel();}
    });
  }

  // tutup saat klik di luar; posisi ikut bila layar digulir / diubah ukurannya (mis. keyboard HP muncul)
  document.addEventListener('mousedown',function(e){if(cur&&!cur.panel.contains(e.target)&&!cur.wrap.contains(e.target))closeAny();},true);
  document.addEventListener('touchstart',function(e){if(cur&&!cur.panel.contains(e.target)&&!cur.wrap.contains(e.target))closeAny();},{capture:true,passive:true});
  window.addEventListener('resize',position);
  window.addEventListener('scroll',function(e){if(cur&&!cur.panel.contains(e.target))position();},true);

  // Pencarian-dropdown LAMA (SRIT.SS di JS_UI) membungkus <select> menjadi kotak ketik. Itu diganti total oleh dropdown baru ini:
  // fungsi lama dialihkan ke sini, dan select yang sudah terlanjur dibungkus dibongkar lalu dipercantik ulang.
  function takeOver(){
    try{
      if(window.SRIT&&window.SRIT.SS){
        window.SRIT.SS.enhance=function(s){try{if(s&&eligible(s))enhance(s);}catch(e){}};
        window.SRIT.SS.scan=function(){scan();};
        window.SRIT.SS.init=function(){scan();};
      }
      var ws=document.querySelectorAll('.ss-wrap');
      for(var i=0;i<ws.length;i++){
        var w=ws[i],sel=w.querySelector('select');if(!sel||!w.parentNode)continue;
        w.parentNode.insertBefore(sel,w);sel.style.display='';delete sel.dataset.ssDone;w.parentNode.removeChild(w);
      }
    }catch(e){console.error('SRIT_Dropdown takeOver:',e);}
  }
  function scan(){takeOver();var all=document.querySelectorAll('select');for(var i=0;i<all.length;i++){try{if(eligible(all[i]))enhance(all[i]);}catch(e){console.error('SRIT_Dropdown:',e);}}}
  var queued=false;
  new MutationObserver(function(ms){
    if(queued)return;
    for(var i=0;i<ms.length;i++){var a=ms[i].addedNodes;
      for(var j=0;j<a.length;j++){var n=a[j];
        if(n.nodeType===1&&(n.tagName==='SELECT'||(n.querySelector&&n.querySelector('select')))){queued=true;requestAnimationFrame(function(){queued=false;scan();});return;}}}
  }).observe(document.body,{childList:true,subtree:true});
  scan();
  window.SRIT_Dropdown={scan:scan,enhance:function(s){try{if(s&&eligible(s))enhance(s);}catch(e){}},version:3};
  console.info('SRIT_Dropdown aktif');
  }
  if(document.body&&document.head)boot();else document.addEventListener('DOMContentLoaded',boot);
})();
</script>

<script>__srit.n('JS_Boot')</script>
<script>
//# sourceURL=JS_Boot.html
/* =========================================================================
   BOOTSTRAP APP — memuat konfigurasi publik, memulihkan sesi, lalu menjalankan router.
   Setiap langkah dilindungi agar satu galat tidak membuat layar kosong; galat tampil di layar (window.__srit).
   ========================================================================= */
document.addEventListener('DOMContentLoaded',async()=>{
  const D=window.__srit;
  const note=(name,e)=>{console.error('SRIT boot: '+name,e);if(D)D.errs.push({kind:'js',msg:name+': '+String((e&&e.message)||e),file:'JS_Boot'});};
  const step=(name,f)=>{try{return f();}catch(e){note(name,e);}};
  // 1) pastikan berkas inti termuat lengkap; berkas menu yang cacat hanya diperingatkan
  const miss=D?D.check():[];
  if(miss.some(m=>m.core)){D.fail(miss);return;}
  // 2) tema awal dari penyimpanan lokal (agar tidak berkedip), lalu disempurnakan oleh pengaturan server
  step('tema awal',()=>{SRIT.Theme.apply(SRIT.LS.get('SRIT_THEME')||'light');SRIT.Brand.render();});
  step('tombol tema',()=>{$('#themeToggle').onclick=()=>{SRIT.Theme.toggle();};});
  step('form login',()=>{$('#loginForm').onsubmit=async e=>{e.preventDefault();
    const btn=$('#loginForm button[type=submit]');if(btn)btn.disabled=true;SRIT.Loading.show();
    const r=await SRIT.Auth.login($('#loginEmail').value.trim(),$('#loginPass').value);
    SRIT.Loading.hide();if(btn)btn.disabled=false;
    if(r.ok){$('#loginErr').classList.add('d-none');location.hash='#/dashboard';SRIT.Router.go();}
    else{$('#loginErr').textContent=r.msg;$('#loginErr').classList.remove('d-none');}
  };});
  step('pencarian dropdown',()=>SRIT.SS.init()); // aktifkan pencarian pada semua dropdown
  step('router hash',()=>window.addEventListener('hashchange',()=>SRIT.Router.go()));
  // 3) konfigurasi publik (branding, tema, pengaturan Live TV)
  try{const cfg=await SRIT.Server.pub('apiPublicConfig');SRIT.Store._set('SETTINGS',cfg.settings||{});}
  catch(e){
    note('apiPublicConfig',e);
    if(/Database belum dibuat/i.test(String(e&&e.message)))step('info',()=>SRIT.Notify('Database belum dibuat. Jalankan runFullSetup() di editor Apps Script, lalu muat ulang halaman.','err',15000));
  }
  step('tema server',()=>{
    const s=SRIT.Store.readObj('SETTINGS');
    const themeId=SRIT.LS.get('SRIT_THEME')||s.THEME_MODE||'light';
    SRIT.Theme.apply(themeId);
    // warna kustom hanya untuk tema light/dark; tema lain punya palet sendiri
    if((themeId==='light'||themeId==='dark')&&s.THEME_PRIMARY)SRIT.Theme.setPrimary(s.THEME_PRIMARY);
    SRIT.Brand.render();
  });
  // 4) restore session
  try{await SRIT.Auth.restore();}catch(e){note('restore sesi',e);}
  // pembaruan cermin data berkala (multi-pengguna)
  setInterval(()=>{if(SRIT.Auth.user)SRIT.Sync.poll();},45000);
  // 5) default landing = Live TV
  if(!location.hash)location.hash='#/live';
  let routed=true;
  try{SRIT.Router.go();}catch(e){routed=false;note('router',e);}
  if(D){if(routed)D.ready();else{D.fail(miss);return;}}   // router gagal → tampilkan penyebab, jangan biarkan layar kosong
  // peringatan non-fatal: menu yang berkasnya cacat & pustaka CDN yang gagal dimuat
  step('peringatan',()=>{
    if(miss.length)SRIT.Notify('Berkas belum termuat lengkap: '+miss.map(m=>m.file).join(', ')+'. Menu terkait tidak akan berfungsi.','warn',15000);
    const lib=['bootstrap','Chart'].filter(k=>!window[k]);
    if(lib.length)SRIT.Notify('Pustaka '+lib.join(' & ')+' dari CDN belum termuat — tampilan/grafik mungkin tidak lengkap. Periksa koneksi internet.','warn',12000);
  });
});
</script>
